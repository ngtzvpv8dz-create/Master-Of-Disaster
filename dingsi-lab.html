le="--accent:#ff969f" data-id="calendar" aria-label="KALENDER"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/kalender.svg" alt="" loading="eager" decoding="async"></span><span class="name">KALENDER</span></button><button class="tile" style="--accent:#88d8cb" data-id="progress" aria-label="PROGRESS"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/progress.svg" alt="" loading="eager" decoding="async"></span><span class="name">PROGRESS</span></button><button class="tile" style="--accent:#c4a4ee" data-id="denkfabrik" aria-label="DENKFABRIK"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/denkfabrik.svg" alt="" loading="eager" decoding="async"></span><span class="name">DENKFABRIK</span></button><button class="tile" style="--accent:#81c4ba" data-id="outdoor" aria-label="OUTDOOR"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/outdoor.svg" alt="" loading="eager" decoding="async"></span><span class="name">OUTDOOR</span></button><button class="tile" style="--accent:#eab08e" data-id="wohnung" aria-label="WOHNUNG"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/wohnung.svg" alt="" loading="eager" decoding="async"></span><span class="name">WOHNUNG</span></button><button class="tile" style="--accent:#f4b66b" data-id="werkstatt" aria-label="WERKSTATT"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/werkstatt.svg" alt="" loading="eager" decoding="async"></span><span class="name">WERKSTATT</span></button><button class="tile" style="--accent:#f5a2a2" data-id="reisen" aria-label="REISEN"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/reisen.svg" alt="" loading="eager" decoding="async"></span><span class="name">REISEN</span></button><button class="tile" style="--accent:#e7c18d" data-id="backstage" aria-label="BACKSTAGE"><span class="art"><img class="lab-3d-icon" src="./assets/dingsi-lab-icons/backstage.svg" alt="" loading="eager" decoding="async"></span><span class="name">BACKSTAGE</span></button></div></main><div id="toast" role="status"></div><script>
const toast=document.getElementById('toast');let timer;function show(message){toast.textContent=message;toast.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toast.style.display='none',2300)}
document.querySelectorAll('.tile').forEach(button=>button.addEventListener('click',()=>show(button.querySelector('.name').textContent+' · Vorschau, noch kein produktiver Bereich')));
document.getElementById('home').onclick=()=>{scrollTo({top:0,behavior:'smooth'});show('Dingsi Lab · Startansicht')};

// Lab-only refresh: keep the canonical installed home-screen URL current even when
// the shared production service worker temporarily serves a cached navigation.
(async()=>{
  try{
    const canonical=new URL('./dingsi-lab.html',location.href);
    const response=await fetch(canonical.href+'?lab-sync='+Date.now(),{cache:'no-store'});
    if(!response.ok)return;
    const html=await response.text();
    if(!html.includes('<title>Dingsi Lab'))return;
    if('caches' in window){
      const cache=await caches.open('master-of-disaster-v612-static');
      await cache.put(canonical.href,new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8'}}));
    }
    const latest=html.match(/<title>Dingsi Lab · Homescreen V(\d+)<\/title>/);
    const current=document.title.match(/Homescreen V(\d+)/);
    if(latest&&current&&Number(latest[1])>Number(current[1])&&sessionStorage.getItem('dingsi-lab-last-refresh')!==latest[1]){
      sessionStorage.setItem('dingsi-lab-last-refresh',latest[1]);
      location.replace(canonical.href+'?lab-live='+latest[1]);
    }
  }catch(_){}
})();
</script></body></html>
