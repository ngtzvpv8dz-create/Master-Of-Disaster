// Lab-only refresh: keep the canonical installed home-screen URL current even when
// the shared production service worker temporarily serves a cached navigation.
(async()=>{
  try{
    const canonical=new URL('./dingsi-lab.html',location.href);
    const response=await fetch(canonical.href+'?lab-sync='+Date.now(),{cache:'no-store'});
    if(!response.ok)return;
    const html=await response.text();
    if(!html.includes('<title>Dingsi Lab'))return;
    if('caches' in window){
      const cache=await caches.open('master-of-disaster-v612-static');
      await cache.put(canonical.href,new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8'}}));
    }
    const latest=html.match(/<title>Dingsi Lab · Homescreen V(\d+)<\/title>/);
    const current=document.title.match(/Homescreen V(\d+)/);
    if(latest&&current&&Number(latest[1])>Number(current[1])&&sessionStorage.getItem('dingsi-lab-last-refresh')!==latest[1]){
      sessionStorage.setItem('dingsi-lab-last-refresh',latest[1]);

})();
