function berlinLocalInputToISO(

) {

}


const match =

value

.match(

const y =

);

match[2]
);


const d =
Number(
match[3]
);


const h =
Number(
match[4]
);


const min =
Number(
match[5]
);


const localAsUTC =
Date.UTC(
y,
m - 1,
d,
h,
min,
0
);


let candidate =
new Date(
localAsUTC
);


for (

i < 3;
i += 1
) {

const offset =
getBerlinOffsetMs(
candidate
);


candidate =
new Date(
localAsUTC -
offset
);

}


return candidate
.toISOString();

}

return segments.reduce(

if (

}


return (
sum +
Math.max(

},
0
);

if (

return {

function getOverlapMs(
startA,
endA,
startB,
endB
) {

const start =
Math.max(
new Date(startA).getTime(),
new Date(startB).getTime()
);


const end =
Math.min(
new Date(endA).getTime(),
new Date(endB).getTime()
);


return Math.max(

end - start
);

}


function getWeightTaskOverlapForDate(
dateKey
) {

const phases =
getWeightPhasesForDate(
dateKey,
false
);


/*
  MEHRTÄGIGE AUFGABEN:
  Moderne Aufgaben werden nicht nach completedDate vorgefiltert.
  Entscheidend ist, ob ihre echten activeSegments die Tragephasen
  dieses Kalendertags schneiden. Historische Aufgaben ohne exakte
  Segmente bleiben dagegen am dokumentierten completedDate.
*/
const modernTasks =
archive.filter(
task =>
Array.isArray(
task.activeSegments
) &&
task.activeSegments.some(
segment =>
segment &&
segment.startedAt &&
segment.endedAt
)
);


const historicalTasksForDate =
archive.filter(
task =>
task.completedDate ===
dateKey &&
!(
Array.isArray(
task.activeSegments
) &&
task.activeSegments.some(
segment =>
segment &&
segment.startedAt &&
segment.endedAt
)
)
);


/*
  MODERNE / EXAKTE AUFGABENSEGMENTE
*/

let exactSegmentOverlapMs =
0;


const exactByWeight =
{};


modernTasks.forEach(
task => {

const segments =
Array.isArray(
task.activeSegments
)
? task.activeSegments
: [];


segments.forEach(
segment => {

if (
!segment.startedAt ||
!segment.endedAt
) {
return;
}


phases.forEach(
phase => {

if (
!phase.startedAt ||
!phase.endedAt
) {
return;
}


const overlap =
getOverlapMs(
segment.startedAt,
segment.endedAt,
phase.startedAt,
phase.endedAt
);


if (
overlap <= 0
) {
return;
}


exactSegmentOverlapMs +=
overlap;


const weightKey =
String(
Number(
phase.weightKg
)
);


if (
!exactByWeight[
weightKey
]
) {

exactByWeight[
weightKey
] =
0;

}


exactByWeight[
weightKey
] +=
overlap;

});

});

});


/*
  HISTORISCHE ARCHIVDATEN

  Viele alte Aufgaben besitzen bewusst keine activeSegments.
  Dafür existieren historischeWeightKg an Aufgaben ODER
  activeTaskDurationMs an dokumentierten Tragephasen.
*/

const historicalTasks =
historicalTasksForDate.filter(
task =>
Number(
task.historicalWeightKg
) > 0
);


const historicalTaskMs =
historicalTasks.reduce(
(sum,task) =>
sum +
getArchiveWeightedActiveMs(
task
),
0
);


const historicalTaskByWeight =
{};


historicalTasks.forEach(
task => {

const key =
String(
Number(
task.historicalWeightKg
)
);


if (
!historicalTaskByWeight[
key
]
) {

historicalTaskByWeight[
key
] =
0;

}


historicalTaskByWeight[
key
] +=
getArchiveWeightedActiveMs(
task
);

}
);


const historicalPhases =
phases.filter(
phase =>
phase.historical ===
true
);


const phaseKnownActiveMs =
historicalPhases.reduce(
(sum,phase) => {

if (
phase.activeTaskDurationMs ===
null ||
typeof phase.activeTaskDurationMs ===
"undefined"
) {

return sum;

}


return (
sum +
(
Number(
phase.activeTaskDurationMs
) || 0
)
);

},
0
);


const phaseHasUnknownDistribution =
historicalPhases.some(
phase =>
phase.activeTaskDurationMs ===
null ||
typeof phase.activeTaskDurationMs ===
"undefined"
);


const phaseKnownByWeight =
{};


historicalPhases.forEach(
phase => {

if (
phase.activeTaskDurationMs ===
null ||
typeof phase.activeTaskDurationMs ===
"undefined"
) {

return;

}


const key =
String(
Number(
phase.weightKg
)
);


if (
!phaseKnownByWeight[
key
]
) {

phaseKnownByWeight[
key
] =
0;

}


phaseKnownByWeight[
key
] +=
Number(
phase.activeTaskDurationMs
) || 0;

}
);


/*
  Wenn die Tragephasen die aktive Zeit vollständig enthalten,
  sind sie die beste Quelle.
  Wenn die Verteilung auf einzelne Phasen historisch unbekannt war,
  verwenden wir die taskweise Zusatzgewichts-Zuordnung.
*/

let historicalActiveMs =
0;


let historicalByWeight =
{};


if (
historicalPhases.length > 0 &&
!phaseHasUnknownDistribution &&
phaseKnownActiveMs > 0
) {

historicalActiveMs =
phaseKnownActiveMs;


historicalByWeight =
phaseKnownByWeight;

} else if (
historicalTaskMs > 0
) {

historicalActiveMs =
historicalTaskMs;


historicalByWeight =
historicalTaskByWeight;

} else {

historicalActiveMs =
phaseKnownActiveMs;


historicalByWeight =
phaseKnownByWeight;

}


const byWeight =
{
...historicalByWeight
};


Object.entries(
exactByWeight
)
.forEach(
entry => {

if (
!byWeight[
entry[0]
]
) {

byWeight[
entry[0]
] =
0;

}


byWeight[
entry[0]
] +=
entry[1];

}
);


const activeWithWeightMs =
historicalActiveMs +
exactSegmentOverlapMs;


const totalWeightMs =
getWeightSummaryForDate(
dateKey,
false
).totalMs;


return {

activeWithWeightMs:
activeWithWeightMs,

outsideActiveMs:
Math.max(
0,
totalWeightMs -
activeWithWeightMs
),

byWeight:
byWeight

};

}


function getArchiveTaskWeightOverlapMs(
task
) {

if (
!task ||
!task.completedDate
) {
return 0;
}


const segments =
Array.isArray(
task.activeSegments
)
? task.activeSegments
: [];


if (
segments.length === 0
) {

if (
Number(
task.historicalWeightKg
) > 0
) {

return getArchiveWeightedActiveMs(
task
);

}


return 0;

}


/*
  Moderne Archivaufgaben können über mehrere Kalendertage laufen.
  Deshalb nicht nur die Gewichtstragephasen des Abschlusstags prüfen,
  sondern alle gespeicherten Phasen gegen die echten Aktivsegmente.
*/
const phases =
weightPhases.filter(
phase =>
phase &&
phase.startedAt &&
phase.endedAt
);


let totalOverlapMs =
0;


segments.forEach(
segment => {

if (
!segment.startedAt ||
!segment.endedAt
) {
return;
}


phases.forEach(
phase => {

if (
!phase.startedAt ||
!phase.endedAt
) {
return;
}


totalOverlapMs +=
getOverlapMs(
segment.startedAt,
segment.endedAt,
phase.startedAt,
phase.endedAt
);

});

});


return totalOverlapMs;

}

? task.cookingSegments
: [];


let activeMs =
0;


let passiveMs =
0;


segments.forEach(
segment => {

if (
!segment.startedAt
) {
return;
}


const endValue =
segment.endedAt ||
endIso;


if (!endValue) {
return;
}


const duration =
Math.max(
0,
new Date(
endValue
).getTime() -
new Date(
segment.startedAt
).getTime()
);


if (
segment.mode ===
"passive"
) {

passiveMs +=
duration;

} else {

activeMs +=
duration;

}

}
);


return {

activeMs:
activeMs,

passiveMs:
passiveMs

};

}


function calculateActiveDuration(
task,
end
) {

const historicalProgressMs =
Number(
task &&
task.importedHistoricalProgressDurationMs
) || 0;


if (
task &&
typeof task.importedHistoricalProgressDurationMs !==
"undefined"
) {

const endIso =
new Date(
end
).toISOString();


return (
historicalProgressMs +
sumTaskSegmentsMs(
task,
endIso
)
);

}


/*
  LEGACY-/NORMALE AUFGABEN OHNE IMPORTBASIS:
  bestehende Berechnung unverändert beibehalten.
*/
if (
!task ||
!task.startedAt
) {
return 0;
}


let pause =
task.pauseTotalMs || 0;


if (
task.status ===
"paused" &&
task.pausedAt
) {

pause +=
Math.max(
0,
end -
new Date(
task.pausedAt
).getTime()
);

}


return Math.max(
0,
end -
new Date(
task.startedAt
).getTime() -
pause
);

}


function liveDuration(task) {

return calculateActiveDuration(
task,
Date.now()
);

}


function hasValidCompletionDuration(
task,
durationMs
) {

/*
  MASTER V361 – ABSCHLUSSREGEL

  Normale Aufgaben, Freizeit und Kochen dürfen nur abgeschlossen
  werden, wenn tatsächlich eine positive Dauer dokumentiert ist.

  Selbstläufer sind die ausdrückliche Ausnahme, weil deren
  autonome Laufzeit nicht als persönliche aktive Arbeitszeit zählt.
*/

if (!task) {
return false;
}


if (
task.type ===
"selfrunner"
) {

return true;

}


return (
Number(
durationMs
) > 0
);

}


function showMissingCompletionDuration(
task
) {

showInfoModal(

"leisure"

: task &&
task.type ===
"cooking"
? "Diese Kochaufgabe hat noch keine tatsächliche Dauer. Starte sie zuerst oder trage über die Zeitkorrektur eine Start- und Endzeit mit positiver Dauer ein."
: "Diese Aufgabe wurde noch nicht begonnen. Eine normale Aufgabe kann nicht mit 00:00:00 als erledigt abgeschlossen werden. Starte sie zuerst oder trage eine tatsächliche Dauer über die Zeitkorrektur ein."
);

}


function finishTask(id) {

const task =
getTask(id);


if (!task) {

}


const now =
Date.now();


const completedDurationMs =
calculateActiveDuration(
task,

);

function saveManualTimes(
id
) {

const task =
getTask(
id
);


if (!task) {
return;
}


const startInput =
document.getElementById(
"manualStart-" + id
);


const endInput =
document.getElementById(
"manualEnd-" + id
);


if (
!startInput ||
!endInput
) {
return;
}


const startIso =
berlinLocalInputToISO(
startInput.value
);


const endIso =
berlinLocalInputToISO(
endInput.value
);


if (
!startIso
) {

showInfoModal(
"Startzeit fehlt",
"Für eine manuelle Zeitkorrektur muss mindestens eine gültige Startzeit vorhanden sein."
);

return;

}


const startMs =
new Date(
startIso
).getTime();


const endMs =
endIso
? new Date(
endIso
).getTime()
: null;


if (
endMs !== null &&
endMs <
startMs
) {

showInfoModal(
"Zeitreise abgelehnt",
"Die Endzeit darf nicht vor der Startzeit liegen."
);

return;

}


if (
endMs !== null &&
endMs ===
startMs
) {

showMissingCompletionDuration(
task
);

return;

}


/*
  Wurde die Startzeit verändert oder gab es
  vorher noch keine, bauen wir die Segmente
  bewusst neu auf.
*/

const oldStartMs =
task.startedAt
? new Date(
task.startedAt
).getTime()
: null;


const startChanged =
oldStartMs ===
null ||
Math.abs(
oldStartMs -
startMs
) >
1000;


if (
startChanged
) {

task.startedAt =
startIso;


task.pauseTotalMs =
0;


task.pausedAt =
null;


task.activeSegments =
[
  {
    startedAt:
    startIso,

    endedAt:
    endIso
  }
];


if (
task.type ===
"cooking"
) {

task.cookingMode =
"active";


task.cookingSegments =
[
  {
    mode:
    "active",

    startedAt:
    startIso,

    endedAt:
    endIso
  }
];

}

} else {

task.startedAt =
startIso;


/*
  Offenes Segment bei nachgetragener
  Endzeit schließen.
*/

if (
endIso &&
Array.isArray(
task.activeSegments
) &&
task.activeSegments.length
) {

const segment =
task.activeSegments[
task.activeSegments.length - 1
];


if (
segment &&
!segment.endedAt
) {

segment.endedAt =
endIso;

}

}


if (
endIso &&
task.type ===
"cooking" &&
Array.isArray(
task.cookingSegments
) &&
task.cookingSegments.length
) {

const cookingSegment =
task.cookingSegments[
task.cookingSegments.length - 1
];


if (
cookingSegment &&
!cookingSegment.endedAt
) {

cookingSegment.endedAt =
endIso;

}

}

}


/*
  NUR STARTZEIT:
  Aufgabe wird als laufend geführt.
*/

if (!endIso) {

task.status =
"running";


task.completedAt =
null;


task.activeDurationMs =
null;


task.leisureDurationMs =
null;


task.actualDurationMs =
null;


task.passiveDurationMs =
null;


task.cookingActiveDurationMs =
null;


task.cookingPassiveDurationMs =
null;


if (
!Array.isArray(
task.activeSegments
) ||
task.activeSegments.length ===
0
) {

task.activeSegments =
[
  {
    startedAt:
    startIso,

    endedAt:
    null
  }
];

} else {

const last =
task.activeSegments[
task.activeSegments.length - 1
];


if (
last &&
last.endedAt
) {

task.activeSegments.push(
{
startedAt:
startIso,

endedAt:
null
}
);

}

}


if (
task.type ===
"cooking"
) {

task.cookingMode =
"active";


if (
!Array.isArray(
task.cookingSegments
) ||
task.cookingSegments.length ===
0
) {

task.cookingSegments =
[
  {
    mode:
    "active",

    startedAt:
    startIso,

    endedAt:
    null
  }
];

}

}


closeModal();

saveTasks();

render();

return;

}


/*
  START + ENDE:
  Aufgabe wird nur abgeschlossen, wenn eine positive
  tatsächliche Dauer entsteht.
*/

const manualCompletionDurationMs =
sumTaskSegmentsMs(
task,
endIso
);


if (
!hasValidCompletionDuration(
task,
manualCompletionDurationMs
)
) {

showMissingCompletionDuration(
task
);

return;

}


task.completedAt =
endIso;


task.status =
"completed";


task.pausedAt =
null;


task.actualDurationMs =
manualCompletionDurationMs;


if (
task.type ===
"leisure"
) {

task.leisureDurationMs =
task.actualDurationMs;


task.activeDurationMs =
0;


task.passiveDurationMs =
null;


task.cookingActiveDurationMs =
null;


task.cookingPassiveDurationMs =
null;

} else if (
task.type ===
"cooking"
) {

const cookingDurations =
calculateCookingDurations(
task,
endIso
);


task.cookingActiveDurationMs =
cookingDurations.activeMs;


task.cookingPassiveDurationMs =
cookingDurations.passiveMs;


task.activeDurationMs =
cookingDurations.activeMs;


task.passiveDurationMs =
cookingDurations.passiveMs;


task.leisureDurationMs =
null;

} else {

task.activeDurationMs =
task.actualDurationMs;


task.leisureDurationMs =
null;


task.passiveDurationMs =
null;


task.cookingActiveDurationMs =
null;


task.cookingPassiveDurationMs =
null;

function dynamicNumber(task) {

/*
  MASTER V361 – DYNAMISCHE NUMMERIERUNG

  Archivnummern und aktive Aufgabennummern sind getrennte
  Nummernräume. Die sichtbare aktive Nummerierung beginnt
  immer bei der aktuell nächsten freien Archivnummer.

  Beispiel:
  Archiv A001–A236
  nextArchiveNumber = 237
  aktive Aufgaben = 237, 238, 239, ...

  Terminale Aufgaben (completed / aborted), die technisch bis
  zur Archivierung noch im tasks-Array liegen können, verändern
  die Nummerierung der weiterhin aktiven Aufgaben nicht.
*/

const activeTasks =
tasks.filter(
item =>
![
"completed",
"aborted"
].includes(
item.status
)
);


const activeIndex =
activeTasks.findIndex(
item =>
item.id ===
task.id
);


if (
activeIndex >= 0
) {

return (
nextArchiveNumber +
activeIndex
);

}


/*
  Fallback für terminale Aufgaben, solange sie vor der
  Archivierung noch dargestellt werden.
*/
const terminalTasks =
tasks.filter(
item =>
[
"completed",
"aborted"
].includes(
item.status
)
);


const terminalIndex =
terminalTasks.findIndex(
item =>
item.id ===
task.id
);


if (
terminalIndex >= 0
) {

return (
nextArchiveNumber +
activeTasks.length +
terminalIndex
);

}


return "?";

}

/* ======================================
   ARCHIV
====================================== */

function getArchiveWeightedActiveMs(
item
) {

if (!item) {
return 0;
}


if (
item.weightedActiveDurationMs !==
null &&
typeof item.weightedActiveDurationMs !==
"undefined"
) {

return Number(
item.weightedActiveDurationMs
) || 0;

}


if (
Number(
item.historicalWeightKg
) > 0
) {

return getArchiveAccountingActiveMs(
item
);

}


return 0;

}


function getArchiveTaskWeightBadges(
item
) {

if (!item) {
return [];
}


/*
  HISTORISCHE ARCHIVAUFGABEN:
  historicalWeightKg bedeutet eine eindeutige
  aufgabenbezogene Zuordnung aus dem alten Archiv.
*/

if (
Number(
item.historicalWeightKg
) > 0
) {

return [
  {
    weightKg:
    Number(
    item.historicalWeightKg
    ),

    partial:
    false,

    durationMs:
    getArchiveWeightedActiveMs(
    item
    )
  }
];

}


/*
  NEUE / MODERNE AUFGABEN:
  Gewicht exakt aus aktiven Segmenten und
  gespeicherten Tragephasen ableiten.
*/

const segments =
Array.isArray(
item.activeSegments
)
? item.activeSegments
: [];


if (
segments.length === 0
) {
return [];
}


const byWeight =
{};


let totalActiveMs =
0;


segments.forEach(
segment => {

if (
!segment.startedAt ||
!segment.endedAt
) {
return;
}


const segmentStart =
new Date(
segment.startedAt
).getTime();


const segmentEnd =
new Date(
segment.endedAt
).getTime();


if (
Number.isNaN(
segmentStart
) ||
Number.isNaN(
segmentEnd
)
) {
return;
}


totalActiveMs +=
Math.max(
0,
segmentEnd -
segmentStart
);


weightPhases.forEach(
phase => {

if (
!phase.startedAt ||
!phase.endedAt
) {
return;
}


const overlapMs =
getOverlapMs(
segment.startedAt,
segment.endedAt,
phase.startedAt,
phase.endedAt
);


if (
overlapMs <= 0
) {
return;
}


const key =
String(
Number(
phase.weightKg
)
);


if (
!byWeight[
key
]
) {

byWeight[
key
] =
0;

}


byWeight[
key
] +=
overlapMs;

});

});


const totalWeightedMs =
Object.values(
byWeight
)
.reduce(
(sum,value) =>
sum +
value,
0
);


if (
totalWeightedMs <= 0
) {
return [];
}


const partial =
totalActiveMs > 0 &&
totalWeightedMs <
totalActiveMs;


return Object.entries(
byWeight
)
.sort(
(a,b) =>
Number(
a[0]
) -
Number(
b[0]
)
)
.map(
entry => ({
weightKg:
Number(
entry[0]
),

durationMs:
entry[1],

partial:
partial
})
);

}


function renderArchiveTaskWeightBadges(
item
) {

const badges =
getArchiveTaskWeightBadges(
item
);


if (
badges.length === 0
) {
return "";
}


return badges
.map(
badge => {

let weightText =
formatWeight(
badge.weightKg
) +
" kg";


/*
  Historische freie Gewichtsangaben wie "ca."
  bevorzugen, wenn sie im Archiv vorhanden sind.
*/

const historicalNote =
String(
item.historicalWeightNote ||
""
)
.trim();


if (
historicalNote
) {

const lower =
historicalNote
.toLowerCase();


if (
lower.includes(
"ca."
) ||
lower.includes(
"circa"
) ||
lower.includes(
"ungefähr"
)
) {

weightText =
historicalNote;

}

}


return `

<span
class="archive-task-weight-details"
title="Mit Zusatzgewicht"
>
🏋️ ${escapeHtml(
weightText
)}
</span>

`;

}
)
.join("");

}

function validateCompleteBackupPayload(
payload
) {

const errors =
[];

[];

const state =

if (

if (

}


const nextNumber =

state.nextArchiveNumber

if (

archiveNumbers.forEach(

);

nextNumber

);

);


const testArchiveCount =

function getBerlinDayBoundsMs(
dateKey
) {

if (!dateKey) {
return null;
}


const nextDateKey =
addDays(
dateKey,
1
);


const startIso =
berlinLocalInputToISO(
dateKey + "T00:00"
);


const endIso =
berlinLocalInputToISO(
nextDateKey + "T00:00"
);


if (
!startIso ||
!endIso
) {
return null;
}


const startMs =
new Date(
startIso
).getTime();


const endMs =
new Date(
endIso
).getTime();


if (
Number.isNaN(
startMs
) ||
Number.isNaN(
endMs
) ||
endMs <= startMs
) {
return null;
}


return {
startMs:
startMs,

endMs:
endMs
};

}


function getArchiveActiveBreakdownByDate(
item
) {

const result =
{};


if (!item) {
return result;
}


function addToDate(
dateKey,
durationMs
) {

const ms =
Number(
durationMs
) || 0;


if (
!dateKey ||
ms <= 0
) {
return;
}


if (!result[dateKey]) {
result[dateKey] =
0;
}


result[dateKey] +=
ms;

}


function addSegmentToDates(
segment
) {

if (
!segment ||
!segment.startedAt ||
!segment.endedAt
) {
return;
}


const segmentStart =
new Date(
segment.startedAt
).getTime();


const segmentEnd =
new Date(
segment.endedAt
).getTime();


if (
Number.isNaN(
segmentStart
) ||
Number.isNaN(
segmentEnd
) ||
segmentEnd <=
segmentStart
) {
return;
}


let dateKey =
getBerlinDateKeyFromISO(
segment.startedAt
);


const finalDateKey =
getBerlinDateKeyFromISO(
new Date(
segmentEnd - 1
).toISOString()
);


if (
!dateKey ||
!finalDateKey
) {
return;
}


let guard =
0;


while (
dateKey <= finalDateKey &&
guard < 3700
) {

const bounds =
getBerlinDayBoundsMs(
dateKey
);


if (!bounds) {
break;
}


const overlapMs =
Math.max(
0,
Math.min(
segmentEnd,
bounds.endMs
) -
Math.max(
segmentStart,
bounds.startMs
)
);


addToDate(
dateKey,
overlapMs
);


dateKey =
addDays(
dateKey,
1
);


guard +=
1;

}

}


/*
  1) Historische, ausdrücklich einem Datum zugeordnete Altzeit.
  Beispiel „Kisten sortieren“: 1:30:00 am 12.06.2026.
*/

item.historicalAccountingByDate &&
typeof item.historicalAccountingByDate ===
"object"
) {

Object.entries(
item.historicalAccountingByDate
)
.forEach(
entry => {

addToDate(
entry[0],
entry[1]
);

}
);

}


/*
  2) Historische Altsegmente mit exakten Uhrzeiten.
  Beispiel Route/Anreise Schweden am 09.08.2026.
*/
if (
Array.isArray(
item.historicalAccountingSegments
)
) {

item.historicalAccountingSegments
.forEach(
addSegmentToDates
);

}


/*
  3) Historische Altzeit ohne belastbares Datum.
  Sie bleibt erhalten und wird mangels rekonstruierbarer Tagesangabe
  erst am endgültigen Abschlusstag statistisch verbucht.
*/
addToDate(
item.completedDate,
item.historicalUnallocatedAccountingMs
);


/*
  4) Alle ab Import tatsächlich erfassten modernen Segmente.
*/
const segments =
Array.isArray(
item.activeSegments
)
? item.activeSegments.filter(
segment =>
segment &&
segment.startedAt &&
segment.endedAt
)
: [];


segments.forEach(
addSegmentToDates
);


/*
  Normale historische Archivaufgabe ohne moderne/Import-Metadaten:
  bisherigen Fallback unverändert verwenden.
*/
const hasImportedAccounting =
(
item.sourceMasterVersion ===
"V361"
) ||
Number(
item.historicalUnallocatedAccountingMs
) > 0 ||
(
item.historicalAccountingByDate &&
Object.keys(
item.historicalAccountingByDate
).length > 0
) ||
(
Array.isArray(
item.historicalAccountingSegments
) &&
item.historicalAccountingSegments.length > 0
);


if (
!hasImportedAccounting &&
segments.length === 0 &&
item.completedDate &&
getArchiveAccountingActiveMs(
item
) > 0
) {

addToDate(
item.completedDate,
getArchiveAccountingActiveMs(
item
)
);

}


return result;

}

function getArchiveActiveMsForDate(
item,
dateKey
) {

const breakdown =
getArchiveActiveBreakdownByDate(
item
);


return Number(
breakdown[dateKey]
) || 0;

}


function statisticsDateIsInPeriod(
dateKey
) {

if (
statisticsPeriod ===
"all"
) {
return true;
}


if (!dateKey) {
return false;
}


const today =
getBerlinDateKey();


const days =
statisticsPeriod ===
"7d"
? 7
: 30;


const firstDate =
addDays(
today,
-(days - 1)
);


return (
dateKey >=
firstDate
&&
dateKey <=
today
);

}

let supabaseInitialImportState = {
status: "idle",
label: "NOCH NICHT GESTARTET",
detail: "Der Erstimport schreibt eine einmalige Cloud-Kopie und verifiziert sie anschließend. localStorage bleibt weiterhin die führende Datenquelle.",
counts: null,
verified: false,
finishedAt: null
};


function importNumberOrNull(value) {
const number = Number(value);
return Number.isFinite(number) ? number : null;
}


function importNonNegativeNumberOrNull(value) {
const number = Number(value);
return Number.isFinite(number) && number >= 0 ? number : null;
}


function importPositiveNumberOrNull(value) {
const number = Number(value);
return Number.isFinite(number) && number > 0 ? number : null;
}


function createSupabaseImportUuid() {
if (window.crypto && typeof window.crypto.randomUUID === "function") {
return window.crypto.randomUUID();
}
return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, character => {
const random = Math.random() * 16 | 0;
const value = character === "x" ? random : (random & 0x3 | 0x8);
return value.toString(16);
});
}


function importSegmentDurationMs(segment) {
const explicit = importNonNegativeNumberOrNull(segment && segment.durationMs);
if (explicit !== null) {
return explicit;
}
const start = Date.parse(segment && segment.startedAt ? segment.startedAt : "");
const end = Date.parse(segment && segment.endedAt ? segment.endedAt : "");
if (Number.isFinite(start) && Number.isFinite(end) && end >= start) {
return end - start;
}
return null;
}


function getRealArchiveForSupabaseImport() {
return archive.filter(item => !isArchivedTest(item));
}


function getSupabaseImportExpectedCounts() {
const realArchive = getRealArchiveForSupabaseImport();
let taskActiveSegments = 0;
let taskCookingSegments = 0;
let archiveActiveSegments = 0;

tasks.forEach(task => {
if (Array.isArray(task && task.activeSegments)) {
task.activeSegments.forEach(segment => {
if (segment && segment.startedAt) {
taskActiveSegments += 1;
}
});
}
if (Array.isArray(task && task.cookingSegments)) {
task.cookingSegments.forEach(segment => {
if (segment && segment.startedAt && ["active","passive"].includes(segment.mode)) {
taskCookingSegments += 1;
}
});
}
});

realArchive.forEach(item => {
if (Array.isArray(item && item.activeSegments)) {
item.activeSegments.forEach(segment => {
if (segment && segment.startedAt && segment.endedAt) {
archiveActiveSegments += 1;
}
});
}
});

return {
app_state: 1,
tasks: tasks.length,
task_active_segments: taskActiveSegments,
task_cooking_segments: taskCookingSegments,
archive_entries: realArchive.length,
archive_active_segments: archiveActiveSegments,
weight_phases: Array.isArray(weightPhases) ? weightPhases.filter(phase => phase && importPositiveNumberOrNull(phase.weightKg) !== null && phase.startedAt).length : 0,
legacy_metadata: 2
};
}


async function rollbackSupabaseInitialImport(client,userId) {
const tables = [
"legacy_metadata",
"weight_phases",
"archive_entries",
"tasks",

];
const rollbackErrors = [];
for (const tableName of tables) {
const { error } = await client.from(tableName).delete().eq("user_id",userId);
if (error) {
rollbackErrors.push(tableName + ": " + (error.message || "Rollback-Fehler"));
}
}
return rollbackErrors;
}


async function verifySupabaseInitialImport(client,userId,expectedCounts) {
const actualCounts = {};
for (const tableName of SUPABASE_EXPECTED_TABLES) {
const { count, error } = await client
.from(tableName)
.select("*", { count: "exact", head: true });
if (error) {
throw new Error("Verifikation " + tableName + ": " + (error.message || "Lesefehler"));
}
actualCounts[tableName] = Number.isFinite(Number(count)) ? Number(count) : 0;
}

for (const [tableName,expected] of Object.entries(expectedCounts)) {
if (actualCounts[tableName] !== expected) {
throw new Error("Verifikation fehlgeschlagen: " + tableName + " hat " + actualCounts[tableName] + " Zeilen, erwartet " + expected + ".");
}
}

const { data: stateRows, error: stateError } = await client
.from("app_state")
.select("user_id,next_archive_number,schema_version,app_version")
.eq("user_id",userId)
.limit(1);
if (stateError) {
throw stateError;
}
const stateRow = Array.isArray(stateRows) && stateRows.length ? stateRows[0] : null;
if (!stateRow || Number(stateRow.next_archive_number) !== Number(nextArchiveNumber)) {
throw new Error("Verifikation fehlgeschlagen: next_archive_number stimmt nicht mit dem lokalen Stand überein.");
}

const { data: manifestRows, error: manifestError } = await client
.from("legacy_metadata")
.select("key,payload")
.eq("user_id",userId)
.eq("key","initial_import_manifest_v1")
.limit(1);
if (manifestError) {
throw manifestError;
}
if (!Array.isArray(manifestRows) || !manifestRows.length) {
throw new Error("Verifikation fehlgeschlagen: Import-Manifest fehlt.");
}

return actualCounts;
}

label: "ERSTIMPORT LÄUFT…",
detail: "Lokale Daten werden kontrolliert nach Supabase kopiert. Bitte diese Seite jetzt nicht schließen.",

};
if (currentTab === "dev") {

}

let client = null;

try {
const integrity = collectDataIntegrityReport();
if (!integrity || !integrity.ok) {
throw new Error("Lokale Datenprüfung ist nicht sauber. Erstimport abgebrochen.");
}

client = getSupabaseClient();
const { data: sessionData, error: sessionError } = await client.auth.getSession();
if (sessionError) {
throw sessionError;
}
const session = sessionData && sessionData.session ? sessionData.session : null;
if (!session || !session.user || !session.user.id) {
throw new Error("Supabase-Login fehlt.");
}
userId = session.user.id;

/* Letzter Sicherheitscheck unmittelbar vor dem ersten Schreiben. */
for (const tableName of SUPABASE_EXPECTED_TABLES) {
const { count, error } = await client.from(tableName).select("*", { count: "exact", head: true });
if (error) {
throw new Error("Cloud-Check " + tableName + ": " + (error.message || "Lesefehler"));
}
if ((Number(count) || 0) !== 0) {
throw new Error("Erstimport gesperrt: " + tableName + " ist nicht leer.");
}
}

const importedAt = new Date().toISOString();

function formatSupabaseSyncTimestamp(value) {
const date = new Date(value);
if (!Number.isFinite(date.getTime())) return String(value || "");
return new Intl.DateTimeFormat("de-DE", {
timeZone:"Europe/Berlin",
day:"2-digit", month:"2-digit", year:"numeric",
hour:"2-digit", minute:"2-digit", second:"2-digit",
hour12:false
}).format(date);
}


function scheduleSupabaseLiveSync(reason = "local-save") {
if (reason) {
supabaseLiveSyncReasons.add(String(reason));
}
if (supabaseLiveSyncRunning) {
supabaseLiveSyncPending = true;
return;
}
if (supabaseLiveSyncTimer) {
clearTimeout(supabaseLiveSyncTimer);
}
supabaseLiveSyncTimer = setTimeout(() => {
supabaseLiveSyncTimer = null;
runSupabaseLiveSync(false);
}, 900);
}


async function getLiveSyncSessionAndManifest(client) {
const { data: sessionData, error: sessionError } = await client.auth.getSession();
if (sessionError) throw sessionError;
const session = sessionData && sessionData.session ? sessionData.session : null;
if (!session || !session.user || !session.user.id) {
return { ready: false, reason: "Supabase-Login fehlt." };
}
const userId = session.user.id;
const { data: manifestRows, error: manifestError } = await client
.from("legacy_metadata")
.select("key")
.eq("user_id", userId)
.eq("key", "initial_import_manifest_v1")
.limit(1);
if (manifestError) throw manifestError;
if (!Array.isArray(manifestRows) || !manifestRows.length) {
return { ready: false, reason: "Der verifizierte Erstimport wurde für diesen Benutzer nicht gefunden." };
}
return { ready: true, session, userId };
}

async function syncTasksToSupabase(client,userId) {
const { data: existingRows, error: existingError } = await client
.from("tasks")
.select("id,legacy_task_id")
.eq("user_id", userId);
if (existingError) throw existingError;
const existing = Array.isArray(existingRows) ? existingRows : [];
const idByLegacy = new Map(existing.map(row => [Number(row.legacy_task_id), row.id]));
const localIds = new Set();
const taskRows = [];
const taskSegmentRows = [];
const cookingRows = [];

for (const task of tasks) {
const legacyId = Number(task && task.id);
if (!Number.isInteger(legacyId)) continue;
localIds.add(legacyId);
const cloudId = idByLegacy.get(legacyId) || createSupabaseImportUuid();
taskRows.push(buildLiveTaskRow(task,userId,cloudId));
if (Array.isArray(task.activeSegments)) {
for (const segment of task.activeSegments) {
if (!segment || !segment.startedAt) continue;
taskSegmentRows.push({ user_id:userId, task_id:cloudId, started_at:segment.startedAt, ended_at:segment.endedAt || null, duration_ms:importSegmentDurationMs(segment), weight_kg:importPositiveNumberOrNull(segment.weightKg), metadata:{ raw:segment, liveSync:true } });
}
}
if (Array.isArray(task.cookingSegments)) {
for (const segment of task.cookingSegments) {
if (!segment || !segment.startedAt || !["active","passive"].includes(segment.mode)) continue;
cookingRows.push({ user_id:userId, task_id:cloudId, mode:segment.mode, started_at:segment.startedAt, ended_at:segment.endedAt || null, duration_ms:importSegmentDurationMs(segment) });
}
}
}

/* Kindzeilen zuerst entfernen, damit FK-Regeln das Entfernen lokaler Aufgaben nicht blockieren. */
let result = await client.from("task_active_segments").delete().eq("user_id",userId);
if (result.error) throw result.error;
result = await client.from("task_cooking_segments").delete().eq("user_id",userId);
if (result.error) throw result.error;

const removedIds = existing.filter(row => !localIds.has(Number(row.legacy_task_id))).map(row => row.id);
if (removedIds.length) {
const { error } = await client.from("tasks").delete().in("id", removedIds).eq("user_id",userId);
if (error) throw error;
}
for (const row of taskRows) {
const known = idByLegacy.has(Number(row.legacy_task_id));
const query = known ? client.from("tasks").update(row).eq("id",row.id).eq("user_id",userId) : client.from("tasks").insert([row]);
const { error } = await query;
if (error) throw error;
}
if (taskSegmentRows.length) { result = await client.from("task_active_segments").insert(taskSegmentRows); if (result.error) throw result.error; }
if (cookingRows.length) { result = await client.from("task_cooking_segments").insert(cookingRows); if (result.error) throw result.error; }
return { tasks:taskRows.length, task_active_segments:taskSegmentRows.length, task_cooking_segments:cookingRows.length };
}


async function syncArchiveToSupabase(client,userId) {

.from("archive_entries")
.select("id,archive_number")
.eq("user_id",userId);
if (existingError) throw existingError;
const existing = Array.isArray(existingRows) ? existingRows : [];
const idByNumber = new Map(existing.map(row => [Number(row.archive_number), row.id]));
const localNumbers = new Set();
const archiveRows = [];
const segmentRows = [];
const syncedAt = new Date().toISOString();
for (const item of realArchive) {
const number = Number(item && item.archiveNumber);
if (!Number.isInteger(number)) continue;
localNumbers.add(number);
const cloudId = idByNumber.get(number) || createSupabaseImportUuid();
archiveRows.push(buildLiveArchiveRow(item,userId,cloudId,syncedAt));
if (Array.isArray(item.activeSegments)) {
for (const segment of item.activeSegments) {
if (!segment || !segment.startedAt || !segment.endedAt) continue;
segmentRows.push({ user_id:userId, archive_entry_id:cloudId, started_at:segment.startedAt, ended_at:segment.endedAt, duration_ms:importSegmentDurationMs(segment) || 0, metadata:{ raw:segment, archiveNumber:number, liveSync:true } });
}
}
}
/* Archivsegmente zuerst entfernen, bevor eventuell Archivzeilen entfallen. */
let result = await client.from("archive_active_segments").delete().eq("user_id",userId);
if (result.error) throw result.error;
const removedIds = existing.filter(row => !localNumbers.has(Number(row.archive_number))).map(row => row.id);
if (removedIds.length) {
const { error } = await client.from("archive_entries").delete().in("id",removedIds).eq("user_id",userId);
if (error) throw error;
}
for (const row of archiveRows) {
const known = idByNumber.has(Number(row.archive_number));
const query = known ? client.from("archive_entries").update(row).eq("id",row.id).eq("user_id",userId) : client.from("archive_entries").insert([row]);
const { error } = await query;
if (error) throw error;
}
if (segmentRows.length) { result = await client.from("archive_active_segments").insert(segmentRows); if (result.error) throw result.error; }
return { archive_entries:archiveRows.length, archive_active_segments:segmentRows.length };
}


async function syncWeightToSupabase(client,userId) {
const weightRows = (Array.isArray(weightPhases) ? weightPhases : [])
.filter(phase => phase && importPositiveNumberOrNull(phase.weightKg) !== null && phase.startedAt)
.map(phase => ({ user_id:userId, legacy_phase_id:Number.isInteger(Number(phase.id)) ? Number(phase.id) : null, weight_kg:importPositiveNumberOrNull(phase.weightKg), started_at:phase.startedAt, ended_at:phase.endedAt || null, phase_date:phase.date || getBerlinDateKey(new Date(phase.startedAt)), source:phase.source ? String(phase.source) : "live-sync", metadata:{ raw:phase, liveSync:true } }));
let result = await client.from("weight_phases").delete().eq("user_id",userId);
if (result.error) throw result.error;
if (weightRows.length) { result = await client.from("weight_phases").insert(weightRows); if (result.error) throw result.error; }
return { weight_phases:weightRows.length };
}


async function syncAppStateToSupabase(client,userId) {
const row = {
user_id:userId,
next_archive_number:nextArchiveNumber,
current_tab:currentTab,
new_task_priority:newTaskPriority,
new_task_type:newTaskType,
statistics_period:statisticsPeriod,
ui_settings:{ weightState:weightState, liveSync:{ appVersion:APP_VERSION, syncedAt:new Date().toISOString(), localStorageRemainsMaster:true } },
schema_version:1,
app_version:APP_VERSION
};
const { data: existing, error: readError } = await client.from("app_state").select("user_id").eq("user_id",userId).limit(1);
if (readError) throw readError;
const result = Array.isArray(existing) && existing.length
? await client.from("app_state").update(row).eq("user_id",userId)
: await client.from("app_state").insert([row]);
if (result.error) throw result.error;
return { app_state:1 };
}


async function verifySupabaseLiveSync(client,userId,expected) {
const checks = {};
for (const tableName of ["app_state","tasks","task_active_segments","task_cooking_segments","archive_entries","archive_active_segments","weight_phases"]) {
const { count, error } = await client.from(tableName).select("*",{ count:"exact", head:true });
if (error) throw error;
checks[tableName] = Number(count) || 0;
if (expected[tableName] !== undefined && checks[tableName] !== expected[tableName]) {
throw new Error("Sync-Verifikation: " + tableName + " hat " + checks[tableName] + " Zeilen, lokal erwartet " + expected[tableName] + ".");
}
}
const { data: stateRows, error: stateError } = await client.from("app_state").select("next_archive_number,app_version").eq("user_id",userId).limit(1);
if (stateError) throw stateError;
if (!Array.isArray(stateRows) || !stateRows.length || Number(stateRows[0].next_archive_number) !== Number(nextArchiveNumber)) {
throw new Error("Sync-Verifikation: next_archive_number stimmt nicht.");
}
return checks;
}


async function runSupabaseLiveSync(manual = false) {
if (supabaseLiveSyncRunning) {
supabaseLiveSyncPending = true;
return;
}
supabaseLiveSyncRunning = true;
const reasons = Array.from(supabaseLiveSyncReasons);
supabaseLiveSyncReasons.clear();
supabaseLiveSyncState = { ...supabaseLiveSyncState, status:"running", label:"SYNCHRONISIERE…", detail:"Lokaler Stand wird nach Supabase gespiegelt und anschließend gezählt.", lastReason:reasons.join(", ") || (manual ? "manuell" : "auto") };
if (currentTab === "dev") render();
try {
const integrity = collectDataIntegrityReport();
if (!integrity || !integrity.ok) throw new Error("Lokale Datenprüfung meldet Fehler. Cloud-Sync wurde aus Sicherheitsgründen gestoppt.");
const client = getSupabaseClient();
const readiness = await getLiveSyncSessionAndManifest(client);
if (!readiness.ready) {
supabaseLiveSyncState = { ...supabaseLiveSyncState, status:"warn", label:"SYNC PAUSIERT ⚠️", detail:readiness.reason + " Lokale Speicherung funktioniert weiter; nach Login kann manuell nachsynchronisiert werden." };
return;
}
const userId = readiness.userId;
const taskCounts = await syncTasksToSupabase(client,userId);
const archiveCounts = await syncArchiveToSupabase(client,userId);
const weightCounts = await syncWeightToSupabase(client,userId);
const stateCounts = await syncAppStateToSupabase(client,userId);
const expected = { ...stateCounts, ...taskCounts, ...archiveCounts, ...weightCounts };
const verified = await verifySupabaseLiveSync(client,userId,expected);
supabaseLiveSyncState = {
status:"ok",
label:"CLOUD SYNCHRON ✅",
detail:"Lokaler Stand wurde erfolgreich nach Supabase gespiegelt und verifiziert. localStorage bleibt weiterhin Master.",
lastSyncAt:new Date().toISOString(),
lastReason:reasons.join(", ") || (manual ? "manuell" : "auto"),
counts:verified
};
} catch (error) {
supabaseLiveSyncState = { ...supabaseLiveSyncState, status:"error", label:"SYNC-FEHLER ❌", detail:(error && error.message) ? error.message : "Unbekannter Cloud-Sync-Fehler." };
} finally {
supabaseLiveSyncRunning = false;
if (currentTab === "dev") render();
if (supabaseLiveSyncPending) {
supabaseLiveSyncPending = false;
scheduleSupabaseLiveSync("nachlauf");
}
}
}

====================================== */

function normalizeSuggestionText(
value
) {

return String(
value || ""
)
.trim()
.toLocaleLowerCase(
"de-DE"
);

}


function getKnownTaskSuggestions(
query
) {

const normalizedQuery =
normalizeSuggestionText(
query
);


if (
normalizedQuery.length <
1
) {

return [];

}


const known =
new Map();


function addKnown(
item,
source
) {

const name =
String(
item.text || ""
).trim();


if (!name) {
return;
}


const key =
normalizeSuggestionText(
name
);


if (
!known.has(
key
)
) {

known.set(
key,
{
name:
name,

source:
source
}
);

}

}


tasks.forEach(
item =>
addKnown(
item,
"AKTIV"
)
);


archive.forEach(
item =>
addKnown(
item,
"ARCHIV"
)
);


return [
...known.values()
]
.map(
item => {

const normalizedName =
normalizeSuggestionText(
item.name
);


let rank =
999;


if (
normalizedName ===
normalizedQuery
) {

rank =
0;

} else if (
normalizedName.startsWith(
normalizedQuery
)
) {

rank =
1;

} else if (
normalizedName.includes(
normalizedQuery
)
) {

rank =
2;

}


return {
...item,
rank:
rank
};

}
)
.filter(
item =>
item.rank <
999
)
.sort(
(a,b) =>
a.rank -
b.rank
||
a.name.localeCompare(
b.name,
"de-DE"
)
)
.slice(
0,
8
);

}


function hideTaskSuggestions() {

const box =
document.getElementById(
"taskSuggestions"
);


if (!box) {
return;
}


box.classList.remove(
"visible"
);


box.innerHTML =
"";

}


function selectTaskSuggestion(
encodedName
) {

const input =
document.getElementById(
"taskInput"
);


if (!input) {
return;
}


input.value =
decodeURIComponent(
encodedName
);


hideTaskSuggestions();


input.focus();

}


function renderTaskSuggestions() {

const input =
document.getElementById(
"taskInput"
);


const box =
document.getElementById(
"taskSuggestions"
);


if (
!input ||
!box
) {
return;
}


const suggestions =
getKnownTaskSuggestions(
input.value
);


if (
suggestions.length ===
0
) {

hideTaskSuggestions();

return;

}


box.innerHTML =
suggestions
.map(
item => `

<button
type="button"
class="task-suggestion"
onmousedown="event.preventDefault()"
onclick="selectTaskSuggestion('${encodeURIComponent(
item.name
)}')"
>

<span class="task-suggestion-name">
${escapeHtml(
item.name
)}
</span>

<span class="task-suggestion-source">
${item.source}
</span>

</button>

`
)
.join("");


box.classList.add(
"visible"
);

}

/* ======================================
   ENTER
====================================== */

document
.getElementById(
"taskInput"
)
.addEventListener(
"input",
renderTaskSuggestions
);


document
.addEventListener(
"click",
event => {

const wrap =
event.target.closest(
".task-input-wrap"
);


if (!wrap) {

hideTaskSuggestions();

}

}
);


document
.getElementById(
"taskInput"
)
.addEventListener(
"keydown",
event => {

if (
event.key ===
"Enter"
) {

hideTaskSuggestions();

addTask();

}

}
);

   START
====================================== */

const masterV361ImportResult =
importMasterV361ActiveTasksOnce();


if (
masterV361ImportResult.added > 0
) {

console.info(
"Master V361 importiert:",
masterV361ImportResult.added,
"aktive Aufgaben."
);

}


processDayTransition();

saveAll();

updateNewOptions();

renderWeightPanel();

render();


setTimeout(
() => {

refreshSupabaseSessionStatus();

},
0
);


setTimeout(
() => {

if (
cleanupAccidentalKitchenTestSafely()
) {

renderWeightPanel();

render();

}

},
0
);

</script>
