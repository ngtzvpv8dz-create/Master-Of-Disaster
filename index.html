<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Master of Disaster</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
    }

    .add-button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .task {
      background: #222;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .task-text {
      flex: 1;
      font-size: 18px;
      word-break: break-word;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .move-buttons {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .move-button {
      width: 32px;
      height: 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .empty-message {
      text-align: center;
      opacity: 0.5;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>MASTER OF DISASTER</h1>

    <input
      type="text"
      id="taskInput"
      placeholder="Neue Aufgabe..."
    >

    <button
      class="add-button"
      onclick="addTask()"
    >
      + Aufgabe hinzufügen
    </button>

    <div id="taskList"></div>

  </div>

  <script>

    let tasks =
      JSON.parse(
        localStorage.getItem("masterOfDisasterTasks")
      ) || [];

    function saveTasks() {
      localStorage.setItem(
        "masterOfDisasterTasks",
        JSON.stringify(tasks)
      );
    }

    function addTask() {

      const input =
        document.getElementById("taskInput");

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }

      const newTask = {
        id: Date.now(),
        text: text,
        completed: false
      };

      tasks.push(newTask);

      saveTasks();

      input.value = "";

      renderTasks();
    }

    function toggleTask(id) {

      const task =
        tasks.find(task => task.id === id);

      if (task) {
        task.completed =
          !task.completed;
      }

      saveTasks();

      renderTasks();
    }

    function deleteTask(id) {

      tasks =
        tasks.filter(
          task => task.id !== id
        );

      saveTasks();

      renderTasks();
    }

    function editTask(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      const newText =
        prompt(
          "Aufgabe bearbeiten:",
          task.text
        );

      if (newText === null) {
        return;
      }

      const cleanedText =
        newText.trim();

      if (cleanedText === "") {
        return;
      }

      task.text = cleanedText;

      saveTasks();

      renderTasks();
    }

    function moveTaskUp(id) {

      const index =
        tasks.findIndex(
          task => task.id === id
        );

      if (index <= 0) {
        return;
      }

      const temp =
        tasks[index - 1];

      tasks[index - 1] =
        tasks[index];

      tasks[index] =
        temp;

      saveTasks();

      renderTasks();
    }

    function moveTaskDown(id) {

      const index =
        tasks.findIndex(
          task => task.id === id
        );

      if (
        index === -1 ||
        index >= tasks.length - 1
      ) {
        return;
      }

      const temp =
        tasks[index + 1];

      tasks[index + 1] =
        tasks[index];

      tasks[index] =
        temp;

      saveTasks();

      renderTasks();
    }

    function renderTasks() {

      const taskList =
        document.getElementById("taskList");

      taskList.innerHTML = "";

      if (tasks.length === 0) {

        taskList.innerHTML = `
          <div class="empty-message">
            Noch keine Aufgaben 👀
          </div>
        `;

        return;
      }

      tasks.forEach(task => {

        const taskElement =
          document.createElement("div");

        taskElement.className =
          "task" +
          (task.completed
            ? " completed"
            : "");

        taskElement.innerHTML = `

          <div class="move-buttons">

            <button
              class="move-button"
              onclick="moveTaskUp(${task.id})"
            >
              ▲
            </button>

            <button
              class="move-button"
              onclick="moveTaskDown(${task.id})"
            >
              ▼
            </button>

          </div>

          <button
            class="icon-button"
            onclick="toggleTask(${task.id})"
          >
            ${task.completed ? "✅" : "⬜"}
          </button>

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          <button
            class="icon-button"
            onclick="editTask(${task.id})"
          >
            ✏️
          </button>

          <button
            class="icon-button"
            onclick="deleteTask(${task.id})"
          >
            🗑️
          </button>

        `;

        taskList.appendChild(
          taskElement
        );
      });
    }

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

    document
      .getElementById("taskInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            addTask();
          }

        }
      );

    renderTasks();

  </script>

</body>
</html>
