<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">

  <title>Master of Disaster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #15191d 0%,
          #0b0d0f 45%,
          #070809 100%
        );

      color: #f3f3f3;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin: 10px 0 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .eyebrow {
      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;

      color: #8c969f;
    }

    .title-bottom {
      margin-top: 10px;
      margin-bottom: 0;
      letter-spacing: 2.5px;
    }

    /* EINGABE */

    .input-panel {
      padding: 14px;
      margin-bottom: 26px;

      background: #171b1f;

      border: 1px solid #292f34;
      border-radius: 18px;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.28);
    }

    #taskInput {
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;

      border: 1px solid #30373d;
      border-radius: 12px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 17px;
    }

    #taskInput:focus,
    .edit-input:focus {
      border-color: #7d8993;
    }

    #taskInput::placeholder {
      color: #626b72;
    }

    .add-button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #e8ecef;
      color: #101214;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    /* BEREICHE */

    .task-section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 0 4px 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;

      color: #8c969f;
    }

    .counter {
      padding: 5px 9px;

      border: 1px solid #30363b;
      border-radius: 20px;

      background: #15191c;

      font-size: 12px;
      color: #aab1b7;
    }

    /* AUFGABEN */

    .task {
      display: flex;
      align-items: center;
      gap: 9px;

      min-height: 70px;

      padding: 10px;
      margin-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          #1c2125,
          #14181b
        );

      border: 1px solid #292f34;
      border-radius: 15px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.18);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        border-color 0.15s ease;
    }

    .task.completed {
      opacity: 0.55;
    }

    .task.completed .task-text {
      text-decoration: line-through;
    }

    .task.dragging {
      opacity: 0.45;
      transform: scale(0.985);
      border-color: #587389;
    }

    .task.drag-over {
      border-color: #5d7890;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      word-break: break-word;
    }

    .task-meta {
      margin-top: 5px;

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.7px;

      color: #587b98;
    }

    /* DRAG-GRIFF */

    .drag-handle {
      width: 32px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: 1px solid #30363b;
      border-radius: 9px;

      background: #0e1113;
      color: #75808a;

      font-size: 21px;
      line-height: 1;

      cursor: grab;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
      transform: scale(0.95);
    }

    /* BUTTONS */

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border: 1px solid #30363b;
      border-radius: 11px;

      background: #0e1113;

      font-size: 18px;

      cursor: pointer;
    }

    .icon-button:disabled {
      cursor: default;
    }

    .icon-button:active,
    .edit-button:active,
    .add-button:active {
      transform: scale(0.96);
    }

    /* BEARBEITEN */

    .edit-area {
      flex: 1;
      min-width: 0;
    }

    .edit-input {
      width: 100%;
      padding: 11px;

      border: 1px solid #30373d;
      border-radius: 9px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 16px;
    }

    .edit-actions {
      display: flex;
      gap: 7px;

      margin-top: 7px;
    }

    .edit-button {
      flex: 1;

      padding: 8px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #0e1113;
      color: #d8dde0;

      font-weight: 700;

      cursor: pointer;
    }

    /* LEERE BEREICHE */

    .empty-message {
      padding: 25px 20px;

      border: 1px dashed #30363b;
      border-radius: 15px;

      text-align: center;

      color: #626c73;
    }

    /* LÖSCH-DIALOG */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.72);

      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 360px;

      padding: 22px;

      background: #191d20;

      border: 1px solid #343b40;
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .modal p {
      margin: 0 0 20px;
      color: #9ba3a9;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-button {
      flex: 1;
      padding: 12px;

      border: 0;
      border-radius: 10px;

      font-weight: 800;

      cursor: pointer;
    }

    .cancel-delete {
      background: #30363b;
      color: white;
    }

    .confirm-delete {
      background: #e8ecef;
      color: #101214;
    }

    @media (max-width: 390px) {

      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .task {
        gap: 6px;
      }

      .icon-button {
        width: 38px;
        height: 40px;
        font-size: 16px;
      }

      .drag-handle {
        width: 29px;
        height: 40px;
        font-size: 19px;
      }

      .task-text {
        font-size: 16px;
      }

      .task-meta {
        font-size: 8.5px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <h1>
        MASTER OF DISASTER
      </h1>

      <div class="eyebrow title-bottom">
        WEEK-AND-END-TO-DO-DINGSI
      </div>

    </header>


    <section class="input-panel">

      <input
        type="text"
        id="taskInput"
        placeholder="Was steht an?"
        autocomplete="off"
      >

      <button
        class="add-button"
        onclick="addTask()"
      >
        + AUFGABE HINZUFÜGEN
      </button>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          AUFGABEN
        </div>

        <div
          class="counter"
          id="openCounter"
        >
          0 offen
        </div>

      </div>

      <div id="openTaskList"></div>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          ERLEDIGT
        </div>

        <div
          class="counter"
          id="completedCounter"
        >
          0 erledigt
        </div>

      </div>

      <div id="completedTaskList"></div>

    </section>

  </main>


  <div id="modalContainer"></div>


  <script>

    let tasks =
      JSON.parse(
        localStorage.getItem(
          "masterOfDisasterTasks"
        )
      ) || [];

    let editingTaskId = null;

    let draggedTaskId = null;
    let pointerDrag = null;


    function saveTasks() {

      localStorage.setItem(
        "masterOfDisasterTasks",
        JSON.stringify(tasks)
      );

    }


    function addTask() {

      const input =
        document.getElementById(
          "taskInput"
        );

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }

      tasks.push({
        id: Date.now(),
        text: text,
        completed: false,
        completedAt: null
      });

      saveTasks();

      input.value = "";

      renderTasks();

    }


    function toggleTask(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      task.completed = true;
      task.completedAt =
        new Date().toISOString();

      editingTaskId = null;

      saveTasks();

      renderTasks();

    }


    function repeatTask(id) {

      const oldTask =
        tasks.find(
          task => task.id === id
        );

      if (!oldTask) {
        return;
      }

      tasks.push({
        id: Date.now(),
        text: oldTask.text,
        completed: false,
        completedAt: null
      });

      saveTasks();

      renderTasks();

    }


    function startEditing(id) {

      editingTaskId = id;

      renderTasks();

      setTimeout(() => {

        const input =
          document.getElementById(
            "edit-" + id
          );

        if (input) {

          input.focus();

          input.setSelectionRange(
            input.value.length,
            input.value.length
          );

        }

      }, 0);

    }


    function cancelEditing() {

      editingTaskId = null;

      renderTasks();

    }


    function saveEdit(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      const input =
        document.getElementById(
          "edit-" + id
        );

      if (!task || !input) {
        return;
      }

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }

      task.text = text;

      editingTaskId = null;

      saveTasks();

      renderTasks();

    }


    function askDelete(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      const container =
        document.getElementById(
          "modalContainer"
        );

      container.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeDeleteModal(event)"
        >

          <div class="modal">

            <h2>
              Aufgabe löschen?
            </h2>

            <p>
              „${escapeHtml(task.text)}“
              wird endgültig gelöscht.
            </p>

            <div class="modal-actions">

              <button
                class="modal-button cancel-delete"
                onclick="closeModal()"
              >
                Abbrechen
              </button>

              <button
                class="modal-button confirm-delete"
                onclick="deleteTask(${id})"
              >
                Löschen
              </button>

            </div>

          </div>

        </div>
      `;

    }


    function closeDeleteModal(event) {

      if (
        event.target.classList.contains(
          "modal-backdrop"
        )
      ) {
        closeModal();
      }

    }


    function closeModal() {

      document.getElementById(
        "modalContainer"
      ).innerHTML = "";

    }


    function deleteTask(id) {

      tasks =
        tasks.filter(
          task => task.id !== id
        );

      saveTasks();

      closeModal();

      renderTasks();

    }


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    function formatCompletedAt(value) {

      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      const datePart =
        date.toLocaleDateString(
          "de-DE",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        );

      const timePart =
        date.toLocaleTimeString(
          "de-DE",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      return (
        "ERLEDIGT · " +
        datePart +
        " · " +
        timePart +
        " UHR"
      );

    }


    function reorderOpenTasks(
      draggedId,
      targetId
    ) {

      if (
        draggedId === targetId
      ) {
        return;
      }

      const openTasks =
        tasks.filter(
          task => !task.completed
        );

      const draggedIndex =
        openTasks.findIndex(
          task =>
            task.id === draggedId
        );

      const targetIndex =
        openTasks.findIndex(
          task =>
            task.id === targetId
        );

      if (
        draggedIndex === -1 ||
        targetIndex === -1
      ) {
        return;
      }

      const [
        draggedTask
      ] =
        openTasks.splice(
          draggedIndex,
          1
        );

      openTasks.splice(
        targetIndex,
        0,
        draggedTask
      );

      let openIndex = 0;

      tasks =
        tasks.map(task => {

          if (task.completed) {
            return task;
          }

          const newTask =
            openTasks[openIndex];

          openIndex++;

          return newTask;

        });

      saveTasks();

      renderTasks();

    }


    function setupMouseDrag(
      taskElement,
      task
    ) {

      taskElement.addEventListener(
        "dragover",
        event => {

          event.preventDefault();

          if (
            draggedTaskId === null ||
            draggedTaskId === task.id
          ) {
            return;
          }

          taskElement.classList.add(
            "drag-over"
          );

        }
      );


      taskElement.addEventListener(
        "dragleave",
        () => {

          taskElement.classList.remove(
            "drag-over"
          );

        }
      );


      taskElement.addEventListener(
        "drop",
        event => {

          event.preventDefault();

          taskElement.classList.remove(
            "drag-over"
          );

          if (
            draggedTaskId === null
          ) {
            return;
          }

          reorderOpenTasks(
            draggedTaskId,
            task.id
          );

          draggedTaskId = null;

        }
      );

    }


    function startPointerDrag(
      event,
      taskId
    ) {

      if (
        event.pointerType === "mouse"
      ) {
        return;
      }

      event.preventDefault();

      const taskElement =
        event.currentTarget.closest(
          ".task"
        );

      if (!taskElement) {
        return;
      }

      pointerDrag = {
        taskId: taskId,
        element: taskElement,
        pointerId: event.pointerId
      };

      event.currentTarget
        .setPointerCapture(
          event.pointerId
        );

      taskElement.classList.add(
        "dragging"
      );

    }


    function movePointerDrag(event) {

      if (!pointerDrag) {
        return;
      }

      if (
        event.pointerId !==
        pointerDrag.pointerId
      ) {
        return;
      }

      event.preventDefault();

      const element =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );

      const targetTask =
        element
          ? element.closest(".task")
          : null;

      document
        .querySelectorAll(
          ".task.drag-over"
        )
        .forEach(item =>
          item.classList.remove(
            "drag-over"
          )
        );

      if (
        !targetTask ||
        targetTask ===
          pointerDrag.element
      ) {
        return;
      }

      const targetId =
        Number(
          targetTask.dataset.taskId
        );

      const targetData =
        tasks.find(
          task =>
            task.id === targetId
        );

      if (
        !targetData ||
        targetData.completed
      ) {
        return;
      }

      targetTask.classList.add(
        "drag-over"
      );

    }


    function endPointerDrag(event) {

      if (!pointerDrag) {
        return;
      }

      if (
        event.pointerId !==
        pointerDrag.pointerId
      ) {
        return;
      }

      const element =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );

      const targetTask =
        element
          ? element.closest(".task")
          : null;

      const draggedId =
        pointerDrag.taskId;

      pointerDrag.element.classList.remove(
        "dragging"
      );

      document
        .querySelectorAll(
          ".task.drag-over"
        )
        .forEach(item =>
          item.classList.remove(
            "drag-over"
          )
        );

      pointerDrag = null;

      if (!targetTask) {
        return;
      }

      const targetId =
        Number(
          targetTask.dataset.taskId
        );

      const targetData =
        tasks.find(
          task =>
            task.id === targetId
        );

      if (
        !targetData ||
        targetData.completed
      ) {
        return;
      }

      reorderOpenTasks(
        draggedId,
        targetId
      );

    }


    document.addEventListener(
      "pointermove",
      movePointerDrag,
      {
        passive: false
      }
    );


    document.addEventListener(
      "pointerup",
      endPointerDrag
    );


    document.addEventListener(
      "pointercancel",
      endPointerDrag
    );


    function createTaskElement(task) {

      const taskElement =
        document.createElement(
          "div"
        );

      taskElement.className =
        "task" +
        (
          task.completed
            ? " completed"
            : ""
        );

      taskElement.dataset.taskId =
        task.id;


      if (
        !task.completed &&
        editingTaskId === task.id
      ) {

        taskElement.innerHTML = `

          <div class="edit-area">

            <input
              class="edit-input"
              id="edit-${task.id}"
              value="${escapeHtml(task.text)}"
              onkeydown="
                if(event.key === 'Enter') {
                  saveEdit(${task.id})
                }
              "
            >

            <div class="edit-actions">

              <button
                class="edit-button"
                onclick="saveEdit(${task.id})"
              >
                ✓ Speichern
              </button>

              <button
                class="edit-button"
                onclick="cancelEditing()"
              >
                × Abbrechen
              </button>

            </div>

          </div>
        `;

        return taskElement;

      }


      if (task.completed) {

        taskElement.innerHTML = `

          <button
            class="icon-button"
            aria-label="Erledigt"
            title="Erledigt"
            disabled
          >
            ✅
          </button>

          <div class="task-content">

            <div class="task-text">
              ${escapeHtml(task.text)}
            </div>

            ${
              task.completedAt
                ? `
                  <div class="task-meta">
                    ${formatCompletedAt(task.completedAt)}
                  </div>
                `
                : ""
            }

          </div>

          <button
            class="icon-button"
            onclick="repeatTask(${task.id})"
            aria-label="Aufgabe wiederholen"
            title="Wiederholen"
          >
            🔁
          </button>

        `;

      } else {

        taskElement.innerHTML = `

          <div
            class="drag-handle"
            draggable="true"
            aria-label="Aufgabe verschieben"
            title="Verschieben"
          >
            ≡
          </div>

          <button
            class="icon-button"
            onclick="toggleTask(${task.id})"
            aria-label="Aufgabe erledigen"
            title="Erledigen"
          >
            ⬜
          </button>

          <div class="task-content">

            <div class="task-text">
              ${escapeHtml(task.text)}
            </div>

          </div>

          <button
            class="icon-button"
            onclick="startEditing(${task.id})"
            aria-label="Bearbeiten"
            title="Bearbeiten"
          >
            ✏️
          </button>

          <button
            class="icon-button"
            onclick="askDelete(${task.id})"
            aria-label="Löschen"
            title="Löschen"
          >
            🗑️
          </button>

        `;


        const handle =
          taskElement.querySelector(
            ".drag-handle"
          );


        handle.addEventListener(
          "dragstart",
          event => {

            draggedTaskId =
              task.id;

            taskElement.classList.add(
              "dragging"
            );

            event.dataTransfer.effectAllowed =
              "move";

            event.dataTransfer.setData(
              "text/plain",
              String(task.id)
            );

          }
        );


        handle.addEventListener(
          "dragend",
          () => {

            draggedTaskId = null;

            taskElement.classList.remove(
              "dragging"
            );

            document
              .querySelectorAll(
                ".task.drag-over"
              )
              .forEach(item =>
                item.classList.remove(
                  "drag-over"
                )
              );

          }
        );


        handle.addEventListener(
          "pointerdown",
          event =>
            startPointerDrag(
              event,
              task.id
            )
        );


        setupMouseDrag(
          taskElement,
          task
        );

      }

      return taskElement;

    }


    function renderTasks() {

      const openTaskList =
        document.getElementById(
          "openTaskList"
        );

      const completedTaskList =
        document.getElementById(
          "completedTaskList"
        );

      const openTasks =
        tasks.filter(
          task => !task.completed
        );

      const completedTasks =
        tasks.filter(
          task => task.completed
        );


      document.getElementById(
        "openCounter"
      ).textContent =
        openTasks.length === 1
          ? "1 offen"
          : openTasks.length +
            " offen";


      document.getElementById(
        "completedCounter"
      ).textContent =
        completedTasks.length === 1
          ? "1 erledigt"
          : completedTasks.length +
            " erledigt";


      openTaskList.innerHTML = "";

      completedTaskList.innerHTML = "";


      if (
        openTasks.length === 0
      ) {

        openTaskList.innerHTML = `
          <div class="empty-message">
            Nix offen. Verdächtig. 👀
          </div>
        `;

      } else {

        openTasks.forEach(task => {

          openTaskList.appendChild(
            createTaskElement(task)
          );

        });

      }


      if (
        completedTasks.length === 0
      ) {

        completedTaskList.innerHTML = `
          <div class="empty-message">
            Noch nix erledigt.
          </div>
        `;

      } else {

        completedTasks.forEach(
          task => {

            completedTaskList.appendChild(
              createTaskElement(task)
            );

          }
        );

      }

    }


    document
      .getElementById(
        "taskInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {
            addTask();
          }

        }
      );


    renderTasks();

  </script>

</body>
</html>
