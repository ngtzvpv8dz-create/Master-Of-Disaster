/*
  EINE EINZIGE SENKRECHTE LINIE

*/

.archive-task-list::before {
  content: "";

  position: absolute;

}

  AUFGABEN LIEGEN ÜBER DER LINIE
*/

.archive-task {
  position: relative;
  z-index: 1;

  margin-left: 20px;
}


/*
  WAAGERECHTER ABZWEIG
  VON DER SENKRECHTEN LINIE
*/

.archive-task::before {
  content: "";

  position: absolute;

  left: -13px;
  top: 15px;

  width: 13px;
  height: 1px;

  opacity: 1;
}


/*
  BEI DER LETZTEN AUFGABE
  DIE SENKRECHTE LINIE UNTERHALB

*/

.archive-task:last-child::after {
  content: "";

  position: absolute;

  left: -15px;
  top: 16px;
  bottom: -6px;

  width: 5px;

  background: #070809;

  z-index: 3;
}

) {

return window.localStorage
.getItem(
key
);

} catch (
error

key
);

return null;

function safeStorageSet(
key,
value
) {

.setItem(
key,
value
);

error
) {

key

function phaseDurationMs(phase) {

const start =
new Date(
phase.startedAt
).getTime();


const end =
new Date(
phase.endedAt
).getTime();


if (
Number.isNaN(start) ||

) {

end - start

function getWeightPhasesForDate(
dateKey,
includeCurrent = false
) {

const bounds =
getBerlinDayBoundsMs(
dateKey
);


const phases =
weightPhases
.map(
phase => {

if (!phase) {
return null;
}


if (
phase.startedAt &&
phase.endedAt &&
bounds
) {

const startMs =
new Date(
phase.startedAt
).getTime();


const endMs =
new Date(
phase.endedAt
).getTime();


if (
Number.isNaN(
startMs
) ||
Number.isNaN(
endMs
)
) {
return null;
}


const clippedStart =
Math.max(
startMs,
bounds.startMs
);


const clippedEnd =
Math.min(
endMs,
bounds.endMs
);


if (
clippedEnd <=
clippedStart
) {
return null;
}


return {
...phase,

startedAt:
new Date(
clippedStart
).toISOString(),

endedAt:
new Date(
clippedEnd
).toISOString(),

originalStartedAt:
phase.startedAt,

originalEndedAt:
phase.endedAt,

date:
dateKey
};

}


/*
  Historische Phasen können bewusst nur eine Tageszuordnung
  und keine exakten ISO-Zeitpunkte besitzen. Diese bleiben über
  das dokumentierte date-Feld verfügbar.
*/
return phase.date ===
dateKey
? phase
: null;

}
)
.filter(Boolean);


if (
includeCurrent &&
weightState.isWearing &&
weightState.currentPhaseStartedAt &&
bounds
) {

const currentStartMs =
new Date(
weightState.currentPhaseStartedAt
).getTime();


const nowMs =
Date.now();


const clippedStart =
Math.max(
currentStartMs,
bounds.startMs
);


const clippedEnd =
Math.min(
nowMs,
bounds.endMs
);


if (
!Number.isNaN(
currentStartMs
) &&
clippedEnd > clippedStart
) {

phases.push({

id:
"current",

weightKg:
Number(
weightState.currentPhaseWeightKg
),

startedAt:
new Date(
clippedStart
).toISOString(),

endedAt:
new Date(
clippedEnd
).toISOString(),

date:
dateKey,

temporary:
true

});

}

}


return phases;

}

function getWeightSummaryForDate(
dateKey,
includeCurrent = false
) {

const phases =
getWeightPhasesForDate(
dateKey,
includeCurrent
);


const byWeight =
{};


let totalMs =
0;


phases.forEach(
phase => {

const duration =
phaseDurationMs(
phase
);


totalMs +=
duration;


const key =
String(
Number(
phase.weightKg
)
);


if (!byWeight[key]) {

byWeight[key] =
0;

}


byWeight[key] +=
duration;

}
);


return {

totalMs:
totalMs,

byWeight:
byWeight,

phases:
phases

};

}


function getTodayWeightDurationMs() {

return getWeightSummaryForDate(
getBerlinDateKey(),
true
).totalMs;

}

/* ======================================
   AKTIVE AUFGABENZEIT MIT ZUSATZGEWICHT
====================================== */

function getOverlapMs(
startA,
endA,
startB,
endB
) {

const start =
Math.max(
new Date(startA).getTime(),
new Date(startB).getTime()
);


const end =
Math.min(
new Date(endA).getTime(),
new Date(endB).getTime()
);


return Math.max(
0,
end - start
);

}


function getWeightTaskOverlapForDate(
dateKey
) {

const phases =
getWeightPhasesForDate(
dateKey,
false
);


/*
  MEHRTÄGIGE AUFGABEN:
  Moderne Aufgaben werden nicht nach completedDate vorgefiltert.
  Entscheidend ist, ob ihre echten activeSegments die Tragephasen
  dieses Kalendertags schneiden. Historische Aufgaben ohne exakte
  Segmente bleiben dagegen am dokumentierten completedDate.
*/
const modernTasks =
archive.filter(
task =>
Array.isArray(
task.activeSegments
) &&
task.activeSegments.some(
segment =>
segment &&
segment.startedAt &&
segment.endedAt
)
);


const historicalTasksForDate =
archive.filter(
task =>
task.completedDate ===
dateKey &&
!(
Array.isArray(
task.activeSegments
) &&
task.activeSegments.some(
segment =>
segment &&
segment.startedAt &&
segment.endedAt
)
)
);


/*
  MODERNE / EXAKTE AUFGABENSEGMENTE
*/

let exactSegmentOverlapMs =
0;


const exactByWeight =
{};


modernTasks.forEach(
task => {

const segments =
Array.isArray(
task.activeSegments
)
? task.activeSegments
: [];


segments.forEach(
segment => {

if (
!segment.startedAt ||
!segment.endedAt
) {
return;
}


phases.forEach(
phase => {

if (
!phase.startedAt ||
!phase.endedAt
) {
return;
}


const overlap =
getOverlapMs(
segment.startedAt,
segment.endedAt,
phase.startedAt,
phase.endedAt
);


if (
overlap <= 0
) {
return;
}


exactSegmentOverlapMs +=
overlap;


const weightKey =
String(
Number(
phase.weightKg
)
);


if (
!exactByWeight[
weightKey
]
) {

exactByWeight[
weightKey
] =
0;

}


exactByWeight[
weightKey
] +=
overlap;

});

});

});


/*
  HISTORISCHE ARCHIVDATEN

  Viele alte Aufgaben besitzen bewusst keine activeSegments.
  Dafür existieren historischeWeightKg an Aufgaben ODER
  activeTaskDurationMs an dokumentierten Tragephasen.
*/

const historicalTasks =
historicalTasksForDate.filter(
task =>
Number(
task.historicalWeightKg
) > 0
);


const historicalTaskMs =
historicalTasks.reduce(
(sum,task) =>
sum +
getArchiveWeightedActiveMs(
task
),
0
);


const historicalTaskByWeight =
{};


historicalTasks.forEach(
task => {

const key =
String(
Number(
task.historicalWeightKg
)
);


if (
!historicalTaskByWeight[
key
]
) {

historicalTaskByWeight[
key
] =
0;

}


historicalTaskByWeight[
key
] +=
getArchiveWeightedActiveMs(
task
);

}
);


const historicalPhases =
phases.filter(
phase =>
phase.historical ===
true
);


const phaseKnownActiveMs =
historicalPhases.reduce(
(sum,phase) => {

if (
phase.activeTaskDurationMs ===
null ||
typeof phase.activeTaskDurationMs ===
"undefined"
) {

return sum;

}


return (
sum +
(
Number(
phase.activeTaskDurationMs
) || 0
)
);

},
0
);


const phaseHasUnknownDistribution =
historicalPhases.some(
phase =>
phase.activeTaskDurationMs ===
null ||
typeof phase.activeTaskDurationMs ===
"undefined"
);


const phaseKnownByWeight =
{};


historicalPhases.forEach(
phase => {

if (
phase.activeTaskDurationMs ===
null ||
typeof phase.activeTaskDurationMs ===
"undefined"
) {

return;

}


const key =
String(
Number(
phase.weightKg
)
);


if (
!phaseKnownByWeight[
key
]
) {

phaseKnownByWeight[
key
] =
0;

}


phaseKnownByWeight[
key
] +=
Number(
phase.activeTaskDurationMs
) || 0;

}
);


/*
  Wenn die Tragephasen die aktive Zeit vollständig enthalten,
  sind sie die beste Quelle.
  Wenn die Verteilung auf einzelne Phasen historisch unbekannt war,
  verwenden wir die taskweise Zusatzgewichts-Zuordnung.
*/

let historicalActiveMs =
0;


let historicalByWeight =
{};


if (
historicalPhases.length > 0 &&
!phaseHasUnknownDistribution &&
phaseKnownActiveMs > 0
) {

historicalActiveMs =
phaseKnownActiveMs;


historicalByWeight =
phaseKnownByWeight;

} else if (
historicalTaskMs > 0
) {

historicalActiveMs =
historicalTaskMs;


historicalByWeight =
historicalTaskByWeight;

} else {

historicalActiveMs =
phaseKnownActiveMs;


historicalByWeight =
phaseKnownByWeight;

}


const byWeight =
{
...historicalByWeight
};


Object.entries(
exactByWeight
)
.forEach(
entry => {

if (
!byWeight[
entry[0]
]
) {

byWeight[
entry[0]
] =
0;

}


byWeight[
entry[0]
] +=
entry[1];

}
);


const activeWithWeightMs =
historicalActiveMs +
exactSegmentOverlapMs;


const totalWeightMs =
getWeightSummaryForDate(
dateKey,
false
).totalMs;


return {

activeWithWeightMs:
activeWithWeightMs,

outsideActiveMs:
Math.max(
0,
totalWeightMs -
activeWithWeightMs
),

byWeight:
byWeight

};

}


function getArchiveTaskWeightOverlapMs(
task
) {

if (
!task ||
!task.completedDate
) {
return 0;
}


const segments =
Array.isArray(
task.activeSegments
)
? task.activeSegments
: [];


if (
segments.length === 0
) {

if (
Number(
task.historicalWeightKg
) > 0
) {

return getArchiveWeightedActiveMs(
task
);

}


return 0;

}


/*
  Moderne Archivaufgaben können über mehrere Kalendertage laufen.
  Deshalb nicht nur die Gewichtstragephasen des Abschlusstags prüfen,
  sondern alle gespeicherten Phasen gegen die echten Aktivsegmente.
*/
const phases =
weightPhases.filter(
phase =>
phase &&
phase.startedAt &&
phase.endedAt
);


let totalOverlapMs =
0;


segments.forEach(
segment => {

if (
!segment.startedAt ||
!segment.endedAt
) {
return;
}


phases.forEach(
phase => {

if (
!phase.startedAt ||
!phase.endedAt
) {
return;
}


totalOverlapMs +=
getOverlapMs(
segment.startedAt,
segment.endedAt,
phase.startedAt,
phase.endedAt
);

});

});


return totalOverlapMs;

}

![

const normalizedMode =

) {

const now =

];

});

function calculateCookingDurations(
task,
endIso = null
) {

const segments =
Array.isArray(
task.cookingSegments
)
? task.cookingSegments
: [];


let activeMs =
0;


let passiveMs =
0;


segments.forEach(
segment => {

if (
!segment.startedAt
) {
return;
}


const endValue =
segment.endedAt ||
endIso;


if (!endValue) {
return;
}


const duration =
Math.max(
0,
new Date(
endValue
).getTime() -
new Date(
segment.startedAt
).getTime()
);


if (
segment.mode ===
"passive"
) {

passiveMs +=
duration;

} else {

activeMs +=
duration;

}

}
);


return {

activeMs:
activeMs,

passiveMs:
passiveMs

};

}


function calculateActiveDuration(
task,
end
) {

if (!task.startedAt) {
return 0;
}


let pause =
task.pauseTotalMs || 0;


if (
task.status ===
"paused" &&
task.pausedAt
) {

pause +=
Math.max(
0,
end -
new Date(
task.pausedAt
).getTime()
);

}


return Math.max(
0,
end -
new Date(
task.startedAt
).getTime() -
pause
);

}


function liveDuration(task) {

return calculateActiveDuration(
task,
Date.now()
);

}


function finishTask(id) {

const task =
getTask(id);


if (!task) {
return;
}


const now =
Date.now();


const completedDurationMs =
calculateActiveDuration(
task,
now
);


task.actualDurationMs =
completedDurationMs;


if (
task.type ===
"leisure"
) {

task.leisureDurationMs =
completedDurationMs;

task.passiveDurationMs =
null;

task.cookingActiveDurationMs =
null;

task.cookingPassiveDurationMs =
null;


task.activeDurationMs =
0;

} else if (
task.type ===
"cooking"
) {

const cookingDurations =
calculateCookingDurations(
task,
new Date(now)
.toISOString()
);


task.cookingActiveDurationMs =
cookingDurations.activeMs;

task.cookingPassiveDurationMs =
cookingDurations.passiveMs;

task.activeDurationMs =
cookingDurations.activeMs;

task.passiveDurationMs =
cookingDurations.passiveMs;

task.leisureDurationMs =
null;

} else {

task.activeDurationMs =
completedDurationMs;

task.leisureDurationMs =
null;

null;

}


task.status =

>

>

<div class="time-edit-note">
Fehlende Zeiten werden automatisch mit dem aktuellen Datum und der aktuellen Uhrzeit in Europe/Berlin vorausgefüllt. Du musst dann meist nur Stunde oder Minute anpassen. Soll eine Aufgabe nur rückwirkend gestartet und noch nicht beendet werden, lösche einfach den Wert im Feld ENDZEIT.

function saveManualTimes(
id
) {

const task =
getTask(
id
);


if (!task) {
return;
}


const startInput =
document.getElementById(
"manualStart-" + id
);


const endInput =
document.getElementById(
"manualEnd-" + id
);


if (
!startInput ||
!endInput
) {
return;
}


const startIso =
berlinLocalInputToISO(
startInput.value
);


const endIso =
berlinLocalInputToISO(
endInput.value
);


if (
!startIso
) {

showInfoModal(
"Startzeit fehlt",
"Für eine manuelle Zeitkorrektur muss mindestens eine gültige Startzeit vorhanden sein."
);

return;

}


const startMs =
new Date(
startIso
).getTime();


const endMs =
endIso
? new Date(
endIso
).getTime()
: null;


if (
endMs !== null &&
endMs <
startMs
) {

showInfoModal(
"Zeitreise abgelehnt",
"Die Endzeit darf nicht vor der Startzeit liegen."
);

return;

}


/*
  Wurde die Startzeit verändert oder gab es
  vorher noch keine, bauen wir die Segmente
  bewusst neu auf.
*/

const oldStartMs =
task.startedAt
? new Date(
task.startedAt
).getTime()
: null;


const startChanged =
oldStartMs ===
null ||
Math.abs(
oldStartMs -
startMs
) >
1000;


if (
startChanged
) {

task.startedAt =
startIso;


task.pauseTotalMs =
0;


task.pausedAt =
null;


task.activeSegments =
[
  {
    startedAt:
    startIso,

    endedAt:
    endIso
  }
];


if (
task.type ===
"cooking"
) {

task.cookingMode =
"active";


task.cookingSegments =
[
  {
    mode:
    "active",

    startedAt:
    startIso,

    endedAt:
    endIso
  }
];

}

} else {

task.startedAt =
startIso;


/*
  Offenes Segment bei nachgetragener
  Endzeit schließen.
*/

if (
endIso &&
Array.isArray(
task.activeSegments
) &&
task.activeSegments.length
) {

const segment =
task.activeSegments[
task.activeSegments.length - 1
];


if (
segment &&
!segment.endedAt
) {

segment.endedAt =
endIso;

}

}


if (
endIso &&
task.type ===
"cooking" &&
Array.isArray(
task.cookingSegments
) &&
task.cookingSegments.length
) {

const cookingSegment =
task.cookingSegments[
task.cookingSegments.length - 1
];


if (
cookingSegment &&
!cookingSegment.endedAt
) {

cookingSegment.endedAt =
endIso;

}

}

}


/*
  NUR STARTZEIT:
  Aufgabe wird als laufend geführt.
*/

if (!endIso) {

task.status =
"running";


task.completedAt =
null;


task.activeDurationMs =
null;


task.leisureDurationMs =
null;


task.actualDurationMs =
null;


task.passiveDurationMs =
null;


task.cookingActiveDurationMs =
null;


task.cookingPassiveDurationMs =
null;


if (
!Array.isArray(
task.activeSegments
) ||
task.activeSegments.length ===
0
) {

task.activeSegments =
[
  {
    startedAt:
    startIso,

    endedAt:
    null
  }
];

} else {

const last =
task.activeSegments[
task.activeSegments.length - 1
];


if (
last &&
last.endedAt
) {

task.activeSegments.push(
{
startedAt:
startIso,

endedAt:
null
}
);

}

}


if (
task.type ===
"cooking"
) {

task.cookingMode =
"active";


if (
!Array.isArray(
task.cookingSegments
) ||
task.cookingSegments.length ===
0
) {

task.cookingSegments =
[
  {
    mode:
    "active",

    startedAt:
    startIso,

    endedAt:
    null
  }
];

}

}


closeModal();

saveTasks();

render();

return;

}


/*
  START + ENDE:
  Aufgabe wird abgeschlossen.
*/

task.completedAt =
endIso;


task.status =
"completed";


task.pausedAt =
null;


task.actualDurationMs =
sumTaskSegmentsMs(
task,
endIso
);


if (
task.type ===
"leisure"
) {

task.leisureDurationMs =
task.actualDurationMs;


task.activeDurationMs =
0;


task.passiveDurationMs =
null;


task.cookingActiveDurationMs =
null;


task.cookingPassiveDurationMs =
null;

} else if (
task.type ===
"cooking"
) {

const cookingDurations =
calculateCookingDurations(
task,
endIso
);


task.cookingActiveDurationMs =
cookingDurations.activeMs;


task.cookingPassiveDurationMs =
cookingDurations.passiveMs;


task.activeDurationMs =
cookingDurations.activeMs;


task.passiveDurationMs =
cookingDurations.passiveMs;


task.leisureDurationMs =
null;

} else {

task.activeDurationMs =
task.actualDurationMs;


task.leisureDurationMs =
null;


task.passiveDurationMs =
null;


task.cookingActiveDurationMs =
null;


task.cookingPassiveDurationMs =
null;

}


normalizeTodayOrder();


closeModal();

saveTasks();

render();

}

function askAbort(id) {

const task =
getTask(id);


if (!task) {
return;
}


document
.getElementById(
"modalContainer"
)
.innerHTML = `

Aufgabe abbrechen?
</h2>

class="modal-button cancel-modal"
onclick="closeModal()"
>

</button>

<button
class="modal-button danger-modal"
onclick="abortTask(${id})"
>
Abbrechen
</button>

</div>

</div>

</div>
`;

}


function abortTask(id) {

const task =
getTask(id);


if (!task) {
return;
}


const now =
new Date()
.toISOString();


if (
task.status ===
"running" &&
Array.isArray(
task.activeSegments
) &&
task.activeSegments.length
) {

const last =
task.activeSegments[
task.activeSegments.length - 1
];


if (
last &&
!last.endedAt
) {

last.endedAt =
now;

}

}


if (
task.type ===
"cooking" &&
task.status ===
"running" &&
Array.isArray(
task.cookingSegments
) &&
task.cookingSegments.length
) {

const lastCooking =
task.cookingSegments[
task.cookingSegments.length - 1
];


if (
lastCooking &&
!lastCooking.endedAt
) {

lastCooking.endedAt =
now;

}

}


const investedMs =
sumTaskSegmentsMs(
task,
now
);


task.status =
"aborted";

task.abortedAt =
now;

task.actualDurationMs =
investedMs;


if (
task.type ===
"leisure"
) {

task.leisureDurationMs =
investedMs;

task.activeDurationMs =
0;

} else if (
task.type ===
"cooking"
) {

const cookingDurations =
calculateCookingDurations(
task,
now
);


task.cookingActiveDurationMs =
cookingDurations.activeMs;

task.cookingPassiveDurationMs =
cookingDurations.passiveMs;

task.activeDurationMs =
cookingDurations.activeMs;

task.passiveDurationMs =
cookingDurations.passiveMs;

} else {

task.activeDurationMs =
investedMs;

}


task.todayDate =
null;

task.todayOrder =
null;


closeModal();

saveTasks();

render();

}

/* ======================================
   SYMBOLE
====================================== */

function prioritySymbol(priority) {

if (
priority ===
"high"
) {
return "🔴";
}


if (
priority ===
"medium"
) {
return "🟡";
}


return "⚪";

}


function statusSymbol(task) {

if (
task.status ===
"completed"
) {
return "✅";
}


if (
task.status ===
"aborted"
) {
return "❌";
}


if (
task.status ===
"running"
) {
return "▶️";
}


if (
task.status ===
"paused"
) {
return "☕";
}


return "⬜";

}


function dueSymbol(task) {

if (
!task.dueDate ||
task.dueMode ===
"none"
) {
return "";
}


if (
task.dueMode ===
"tomorrowOnly"
) {
return "💠";
}


return (
task.dueDate <=
getBerlinDateKey()
? "⚠️"
: "🔷"
);

}


function flags(task) {

return `

<div class="compact-flags">

<span class="mini-flag">
${prioritySymbol(
task.priority
)}
</span>

${
task.optional
? "<span class='mini-flag'>🟣</span>"
: ""
}

${
dueSymbol(task)
? "<span class='mini-flag'>" +
dueSymbol(task) +
"</span>"
: ""
}

</div>
`;

}


function dynamicNumber(task) {

const index =
tasks.findIndex(
item =>
item.id ===
task.id
);


const number =
index + 1;


return number < 10
? "0" + number
: number;

}

);

![

"aborted"
].includes(

)
) {

"today-task-active"
);

onclick="cancelEditing()"
>
ABBRECHEN
</button>

</div>

}


let drag =
"";


if (
todayDrag &&
![
"completed",
"aborted"
].includes(
task.status
)
) {

drag = `

<div
class="drag-handle"
onpointerdown="startTodayDrag(event,${task.id})"
>
≡
</div>
`;

}


let meta =
"";

task.status ===
"running" ||
task.status ===
"paused"
) {

task.type ===
"leisure"
) {

meta = `

class="task-leisure-duration live-duration"

data-live-kind="leisure"
>
FREIZEIT ·

)}
</div>

} else if (
task.type ===
"cooking"
) {

calculateCookingDurations(
task,
new Date()
.toISOString()
);


meta = `

<div class="task-cooking-active">
AKTIV KOCHEN ·
<span
class="live-cooking-active"
data-task-id="${task.id}"
>
${formatDuration(
cookingLive.activeMs
)}
</span>
</div>

<div class="task-cooking-passive">
WARTE-/GARZEIT ·
<span
class="live-cooking-passive"
data-task-id="${task.id}"
>
${formatDuration(
cookingLive.passiveMs
)}
</span>
</div>
`;

} else {

meta = `

<div
class="duration live-duration"
data-task-id="${task.id}"
data-live-kind="work"
>
AKTIV ·
${formatDuration(
liveDuration(task)
)}
</div>
`;

}

}


if (
task.status ===
"completed"
) {

const completedDuration =
task.type ===
"leisure"
? (
Number(
task.leisureDurationMs
) || 0
)
: (
Number(
task.activeDurationMs
) || 0
);


meta = `

${formatDateTime(
task.completedAt,
"ERLEDIGT"
)}
</div>

${
task.type ===
"leisure"
? `
<div class="task-leisure-duration">
FREIZEIT ·
${formatDuration(
completedDuration
)}
</div>
`
: task.type ===
"cooking"
? `
<div class="task-cooking-active">
AKTIV KOCHEN ·
${formatDuration(
Number(
task.cookingActiveDurationMs
) || 0
)}
</div>

<div class="task-cooking-passive">
WARTE-/GARZEIT ·
${formatDuration(
Number(
task.cookingPassiveDurationMs
) || 0
)}
</div>
`
: `
<div class="duration">
DAUER ·
${formatDuration(
completedDuration
)}
</div>
`
}

`;

}


let todayToggleButton =
iconButton(

isTodayTask(task)
? "📌"
: "📅",

isTodayTask(task)
? "Aus Heute entfernen"
: "Zu Heute hinzufügen",

`toggleToday(${task.id})`,

isTodayTask(task)
? "today-button selected"
: "today-button"

);

let actions =
"";


if (!compactOnly) {

if (
task.status ===
"open"
) {

actions = `

<div class="icon-actions">

${
task.type ===
"selfrunner"
? iconButton(
"🤖",
"Selbstläufer auslösen · 1 Minute",
`completeSelfrunner(${task.id})`,
"start-button"
)
: iconButton(
"▶️",
"Start",
`startTask(${task.id})`,
"start-button"
)
}

task.type !==
"selfrunner"
? iconButton(
"🕒",
"Start-/Endzeit manuell",
`askManualTimes(${task.id})`,
"time-action-button"
)
: ""
}

${
showTodayButton
? todayToggleButton
: ""
}

"✏️",
"Bearbeiten",
`startEditing(${task.id})`
)}

${iconButton(

"Abbruch",
`askAbort(${task.id})`,

)}

todayDrag

"Aus Heute",
`toggleToday(${task.id})`,

)

}


if (
task.status ===
"running"
) {

const cookingModeControls =
task.type ===
"cooking"
? `

task.cookingMode === "passive"

}"
onclick="switchCookingMode(${task.id},'passive')"

"✅",
"Beenden",
`finishTask(${task.id})`,

)}

"❌",
"Abbruch",
`askAbort(${task.id})`,
"abort-button"
)}

if (
task.status ===
"paused"
) {

actions = `

<div class="icon-actions">

${iconButton(
"▶️",
"Weiter",
`resumeTask(${task.id})`,
"start-button"
)}

"🕒",
"Endzeit manuell eintragen",
`askManualTimes(${task.id})`,
"time-action-button"
)}

"✅",
"Beenden",
`finishTask(${task.id})`,
"finish-button"
)}

${iconButton(
"❌",
"Abbruch",
`askAbort(${task.id})`,
"abort-button"
)}

</div>

}

}


element.innerHTML = `

${dynamicNumber(task)}
</div>

<div class="status-symbol">
${statusSymbol(task)}
</div>

<div class="task-content">

<div class="task-text">

task.text
)}
</div>

${
filterTodayOnly
? todayToggleButton
: ""
}

<span class="task-type-badge ${
task.type === "leisure"
? "leisure"
: task.type === "selfrunner"
? "selfrunner"
: task.type === "cooking"
? "cooking"
: ""
}">
${taskTypeLabel(
task.type
)}

${meta}

${actions}

${
task.status ===
"completed" &&
task.type !==
"selfrunner"
? `
<button
class="repeat-button time-action-button"
title="Zeiten korrigieren"
onclick="askManualTimes(${task.id})"
>
🕒
</button>

: ""
}

${
[
"completed",
"aborted"
].includes(
task.status
)
? `
<button
class="repeat-button"
onclick="repeatTask(${task.id})"
>
🔁
</button>
`
: ""
}

`;


return element;

}

function getArchiveWeightedActiveMs(
item
) {

if (!item) {
return 0;
}


if (
item.weightedActiveDurationMs !==
null &&
typeof item.weightedActiveDurationMs !==
"undefined"
) {

return Number(
item.weightedActiveDurationMs
) || 0;

}


if (
Number(
item.historicalWeightKg
) > 0
) {

return getArchiveAccountingActiveMs(
item
);

}


return 0;

}


function getArchiveTaskWeightBadges(
item
) {

if (!item) {
return [];
}


/*
  HISTORISCHE ARCHIVAUFGABEN:
  historicalWeightKg bedeutet eine eindeutige
  aufgabenbezogene Zuordnung aus dem alten Archiv.
*/

if (
Number(
item.historicalWeightKg
) > 0
) {

return [
  {
    weightKg:
    Number(
    item.historicalWeightKg
    ),

    partial:
    false,

    durationMs:
    getArchiveWeightedActiveMs(
    item
    )
  }
];

}


/*
  NEUE / MODERNE AUFGABEN:
  Gewicht exakt aus aktiven Segmenten und
  gespeicherten Tragephasen ableiten.
*/

const segments =
Array.isArray(
item.activeSegments
)
? item.activeSegments
: [];


if (
segments.length === 0
) {
return [];
}


const byWeight =
{};


let totalActiveMs =
0;


segments.forEach(
segment => {

if (
!segment.startedAt ||
!segment.endedAt
) {
return;
}


const segmentStart =
new Date(
segment.startedAt
).getTime();


const segmentEnd =
new Date(
segment.endedAt
).getTime();


if (
Number.isNaN(
segmentStart
) ||
Number.isNaN(
segmentEnd
)
) {
return;
}


totalActiveMs +=
Math.max(
0,
segmentEnd -
segmentStart
);


weightPhases.forEach(
phase => {

if (
!phase.startedAt ||
!phase.endedAt
) {
return;
}


const overlapMs =
getOverlapMs(
segment.startedAt,
segment.endedAt,
phase.startedAt,
phase.endedAt
);


if (
overlapMs <= 0
) {
return;
}


const key =
String(
Number(
phase.weightKg
)
);


if (
!byWeight[
key
]
) {

byWeight[
key
] =
0;

}


byWeight[
key
] +=
overlapMs;

});

});


const totalWeightedMs =
Object.values(
byWeight
)
.reduce(
(sum,value) =>
sum +
value,
0
);


if (
totalWeightedMs <= 0
) {
return [];
}


const partial =
totalActiveMs > 0 &&
totalWeightedMs <
totalActiveMs;


return Object.entries(
byWeight
)
.sort(
(a,b) =>
Number(
a[0]
) -
Number(
b[0]
)
)
.map(
entry => ({
weightKg:
Number(
entry[0]
),

durationMs:
entry[1],

partial:
partial
})
);

}


function renderArchiveTaskWeightBadges(
item
) {

const badges =
getArchiveTaskWeightBadges(
item
);


if (
badges.length === 0
) {
return "";
}


return badges
.map(
badge => {

let weightText =
formatWeight(
badge.weightKg
) +
" kg";


/*
  Historische freie Gewichtsangaben wie "ca."
  bevorzugen, wenn sie im Archiv vorhanden sind.
*/

const historicalNote =
String(
item.historicalWeightNote ||
""
)
.trim();


if (
historicalNote
) {

const lower =
historicalNote
.toLowerCase();


if (
lower.includes(
"ca."
) ||
lower.includes(
"circa"
) ||
lower.includes(
"ungefähr"
)
) {

weightText =
historicalNote;

}

}


return `

<span
class="archive-task-weight-details"
title="Mit Zusatzgewicht"
>
🏋️ ${escapeHtml(
weightText
)}
</span>

`;

}
)
.join("");

}

function getBerlinDayBoundsMs(
dateKey
) {

if (!dateKey) {
return null;
}


const nextDateKey =
addDays(
dateKey,
1
);


const startIso =
berlinLocalInputToISO(
dateKey + "T00:00"
);


const endIso =
berlinLocalInputToISO(
nextDateKey + "T00:00"
);


if (
!startIso ||
!endIso
) {
return null;
}


const startMs =
new Date(
startIso
).getTime();


const endMs =
new Date(
endIso
).getTime();


if (
Number.isNaN(
startMs
) ||
Number.isNaN(
endMs
) ||
endMs <= startMs
) {
return null;
}


return {
startMs:
startMs,

endMs:
endMs
};

}


function getArchiveActiveBreakdownByDate(
item
) {

const result =
{};


if (!item) {
return result;
}


const segments =
Array.isArray(
item.activeSegments
)
? item.activeSegments.filter(
segment =>
segment &&
segment.startedAt &&
segment.endedAt
)
: [];


/*
  Historische Aufgaben besitzen häufig keine exakten Segmente.
  Diese Daten werden bewusst NICHT rekonstruiert. In diesem Fall
  bleibt die dokumentierte aktive Archivzeit am completedDate.
*/
if (
segments.length === 0
) {

if (
item.completedDate &&
getArchiveAccountingActiveMs(
item
) > 0
) {

result[
item.completedDate
] =
getArchiveAccountingActiveMs(
item
);

}


return result;

}


segments.forEach(
segment => {

const segmentStart =
new Date(
segment.startedAt
).getTime();


const segmentEnd =
new Date(
segment.endedAt
).getTime();


if (
Number.isNaN(
segmentStart
) ||
Number.isNaN(
segmentEnd
) ||
segmentEnd <= segmentStart
) {
return;
}


let dateKey =
getBerlinDateKeyFromISO(
segment.startedAt
);


const finalDateKey =
getBerlinDateKeyFromISO(
new Date(
segmentEnd - 1
).toISOString()
);


if (
!dateKey ||
!finalDateKey
) {
return;
}


let guard =
0;


while (
 dateKey <= finalDateKey &&
 guard < 3700
) {

const bounds =
getBerlinDayBoundsMs(
dateKey
);


if (!bounds) {
break;
}


const overlapMs =
Math.max(
0,
Math.min(
segmentEnd,
bounds.endMs
) -
Math.max(
segmentStart,
bounds.startMs
)
);


if (
overlapMs > 0
) {

if (!result[dateKey]) {
result[dateKey] =
0;
}


result[dateKey] +=
overlapMs;

}


dateKey =
addDays(
dateKey,
1
);


guard +=
1;

}

});


return result;

}


function getArchiveActiveMsForDate(
item,
dateKey
) {

const breakdown =
getArchiveActiveBreakdownByDate(
item
);


return Number(
breakdown[dateKey]
) || 0;

}


function statisticsDateIsInPeriod(
dateKey
) {

if (
statisticsPeriod ===
"all"
) {
return true;
}


if (!dateKey) {
return false;
}


const today =
getBerlinDateKey();


const days =
statisticsPeriod ===
"7d"
? 7
: 30;


const firstDate =
addDays(
today,
-(days - 1)
);


return (
dateKey >=
firstDate
&&
dateKey <=
today
);

}

/* ======================================

====================================== */

function normalizeSuggestionText(
value
) {

return String(
value || ""
)
.trim()
.toLocaleLowerCase(
"de-DE"
);

}


function getKnownTaskSuggestions(
query
) {

const normalizedQuery =
normalizeSuggestionText(
query
);


if (
normalizedQuery.length <
1
) {

return [];

}


const known =
new Map();


function addKnown(
item,
source
) {

const name =
String(
item.text || ""
).trim();


if (!name) {
return;
}


const key =
normalizeSuggestionText(
name
);


if (
!known.has(
key
)
) {

known.set(
key,
{
name:
name,

source:
source
}
);

}

}


tasks.forEach(
item =>
addKnown(
item,
"AKTIV"
)
);


archive.forEach(
item =>
addKnown(
item,
"ARCHIV"
)
);


return [
...known.values()
]
.map(
item => {

const normalizedName =
normalizeSuggestionText(
item.name
);


let rank =
999;


if (
normalizedName ===
normalizedQuery
) {

rank =
0;

} else if (
normalizedName.startsWith(
normalizedQuery
)
) {

rank =
1;

} else if (
normalizedName.includes(
normalizedQuery
)
) {

rank =
2;

}


return {
...item,
rank:
rank
};

}
)
.filter(
item =>
item.rank <
999
)
.sort(
(a,b) =>
a.rank -
b.rank
||
a.name.localeCompare(
b.name,
"de-DE"
)
)
.slice(
0,
8
);

}


function hideTaskSuggestions() {

const box =
document.getElementById(
"taskSuggestions"
);


if (!box) {
return;
}


box.classList.remove(
"visible"
);


box.innerHTML =
"";

}


function selectTaskSuggestion(
encodedName
) {

const input =
document.getElementById(
"taskInput"
);


if (!input) {
return;
}


input.value =
decodeURIComponent(
encodedName
);


hideTaskSuggestions();


input.focus();

}


function renderTaskSuggestions() {

const input =
document.getElementById(
"taskInput"
);


const box =
document.getElementById(
"taskSuggestions"
);


if (
!input ||
!box
) {
return;
}


const suggestions =
getKnownTaskSuggestions(
input.value
);


if (
suggestions.length ===
0
) {

hideTaskSuggestions();

return;

}


box.innerHTML =
suggestions
.map(
item => `

<button
type="button"
class="task-suggestion"
onmousedown="event.preventDefault()"
onclick="selectTaskSuggestion('${encodeURIComponent(
item.name
)}')"
>

<span class="task-suggestion-name">
${escapeHtml(
item.name
)}
</span>

<span class="task-suggestion-source">
${item.source}
</span>

</button>

`
)
.join("");


box.classList.add(
"visible"
);

}

/* ======================================
   ENTER
====================================== */
