<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Master of Disaster</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #taskList {
      margin-top: 20px;
    }

    .task {
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>MASTER OF DISASTER</h1>

    <input
      type="text"
      id="taskInput"
      placeholder="Neue Aufgabe..."
    >

    <button onclick="addTask()">
      + Aufgabe hinzufügen
    </button>

    <div id="taskList"></div>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const taskList = document.getElementById("taskList");

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      const task = document.createElement("div");
      task.className = "task";
      task.textContent = text;

      taskList.appendChild(task);

      input.value = "";
    }
  </script>

</body>
</html>
