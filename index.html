<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">

  <title>Master of Disaster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #15191d 0%,
          #0b0d0f 45%,
          #070809 100%
        );

      color: #f3f3f3;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin: 10px 0 30px;
      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .eyebrow {
      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;

      color: #8c969f;
    }

    .title-bottom {
      margin-top: 10px;
      margin-bottom: 0;
      letter-spacing: 2.5px;
    }

    /* EINGABE */

    .input-panel {
      padding: 14px;
      margin-bottom: 26px;

      background: #171b1f;

      border: 1px solid #292f34;
      border-radius: 18px;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.28);
    }

    #taskInput {
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;

      border: 1px solid #30373d;
      border-radius: 12px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 17px;
    }

    #taskInput:focus,
    .edit-input:focus {
      border-color: #7d8993;
    }

    #taskInput::placeholder {
      color: #626b72;
    }

    .add-button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #e8ecef;
      color: #101214;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    /* BEREICHE */

    .task-section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 0 4px 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;

      color: #8c969f;
    }

    .counter {
      padding: 5px 9px;

      border: 1px solid #30363b;
      border-radius: 20px;

      background: #15191c;

      font-size: 12px;
      color: #aab1b7;
    }

    /* AUFGABEN */

    .task {
      display: flex;
      align-items: flex-start;
      gap: 8px;

      min-height: 70px;

      padding: 12px 10px;
      margin-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          #1c2125,
          #14181b
        );

      border: 1px solid #292f34;
      border-radius: 15px;

      box-shadow:
        0 8px 20px rgba(0,0,0,0.18);
    }

    .task.running {
      border-color: #928832;
    }

    .task.paused {
      border-color: #695f32;
    }

    .task.completed {
      opacity: 0.55;
    }

    .task.aborted {
      opacity: 0.5;
    }

    .task.completed .task-text,
    .task.aborted .task-text {
      text-decoration: line-through;
    }

    /* NUMMER */

    .task-number {
      width: 32px;
      flex-shrink: 0;

      padding-top: 4px;

      text-align: center;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;

      color: #647887;
    }

    /* STATUS */

    .status-symbol {
      width: 28px;
      flex-shrink: 0;

      padding-top: 1px;

      text-align: center;

      font-size: 20px;
      line-height: 1;

      user-select: none;
    }

    /* INHALT */

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;

      word-break: break-word;
    }

    /* PRIORITÄT */

    .settings-block {
      margin-top: 9px;

      padding-top: 8px;

      border-top: 1px solid #292f34;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 5px;

      margin-top: 6px;

      flex-wrap: wrap;
    }

    .settings-label {
      min-width: 64px;

      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.8px;

      color: #69747b;
    }

    .setting-button {
      min-height: 29px;

      padding: 4px 7px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #101315;
      color: #d9dde0;

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;

      opacity: 0.5;
    }

    .setting-button.selected {
      opacity: 1;

      border-color: #68747c;
      background: #20262a;
    }

    .setting-button:active {
      transform: scale(0.95);
    }

    /* KENNZEICHNUNGEN */

    .flag-line {
      display: flex;
      gap: 7px;

      margin-top: 7px;

      flex-wrap: wrap;
    }

    .flag {
      padding: 4px 7px;

      border: 1px solid #30363b;
      border-radius: 7px;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .priority-normal {
      color: #b8bec2;
    }

    .priority-medium {
      color: #d4be54;
    }

    .priority-high {
      color: #dd6969;
    }

    .optional-flag {
      color: #b67bd5;
      border-color: #5e476b;
    }

    .tomorrow-flag {
      color: #6db6d6;
      border-color: #3e6272;
    }

    .deadline-flag {
      color: #60aee0;
      border-color: #385e77;
    }

    .warning-flag {
      color: #e3aa4d;
      border-color: #805f31;

      background: rgba(145, 92, 25, 0.12);
    }

    /* META */

    .task-meta {
      margin-top: 5px;

      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.7px;

      color: #4f8ec4;
    }

    .status-meta {
      margin-top: 5px;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.7px;

      color: #b3a94f;
    }

    .paused-meta {
      color: #9e8d50;
    }

    .abort-meta {
      margin-top: 5px;

      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.7px;

      color: #a96666;
    }

    .duration {
      margin-top: 4px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;

      color: #70a5cf;
    }

    .aborted-duration {
      color: #ba7777;
    }

    /* AKTIONEN */

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .task-actions {
      width: 100%;

      display: flex;
      gap: 6px;

      margin-top: 10px;

      flex-wrap: wrap;
    }

    .task-action-text {
      flex: 1;
      min-width: 80px;

      padding: 8px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #101315;
      color: #d1d6d9;

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;
    }

    .start-button {
      border-color: #3e6047;
    }

    .pause-button {
      border-color: #776d36;
    }

    .finish-button {
      border-color: #41604b;
    }

    .abort-button {
      border-color: #6b3f3f;
    }

    .repeat-button {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      border: 1px solid #30363b;
      border-radius: 10px;

      background: #0e1113;

      font-size: 17px;

      cursor: pointer;
    }

    /* BEARBEITEN */

    .edit-area {
      flex: 1;
      min-width: 0;
    }

    .edit-input {
      width: 100%;
      padding: 11px;

      border: 1px solid #30373d;
      border-radius: 9px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 16px;
    }

    .edit-actions {
      display: flex;
      gap: 7px;

      margin-top: 7px;
    }

    .edit-button {
      flex: 1;

      padding: 8px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #0e1113;
      color: #d8dde0;

      font-weight: 700;

      cursor: pointer;
    }

    /* LEERE BEREICHE */

    .empty-message {
      padding: 25px 20px;

      border: 1px dashed #30363b;
      border-radius: 15px;

      text-align: center;

      color: #626c73;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0,0,0,0.72);

      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 360px;

      padding: 22px;

      background: #191d20;

      border: 1px solid #343b40;
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.6);
    }

    .modal h2 {
      margin: 0 0 8px;

      font-size: 20px;
    }

    .modal p {
      margin: 0 0 20px;

      color: #9ba3a9;

      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-button {
      flex: 1;

      padding: 12px;

      border: 0;
      border-radius: 10px;

      font-weight: 800;

      cursor: pointer;
    }

    .cancel-modal {
      background: #30363b;
      color: white;
    }

    .confirm-modal {
      background: #e8ecef;
      color: #101214;
    }

    .danger-modal {
      background: #7c3f3f;
      color: white;
    }

    @media (max-width: 390px) {

      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .task {
        gap: 4px;
      }

      .task-number {
        width: 25px;
        font-size: 9px;
      }

      .status-symbol {
        width: 24px;
        font-size: 18px;
      }

      .task-text {
        font-size: 16px;
      }

      .task-meta,
      .abort-meta {
        font-size: 7.5px;
      }

      .status-meta {
        font-size: 8px;
      }

      .duration {
        font-size: 9px;
      }

      .setting-button {
        font-size: 9px;
        padding: 4px 6px;
      }

      .settings-label {
        min-width: 58px;
        font-size: 7.5px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <h1>
        MASTER OF DISASTER
      </h1>

      <div class="eyebrow title-bottom">
        WEEK-AND-END-TO-DO-DINGSI
      </div>

    </header>


    <section class="input-panel">

      <input
        type="text"
        id="taskInput"
        placeholder="Was steht an?"
        autocomplete="off"
      >

      <button
        class="add-button"
        onclick="addTask()"
      >
        + AUFGABE HINZUFÜGEN
      </button>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          OFFENE UND LAUFENDE AUFGABEN
        </div>

        <div
          class="counter"
          id="activeCounter"
        >
          0 aktiv
        </div>

      </div>

      <div id="activeTaskList"></div>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          ERLEDIGT
        </div>

        <div
          class="counter"
          id="completedCounter"
        >
          0 erledigt
        </div>

      </div>

      <div id="completedTaskList"></div>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          ABGEBROCHEN
        </div>

        <div
          class="counter"
          id="abortedCounter"
        >
          0 abgebrochen
        </div>

      </div>

      <div id="abortedTaskList"></div>

    </section>

  </main>


  <div id="modalContainer"></div>


  <script>

    let tasks =
      JSON.parse(
        localStorage.getItem(
          "masterOfDisasterTasks"
        )
      ) || [];

    let editingTaskId = null;


    /*
      MIGRATION ALTER DATEN
    */

    tasks = tasks.map(task => {

      if (!task.status) {

        task.status =
          task.completed === true
            ? "completed"
            : "open";

      }

      const defaults = {

        priority: "normal",

        optional: false,

        dueMode: "none",
        dueDate: null,

        startedAt: null,
        pausedAt: null,
        pauseTotalMs: 0,

        completedAt: null,
        activeDurationMs: null,

        abortedAt: null,
        abortedActiveDurationMs: null
      };


      Object.keys(defaults)
        .forEach(key => {

          if (
            typeof task[key] ===
            "undefined"
          ) {

            task[key] =
              defaults[key];

          }

        });


      return task;

    });


    /*
      EUROPE / BERLIN DATUM
    */

    function getBerlinDateKey() {

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: "Europe/Berlin",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).format(
        new Date()
      );

    }


    function addDaysToDateKey(
      dateKey,
      days
    ) {

      const parts =
        dateKey.split("-")
          .map(Number);

      const date =
        new Date(
          Date.UTC(
            parts[0],
            parts[1] - 1,
            parts[2] + days,
            12,
            0,
            0
          )
        );

      return (
        date.getUTCFullYear() +
        "-" +
        String(
          date.getUTCMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          date.getUTCDate()
        ).padStart(2, "0")
      );

    }


    /*
      DATUMSREGELN AUTOMATISCH PRÜFEN

      💠 gilt nur für den unmittelbar
      folgenden Kalendertag.

      Sobald dieser Tag erreicht ist,
      wird 💠 entfernt.

      🔷 bleibt gespeichert.
      Sobald die Deadline erreicht ist,
      wird es als ⚠️ angezeigt.
    */

    function applyAutomaticDateRules() {

      const today =
        getBerlinDateKey();

      let changed =
        false;


      tasks.forEach(task => {

        if (
          task.status === "completed" ||
          task.status === "aborted"
        ) {
          return;
        }


        if (
          task.dueMode ===
            "tomorrowOnly" &&
          task.dueDate &&
          task.dueDate <= today
        ) {

          task.dueMode =
            "none";

          task.dueDate =
            null;

          changed =
            true;

        }

      });


      if (changed) {
        saveTasks();
      }

    }


    /*
      SPEICHERN
    */

    function saveTasks() {

      localStorage.setItem(
        "masterOfDisasterTasks",
        JSON.stringify(tasks)
      );

    }


    function getTask(id) {

      return tasks.find(
        task => task.id === id
      );

    }


    /*
      NEUE AUFGABE
    */

    function addTask() {

      const input =
        document.getElementById(
          "taskInput"
        );

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }


      tasks.push({

        id: Date.now(),

        text: text,

        status: "open",

        priority: "normal",

        optional: false,

        dueMode: "none",
        dueDate: null,

        startedAt: null,
        pausedAt: null,
        pauseTotalMs: 0,

        completedAt: null,
        activeDurationMs: null,

        abortedAt: null,
        abortedActiveDurationMs: null
      });


      saveTasks();

      input.value =
        "";

      renderTasks();

    }


    /*
      PRIORITÄT
    */

    function setPriority(
      id,
      priority
    ) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      if (
        task.status === "completed" ||
        task.status === "aborted"
      ) {
        return;
      }


      if (
        ![
          "normal",
          "medium",
          "high"
        ].includes(priority)
      ) {
        return;
      }


      task.priority =
        priority;

      saveTasks();

      renderTasks();

    }


    /*
      OPTIONAL
    */

    function toggleOptional(id) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      if (
        task.status === "completed" ||
        task.status === "aborted"
      ) {
        return;
      }


      task.optional =
        !task.optional;


      saveTasks();

      renderTasks();

    }


    /*
      FÄLLIGKEIT
    */

    function setDueMode(
      id,
      mode
    ) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      if (
        task.status === "completed" ||
        task.status === "aborted"
      ) {
        return;
      }


      const today =
        getBerlinDateKey();

      const tomorrow =
        addDaysToDateKey(
          today,
          1
        );


      if (
        mode === "none"
      ) {

        task.dueMode =
          "none";

        task.dueDate =
          null;

      }


      if (
        mode === "tomorrowOnly"
      ) {

        task.dueMode =
          "tomorrowOnly";

        task.dueDate =
          tomorrow;

      }


      if (
        mode === "deadlineTomorrow"
      ) {

        task.dueMode =
          "deadline";

        task.dueDate =
          tomorrow;

      }


      saveTasks();

      renderTasks();

    }


    /*
      PRIORITÄT HILFSFUNKTIONEN
    */

    function getPrioritySymbol(
      priority
    ) {

      if (
        priority === "medium"
      ) {
        return "🟡";
      }


      if (
        priority === "high"
      ) {
        return "🔴";
      }


      return "⚪";

    }


    function getPriorityName(
      priority
    ) {

      if (
        priority === "medium"
      ) {
        return "MITTEL";
      }


      if (
        priority === "high"
      ) {
        return "HOCH";
      }


      return "NORMAL";

    }


    function getPriorityClass(
      priority
    ) {

      if (
        priority === "medium"
      ) {
        return "priority-medium";
      }


      if (
        priority === "high"
      ) {
        return "priority-high";
      }


      return "priority-normal";

    }


    /*
      FÄLLIGKEITSANZEIGE
    */

    function getDueDisplay(task) {

      if (
        !task.dueMode ||
        task.dueMode === "none" ||
        !task.dueDate
      ) {
        return "";
      }


      const today =
        getBerlinDateKey();


      if (
        task.dueMode ===
        "tomorrowOnly"
      ) {

        return `
          <span class="flag tomorrow-flag">
            💠 MORGEN
          </span>
        `;

      }


      if (
        task.dueMode ===
        "deadline"
      ) {

        if (
          task.dueDate <= today
        ) {

          return `
            <span class="flag warning-flag">
              ⚠️ HEUTE FÄLLIG
            </span>
          `;

        }


        return `
          <span class="flag deadline-flag">
            🔷 SPÄTESTENS MORGEN
          </span>
        `;

      }


      return "";

    }


    /*
      KENNZEICHNUNGEN
    */

    function createFlags(task) {

      return `

        <div class="flag-line">

          <span
            class="flag
            ${getPriorityClass(
              task.priority
            )}"
          >
            ${getPrioritySymbol(
              task.priority
            )}
            ${getPriorityName(
              task.priority
            )}
          </span>

          ${
            task.optional
              ? `
                <span class="flag optional-flag">
                  🟣 OPTIONAL
                </span>
              `
              : ""
          }

          ${getDueDisplay(task)}

        </div>
      `;

    }


    /*
      EINSTELLUNGEN
    */

    function createTaskSettings(
      task
    ) {

      return `

        <div class="settings-block">

          <div class="settings-row">

            <span class="settings-label">
              PRIORITÄT
            </span>

            <button
              class="setting-button
              ${
                task.priority === "normal"
                  ? "selected"
                  : ""
              }"
              onclick="setPriority(
                ${task.id},
                'normal'
              )"
            >
              ⚪ NORMAL
            </button>

            <button
              class="setting-button
              ${
                task.priority === "medium"
                  ? "selected"
                  : ""
              }"
              onclick="setPriority(
                ${task.id},
                'medium'
              )"
            >
              🟡 MITTEL
            </button>

            <button
              class="setting-button
              ${
                task.priority === "high"
                  ? "selected"
                  : ""
              }"
              onclick="setPriority(
                ${task.id},
                'high'
              )"
            >
              🔴 HOCH
            </button>

          </div>


          <div class="settings-row">

            <span class="settings-label">
              OPTIONAL
            </span>

            <button
              class="setting-button
              ${
                task.optional
                  ? "selected"
                  : ""
              }"
              onclick="toggleOptional(
                ${task.id}
              )"
            >
              🟣
              ${
                task.optional
                  ? "JA"
                  : "NEIN"
              }
            </button>

          </div>


          <div class="settings-row">

            <span class="settings-label">
              FÄLLIG
            </span>

            <button
              class="setting-button
              ${
                task.dueMode === "none"
                  ? "selected"
                  : ""
              }"
              onclick="setDueMode(
                ${task.id},
                'none'
              )"
            >
              —
            </button>

            <button
              class="setting-button
              ${
                task.dueMode ===
                  "tomorrowOnly"
                  ? "selected"
                  : ""
              }"
              onclick="setDueMode(
                ${task.id},
                'tomorrowOnly'
              )"
            >
              💠 MORGEN
            </button>

            <button
              class="setting-button
              ${
                task.dueMode ===
                  "deadline"
                  ? "selected"
                  : ""
              }"
              onclick="setDueMode(
                ${task.id},
                'deadlineTomorrow'
              )"
            >
              🔷 BIS MORGEN
            </button>

          </div>

        </div>
      `;

    }


    /*
      STARTEN
    */

    function startTask(id) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      const alreadyRunning =
        tasks.find(
          item =>
            item.status === "running" &&
            item.id !== id
        );


      if (alreadyRunning) {

        showInfoModal(
          "Schon eine Aufgabe aktiv",
          "Aktuell läuft bereits „" +
          alreadyRunning.text +
          "“. Pausiere oder beende sie zuerst."
        );

        return;

      }


      task.status =
        "running";

      task.startedAt =
        new Date().toISOString();

      task.pausedAt =
        null;

      task.pauseTotalMs =
        0;

      task.completedAt =
        null;

      task.activeDurationMs =
        null;

      task.abortedAt =
        null;

      task.abortedActiveDurationMs =
        null;


      saveTasks();

      renderTasks();

    }


    /*
      PAUSIEREN
    */

    function pauseTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status !== "running"
      ) {
        return;
      }


      task.status =
        "paused";

      task.pausedAt =
        new Date().toISOString();


      saveTasks();

      renderTasks();

    }


    /*
      FORTSETZEN
    */

    function resumeTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status !== "paused"
      ) {
        return;
      }


      const alreadyRunning =
        tasks.find(
          item =>
            item.status === "running" &&
            item.id !== id
        );


      if (alreadyRunning) {

        showInfoModal(
          "Schon eine Aufgabe aktiv",
          "Aktuell läuft bereits „" +
          alreadyRunning.text +
          "“. Pausiere oder beende sie zuerst."
        );

        return;

      }


      const now =
        Date.now();


      const pauseStart =
        task.pausedAt
          ? new Date(
              task.pausedAt
            ).getTime()
          : now;


      task.pauseTotalMs +=
        Math.max(
          0,
          now - pauseStart
        );


      task.pausedAt =
        null;

      task.status =
        "running";


      saveTasks();

      renderTasks();

    }


    /*
      BEENDEN
    */

    function finishTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        (
          task.status !== "running" &&
          task.status !== "paused"
        )
      ) {
        return;
      }


      const now =
        Date.now();


      const duration =
        calculateActiveDuration(
          task,
          now
        );


      if (
        task.status === "paused" &&
        task.pausedAt
      ) {

        task.pauseTotalMs +=
          Math.max(
            0,
            now -
            new Date(
              task.pausedAt
            ).getTime()
          );

      }


      task.status =
        "completed";

      task.pausedAt =
        null;

      task.completedAt =
        new Date(now)
          .toISOString();

      task.activeDurationMs =
        duration;

      task.abortedAt =
        null;

      task.abortedActiveDurationMs =
        null;


      editingTaskId =
        null;


      saveTasks();

      renderTasks();

    }


    /*
      ABBRECHEN
    */

    function askAbort(id) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      const container =
        document.getElementById(
          "modalContainer"
        );


      container.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeModalOnBackdrop(event)"
        >

          <div class="modal">

            <h2>
              Aufgabe abbrechen?
            </h2>

            <p>
              „${escapeHtml(task.text)}“
              wird endgültig als abgebrochen markiert.
            </p>

            <div class="modal-actions">

              <button
                class="modal-button cancel-modal"
                onclick="closeModal()"
              >
                Zurück
              </button>

              <button
                class="modal-button danger-modal"
                onclick="abortTask(${id})"
              >
                Abbrechen
              </button>

            </div>

          </div>

        </div>
      `;

    }


    function abortTask(id) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      const now =
        Date.now();


      if (task.startedAt) {

        task.abortedActiveDurationMs =
          calculateActiveDuration(
            task,
            now
          );


        if (
          task.status === "paused" &&
          task.pausedAt
        ) {

          task.pauseTotalMs +=
            Math.max(
              0,
              now -
              new Date(
                task.pausedAt
              ).getTime()
            );

        }

      } else {

        task.abortedActiveDurationMs =
          null;

      }


      task.status =
        "aborted";

      task.abortedAt =
        new Date(now)
          .toISOString();

      task.pausedAt =
        null;

      task.completedAt =
        null;

      task.activeDurationMs =
        null;


      editingTaskId =
        null;


      saveTasks();

      closeModal();

      renderTasks();

    }


    /*
      ZEITBERECHNUNG
    */

    function calculateActiveDuration(
      task,
      endTime
    ) {

      if (!task.startedAt) {
        return 0;
      }


      const started =
        new Date(
          task.startedAt
        ).getTime();


      let pauseTotal =
        task.pauseTotalMs || 0;


      if (
        task.status === "paused" &&
        task.pausedAt
      ) {

        pauseTotal +=
          Math.max(
            0,
            endTime -
            new Date(
              task.pausedAt
            ).getTime()
          );

      }


      return Math.max(
        0,
        endTime -
        started -
        pauseTotal
      );

    }


    function getCurrentActiveDuration(
      task
    ) {

      return calculateActiveDuration(
        task,
        Date.now()
      );

    }


    /*
      WIEDERHOLEN

      Priorität und Optionalität
      werden übernommen.

      Alte Fälligkeit dagegen NICHT,
      damit keine alte Deadline
      auf eine neue Wiederholung
      übertragen wird.
    */

    function repeatTask(id) {

      const oldTask =
        getTask(id);

      if (!oldTask) {
        return;
      }


      tasks.push({

        id: Date.now(),

        text:
          oldTask.text,

        status:
          "open",

        priority:
          oldTask.priority ||
          "normal",

        optional:
          oldTask.optional ||
          false,

        dueMode:
          "none",

        dueDate:
          null,

        startedAt:
          null,

        pausedAt:
          null,

        pauseTotalMs:
          0,

        completedAt:
          null,

        activeDurationMs:
          null,

        abortedAt:
          null,

        abortedActiveDurationMs:
          null

      });


      saveTasks();

      renderTasks();

    }


    /*
      BEARBEITEN
    */

    function startEditing(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status === "completed" ||
        task.status === "aborted"
      ) {
        return;
      }


      editingTaskId =
        id;


      renderTasks();


      setTimeout(() => {

        const input =
          document.getElementById(
            "edit-" + id
          );


        if (input) {

          input.focus();

          input.setSelectionRange(
            input.value.length,
            input.value.length
          );

        }

      }, 0);

    }


    function cancelEditing() {

      editingTaskId =
        null;

      renderTasks();

    }


    function saveEdit(id) {

      const task =
        getTask(id);


      const input =
        document.getElementById(
          "edit-" + id
        );


      if (!task || !input) {
        return;
      }


      const text =
        input.value.trim();


      if (text === "") {
        return;
      }


      task.text =
        text;


      editingTaskId =
        null;


      saveTasks();

      renderTasks();

    }


    /*
      LÖSCHEN
    */

    function askDelete(id) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      const container =
        document.getElementById(
          "modalContainer"
        );


      container.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeModalOnBackdrop(event)"
        >

          <div class="modal">

            <h2>
              Aufgabe löschen?
            </h2>

            <p>
              „${escapeHtml(task.text)}“
              wird endgültig gelöscht.
            </p>

            <div class="modal-actions">

              <button
                class="modal-button cancel-modal"
                onclick="closeModal()"
              >
                Abbrechen
              </button>

              <button
                class="modal-button danger-modal"
                onclick="deleteTask(${id})"
              >
                Löschen
              </button>

            </div>

          </div>

        </div>
      `;

    }


    function deleteTask(id) {

      tasks =
        tasks.filter(
          task =>
            task.id !== id
        );


      saveTasks();

      closeModal();

      renderTasks();

    }

      MODAL

    /*
      HTML SICHER
    */

    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


    /*
      NUMMERIERUNG
    */

    function formatTaskNumber(
      number
    ) {

      if (number < 10) {

        return "0" +
          number;

      }


      return String(
        number
      );

    }


    function getDynamicTaskNumber(
      task
    ) {

      const index =
        tasks.findIndex(
          item =>
            item.id === task.id
        );


      if (index === -1) {
        return "";
      }


      return formatTaskNumber(
        index + 1
      );

    }


    /*
      DATUM + ZEIT
    */

    function formatDateTime(
      value,
      label
    ) {

      if (!value) {
        return "";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }


      const datePart =
        date.toLocaleDateString(
          "de-DE",
          {
            timeZone:
              "Europe/Berlin",

            day:
              "2-digit",

            month:
              "2-digit",

            year:
              "numeric"
          }
        );


      const timePart =
        date.toLocaleTimeString(
          "de-DE",
          {
            timeZone:
              "Europe/Berlin",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit"
          }
        );


      return (
        label +
        " · " +
        datePart +
        " · " +
        timePart +
        " UHR"
      );

    }


    /*
      DAUER
    */

    function formatDuration(ms) {

      if (
        ms === null ||
        typeof ms ===
          "undefined"
      ) {
        return "";
      }


      const totalSeconds =
        Math.floor(
          ms / 1000
        );


      const hours =
        Math.floor(
          totalSeconds /
          3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds %
            3600
          ) /
          60
        );


      const seconds =
        totalSeconds %
        60;


      return (
        String(hours)
          .padStart(
            2,
            "0"
          ) +
        ":" +
        String(minutes)
          .padStart(
            2,
            "0"
          ) +
        ":" +
        String(seconds)
          .padStart(
            2,
            "0"
          )
      );

    }


    /*
      STATUSSYMBOL
    */

    function getStatusSymbol(
      task
    ) {

      if (
        task.status === "running" ||
        task.status === "paused"
      ) {
        return "🟨";
      }


      if (
        task.status === "completed"
      ) {
        return "✅";
      }


      if (
        task.status === "aborted"
      ) {
        return "❌";
      }


      return "⬜";

    }


    /*
      AKTIVE AUFGABE
    */

    function createActiveTaskElement(
      task
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "task";


      if (
        task.status === "running"

        );

        task.status === "paused"
      ) {

        element.classList.add(

        );

      }

        getDynamicTaskNumber(
          task
        );


      if (
        editingTaskId ===
        task.id
      ) {

        element.innerHTML = `

          <div class="task-number">
            ${number}
          </div>

          <div class="status-symbol">
            ${getStatusSymbol(task)}
          </div>

          <div class="edit-area">

            <input
              class="edit-input"
              id="edit-${task.id}"
              value="${escapeHtml(task.text)}"
              onkeydown="
                if(event.key === 'Enter') {
                  saveEdit(${task.id})
                }
              "
            >

            <div class="edit-actions">

              <button
                class="edit-button"
                onclick="saveEdit(${task.id})"
              >

              </button>

              </button>

        return element;

      }


      let meta =

      if (

      ) {

          <div class="status-meta paused-meta">

          </div>

          <div class="task-meta">
            ${formatDateTime(
              task.startedAt,
              "GESTARTET"
            )}
          </div>

          <div
            class="duration live-duration"
            data-task-id="${task.id}"
          >
            AKTIV ·
            ${formatDuration(
              getCurrentActiveDuration(

              )
            )}

      }


      let actions =

      if (

      ) {

        actions = `

          <div class="task-actions">

            </button>

            <button
              class="task-action-text"
              onclick="startEditing(${task.id})"

            </button>

            <button
              class="task-action-text"
              onclick="askDelete(${task.id})"
            >
              🗑 LÖSCHEN
            </button>

            <button
              class="task-action-text abort-button"
              onclick="askAbort(${task.id})"
            >
              ❌ ABBRECHEN
            </button>

          </div>
        `;

      }


      if (
        task.status === "running"
      ) {

        actions = `

          <div class="task-actions">

            <button
              class="task-action-text pause-button"
              onclick="pauseTask(${task.id})"
            >
              ⏸ PAUSE
            </button>

            <button
              class="task-action-text finish-button"
              onclick="finishTask(${task.id})"
            >
              ✅ BEENDEN
            </button>

            <button
              class="task-action-text abort-button"
              onclick="askAbort(${task.id})"
            >
              ❌ ABBRECHEN
            </button>

          </div>
        `;

      }


      if (
        task.status === "paused"
      ) {

        actions = `

          <div class="task-actions">

            <button
              class="task-action-text start-button"
              onclick="resumeTask(${task.id})"
            >
              ▶ FORTSETZEN
            </button>

            <button
              class="task-action-text finish-button"
              onclick="finishTask(${task.id})"
            >
              ✅ BEENDEN
            </button>

            <button
              class="task-action-text abort-button"
              onclick="askAbort(${task.id})"
            >
              ❌ ABBRECHEN
            </button>

          </div>
        `;

      }


      element.innerHTML = `

        <div class="task-number">
          ${number}
        </div>

        <div class="status-symbol">
          ${getStatusSymbol(task)}
        </div>

        <div class="task-content">

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          ${createFlags(task)}

          ${meta}

          ${createTaskSettings(task)}

          ${actions}

        </div>
      `;


      return element;

    }


    /*
      ERLEDIGT
    */

    function createCompletedTaskElement(
      task
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "task completed";


      const number =
        getDynamicTaskNumber(

        );


      element.innerHTML = `

        <div class="task-number">
          ${number}
        </div>

        <div class="status-symbol">
          ✅
        </div>

        <div class="task-content">

          <div class="task-text">

          </div>

          }

        </button>

    }


    /*
      ABGEBROCHEN
    */

    function createAbortedTaskElement(
      task
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "task aborted";


      const number =
        getDynamicTaskNumber(
          task
        );


      element.innerHTML = `

        <div class="task-number">
          ${number}
        </div>

        <div class="status-symbol">
          ❌
        </div>

        </button>

      return element;

    }


    /*
      RENDER
    */

    function renderTasks() {

      applyAutomaticDateRules();


      const activeList =
        document.getElementById(
          "activeTaskList"
        );


      const completedList =
        document.getElementById(
          "completedTaskList"
        );


      const abortedList =
        document.getElementById(
          "abortedTaskList"
        );


      const activeTasks =
        tasks.filter(
          task =>
            task.status === "open" ||
            task.status === "running" ||
            task.status === "paused"
        );


      const completedTasks =
        tasks
          .filter(
            task =>
              task.status ===
              "completed"
          )
          .sort(
            (a,b) =>
              new Date(
                b.completedAt || 0
              ) -
              new Date(
                a.completedAt || 0
              )
          );


      const abortedTasks =
        tasks
          .filter(
            task =>
              task.status ===
              "aborted"
          )
          .sort(
            (a,b) =>
              new Date(
                b.abortedAt || 0
              ) -
              new Date(
                a.abortedAt || 0
              )
          );


      const openCount =
        tasks.filter(
          task =>
            task.status === "open"
        ).length;


      const runningCount =
        tasks.filter(
          task =>
            task.status === "running"
        ).length;


      const pausedCount =
        tasks.filter(
          task =>
            task.status === "paused"
        ).length;


      document.getElementById(
        "activeCounter"
      ).textContent =
        openCount +
        " offen · " +
        runningCount +
        " läuft · " +
        pausedCount +
        " pausiert";


      document.getElementById(
        "completedCounter"
      ).textContent =
        completedTasks.length +
        " erledigt";


      document.getElementById(
        "abortedCounter"
      ).textContent =
        abortedTasks.length +
        " abgebrochen";


      activeList.innerHTML =
        "";

      completedList.innerHTML =
        "";

      abortedList.innerHTML =
        "";


      if (
        activeTasks.length === 0
      ) {

        activeList.innerHTML = `
          <div class="empty-message">
            Nix offen. Verdächtig. 👀
          </div>
        `;

      } else {

        activeTasks.forEach(
          task => {

            activeList.appendChild(
              createActiveTaskElement(
                task
              )
            );

          }
        );

      }


      if (
        completedTasks.length === 0
      ) {

        completedList.innerHTML = `
          <div class="empty-message">
            Noch nix erledigt.
          </div>
        `;

      } else {

        completedTasks.forEach(
          task => {

            completedList.appendChild(
              createCompletedTaskElement(
                task
              )
            );

          }
        );

      }


      if (
        abortedTasks.length === 0
      ) {

        abortedList.innerHTML = `
          <div class="empty-message">
            Nix abgebrochen.
          </div>
        `;

      } else {

        abortedTasks.forEach(
          task => {

            abortedList.appendChild(
              createAbortedTaskElement(
                task
              )
            );

          }
        );

      }

    }


    /*
      LIVE-TIMER
    */

    function updateLiveTimers() {

      document
        .querySelectorAll(
          ".live-duration"
        )
        .forEach(
          element => {

            const id =
              Number(
                element.dataset.taskId
              );


            const task =
              getTask(id);


            if (!task) {
              return;
            }


            element.textContent =
              "AKTIV · " +
              formatDuration(
                getCurrentActiveDuration(
                  task
                )
              );

          }
        );

    }


    setInterval(
      updateLiveTimers,
      1000
    );


    /*
      DATUMSREGELN AUCH PRÜFEN,
      WENN MAN ZUR APP ZURÜCKKEHRT
    */

    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState ===
          "visible"
        ) {

          renderTasks();

        }

      }
    );


    /*
      ENTER = HINZUFÜGEN
    */

    document
      .getElementById(
        "taskInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            addTask();

          }

        }
      );


    saveTasks();

    renderTasks();

  </script>

</body>
</html>
