    function loadOne(src){
      const key=abs(src);
      if(loaded.has(key)||[...document.scripts].some(s=>s.src===key)){loaded.add(key);return Promise.resolve(src);}
      if(pending.has(key))return pending.get(key);
      const p=new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src=src;s.async=false;s.dataset.modAreaRuntimeV591='true';
        s.onload=()=>{loaded.add(key);pending.delete(key);resolve(src);};

        document.body.appendChild(s);
      });
      pending.set(key,p); return p;
    }
    async function loadArea(id){
      if(areaReady.has(id))return true;
      for(const src of (GROUPS[id]||[])){await loadOne(src);await new Promise(r=>setTimeout(r,18));}
      areaReady.add(id); return true;

      return true;

      const start=Date.now();
      return new Promise((resolve,reject)=>{
        const tick=()=>{try{const v=test();if(v)return resolve(v);}catch(_){}
          if(Date.now()-start>timeout)return reject(new Error('Bereich wurde nicht rechtzeitig bereit.'));
          setTimeout(tick,40);
        }; tick();
      });
    }
