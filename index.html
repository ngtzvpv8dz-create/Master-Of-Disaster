<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">

  <title>Master of Disaster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #15191d 0%,
          #0b0d0f 45%,
          #070809 100%
        );

      color: #f3f3f3;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin: 8px 0 24px;
      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .eyebrow {
      margin-top: 10px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;

      color: #8c969f;
    }

    /* TABS */

    .tabs-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;

      margin: 0 -12px 18px;
      padding: 8px 12px;

      background: rgba(11, 13, 15, 0.96);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border-bottom: 1px solid #252a2e;
    }

    .tabs {
      display: flex;
      gap: 7px;

      overflow-x: auto;

      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      flex-shrink: 0;

      padding: 9px 12px;

      border: 1px solid #30363b;
      border-radius: 10px;

      background: #121619;
      color: #7f8990;

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.7px;

      cursor: pointer;
    }

    .tab-button.active {
      background: #e8ecef;
      color: #101214;

      border-color: #e8ecef;
    }

    /* EINGABE */

    .input-panel {
      padding: 14px;
      margin-bottom: 22px;

      background: #171b1f;

      border: 1px solid #292f34;
      border-radius: 16px;
    }

    #taskInput {
      width: 100%;

      padding: 14px;
      margin-bottom: 10px;

      border: 1px solid #30373d;
      border-radius: 11px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 16px;
    }

    #taskInput:focus,
    .edit-input:focus {
      border-color: #7d8993;
    }

    #taskInput::placeholder {
      color: #626b72;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 5px;

      margin-bottom: 7px;

      flex-wrap: wrap;
    }

    .option-label {
      min-width: 62px;

      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.7px;

      color: #69747b;
    }

    .option-button {
      min-height: 29px;

      padding: 4px 7px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #101315;
      color: #d9dde0;

      font-size: 9px;
      font-weight: 800;

      cursor: pointer;

      opacity: 0.48;
    }

    .option-button.selected {
      opacity: 1;

      background: #20262a;
      border-color: #68747c;
    }

    .add-button {
      width: 100%;

      padding: 14px;
      margin-top: 4px;

      border: 0;
      border-radius: 11px;

      background: #e8ecef;
      color: #101214;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;
    }

    /* BEREICHE */

    .section {
      margin-bottom: 26px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 8px;

      margin: 0 3px 10px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.6px;

      color: #8c969f;
    }

    .counter {
      flex-shrink: 0;

      padding: 5px 8px;

      border: 1px solid #30363b;
      border-radius: 20px;

      background: #15191c;

      font-size: 10px;
      color: #aab1b7;
    }

    /* AUFGABEN */

    .task {
      display: flex;
      align-items: center;
      gap: 5px;

      min-height: 50px;

      padding: 8px;
      margin-bottom: 7px;

      background:
        linear-gradient(
          135deg,
          #1c2125,
          #14181b
        );

      border: 1px solid #292f34;
      border-radius: 13px;
    }

    .task.running {
      border-color: #55775f;
    }

    .task.paused {
      border-color: #776d36;
    }

    .task.completed {
      opacity: 0.56;
    }

    .task.aborted {
      opacity: 0.5;
    }

    .task.completed .task-text,
    .task.aborted .task-text {
      text-decoration: line-through;
    }

    .task-number {
      width: 27px;
      flex-shrink: 0;

      text-align: center;

      font-size: 9px;
      font-weight: 900;

      color: #647887;
    }

    .status-symbol {
      width: 25px;
      flex-shrink: 0;

      text-align: center;

      font-size: 17px;
      line-height: 1;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-main-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .task-text {
      flex: 1;
      min-width: 0;

      font-size: 15px;
      font-weight: 650;
      line-height: 1.25;

      word-break: break-word;
    }

    /* FLAGS */

    .compact-flags {
      display: flex;
      gap: 3px;

      margin-top: 3px;
    }

    .mini-flag {
      font-size: 10px;
      line-height: 1;
    }

    /* META */

    .task-meta {
      margin-top: 3px;

      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.45px;

      color: #4f8ec4;
    }

    .duration {
      margin-top: 2px;

      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: 0.5px;

      color: #70a5cf;
    }

    .status-meta {
      margin-top: 3px;

      font-size: 8px;
      font-weight: 900;

      color: #b3a94f;
    }

    .abort-meta {
      margin-top: 3px;

      font-size: 7px;
      font-weight: 700;

      color: #ad6666;
    }

    /* KOMPAKTE ICON-AKTIONEN */

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-actions {
      display: flex;
      align-items: center;
      gap: 4px;

      margin-top: 5px;

      flex-wrap: nowrap;
    }

    .icon-action {
      width: 31px;
      height: 31px;

      flex: 0 0 31px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #101315;
      color: #d1d6d9;

      font-size: 13px;

      cursor: pointer;
    }

    .icon-action:active {
      transform: scale(0.93);
    }

    .start-button {
      border-color: #3e6047;
    }

    .pause-button {
      border-color: #776d36;
    }

    .finish-button {
      border-color: #41604b;
    }

    .abort-button {
      border-color: #6b3f3f;
    }

    .today-button {
      border-color: #385e77;
    }

    .today-button.selected {
      background: #14232c;
      border-color: #4c7490;
    }

    .repeat-button {
      width: 32px;
      height: 32px;

      flex-shrink: 0;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #0e1113;

      font-size: 14px;

      cursor: pointer;
    }

    /* HEUTE */

    .today-summary {
      padding: 12px;
      margin-bottom: 14px;

      border: 1px solid #34414a;
      border-radius: 13px;

      background: #151b1f;
    }

    .today-progress {
      font-size: 12px;
      font-weight: 900;
    }

    .today-progress-bar {
      height: 6px;

      margin-top: 9px;

      background: #252b2f;

      border-radius: 20px;

      overflow: hidden;
    }

    .today-progress-fill {
      height: 100%;

      background: #b8c3ca;

      transition: width 0.25s ease;
    }

    .drag-handle {
      width: 27px;
      min-height: 38px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #0d1012;
      color: #74818a;

      font-size: 18px;

      cursor: grab;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .dragging {
      opacity: 0.4;

      transform: scale(0.985);
    }

    .drag-target {
      border-color: #5d829e;
    }

    /* EDIT */

    .edit-area {
      flex: 1;
      min-width: 0;
    }

    .edit-input {
      width: 100%;

      padding: 10px;

      border: 1px solid #30373d;
      border-radius: 8px;

      background: #0d1012;
      color: white;

      outline: none;

      font-size: 15px;
    }

    .edit-options {
      margin-top: 9px;
    }

    .edit-actions {
      display: flex;
      gap: 6px;

      margin-top: 9px;
    }

    .edit-button {
      flex: 1;

      padding: 8px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #0e1113;
      color: #d8dde0;

      font-weight: 800;

      cursor: pointer;
    }

    /* EMPTY */

    .empty-message {
      padding: 22px 16px;

      border: 1px dashed #30363b;
      border-radius: 13px;

      text-align: center;

      color: #626c73;

      font-size: 13px;
    }

    /* ARCHIV */

    .archive-placeholder {
      padding: 28px 20px;

      border: 1px dashed #354048;
      border-radius: 14px;

      text-align: center;

      color: #7b858c;

      line-height: 1.5;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0,0,0,0.72);

      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 360px;

      padding: 22px;

      background: #191d20;

      border: 1px solid #343b40;
      border-radius: 18px;
    }

    .modal h2 {
      margin: 0 0 8px;

      font-size: 20px;
    }

    .modal p {
      margin: 0 0 20px;

      color: #9ba3a9;

      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-button {
      flex: 1;

      padding: 12px;

      border: 0;
      border-radius: 10px;

      font-weight: 800;

      cursor: pointer;
    }

    .cancel-modal {
      background: #30363b;
      color: white;
    }

    .confirm-modal {
      background: #e8ecef;
      color: #101214;
    }

    .danger-modal {
      background: #7c3f3f;
      color: white;
    }

    @media (max-width: 390px) {

      body {
        padding-left: 9px;
        padding-right: 9px;
      }

      .tabs-wrapper {
        margin-left: -9px;
        margin-right: -9px;

        padding-left: 9px;
        padding-right: 9px;
      }

      .task {
        padding: 7px 6px;
      }

      .task-number {
        width: 22px;
      }

      .status-symbol {
        width: 20px;

        font-size: 16px;
      }

      .task-text {
        font-size: 14px;
      }

      .icon-action {
        width: 29px;
        height: 29px;

        flex-basis: 29px;

        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <h1>
        MASTER OF DISASTER
      </h1>

      <div class="eyebrow">
        WEEK-AND-END-TO-DO-DINGSI
      </div>

    </header>


    <div class="tabs-wrapper">

      <nav class="tabs">

        <button
          class="tab-button active"
          data-tab="all"
          onclick="switchTab('all')"
        >
          ALLE
        </button>

        <button
          class="tab-button"
          data-tab="today"
          onclick="switchTab('today')"
        >
          HEUTE
        </button>

        <button
          class="tab-button"
          data-tab="priority"
          onclick="switchTab('priority')"
        >
          PRIORITÄT
        </button>

        <button
          class="tab-button"
          data-tab="due"
          onclick="switchTab('due')"
        >
          FÄLLIG
        </button>

        <button
          class="tab-button"
          data-tab="active"
          onclick="switchTab('active')"
        >
          AKTIV
        </button>

        <button
          class="tab-button"
          data-tab="completed"
          onclick="switchTab('completed')"
        >
          ERLEDIGT
        </button>

        <button
          class="tab-button"
          data-tab="archive"
          onclick="switchTab('archive')"
        >
          ARCHIV
        </button>

      </nav>

    </div>


    <section
      class="input-panel"
      id="inputPanel"
    >

      <input
        type="text"
        id="taskInput"
        placeholder="Was steht an?"
        autocomplete="off"
      >


      <div class="option-row">

        <span class="option-label">
          PRIORITÄT
        </span>

        <button
          id="newPriorityNormal"
          class="option-button selected"
          onclick="setNewPriority('normal')"
        >
          ⚪ NORMAL
        </button>

        <button
          id="newPriorityMedium"
          class="option-button"
          onclick="setNewPriority('medium')"
        >
          🟡 MITTEL
        </button>

        <button
          id="newPriorityHigh"
          class="option-button"
          onclick="setNewPriority('high')"
        >
          🔴 HOCH
        </button>

      </div>


      <div class="option-row">

        <span class="option-label">
          OPTIONAL
        </span>

        <button
          id="newOptionalButton"
          class="option-button"
          onclick="toggleNewOptional()"
        >
          🟣 NEIN
        </button>

      </div>


      <div class="option-row">

        <span class="option-label">
          FÄLLIG
        </span>

        <button
          id="newDueNone"
          class="option-button selected"
          onclick="setNewDue('none')"
        >
          —
        </button>

        <button
          id="newDueTomorrow"
          class="option-button"
          onclick="setNewDue('tomorrowOnly')"
        >
          💠 MORGEN
        </button>

        <button
          id="newDueDeadline"
          class="option-button"
          onclick="setNewDue('deadline')"
        >
          🔷 BIS MORGEN
        </button>

      </div>


      <button
        class="add-button"
        onclick="addTask()"
      >
        + AUFGABE HINZUFÜGEN
      </button>

    </section>


    <div id="viewContainer"></div>

  </main>


  <div id="modalContainer"></div>


  <script>

    let tasks =
      JSON.parse(
        localStorage.getItem(
          "masterOfDisasterTasks"
        )
      ) || [];


    let currentTab =
      "all";


    let editingTaskId =
      null;


    let newTaskPriority =
      "normal";


    let newTaskOptional =
      false;


    let newTaskDueMode =
      "none";


    let dragState =
      null;


    /*
      MIGRATION
    */

    tasks = tasks.map(
      task => {

        if (!task.status) {

          task.status =
            task.completed
              ? "completed"
              : "open";

        }


        const defaults = {

          priority:
            "normal",

          optional:
            false,

          dueMode:
            "none",

          dueDate:
            null,

          todayDate:
            null,

          todayOrder:
            null,

          startedAt:
            null,

          pausedAt:
            null,

          pauseTotalMs:
            0,

          completedAt:
            null,

          activeDurationMs:
            null,

          abortedAt:
            null,

          abortedActiveDurationMs:
            null

        };


        Object.keys(
          defaults
        ).forEach(
          key => {

            if (
              typeof task[key] ===
              "undefined"
            ) {

              task[key] =
                defaults[key];

            }

          }
        );


        return task;

      }
    );


    /*
      SPEICHERN
    */

    function saveTasks() {

      localStorage.setItem(
        "masterOfDisasterTasks",
        JSON.stringify(tasks)
      );

    }


    function getTask(id) {

      return tasks.find(
        task =>
          task.id === id
      );

    }


    /*
      BERLIN-DATUM
    */

    function getBerlinDateKey() {

      return new Intl
        .DateTimeFormat(
          "en-CA",
          {
            timeZone:
              "Europe/Berlin",

            year:
              "numeric",

            month:
              "2-digit",

            day:
              "2-digit"
          }
        )
        .format(
          new Date()
        );

    }


    function addDays(
      dateKey,
      days
    ) {

      const parts =
        dateKey
          .split("-")
          .map(Number);


      const date =
        new Date(
          Date.UTC(
            parts[0],
            parts[1] - 1,
            parts[2] + days,
            12
          )
        );


      return (
        date.getUTCFullYear() +
        "-" +
        String(
          date.getUTCMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          date.getUTCDate()
        ).padStart(2, "0")
      );

    }


    /*
      TABS
    */

    function switchTab(tab) {

      currentTab =
        tab;


      document
        .querySelectorAll(
          ".tab-button"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.tab ===
                tab
            );

          }
        );


      document
        .getElementById(
          "inputPanel"
        )
        .style.display =
          tab === "all"
            ? "block"
            : "none";


      editingTaskId =
        null;


      render();

    }


    /*
      NEUE AUFGABE OPTIONEN
    */

    function setNewPriority(
      priority
    ) {

      newTaskPriority =
        priority;

      updateNewOptions();

    }


    function toggleNewOptional() {

      newTaskOptional =
        !newTaskOptional;

      updateNewOptions();

    }


    function setNewDue(
      mode
    ) {

      newTaskDueMode =
        mode;

      updateNewOptions();

    }


    function updateNewOptions() {

      [
        "newPriorityNormal",
        "newPriorityMedium",
        "newPriorityHigh"
      ].forEach(
        id => {

          document
            .getElementById(id)
            .classList.remove(
              "selected"
            );

        }
      );


      const priorityId =
        newTaskPriority === "high"
          ? "newPriorityHigh"
          : newTaskPriority === "medium"
            ? "newPriorityMedium"
            : "newPriorityNormal";


      document
        .getElementById(
          priorityId
        )
        .classList.add(
          "selected"
        );


      const optional =
        document.getElementById(
          "newOptionalButton"
        );


      optional.classList.toggle(
        "selected",
        newTaskOptional
      );


      optional.textContent =
        newTaskOptional
          ? "🟣 JA"
          : "🟣 NEIN";


      [
        "newDueNone",
        "newDueTomorrow",
        "newDueDeadline"
      ].forEach(
        id => {

          document
            .getElementById(id)
            .classList.remove(
              "selected"
            );

        }
      );


      const dueId =
        newTaskDueMode ===
          "tomorrowOnly"
          ? "newDueTomorrow"
          : newTaskDueMode ===
              "deadline"
            ? "newDueDeadline"
            : "newDueNone";


      document
        .getElementById(
          dueId
        )
        .classList.add(
          "selected"
        );

    }


    function resetNewOptions() {

      newTaskPriority =
        "normal";

      newTaskOptional =
        false;

      newTaskDueMode =
        "none";


      updateNewOptions();

    }


    /*
      AUFGABE ANLEGEN
    */

    function addTask() {

      const input =
        document.getElementById(
          "taskInput"
        );


      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      const today =
        getBerlinDateKey();


      const tomorrow =
        addDays(
          today,
          1
        );


      tasks.push({

        id:
          Date.now(),

        text:
          text,

        status:
          "open",

        priority:
          newTaskPriority,

        optional:
          newTaskOptional,

        dueMode:
          newTaskDueMode,

        dueDate:
          newTaskDueMode === "none"
            ? null
            : tomorrow,

        todayDate:
          null,

        todayOrder:
          null,

        startedAt:
          null,

        pausedAt:
          null,

        pauseTotalMs:
          0,

        completedAt:
          null,

        activeDurationMs:
          null,

        abortedAt:
          null,

        abortedActiveDurationMs:
          null

      });


      input.value =
        "";


      resetNewOptions();

      saveTasks();

      render();

    }


    /*
      HEUTE
    */

    function isTodayTask(task) {

      return (
        task.todayDate ===
        getBerlinDateKey()
      );

    }


    function toggleToday(id) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      const today =
        getBerlinDateKey();


      if (
        task.todayDate ===
        today
      ) {

        task.todayDate =
          null;

        task.todayOrder =
          null;

      } else {

        const todays =
          tasks.filter(
            item =>
              item.todayDate ===
              today
          );


        const highest =
          todays.reduce(
            (max, item) =>
              Math.max(
                max,
                item.todayOrder || 0
              ),
            0
          );


        task.todayDate =
          today;

        task.todayOrder =
          highest + 1;

      }


      normalizeTodayOrder();

      saveTasks();

      render();

    }


    function normalizeTodayOrder() {

      const today =
        getBerlinDateKey();


      const selected =
        tasks
          .filter(
            task =>
              task.todayDate ===
              today
          )
          .sort(
            (a, b) =>
              (a.todayOrder || 0) -
              (b.todayOrder || 0)
          );


      selected.forEach(
        (task, index) => {

          task.todayOrder =
            index + 1;

        }
      );

    }


    /*
      DRAG & DROP HEUTE
    */

    function startTodayDrag(
      event,
      id
    ) {

      event.preventDefault();


      const card =
        event.currentTarget.closest(
          ".task"
        );


      dragState = {

        id:
          id,

        pointerId:
          event.pointerId,

        card:
          card

      };


      event.currentTarget
        .setPointerCapture(
          event.pointerId
        );


      card.classList.add(
        "dragging"
      );

    }


    function moveTodayDrag(
      event
    ) {

      if (!dragState) {
        return;
      }


      if (
        event.pointerId !==
        dragState.pointerId
      ) {
        return;
      }


      event.preventDefault();


      document
        .querySelectorAll(
          ".drag-target"
        )
        .forEach(
          item =>
            item.classList.remove(
              "drag-target"
            )
        );


      const element =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );


      const target =
        element
          ? element.closest(
              ".today-task"
            )
          : null;


      if (
        target &&
        Number(
          target.dataset.id
        ) !==
          dragState.id
      ) {

        target.classList.add(
          "drag-target"
        );

      }

    }


    function endTodayDrag(
      event
    ) {

      if (!dragState) {
        return;
      }


      if (
        event.pointerId !==
        dragState.pointerId
      ) {
        return;
      }


      const element =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );


      const target =
        element
          ? element.closest(
              ".today-task"
            )
          : null;


      const draggedId =
        dragState.id;


      dragState.card
        .classList.remove(
          "dragging"
        );


      document
        .querySelectorAll(
          ".drag-target"
        )
        .forEach(
          item =>
            item.classList.remove(
              "drag-target"
            )
        );


      dragState =
        null;


      if (!target) {
        return;
      }


      const targetId =
        Number(
          target.dataset.id
        );


      if (
        draggedId ===
        targetId
      ) {
        return;
      }


      reorderToday(
        draggedId,
        targetId
      );

    }


    function reorderToday(
      draggedId,
      targetId
    ) {

      const today =
        getBerlinDateKey();


      const selected =
        tasks
          .filter(
            task =>
              task.todayDate ===
              today
          )
          .sort(
            (a, b) =>
              (a.todayOrder || 0) -
              (b.todayOrder || 0)
          );


      const from =
        selected.findIndex(
          task =>
            task.id ===
            draggedId
        );


      const to =
        selected.findIndex(
          task =>
            task.id ===
            targetId
        );


      if (
        from === -1 ||
        to === -1
      ) {
        return;
      }


      const [
        moved
      ] =
        selected.splice(
          from,
          1
        );


      selected.splice(
        to,
        0,
        moved
      );


      selected.forEach(
        (task, index) => {

          task.todayOrder =
            index + 1;

        }
      );


      saveTasks();

      render();

    }


    document.addEventListener(
      "pointermove",
      moveTodayDrag,
      {
        passive: false
      }
    );


    document.addEventListener(
      "pointerup",
      endTodayDrag
    );


    document.addEventListener(
      "pointercancel",
      endTodayDrag
    );


    /*
      PRIORITÄT / OPTIONAL / FÄLLIG
    */

    function setPriority(
      id,
      priority
    ) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      task.priority =
        priority;

    function toggleOptional(id) {

        getTask(id);

      }

    function setDueMode(
      id,
      mode
    ) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      const today =
        getBerlinDateKey();


      task.dueMode =

      task.dueDate =
        mode === "none"
          ? null
          : addDays(
              today,
              1
            );


      saveTasks();

    }


    /*
      STATUS / ZEIT
    */

    function startTask(id) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      const running =
        tasks.find(
          item =>
            item.status ===
              "running" &&
            item.id !== id
        );


      if (running) {

        showInfoModal(
          "Schon eine Aufgabe aktiv",
          "Aktuell läuft bereits „" +
          running.text +
          "“. Pausiere oder beende sie zuerst."
        );

        return;

      }


      task.status =
        "running";

      task.startedAt =
        new Date()
          .toISOString();

      task.pausedAt =
        null;

      task.pauseTotalMs =
        0;


      saveTasks();

      render();

    }


    function pauseTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status !==
          "running"
      ) {
        return;
      }


      task.status =
        "paused";

      task.pausedAt =
        new Date()
          .toISOString();


      saveTasks();

      render();

    }


    function resumeTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status !==
          "paused"
      ) {
        return;
      }


      const running =
        tasks.find(
          item =>
            item.status ===
              "running" &&
            item.id !== id
        );


      if (running) {

        showInfoModal(
          "Schon eine Aufgabe aktiv",
          "Aktuell läuft bereits „" +
          running.text +
          "“. Pausiere oder beende sie zuerst."
        );

        return;

      }


      const now =
        Date.now();


      task.pauseTotalMs +=
        Math.max(
          0,
          now -
          new Date(
            task.pausedAt
          ).getTime()
        );


      task.pausedAt =
        null;

      task.status =
        "running";


      saveTasks();

      render();

    }


    function calculateActiveDuration(
      task,
      end
    ) {

      if (!task.startedAt) {
        return 0;
      }


      let pause =
        task.pauseTotalMs ||
        0;


      if (
        task.status ===
          "paused" &&
        task.pausedAt
      ) {

        pause +=
          Math.max(
            0,
            end -
            new Date(
              task.pausedAt
            ).getTime()
          );

      }


      return Math.max(
        0,
        end -
        new Date(
          task.startedAt
        ).getTime() -
        pause
      );

    }


    function finishTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        ![
          "running",
          "paused"
        ].includes(
          task.status
        )
      ) {
        return;
      }


      const now =
        Date.now();


      task.activeDurationMs =
        calculateActiveDuration(
          task,
          now
        );


      task.status =
        "completed";

      task.completedAt =
        new Date(now)
          .toISOString();

      task.pausedAt =
        null;


      saveTasks();

      render();

    }


    function askAbort(id) {

      const task =
        getTask(id);

      if (!task) {

      }


      document

        `;

    }


    function abortTask(id) {

      const task =
        getTask(id);

      if (!task) {
        return;
      }


      const now =
        Date.now();


      task.abortedActiveDurationMs =
        task.startedAt
          ? calculateActiveDuration(
              task,
              now
            )
          : null;


      task.status =
        "aborted";

      task.abortedAt =
        new Date(now)
          .toISOString();

      task.pausedAt =
        null;


      closeModal();

      saveTasks();

      render();

    }


    /*
      WIEDERHOLEN
    */

    function repeatTask(id) {

      const old =
        getTask(id);

      if (!old) {
        return;
      }


      tasks.push({

        id:
          Date.now(),

        text:
          old.text,

        status:
          "open",

        priority:
          old.priority ||

        optional:

        dueDate:
          null,

        todayDate:
          null,

        todayOrder:
          null,

        startedAt:
          null,

        pausedAt:
          null,

        pauseTotalMs:
          0,

        completedAt:
          null,

        activeDurationMs:
          null,

        abortedAt:
          null,

        abortedActiveDurationMs:
          null

      });


      saveTasks();

      render();

    }


    /*

    */

    function startEditing(id) {

    /*
      SYMBOLE
    */

    function prioritySymbol(
      priority
    ) {

      if (
        priority === "high"
      ) {
        return "🔴";
      }


      if (
        priority === "medium"
      ) {
        return "🟡";
      }


      return "⚪";

    }


    /*
      NEUE STATUSSYMBOLE

      offen      = ⬜
      läuft      = ▶️
      pausiert   = ⏸️
      erledigt   = ✅
      abgebrochen= ❌
    */

    function statusSymbol(
      task
    ) {

      if (
        task.status ===
          "completed"
      ) {
        return "✅";
      }


      if (
        task.status ===
          "aborted"
      ) {
        return "❌";
      }


      if (
        task.status ===
          "running"
      ) {
        return "▶️";
      }


      if (
        task.status ===
          "paused"
      ) {
        return "⏸️";
      }


      return "⬜";

    }


    function dueSymbol(
      task
    ) {

      if (
        !task.dueDate ||
        task.dueMode ===
          "none"
      ) {
        return "";
      }


      const today =
        getBerlinDateKey();


      if (
        task.dueMode ===
          "tomorrowOnly"
      ) {

        if (
          task.dueDate <= today
        ) {
          return "";
        }


        return "💠";

      }


      if (
        task.dueMode ===
          "deadline"
      ) {

        return (
          task.dueDate <= today
            ? "⚠️"
            : "🔷"
        );

      }


      return "";

    }


    function flags(task) {

      return `

        <div class="compact-flags">

          <span class="mini-flag">
            ${prioritySymbol(
              task.priority
            )}
          </span>

          ${
            task.optional
              ? `
                <span class="mini-flag">
                  🟣
                </span>
              `
              : ""
          }

          ${
            dueSymbol(task)
              ? `
                <span class="mini-flag">
                  ${dueSymbol(task)}
                </span>
              `
              : ""
          }

        </div>
      `;

    }


    /*
      NUMMERIERUNG
    */

    function dynamicNumber(
      task
    ) {

      const index =
        tasks.findIndex(
          item =>
            item.id === task.id
        );


      if (index === -1) {
        return "";
      }


      const number =
        index + 1;


      return number < 10
        ? "0" + number
        : String(number);

    }


    /*
      FORMATIERUNG
    */

    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


    function formatDuration(ms) {

      if (
        ms === null ||
        typeof ms ===
          "undefined"
      ) {
        return "";
      }


      const total =
        Math.floor(
          ms / 1000
        );


      const h =
        Math.floor(
          total / 3600
        );


      const m =
        Math.floor(
          (
            total % 3600
          ) / 60
        );


      const s =
        total % 60;


      return (
        String(h)
          .padStart(2,"0") +
        ":" +
        String(m)
          .padStart(2,"0") +
        ":" +
        String(s)
          .padStart(2,"0")
      );

    }


    function formatDateTime(
      value,
      label
    ) {

      if (!value) {
        return "";
      }


      const date =
        new Date(value);


      return (
        label +
        " · " +
        date.toLocaleDateString(
          "de-DE",
          {
            timeZone:
              "Europe/Berlin"
          }
        ) +
        " · " +
        date.toLocaleTimeString(
          "de-DE",
          {
            timeZone:
              "Europe/Berlin",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit"
          }
        ) +
        " UHR"
      );

    }


    function liveDuration(
      task
    ) {

      return calculateActiveDuration(
        task,
        Date.now()
      );

    }

      AUFGABENKARTE
    */

    ) {

        showTodayButton = false,
        compactOnly = false
      } = options;

      ) {

        );
      }


      if (
        task.status ===
          "paused"
      ) {
        element.classList.add(
          "paused"
        );
      }


      if (
        task.status ===
          "completed"
      ) {
        element.classList.add(
          "completed"
        );
      }


      if (
        task.status ===
          "aborted"
      ) {
        element.classList.add(
          "aborted"
        );
      }


      if (todayDrag) {

          >
            AKTIV ·
            ${formatDuration(

            )}

          }

              ${iconButton(
                "✏️",
                "Bearbeiten",
                `startEditing(${task.id})`
              )}

              ${iconButton(
                "🗑️",
                "Löschen",
                `askDelete(${task.id})`
              )}

              ${iconButton(
                "❌",
                "Abbrechen",
                `askAbort(${task.id})`,
                "abort-button"
              )}

              ${
                todayDrag &&
                isTodayTask(task)
                  ? iconButton(
                      "➖",
                      "Aus Heute entfernen",
                      `toggleToday(${task.id})`,
                      "today-button selected"
                    )
                  : ""
              }

            </div>
          `;

        }


        if (
          task.status ===
            "running"
        ) {

          actions = `

            <div class="icon-actions">

              ${iconButton(
                "⏸️",
                "Pausieren",
                `pauseTask(${task.id})`,
                "pause-button"
              )}

              ${iconButton(
                "✅",
                "Beenden",
                `finishTask(${task.id})`,
                "finish-button"
              )}

              ${iconButton(
                "❌",
                "Abbrechen",
                `askAbort(${task.id})`,
                "abort-button"
              )}

              ${
                todayDrag &&
                isTodayTask(task)
                  ? iconButton(
                      "➖",
                      "Aus Heute entfernen",
                      `toggleToday(${task.id})`,
                      "today-button selected"
                    )
                  : ""
              }

            </div>
          `;

        }


        if (
          task.status ===
            "paused"
        ) {

          actions = `

            <div class="icon-actions">

              ${iconButton(
                "▶️",
                "Fortsetzen",
                `resumeTask(${task.id})`,
                "start-button"
              )}

              ${iconButton(
                "✅",
                "Beenden",
                `finishTask(${task.id})`,
                "finish-button"
              )}

              ${iconButton(
                "❌",
                "Abbrechen",
                `askAbort(${task.id})`,
                "abort-button"
              )}

              ${
                todayDrag &&
                isTodayTask(task)
                  ? iconButton(
                      "➖",
                      "Aus Heute entfernen",
                      `toggleToday(${task.id})`,
                      "today-button selected"
                    )
                  : ""
              }

            </div>
          `;

        }

      }


      const repeat =
        [
          "completed",
          "aborted"
        ].includes(
          task.status
        )
          ? `
            <button
              class="repeat-button"
              onclick="repeatTask(${task.id})"
              title="Wiederholen"
              aria-label="Wiederholen"
            >
              🔁
            </button>
          `
          : "";


      element.innerHTML = `

        ${leftDrag}

        <div class="task-number">
          ${dynamicNumber(task)}
        </div>

        <div class="status-symbol">
          ${statusSymbol(task)}
        </div>

        <div class="task-content">

          <div class="task-main-row">

            <div class="task-text">
              ${escapeHtml(task.text)}
            </div>

          </div>

          ${flags(task)}

          ${meta}

          ${actions}

        </div>

        ${repeat}
      `;


      return element;

    }


    /*
      SECTION
    */

    function section(
      title,
      items,
      options = {}
    ) {

      const {
        counter = "",
        empty = "Keine Aufgaben.",
        cardOptions = {}
      } = options;


      const wrapper =
        document.createElement(
          "section"
        );


      wrapper.className =
        "section";


      wrapper.innerHTML = `

        <div class="section-header">

          <div class="section-title">
            ${title}
          </div>

          ${
            counter
              ? `
                <div class="counter">
                  ${counter}
                </div>
              `
              : ""
          }

        </div>
      `;


      if (
        items.length === 0
      ) {

        const emptyDiv =
          document.createElement(
            "div"
          );


        emptyDiv.className =
          "empty-message";


        emptyDiv.textContent =
          empty;


        wrapper.appendChild(
          emptyDiv
        );


        return wrapper;

      }


      items.forEach(
        task => {

          wrapper.appendChild(
            taskCard(
              task,
              cardOptions
            )
          );

        }
      );


      return wrapper;

    }


    /*
      ALLE
    */

    function renderAll(
      container
    ) {

      const active =
        tasks.filter(
          task =>
            [
              "open",
              "running",
              "paused"
            ].includes(
              task.status
            )
        );


      const completed =
        tasks
          .filter(
            task =>
              task.status ===
              "completed"
          )
          .sort(
            (a,b) =>
              new Date(
                b.completedAt || 0
              ) -
              new Date(
                a.completedAt || 0
              )
          );


      const aborted =
        tasks.filter(
          task =>
            task.status ===
            "aborted"
        );


      container.appendChild(
        section(
          "OFFENE UND LAUFENDE AUFGABEN",
          active,
          {
            counter:
              active.length +
              " aktiv",

            empty:
              "Nix offen. Verdächtig. 👀",

            cardOptions: {
              showTodayButton:
                true
            }
          }
        )
      );


      container.appendChild(
        section(
          "ERLEDIGT",
          completed,
          {
            counter:
              completed.length +
              " erledigt",

            empty:
              "Noch nix erledigt."
          }
        )
      );


      container.appendChild(
        section(
          "ABGEBROCHEN",
          aborted,
          {
            counter:
              aborted.length +
              " abgebrochen",

            empty:
              "Nix abgebrochen."
          }
        )
      );

    }


    /*
      HEUTE
    */

    function renderToday(
      container
    ) {

      const today =
        tasks
          .filter(
            task =>
              isTodayTask(task)
          )
          .sort(
            (a,b) =>
              (a.todayOrder || 0) -
              (b.todayOrder || 0)
          );


      const completed =
        today.filter(
          task =>
            task.status ===
            "completed"
        ).length;


      const percent =
        today.length
          ? Math.round(
              completed /
              today.length *
              100
            )
          : 0;


      const summary =
        document.createElement(
          "div"
        );


      summary.className =
        "today-summary";


      summary.innerHTML = `

        <div class="today-progress">
          HEUTIGER AUFGABENBLOCK ·
          ${completed}/${today.length}
          ERLEDIGT
        </div>

        <div class="today-progress-bar">

          <div
            class="today-progress-fill"
            style="width:${percent}%"
          ></div>

        </div>
      `;


      container.appendChild(
        summary
      );


      container.appendChild(
        section(
          "HEUTE",
          today,
          {
            counter:
              today.length +
              " Aufgaben",

            empty:
              "Noch keine Aufgabe für heute ausgewählt.",

            cardOptions: {
              todayDrag:
                true
            }
          }
        )
      );

    }


    /*
      PRIORITÄT
    */

    function renderPriority(
      container
    ) {

      const relevant =
        tasks.filter(
          task =>
            [
              "open",
              "running",
              "paused"
            ].includes(
              task.status
            )
        );


      [
        [
          "🔴 HOHE PRIORITÄT",
          "high"
        ],
        [
          "🟡 MITTLERE PRIORITÄT",
          "medium"
        ],
        [
          "⚪ NORMALE PRIORITÄT",
          "normal"
        ]
      ].forEach(
        group => {

          const items =
            relevant.filter(
              task =>
                task.priority ===
                group[1]
            );


          container.appendChild(
            section(
              group[0],
              items,
              {
                counter:
                  items.length,

                empty:
                  "Keine Aufgaben in dieser Priorität.",

                cardOptions: {
                  compactOnly:
                    true
                }
              }
            )
          );

        }
      );

    }


    /*
      FÄLLIG
    */

    function renderDue(
      container
    ) {

      const active =
        tasks.filter(
          task =>
            [
              "open",
              "running",
              "paused"
            ].includes(
              task.status
            )
        );


      const warning =
        active.filter(
          task =>
            dueSymbol(task) ===
            "⚠️"
        );


      const deadline =
        active.filter(
          task =>
            dueSymbol(task) ===
            "🔷"
        );


      const tomorrow =
        active.filter(
          task =>
            dueSymbol(task) ===
            "💠"
        );


      container.appendChild(
        section(
          "⚠️ HEUTE FÄLLIG",
          warning,
          {
            counter:
              warning.length,

            empty:
              "Keine Deadline für heute."
          }
        )
      );


      container.appendChild(
        section(
          "🔷 SPÄTESTENS MORGEN",
          deadline,
          {
            counter:
              deadline.length,

            empty:
              "Nix spätestens morgen fällig."
          }
        )
      );


      container.appendChild(
        section(
          "💠 FÜR MORGEN",
          tomorrow,
          {
            counter:
              tomorrow.length,

            empty:
              "Keine Aufgabe gezielt für morgen."
          }
        )
      );

    }


    /*
      AKTIV
    */

    function renderActive(
      container
    ) {

      const running =
        tasks.filter(
          task =>
            task.status ===
            "running"
        );


      const paused =
        tasks.filter(
          task =>
            task.status ===
            "paused"
        );


      container.appendChild(
        section(
          "▶️ LÄUFT",
          running,
          {
            counter:
              running.length,

            empty:
              "Aktuell läuft keine Aufgabe."
          }
        )
      );


      container.appendChild(
        section(
          "⏸️ PAUSIERT",
          paused,
          {
            counter:
              paused.length,

            empty:
              "Keine pausierte Aufgabe."
          }
        )
      );

    }


    /*
      ERLEDIGT
    */

    function renderCompleted(
      container
    ) {

      const completed =
        tasks
          .filter(
            task =>
              task.status ===
              "completed"
          )
          .sort(
            (a,b) =>
              new Date(
                b.completedAt || 0
              ) -
              new Date(
                a.completedAt || 0
              )
          );


      container.appendChild(
        section(
          "ERLEDIGT",
          completed,
          {
            counter:
              completed.length +
              " erledigt",

            empty:
              "Noch nix erledigt."
          }
        )
      );

    }


    /*
      ARCHIV
    */

    function renderArchive(
      container
    ) {

      const placeholder =
        document.createElement(
          "div"
        );


      placeholder.className =
        "archive-placeholder";


      placeholder.innerHTML = `
        <strong>ARCHIV</strong><br><br>
        Noch nicht aktiviert.<br>
        Hier landen später archivierte
        Aufgaben mit dauerhafter
        Archivnummer, Datum,
        Zeiten und Statistik.
        ☠️📚
      `;


      container.appendChild(
        placeholder
      );

    }


    /*
      RENDER
    */

    function render() {

      const container =
        document.getElementById(
          "viewContainer"
        );


      container.innerHTML =
        "";


      if (
        currentTab ===
        "all"
      ) {
        renderAll(
          container
        );
      }


      if (
        currentTab ===
        "today"
      ) {
        renderToday(
          container
        );
      }


      if (
        currentTab ===
        "priority"
      ) {
        renderPriority(
          container
        );
      }


      if (
        currentTab ===
        "due"
      ) {
        renderDue(
          container
        );
      }


      if (
        currentTab ===
        "active"
      ) {
        renderActive(
          container
        );
      }


      if (
        currentTab ===
        "completed"
      ) {
        renderCompleted(
          container
        );
      }


      if (
        currentTab ===
        "archive"
      ) {
        renderArchive(
          container
        );
      }

    }


    /*
      LIVE-TIMER
    */

    function updateLiveTimers() {

      document
        .querySelectorAll(
          ".live-duration"
        )
        .forEach(
          element => {

            const task =
              getTask(
                Number(
                  element.dataset.taskId
                )
              );


            if (!task) {
              return;
            }


            element.textContent =
              "AKTIV · " +
              formatDuration(
                liveDuration(
                  task
                )
              );

          }
        );

    }


    setInterval(
      updateLiveTimers,
      1000
    );


    /*
      MODAL
    */

    function closeModal() {

      document
        .getElementById(
          "modalContainer"
        )
        .innerHTML =
          "";

    }


    function closeModalOnBackdrop(
      event
    ) {

      if (
        event.target.classList.contains(
          "modal-backdrop"
        )
      ) {
        closeModal();
      }

    }


    function showInfoModal(
      title,
      text
    ) {

      document
        .getElementById(
          "modalContainer"
        )
        .innerHTML = `

          <div
            class="modal-backdrop"
            onclick="closeModalOnBackdrop(event)"
          >

            <div class="modal">

              <h2>
                ${escapeHtml(title)}
              </h2>

              <p>
                ${escapeHtml(text)}
              </p>

              <div class="modal-actions">

                <button
                  class="modal-button confirm-modal"
                  onclick="closeModal()"
                >
                  Alles klar
                </button>

              </div>

            </div>

          </div>
        `;

    }


    /*
      ENTER
    */

    document
      .getElementById(
        "taskInput"
      )
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {
            addTask();
          }

        }
      );


    saveTasks();

    updateNewOptions();

    render();

  </script>

</body>
</html>
