  <script id="modV586SwPurge">
  (function(){
    'use strict';
    window.__modDisableServiceWorkerV586=true;
    const RELOAD_KEY='mod-v586-sw-clean-reload';
    (async()=>{
      try{
        const hadController=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg=>reg.unregister().catch(()=>false)));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key).catch(()=>false)));
        }
        document.documentElement.dataset.modSwV586='disabled-clean';
        if(hadController&&!sessionStorage.getItem(RELOAD_KEY)){
          sessionStorage.setItem(RELOAD_KEY,'1');
          const url=new URL(location.href);
          url.searchParams.set('v586clean','1');
          location.replace(url.href);
        }
      }catch(error){
        console.warn('V586 SW-Purge:',error);
      }
    })();
  })();

    const loaded=new Set();
    const loading=new Map();

    function absolute(src){
      try{return new URL(src,location.href).href;}catch(_){return src;}
    }

    function alreadyPresent(src){
      const target=absolute(src);
      return [...document.scripts].some(s=>s.src===target);
    }

    function loadOne(src){
      const key=absolute(src);
      if(loaded.has(key))return Promise.resolve(src);
      if(loading.has(key))return loading.get(key);
      if(alreadyPresent(src)){
        loaded.add(key);
        return Promise.resolve(src);
      }
      const promise=new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src=src;
        s.async=false;
        s.dataset.modV588='true';
        s.onload=()=>{loaded.add(key);loading.delete(key);resolve(src);};
        s.onerror=()=>{loading.delete(key);reject(new Error('Laden fehlgeschlagen: '+src));};
        document.body.appendChild(s);
      });
      loading.set(key,promise);
      return promise;
    }

    async function loadGroup(id){
      const list=GROUPS[id]||[];
      for(const src of list){await loadOne(src);await new Promise(resolve=>setTimeout(resolve,8));}
      return true;
    }

    function waitFor(test,timeout=4500){
      const start=Date.now();
      return new Promise((resolve,reject)=>{
        const tick=()=>{
          try{const value=test();if(value)return resolve(value);}catch(_){}
          if(Date.now()-start>=timeout)return reject(new Error('Bereich wurde nicht rechtzeitig bereit.'));
          setTimeout(tick,40);
        };
        tick();
      });
    }

    async function openArea(id){
      document.documentElement.dataset.modV588='loading-'+id;
      await loadGroup(id);

      if(id==='todo'){
        await waitFor(()=>typeof window.render==='function'&&Array.isArray(window.tasks||[]));
        try{window.render();}catch(_){ }
        window.__modAppHubV515?.open?.('todo',{source:'v588-area-polished'});

        const api=await waitFor(()=>window.__modSportV568||window.__modSportModeV510);
        window.__modAppHubV515?.hide?.();
        api.setMode?.('sport',{persist:true,animate:false});
      }else if(id==='food'){
        const api=await waitFor(()=>window.__modFoodV544);
        api.open?.();
      }else if(id==='finance'){
        const api=await waitFor(()=>window.__modFinanceV552||window.__modFinanceV553);

      }else if(id==='kistology'){

        api.open?.({section:'system'});
      }

      const id=button.dataset.modHubLaunchV517;
