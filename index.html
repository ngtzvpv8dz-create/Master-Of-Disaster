<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d0f">  
  
<title>Master of Disaster</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px 50px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #15191d 0%,
      #0b0d0f 45%,
      #070809 100%
    );

  color: #f3f3f3;
}

.app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

/* HEADER */

.header {
  margin: 8px 0 24px;
  text-align: center;
}

h1 {
  margin: 0;

  font-size: clamp(28px, 8vw, 42px);
  line-height: 1;
  letter-spacing: -1.5px;
}

.eyebrow {
  margin-top: 10px;

  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;

  color: #8c969f;
}

/* TABS */

.tabs-wrapper {
  position: sticky;
  top: 0;
  z-index: 50;

  margin: 0 -12px 18px;
  padding: 8px 12px;

  background: rgba(11,13,15,0.96);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border-bottom: 1px solid #252a2e;
}

.tabs {
  display: flex;
  gap: 7px;

  overflow-x: auto;

  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab-button {
  flex-shrink: 0;

  padding: 9px 12px;

  border: 1px solid #30363b;
  border-radius: 10px;

  background: #121619;
  color: #7f8990;

  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.7px;

  cursor: pointer;
}

.tab-button.active {
  background: #e8ecef;
  color: #101214;

  border-color: #e8ecef;
}

/* EINGABE */

.input-panel {
  padding: 14px;
  margin-bottom: 18px;

  background: #171b1f;

  border: 1px solid #292f34;
  border-radius: 16px;
}

#taskInput {
  width: 100%;

  padding: 14px;
  margin-bottom: 10px;

  border: 1px solid #30373d;
  border-radius: 11px;

  outline: none;

  background: #0d1012;
  color: white;

  font-size: 16px;
}

#taskInput:focus,
.edit-input:focus,
.weight-input:focus {
  border-color: #7d8993;
}

#taskInput::placeholder {
  color: #626b72;
}

.option-row {
  display: flex;
  align-items: center;
  gap: 5px;

  margin-bottom: 7px;

  flex-wrap: wrap;
}

.option-label {
  min-width: 62px;

  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.7px;

  color: #69747b;
}

.option-button {
  min-height: 29px;

  padding: 4px 7px;

  border: 1px solid #30363b;
  border-radius: 8px;

  background: #101315;
  color: #d9dde0;

  font-size: 9px;
  font-weight: 800;

  cursor: pointer;

  opacity: 0.48;
}

.option-button.selected {
  opacity: 1;

  background: #20262a;
  border-color: #68747c;
}

.add-button {
  width: 100%;

  padding: 14px;
  margin-top: 4px;

  border: 0;
  border-radius: 11px;

  background: #e8ecef;
  color: #101214;

  font-size: 15px;
  font-weight: 900;

  cursor: pointer;
}

/* ZUSATZGEWICHT */

.weight-panel {
  padding: 13px;
  margin-bottom: 20px;

  background:
    linear-gradient(
      135deg,
      #1a1e21,
      #121618
    );

  border: 1px solid #343b40;
  border-radius: 15px;
}

.weight-panel.active {
  border-color: #6b7745;
}

.weight-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 10px;
}

.weight-title {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1.4px;

  color: #87949c;
}

.weight-edit-button {
  width: 30px;
  height: 30px;

  border: 1px solid #30363b;
  border-radius: 8px;

  background: #101315;
  color: #d1d6d9;

  cursor: pointer;
}

.weight-main {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  margin-top: 10px;
}

.weight-info {
  min-width: 0;
}

.weight-status {
  font-size: 12px;
  font-weight: 900;
}

.weight-status.on {
  color: #b5c474;
}

.weight-status.off {
  color: #727d84;
}

.weight-value {
  margin-top: 3px;

  font-size: 23px;
  font-weight: 900;
}

.weight-meta {
  margin-top: 4px;

  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.5px;

  color: #7895a8;
}

.weight-action-button {
  min-width: 108px;

  padding: 10px 11px;

  border: 1px solid #3e6047;
  border-radius: 9px;

  background: #111714;
  color: #d9e5dc;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}

.weight-action-button.remove {
  border-color: #74504d;

  background: #1c1313;
  color: #e2b1ac;
}

.weight-edit-area {
  margin-top: 12px;
  padding-top: 10px;

  border-top: 1px solid #292f34;
}

.weight-edit-row {
  display: flex;
  gap: 7px;
}

.weight-input {
  flex: 1;
  min-width: 0;

  padding: 10px;

  border: 1px solid #30373d;
  border-radius: 8px;

  outline: none;

  background: #0d1012;
  color: white;

  font-size: 15px;
}

.weight-save-button {
  padding: 9px 11px;

  border: 1px solid #485b66;
  border-radius: 8px;

  background: #162027;
  color: #d6e1e8;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}

/* SECTIONS */

.section {
  margin-bottom: 26px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 8px;

  margin: 0 3px 10px;
}

.section-title {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.6px;

  color: #8c969f;
}

.counter {
  flex-shrink: 0;

  padding: 5px 8px;

  border: 1px solid #30363b;
  border-radius: 20px;

  background: #15191c;

  font-size: 10px;
  color: #aab1b7;
}

/* TASK */

.task {
  display: flex;
  align-items: center;
  gap: 5px;

  min-height: 50px;

  padding: 8px;
  margin-bottom: 7px;

  background:
    linear-gradient(
      135deg,
      #1c2125,
      #14181b
    );

  border: 1px solid #292f34;
  border-radius: 13px;
}

.task.running {
  border-color: #55775f;
}

.task.paused {
  border-color: #776d36;
}

.task.completed {
  opacity: 0.56;
}

.task.aborted {
  opacity: 0.5;
}

.task.completed .task-text,
.task.aborted .task-text {
  text-decoration: line-through;
}

.task-number {
  width: 27px;
  flex-shrink: 0;

  text-align: center;

  font-size: 9px;
  font-weight: 900;

  color: #647887;
}

.status-symbol {
  width: 25px;
  flex-shrink: 0;

  text-align: center;

  font-size: 17px;
  line-height: 1;
}

.task-content {
  flex: 1;
  min-width: 0;
}

.task-main-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.task-text {
  flex: 1;
  min-width: 0;

  font-size: 15px;
  font-weight: 650;
  line-height: 1.25;

  word-break: break-word;
}

/* FLAGS */

.compact-flags {
  display: flex;
  gap: 3px;

  margin-top: 3px;
}

.mini-flag {
  font-size: 10px;
  line-height: 1;
}

/* META */

.task-meta {
  margin-top: 3px;

  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.45px;

  color: #4f8ec4;
}

.duration {
  margin-top: 2px;

  font-size: 8.5px;
  font-weight: 900;
  letter-spacing: 0.5px;

  color: #70a5cf;
}

.status-meta {
  margin-top: 3px;

  font-size: 8px;
  font-weight: 900;

  color: #b3a94f;
}

.abort-meta {
  margin-top: 3px;

  font-size: 7px;
  font-weight: 700;

  color: #ad6666;
}

/* ICONS */

button {
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.icon-actions {
  display: flex;
  align-items: center;
  gap: 4px;

  margin-top: 5px;
  flex-wrap: nowrap;
}

.icon-action {
  width: 31px;
  height: 31px;

  flex: 0 0 31px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 1px solid #30363b;
  border-radius: 8px;

  background: #101315;
  color: #d1d6d9;

  font-size: 13px;

  cursor: pointer;
}

.start-button {
  border-color: #3e6047;
}

.pause-button {
  border-color: #776d36;
}

.finish-button {
  border-color: #41604b;
}

.abort-button {
  border-color: #6b3f3f;
}

.today-button {
  border-color: #385e77;
}

.today-button.selected {
  background: #14232c;
  border-color: #4c7490;
}

.filter-today-action {
  margin-left: auto;
}

.repeat-button {
  width: 32px;
  height: 32px;

  flex-shrink: 0;

  border: 1px solid #30363b;
  border-radius: 8px;

  background: #0e1113;

  cursor: pointer;
}

/* HEUTE */

.today-summary {
  padding: 13px;
  margin-bottom: 14px;

  border: 1px solid #34414a;
  border-radius: 13px;

  background: #151b1f;
}

.today-progress {
  display: flex;
  justify-content: space-between;

  font-size: 11px;
  font-weight: 900;
}

.today-percentage {
  color: #91a8b7;
}

.today-progress-bar {
  height: 7px;

  margin-top: 9px;

  background: #252b2f;

  border-radius: 20px;
  overflow: hidden;
}

.today-progress-fill {
  height: 100%;

  background: #b8c3ca;
}

.next-task-panel {
  padding: 13px;
  margin-bottom: 18px;

  border: 1px solid #50738b;
  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #17242c,
      #11191e
    );
}

.next-task-label {
  margin-bottom: 9px;

  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.5px;

  color: #75acd0;
}

.next-task-content {
  display: flex;
  align-items: center;
  gap: 7px;
}

.next-task-number {
  font-size: 10px;
  font-weight: 900;

  color: #78909f;
}

.next-task-status {
  font-size: 19px;
}

.next-task-name {
  flex: 1;

  font-size: 17px;
  font-weight: 800;
}

.next-task-empty {
  font-size: 13px;

  color: #687780;
}

/* DRAG */

.drag-handle {
  width: 27px;
  min-height: 38px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid #30363b;
  border-radius: 8px;

  background: #0d1012;
  color: #74818a;

  font-size: 18px;

  cursor: grab;

  touch-action: none;
  user-select: none;
}

.dragging {
  opacity: 0.4;
}

.drag-target {
  border-color: #5d829e;
}

/* EDIT */

.edit-area {
  flex: 1;
}

.edit-input {
  width: 100%;

  padding: 10px;

  border: 1px solid #30373d;
  border-radius: 8px;

  background: #0d1012;
  color: white;

  font-size: 15px;
}

.edit-options {
  margin-top: 9px;
}

.edit-actions {
  display: flex;
  gap: 6px;

  margin-top: 9px;
}

.edit-button {
  flex: 1;

  padding: 8px;

  border: 1px solid #30363b;
  border-radius: 8px;

  background: #0e1113;
  color: #d8dde0;

  font-weight: 800;
}

/* EMPTY */

.empty-message {
  padding: 22px 16px;

  border: 1px dashed #30363b;
  border-radius: 13px;

  text-align: center;

  color: #626c73;

  font-size: 13px;
}

/* ARCHIV */

.archive-summary {
  padding: 14px;
  margin-bottom: 20px;

  background: #171b1f;

  border: 1px solid #30383e;
  border-radius: 14px;
}

.archive-summary-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;

  margin-top: 10px;
}

.archive-stat {
  padding: 9px;

  background: #111416;

  border: 1px solid #292f33;
  border-radius: 10px;
}

.archive-stat-label {
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .8px;

  color: #68757d;
}

.archive-stat-value {
  margin-top: 4px;

  font-size: 15px;
  font-weight: 900;
}

.archive-day {
  margin-bottom: 27px;
}

.archive-day-header {
  padding: 12px;
  margin-bottom: 9px;

  background:
    linear-gradient(
      135deg,
      #182027,
      #121719
    );

  border: 1px solid #34414a;
  border-radius: 13px;
}

.archive-day-title {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;

  color: #a8b5bd;
}

.archive-day-meta {
  margin-top: 5px;

  font-size: 9px;
  font-weight: 800;

  color: #71828d;
}

.archive-weight-box {
  margin-top: 9px;
  padding-top: 8px;

  border-top: 1px solid #2c353a;
}

.archive-weight-total {
  font-size: 9px;
  font-weight: 900;

  color: #a6b477;
}

.archive-weight-line {
  margin-top: 4px;

  font-size: 8px;

  color: #7e8b68;
}

.archive-task {
  opacity: .72;

  min-height: 38px;

  padding: 6px 7px;
  margin: 0 0 5px 8px;

  border-left: 3px solid #34414a;
  border-radius: 8px;

  background:
    linear-gradient(
      135deg,
      #171c1f,
      #111416
    );
}

.archive-task .archive-number {
  width: 43px;

  font-size: 9px;
}

.archive-task .status-symbol {
  width: 20px;

  font-size: 14px;
}

.archive-task .task-text {
  font-size: 13px;
  line-height: 1.15;
}

.archive-task .task-meta {
  margin-top: 2px;

  font-size: 6.5px;
}

.archive-task .duration {
  margin-top: 1px;

  font-size: 7.5px;
}

.archive-task-weight {
  flex-shrink: 0;

  margin-left: 5px;

  font-size: 11px;

  opacity: .78;
}

.archive-number {
  width: 48px;
  flex-shrink: 0;

  text-align: center;

  font-size: 10px;
  font-weight: 900;

  color: #8ba0ad;
}

/* DEV */

.dev-panel {
  margin-top: 30px;
  padding: 13px;

  border: 1px dashed #5d4545;
  border-radius: 13px;

  background: #171313;
}

.dev-title {
  margin-bottom: 8px;

  font-size: 9px;
  font-weight: 900;

  color: #b97e7e;
}

.dev-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.dev-button {
  flex: 1;
  min-width: 130px;

  padding: 9px;

  border: 1px solid #604545;
  border-radius: 8px;

  background: #211616;
  color: #c99c9c;

  font-size: 9px;
  font-weight: 900;
}

/* MODAL */

.modal-backdrop {
  position: fixed;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;

  background: rgba(0,0,0,.72);

  z-index: 1000;
}

.modal {
  width: 100%;
  max-width: 360px;

  padding: 22px;

  background: #191d20;

  border: 1px solid #343b40;
  border-radius: 18px;
}

.modal h2 {
  margin-top: 0;
}

.modal p {
  color: #9ba3a9;
}

.modal-actions {
  display: flex;
  gap: 10px;
}

.modal-button {
  flex: 1;

  padding: 12px;

  border: 0;
  border-radius: 10px;

  font-weight: 800;
}

.cancel-modal {
  background: #30363b;
  color: white;
}

.confirm-modal {
  background: #e8ecef;
  color: #101214;
}

.danger-modal {
  background: #7c3f3f;
  color: white;
}

</style>
</head>

<body>

<main class="app">

<header class="header">

<h1>MASTER OF DISASTER</h1>

<div class="eyebrow">
WEEK-AND-END-TO-DO-DINGSI
</div>

</header>


<div class="tabs-wrapper">

<nav class="tabs">

<button class="tab-button active" data-tab="all" onclick="switchTab('all')">
ALLE
</button>

<button class="tab-button" data-tab="today" onclick="switchTab('today')">
HEUTE
</button>

<button class="tab-button" data-tab="priority" onclick="switchTab('priority')">
PRIORITÄT
</button>

<button class="tab-button" data-tab="due" onclick="switchTab('due')">
FÄLLIG
</button>

<button class="tab-button" data-tab="active" onclick="switchTab('active')">
AKTIV
</button>

<button class="tab-button" data-tab="completed" onclick="switchTab('completed')">
ERLEDIGT
</button>

<button class="tab-button" data-tab="archive" onclick="switchTab('archive')">
ARCHIV
</button>

</nav>

</div>


<section class="input-panel" id="inputPanel">

<input
id="taskInput"
type="text"
placeholder="Was steht an?"
autocomplete="off"
>

<div class="option-row">

<span class="option-label">PRIORITÄT</span>

<button
id="newPriorityNormal"
class="option-button selected"
onclick="setNewPriority('normal')"
>
⚪ NORMAL
</button>

<button
id="newPriorityMedium"
class="option-button"
onclick="setNewPriority('medium')"
>
🟡 MITTEL
</button>

<button
id="newPriorityHigh"
class="option-button"
onclick="setNewPriority('high')"
>
🔴 HOCH
</button>

</div>


<div class="option-row">

<span class="option-label">OPTIONAL</span>

<button
id="newOptionalButton"
class="option-button"
onclick="toggleNewOptional()"
>
🟣 NEIN
</button>

</div>


<div class="option-row">

<span class="option-label">FÄLLIG</span>

<button
id="newDueNone"
class="option-button selected"
onclick="setNewDue('none')"
>
—
</button>

<button
id="newDueTomorrow"
class="option-button"
onclick="setNewDue('tomorrowOnly')"
>
💠 MORGEN
</button>

<button
id="newDueDeadline"
class="option-button"
onclick="setNewDue('deadline')"
>
🔷 BIS MORGEN
</button>

</div>


<button
class="add-button"
onclick="addTask()"
>
+ AUFGABE HINZUFÜGEN
</button>

</section>


<div id="weightContainer"></div>

<div id="viewContainer"></div>

</main>


<div id="modalContainer"></div>


<script>

/* ======================================
   DATEN
====================================== */

let tasks =
JSON.parse(
localStorage.getItem(
"masterOfDisasterTasks"
)
) || [];


let archive =
JSON.parse(
localStorage.getItem(
"masterOfDisasterArchive"
)
) || [];


let nextArchiveNumber =
Number(
localStorage.getItem(
"masterOfDisasterNextArchiveNumber"
)
) || 1;


let weightState =
JSON.parse(
localStorage.getItem(
"masterOfDisasterWeightState"
)
) || {

currentWeightKg: 12.3,

isWearing: false,

currentPhaseStartedAt: null,

currentPhaseWeightKg: null

};


let weightPhases =
JSON.parse(
localStorage.getItem(
"masterOfDisasterWeightPhases"
)
) || [];


let currentTab =
"all";

let editingTaskId =
null;

let editingWeight =
false;

let newTaskPriority =
"normal";

let newTaskOptional =
false;

let newTaskDueMode =
"none";

let dragState =
null;


/* ======================================
   MIGRATION
====================================== */

tasks =
tasks.map(task => {

if (!task.status) {

task.status =
task.completed
? "completed"
: "open";

}


const defaults = {

priority:
"normal",

optional:
false,

dueMode:
"none",

dueDate:
null,

todayDate:
null,

todayOrder:
null,

startedAt:
null,

pausedAt:
null,

pauseTotalMs:
0,

completedAt:
null,

activeDurationMs:
null,

abortedAt:
null,

abortedActiveDurationMs:
null,

activeSegments:
[]

};

Object.keys(
defaults
).forEach(key => {

if (
typeof task[key] ===
"undefined"
) {

task[key] =
defaults[key];

}

});


return task;

});


/* ======================================
   SPEICHERN
====================================== */

function saveTasks() {

localStorage.setItem(
"masterOfDisasterTasks",
JSON.stringify(tasks)
);

}


function saveArchive() {

localStorage.setItem(
"masterOfDisasterArchive",
JSON.stringify(archive)
);


localStorage.setItem(
"masterOfDisasterNextArchiveNumber",
String(
nextArchiveNumber
)
);

}


function saveWeight() {

localStorage.setItem(
"masterOfDisasterWeightState",

====================================== */

function getBerlinDateKey(
date = new Date()
) {

return new Intl
.DateTimeFormat(
"en-CA",
{
timeZone:
"Europe/Berlin",

year:
"numeric",

month:
"2-digit",

day:
"2-digit"
}
)
.format(date);

}


function getBerlinDateKeyFromISO(value) {

if (!value) {
return null;
}


const date =
new Date(value);


if (
Number.isNaN(
date.getTime()
)
) {

return null;

}


return getBerlinDateKey(
date
);

}


function addDays(
dateKey,
days
) {

const p =
dateKey
.split("-")
.map(Number);


const date =
new Date(
Date.UTC(
p[0],
p[1] - 1,
p[2] + days,
12
)
);


return (
date.getUTCFullYear() +
"-" +
String(
date.getUTCMonth() + 1
).padStart(2,"0") +
"-" +
String(
date.getUTCDate()
).padStart(2,"0")
);

}


function createTestISOForBerlinDate(
dateKey,
hour = 12,
minute = 0
) {

const p =
dateKey
.split("-")
.map(Number);


return new Date(
Date.UTC(
p[0],
p[1] - 1,
p[2],
hour,
minute,
0
)
).toISOString();

}

function escapeHtml(text) {

document.createElement(

);

function formatDuration(ms) {

if (
ms === null ||
typeof ms ===
"undefined"
) {

return "";

}


const total =
Math.floor(
ms / 1000
);


const h =
Math.floor(
total / 3600
);


const m =
Math.floor(
(total % 3600) /
60
);


const s =
total % 60;


return (
String(h).padStart(2,"0") +
":" +
String(m).padStart(2,"0") +
":" +
String(s).padStart(2,"0")
);

}


function formatWeight(value) {

return Number(value)
.toFixed(1)
.replace(
".",
","
);

}


function formatTimeOnly(value) {

if (!value) {
return "";
}


return new Date(value)
.toLocaleTimeString(
"de-DE",
{
timeZone:
"Europe/Berlin",

hour:
"2-digit",

minute:
"2-digit",

second:
"2-digit"
}
) +
" UHR";

}


function formatDateTime(
value,
label
) {

if (!value) {
return "";
}


const date =
new Date(value);


return (
label +
" · " +
date.toLocaleDateString(
"de-DE",
{
timeZone:
"Europe/Berlin"
}
) +
" · " +
date.toLocaleTimeString(
"de-DE",
{
timeZone:
"Europe/Berlin",

hour:
"2-digit",

minute:
"2-digit",

second:
"2-digit"
}
) +
" UHR"
);

}


function formatArchiveDate(dateKey) {

if (!dateKey) {
return "UNBEKANNT";
}


const p =
dateKey.split("-");


return (
p[2] +
"." +
p[1] +
"." +
p[0]
);

function formatArchiveDayHeading(
dateKey
) {

if (!dateKey) {
return "DATUM UNBEKANNT";
}


const p =
dateKey
.split("-")
.map(Number);


const date =
new Date(
Date.UTC(
p[0],
p[1] - 1,
p[2],
12
)
);


const weekday =
new Intl.DateTimeFormat(
"de-DE",
{
weekday:
"long",

}
)

function processDayTransition() {

const today =
getBerlinDateKey();


let changed =
false;


const remaining =
[];


tasks.forEach(
task => {

if (
task.status ===
"completed"
) {

const completedDate =
getBerlinDateKeyFromISO(
task.completedAt
);


if (
completedDate &&
completedDate < today
) {

archiveCompletedTask(
task
);

changed =
true;

return;

}

}


if (
task.todayDate &&
task.todayDate < today
) {

task.todayDate =
null;

task.todayOrder =
null;

changed =
true;

}


remaining.push(
task
);

}
);


if (changed) {

tasks =
remaining;


normalizeTodayOrder();


saveAll();

}


return changed;

}

const today =

null;

null;

} else {

tasks.filter(

todays.reduce(

),

today;

highest + 1;

task.todayDate ===

![

"aborted"
].includes(
task.status
)
)
.sort(
(a,b) =>
(a.todayOrder || 0) -
(b.todayOrder || 0)
);


selected.forEach(
(task,index) => {

task.todayOrder =
index + 1;

}
);

}

function reorderToday(
draggedId,
targetId
) {

const today =
getBerlinDateKey();


const selected =
tasks
.filter(
task =>
task.todayDate ===
today &&
![
"completed",
"aborted"
].includes(
task.status
)
)
.sort(
(a,b) =>
(a.todayOrder || 0) -
(b.todayOrder || 0)
);


const from =
selected.findIndex(
task =>
task.id ===
draggedId
);


const to =
selected.findIndex(
task =>
task.id ===
targetId
);


if (
from === -1 ||
to === -1
) {
return;
}


const [moved] =
selected.splice(
from,
1
);


selected.splice(
to,
0,
moved
);


selected.forEach(
(task,index) => {

task.todayOrder =
index + 1;

}
);


saveTasks();

render();

}

function pauseTask(id) {

const task =
getTask(id);


if (!task) {
return;
}


task.status =
"paused";

task.pausedAt =
new Date()
.toISOString();


if (
Array.isArray(
task.activeSegments
) &&
task.activeSegments.length
) {

const segment =
task.activeSegments[
task.activeSegments.length - 1
];


if (
segment &&
!segment.endedAt
) {

segment.endedAt =
task.pausedAt;

}

}


saveTasks();

render();

}


function resumeTask(id) {

const task =
getTask(id);


if (!task) {
return;
}


const now =
Date.now();


task.pauseTotalMs +=
Math.max(
0,
now -
new Date(
task.pausedAt
).getTime()
);


task.pausedAt =
null;

task.status =
"running";


if (
!Array.isArray(
task.activeSegments
)
) {

task.activeSegments =
[];

}


task.activeSegments.push({

startedAt:
new Date(now)
.toISOString(),

endedAt:
null

});


saveTasks();
  
render();

}


function calculateActiveDuration(
task,
end
) {

if (!task.startedAt) {
return 0;
}


let pause =
task.pauseTotalMs || 0;


if (
task.status ===
"paused" &&
task.pausedAt
) {

pause +=
Math.max(
0,
end -
new Date(
task.pausedAt
).getTime()
);

}


return Math.max(
0,
end -
new Date(
task.startedAt
).getTime() -
pause
);

}


function liveDuration(task) {

return calculateActiveDuration(
task,
Date.now()
);

}


function finishTask(id) {

const task =
getTask(id);


if (!task) {
return;
}


const now =
Date.now();


task.activeDurationMs =
calculateActiveDuration(
task,
now
);


task.status =
"completed";

task.completedAt =
new Date(now)
.toISOString();


if (
Array.isArray(
task.activeSegments
) &&
task.activeSegments.length
) {

const segment =
task.activeSegments[
task.activeSegments.length - 1
];


if (
segment &&
!segment.endedAt
) {

segment.endedAt =
task.completedAt;

}

}


task.pausedAt =
null;


normalizeTodayOrder();

saveTasks();

render();

}

/* ======================================
   SYMBOLE
====================================== */

function prioritySymbol(priority) {

if (
priority ===
"high"
) {
return "🔴";
}


if (
priority ===
"medium"
) {
return "🟡";
}


return "⚪";

}


function statusSymbol(task) {

if (
task.status ===
"completed"
) {
return "✅";
}


if (
task.status ===
"aborted"
) {
return "❌";
}


if (
task.status ===
"running"
) {
return "▶️";
}


if (
task.status ===
"paused"
) {
return "⏸️";
}


return "⬜";

}


function dueSymbol(task) {

if (
!task.dueDate ||
task.dueMode ===
"none"
) {
return "";
}


if (
task.dueMode ===
"tomorrowOnly"
) {
return "💠";
}


return (
task.dueDate <=
getBerlinDateKey()
? "⚠️"
: "🔷"
);

}


function flags(task) {

return `

<div class="compact-flags">

<span class="mini-flag">
${prioritySymbol(
task.priority
)}
</span>

${
task.optional
? "<span class='mini-flag'>🟣</span>"
: ""
}

${
dueSymbol(task)
? "<span class='mini-flag'>" +
dueSymbol(task) +
"</span>"
: ""
}

</div>
`;

}


function dynamicNumber(task) {

const index =
tasks.findIndex(
item =>
item.id ===
task.id
);


const number =
index + 1;


return number < 10
? "0" + number
: number;

}

document.createElement(
"div"
);


empty.className =
"empty-message";

options.empty ||

);

task => {

taskCard(
task,
options.cardOptions || {}
)
);

}
);


return wrapper;

}

function renderToday(container) {

getBerlinDateKey();


const all =
tasks.filter(
task =>
task.todayDate ===

);

all
.filter(
task =>
[
"open",
"running",
"paused"
].includes(
task.status
)
)
.sort(
(a,b) =>
(a.todayOrder || 0) -
(b.todayOrder || 0)
);


const completed =
all
.filter(
task =>
task.status ===
"completed"
)
.sort(
(a,b) =>
new Date(
b.completedAt
) -
new Date(
a.completedAt
)
);


const total =
active.length +
completed.length;


const percent =
total
? Math.round(
completed.length /
total *
100
)
: 0;

"div"
);

"today-summary";


summary.innerHTML = `

</div>

"running"
);

  function resetYesterdayTestDay() {

const yesterday =
addDays(
getBerlinDateKey(),
-1
);


/*
  AKTIVE, NOCH NICHT ARCHIVIERTE
  ARCHIVTEST-AUFGABEN LÖSCHEN
*/

tasks =
tasks.filter(
task => {

const taskDate =
getBerlinDateKeyFromISO(
task.completedAt
);


const isTestTask =
String(
task.text || ""
).startsWith(
"ARCHIVTEST"
);


return !(
isTestTask &&
taskDate === yesterday
);

}
);


/*
  ARCHIVIERTE TESTAUFGABEN
  VON GESTERN LÖSCHEN
*/

archive =
archive.filter(
item => {

const isTestTask =
String(
item.text || ""
).startsWith(
"ARCHIVTEST"
);


return !(
isTestTask &&
item.completedDate === yesterday
);

}
);


/*
  ALLE GEWICHTS-TESTPHASEN
  VON GESTERN LÖSCHEN

  Das ist nur unser DEV-Testknopf.
*/

weightPhases.filter(
phase =>
phase.date !== yesterday
);

  AUF DEN TATSÄCHLICHEN BESTAND
  ZURÜCKSETZEN.

  NUR FÜR DIE TESTPHASE!
*/

const highestArchiveNumber =
archive.reduce(
(max,item) =>
Math.max(
max,
Number(
item.archiveNumber
) || 0
),
0
);

}
