<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">

  <title>Master of Disaster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #15191d 0%,
          #0b0d0f 45%,
          #070809 100%
        );

      color: #f3f3f3;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin: 10px 0 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .eyebrow {
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #8c969f;
    }

    .title-bottom {
      margin-top: 10px;
      margin-bottom: 0;
      letter-spacing: 2.5px;
    }

    /* NEUE AUFGABE */

    .input-panel {
      padding: 14px;
      margin-bottom: 26px;

      background: #171b1f;
      border: 1px solid #292f34;
      border-radius: 18px;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.28);
    }

    #taskInput {
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;

      border: 1px solid #30373d;
      border-radius: 12px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 17px;
    }

    #taskInput:focus,
    .edit-input:focus {
      border-color: #7d8993;
    }

    #taskInput::placeholder {
      color: #626b72;
    }

    .new-task-options {
      padding: 10px 0 4px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 6px;

      margin-bottom: 8px;

      flex-wrap: wrap;
    }

    .option-label {
      min-width: 65px;

      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.8px;

      color: #69747b;
    }

    .option-button {
      min-height: 30px;

      padding: 4px 7px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #101315;
      color: #d9dde0;

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;

      opacity: 0.5;
    }

    .option-button.selected {
      opacity: 1;
      border-color: #68747c;
      background: #20262a;
    }

    .option-button:active {
      transform: scale(0.95);
    }

    .add-button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #e8ecef;
      color: #101214;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    /* BEREICHE */

    .task-section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 0 4px 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #8c969f;
    }

    .counter {
      padding: 5px 9px;

      border: 1px solid #30363b;
      border-radius: 20px;

      background: #15191c;

      font-size: 12px;
      color: #aab1b7;
    }

    /* AUFGABEN */

    .task {
      display: flex;
      align-items: flex-start;
      gap: 7px;

      min-height: 58px;

      padding: 10px;
      margin-bottom: 8px;

      background:
        linear-gradient(
          135deg,
          #1c2125,
          #14181b
        );

      border: 1px solid #292f34;
      border-radius: 14px;

      box-shadow:
        0 7px 18px rgba(0,0,0,0.16);
    }

    .task.running {
      border-color: #928832;
    }

    .task.paused {
      border-color: #695f32;
    }

    .task.completed {
      opacity: 0.55;
    }

    .task.aborted {
      opacity: 0.5;
    }

    .task.completed .task-text,
    .task.aborted .task-text {
      text-decoration: line-through;
    }

    .task-number {
      width: 28px;
      flex-shrink: 0;

      padding-top: 3px;

      text-align: center;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;

      color: #647887;
    }

    .status-symbol {
      width: 24px;
      flex-shrink: 0;

      text-align: center;

      font-size: 18px;
      line-height: 1.1;

      user-select: none;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;

      word-break: break-word;
    }

    /* KOMPAKTE FLAGS */

    .compact-flags {
      display: flex;
      gap: 5px;

      margin-top: 5px;

      flex-wrap: wrap;
    }

    .mini-flag {
      font-size: 12px;
      line-height: 1;
    }

    /* META */

    .task-meta {
      margin-top: 4px;

      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.6px;

      color: #4f8ec4;
    }

    .status-meta {
      margin-top: 4px;

      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.6px;

      color: #b3a94f;
    }

    .paused-meta {
      color: #9e8d50;
    }

    .abort-meta {
      margin-top: 4px;

      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.6px;

      color: #a96666;
    }

    .duration {
      margin-top: 3px;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.7px;

      color: #70a5cf;
    }

    .aborted-duration {
      color: #ba7777;
    }

    /* AKTIONEN */

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .task-actions {
      display: flex;
      gap: 5px;

      margin-top: 8px;

      flex-wrap: wrap;
    }

    .task-action-text {
      flex: 1;

      min-width: 75px;

      padding: 7px 8px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #101315;
      color: #d1d6d9;

      font-size: 9px;
      font-weight: 800;

      cursor: pointer;
    }

    .start-button {
      border-color: #3e6047;
    }

    .pause-button {
      border-color: #776d36;
    }

    .finish-button {
      border-color: #41604b;
    }

    .abort-button {
      border-color: #6b3f3f;
    }

    .repeat-button {
      width: 36px;
      height: 36px;

      flex-shrink: 0;

      border: 1px solid #30363b;
      border-radius: 10px;

      background: #0e1113;

      font-size: 15px;

      cursor: pointer;
    }

    /* BEARBEITEN */

    .edit-area {
      flex: 1;
      min-width: 0;
    }

    .edit-input {
      width: 100%;
      padding: 11px;

      border: 1px solid #30373d;
      border-radius: 9px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 16px;
    }

    .edit-options {
      margin-top: 10px;

      padding-top: 8px;

      border-top: 1px solid #292f34;
    }

    .edit-actions {
      display: flex;
      gap: 7px;

      margin-top: 10px;
    }

    .edit-button {
      flex: 1;

      padding: 9px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #0e1113;
      color: #d8dde0;

      font-weight: 700;

      cursor: pointer;
    }

    /* LEERE BEREICHE */

    .empty-message {
      padding: 22px 18px;

      border: 1px dashed #30363b;
      border-radius: 14px;

      text-align: center;

      color: #626c73;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0,0,0,0.72);

      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 360px;

      padding: 22px;

      background: #191d20;

      border: 1px solid #343b40;
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.6);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .modal p {
      margin: 0 0 20px;
      color: #9ba3a9;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-button {
      flex: 1;

      padding: 12px;

      border: 0;
      border-radius: 10px;

      font-weight: 800;

      cursor: pointer;
    }

    .cancel-modal {
      background: #30363b;
      color: white;
    }

    .confirm-modal {
      background: #e8ecef;
      color: #101214;
    }

    .danger-modal {
      background: #7c3f3f;
      color: white;
    }

    @media (max-width: 390px) {

      body {
        padding-left: 11px;
        padding-right: 11px;
      }

      .task {
        gap: 4px;
        padding: 9px 8px;
      }

      .task-number {
        width: 24px;
        font-size: 9px;
      }

      .status-symbol {
        width: 22px;
        font-size: 17px;
      }

      .task-text {
        font-size: 15px;
      }

      .task-action-text {
        min-width: 67px;
        font-size: 8px;
      }

      .option-button {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <h1>
        MASTER OF DISASTER
      </h1>

      <div class="eyebrow title-bottom">
        WEEK-AND-END-TO-DO-DINGSI
      </div>

    </header>


    <section class="input-panel">

      <input
        type="text"
        id="taskInput"
        placeholder="Was steht an?"
        autocomplete="off"
      >


      <div class="new-task-options">

        <div class="option-row">

          <span class="option-label">
            PRIORITÄT
          </span>

          <button
            id="newPriorityNormal"
            class="option-button selected"
            onclick="setNewPriority('normal')"
          >
            ⚪ NORMAL
          </button>

          <button
            id="newPriorityMedium"
            class="option-button"
            onclick="setNewPriority('medium')"
          >
            🟡 MITTEL
          </button>

          <button
            id="newPriorityHigh"
            class="option-button"
            onclick="setNewPriority('high')"
          >
            🔴 HOCH
          </button>

        </div>


        <div class="option-row">

          <span class="option-label">
            OPTIONAL
          </span>

          <button
            id="newOptionalButton"
            class="option-button"
            onclick="toggleNewOptional()"
          >
            🟣 NEIN
          </button>

        </div>


        <div class="option-row">

          <span class="option-label">
            FÄLLIG
          </span>

          <button
            id="newDueNone"
            class="option-button selected"
            onclick="setNewDue('none')"
          >
            —
          </button>

          <button
            id="newDueTomorrow"
            class="option-button"
            onclick="setNewDue('tomorrowOnly')"
          >
            💠 MORGEN
          </button>

          <button
            id="newDueDeadline"
            class="option-button"
            onclick="setNewDue('deadline')"
          >
            🔷 BIS MORGEN
          </button>

        </div>

      </div>


      <button
        class="add-button"
        onclick="addTask()"
      >
        + AUFGABE HINZUFÜGEN
      </button>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          OFFENE UND LAUFENDE AUFGABEN
        </div>

        <div
          class="counter"
          id="activeCounter"
        >
          0 aktiv
        </div>

      </div>

      <div id="activeTaskList"></div>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          ERLEDIGT
        </div>

        <div
          class="counter"
          id="completedCounter"
        >
          0 erledigt
        </div>

      </div>

      <div id="completedTaskList"></div>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          ABGEBROCHEN
        </div>

        <div
          class="counter"
          id="abortedCounter"
        >
          0 abgebrochen
        </div>

      </div>

      <div id="abortedTaskList"></div>

    </section>

  </main>


  <div id="modalContainer"></div>


  <script>

    let tasks =
      JSON.parse(
        localStorage.getItem(
          "masterOfDisasterTasks"
        )
      ) || [];

    let editingTaskId = null;


    /*
      AUSWAHL FÜR NEUE AUFGABE
    */

    let newTaskPriority =
      "normal";

    let newTaskOptional =
      false;

    let newTaskDueMode =
      "none";


    /*
      MIGRATION
    */

    tasks = tasks.map(task => {

      if (!task.status) {

        task.status =
          task.completed === true
            ? "completed"
            : "open";

      }


      const defaults = {

        priority: "normal",

        optional: false,

        dueMode: "none",
        dueDate: null,

        startedAt: null,
        pausedAt: null,
        pauseTotalMs: 0,

        completedAt: null,
        activeDurationMs: null,

        abortedAt: null,
        abortedActiveDurationMs: null
      };


      Object.keys(defaults)
        .forEach(key => {

          if (
            typeof task[key] ===
            "undefined"
          ) {

            task[key] =
              defaults[key];

          }

        });


      return task;

    });


    /*
      DATUM BERLIN
    */

    function getBerlinDateKey() {

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone:
            "Europe/Berlin",

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit"
        }
      ).format(
        new Date()
      );

    }


    function addDaysToDateKey(
      dateKey,
      days
    ) {

      const parts =
        dateKey
          .split("-")
          .map(Number);


      const date =
        new Date(
          Date.UTC(
            parts[0],
            parts[1] - 1,
            parts[2] + days,
            12
          )
        );


      return (
        date.getUTCFullYear() +
        "-" +
        String(
          date.getUTCMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
          date.getUTCDate()
        ).padStart(2,"0")
      );

    }


    /*
      AUTOMATISCHE DATUMSREGELN
    */

    function applyAutomaticDateRules() {

      const today =
        getBerlinDateKey();

      let changed =
        false;


      tasks.forEach(task => {

        if (
          task.status === "completed" ||
          task.status === "aborted"
        ) {
          return;
        }


        if (
          task.dueMode ===
            "tomorrowOnly" &&
          task.dueDate &&
          task.dueDate <= today
        ) {

          task.dueMode =
            "none";

          task.dueDate =
            null;

          changed =
            true;

        }

      });


      if (changed) {
        saveTasks();
      }

    }


    /*
      SPEICHERN
    */

    function saveTasks() {

      localStorage.setItem(
        "masterOfDisasterTasks",
        JSON.stringify(tasks)
      );

    }


    function getTask(id) {

      return tasks.find(
        task => task.id === id
      );

    }


    /*
      NEUE-AUFGABE-OPTIONEN
    */

    function setNewPriority(
      priority
    ) {

      newTaskPriority =
        priority;

      updateNewTaskOptions();

    }


    function toggleNewOptional() {

      newTaskOptional =
        !newTaskOptional;

      updateNewTaskOptions();

    }


    function setNewDue(
      mode
    ) {

      newTaskDueMode =
        mode;

      updateNewTaskOptions();

    }


    function updateNewTaskOptions() {

      document
        .querySelectorAll(
          "#newPriorityNormal, #newPriorityMedium, #newPriorityHigh"
        )
        .forEach(
          button =>
            button.classList.remove(
              "selected"
            )
        );


      if (
        newTaskPriority ===
        "normal"
      ) {

        document
          .getElementById(
            "newPriorityNormal"
          )
          .classList.add(
            "selected"
          );

      }


      if (
        newTaskPriority ===
        "medium"
      ) {

        document
          .getElementById(
            "newPriorityMedium"
          )
          .classList.add(
            "selected"
          );

      }


      if (
        newTaskPriority ===
        "high"
      ) {

        document
          .getElementById(
            "newPriorityHigh"
          )
          .classList.add(
            "selected"
          );

      }


      const optionalButton =
        document.getElementById(
          "newOptionalButton"
        );


      optionalButton.classList.toggle(
        "selected",
        newTaskOptional
      );


      optionalButton.textContent =
        newTaskOptional
          ? "🟣 JA"
          : "🟣 NEIN";


      document
        .querySelectorAll(
          "#newDueNone, #newDueTomorrow, #newDueDeadline"
        )
        .forEach(
          button =>
            button.classList.remove(
              "selected"
            )
        );


      if (
        newTaskDueMode ===
        "none"
      ) {

        document
          .getElementById(
            "newDueNone"
          )
          .classList.add(
            "selected"
          );

      }


      if (
        newTaskDueMode ===
        "tomorrowOnly"
      ) {

        document
          .getElementById(
            "newDueTomorrow"
          )
          .classList.add(
            "selected"
          );

      }


      if (
        newTaskDueMode ===
        "deadline"
      ) {

        document
          .getElementById(
            "newDueDeadline"
          )
          .classList.add(
            "selected"
          );

      }

    }


    function resetNewTaskOptions() {

      newTaskPriority =
        "normal";

      newTaskOptional =
        false;

      newTaskDueMode =
        "none";


      updateNewTaskOptions();

    }


    /*
      AUFGABE HINZUFÜGEN
    */

    function addTask() {

      const input =
        document.getElementById(
          "taskInput"
        );


      const text =
        input.value.trim();


      if (text === "") {
        return;
      }


      const today =
        getBerlinDateKey();


      const tomorrow =
        addDaysToDateKey(
          today,
          1
        );


      let dueDate =
        null;


      if (
        newTaskDueMode ===
          "tomorrowOnly" ||
        newTaskDueMode ===
          "deadline"
      ) {

        dueDate =
          tomorrow;

      }


      tasks.push({

        id:
          Date.now(),

        text:
          text,

        status:
          "open",

        priority:
          newTaskPriority,

        optional:
          newTaskOptional,

        dueMode:
          newTaskDueMode,

        dueDate:
          dueDate,

        startedAt:
          null,

        pausedAt:
          null,

        pauseTotalMs:
          0,

        completedAt:
          null,

        activeDurationMs:
          null,

        abortedAt:
          null,

        abortedActiveDurationMs:
          null

      });


      input.value =
        "";


      resetNewTaskOptions();

      saveTasks();

      renderTasks();

    }


    /*
      PRIORITÄT / OPTIONAL / FÄLLIGKEIT
    */

    function setPriority(
      id,
      priority
    ) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      task.priority =
        priority;


      saveTasks();

      renderTasks();

    }


    function toggleOptional(id) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      task.optional =
        !task.optional;


      saveTasks();

      renderTasks();

    }


    function setDueMode(
      id,
      mode
    ) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      const today =
        getBerlinDateKey();


      const tomorrow =
        addDaysToDateKey(
          today,
          1
        );


      task.dueMode =
        mode;


      if (
        mode === "none"
      ) {

        task.dueDate =
          null;

      } else {

        task.dueDate =
          tomorrow;

      }


      saveTasks();

      renderTasks();

    }


    /*
      SYMBOLE
    */

    function getPrioritySymbol(
      priority
    ) {

      if (
        priority === "medium"
      ) {
        return "🟡";
      }


      if (
        priority === "high"
      ) {
        return "🔴";
      }


      return "⚪";

    }


    function getDueSymbol(task) {

      if (
        !task.dueMode ||
        task.dueMode === "none" ||
        !task.dueDate
      ) {
        return "";
      }


      const today =
        getBerlinDateKey();


      if (
        task.dueMode ===
        "tomorrowOnly"
      ) {
        return "💠";
      }


      if (
        task.dueMode ===
        "deadline"
      ) {

        if (
          task.dueDate <= today
        ) {
          return "⚠️";
        }


        return "🔷";

      }


      return "";

    }


    function createCompactFlags(task) {

      const due =
        getDueSymbol(task);


      return `

        <div class="compact-flags">

          <span class="mini-flag">
            ${getPrioritySymbol(
              task.priority
            )}
          </span>

          ${
            task.optional
              ? `
                <span class="mini-flag">
                  🟣
                </span>
              `
              : ""
          }

          ${
            due
              ? `
                <span class="mini-flag">
                  ${due}
                </span>
              `
              : ""
          }

        </div>
      `;

    }


    /*
      BEARBEITUNGSOPTIONEN
    */

    function createEditOptions(
      task
    ) {

      return `

        <div class="edit-options">

          <div class="option-row">

            <span class="option-label">
              PRIORITÄT
            </span>

            <button
              class="option-button
              ${
                task.priority === "normal"
                  ? "selected"
                  : ""
              }"
              onclick="setPriority(
                ${task.id},
                'normal'
              )"
            >
              ⚪ NORMAL
            </button>

            <button
              class="option-button
              ${
                task.priority === "medium"
                  ? "selected"
                  : ""
              }"
              onclick="setPriority(
                ${task.id},
                'medium'
              )"
            >
              🟡 MITTEL
            </button>

            <button
              class="option-button
              ${
                task.priority === "high"
                  ? "selected"
                  : ""
              }"
              onclick="setPriority(
                ${task.id},
                'high'
              )"
            >
              🔴 HOCH
            </button>

          </div>


          <div class="option-row">

            <span class="option-label">
              OPTIONAL
            </span>

            <button
              class="option-button
              ${
                task.optional
                  ? "selected"
                  : ""
              }"
              onclick="toggleOptional(
                ${task.id}
              )"
            >
              🟣
              ${
                task.optional
                  ? "JA"
                  : "NEIN"
              }
            </button>

          </div>


          <div class="option-row">

            <span class="option-label">
              FÄLLIG
            </span>

            <button
              class="option-button
              ${
                task.dueMode === "none"
                  ? "selected"
                  : ""
              }"
              onclick="setDueMode(
                ${task.id},
                'none'
              )"
            >
              —
            </button>

            <button
              class="option-button
              ${
                task.dueMode ===
                  "tomorrowOnly"
                  ? "selected"
                  : ""
              }"
              onclick="setDueMode(
                ${task.id},
                'tomorrowOnly'
              )"
            >
              💠 MORGEN
            </button>

            <button
              class="option-button
              ${
                task.dueMode ===
                  "deadline"
                  ? "selected"
                  : ""
              }"
              onclick="setDueMode(
                ${task.id},
                'deadline'
              )"
            >
              🔷 BIS MORGEN
            </button>

          </div>

        </div>
      `;

    }


    /*
      START / PAUSE / FORTSETZEN
    */

    function startTask(id) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      const running =
        tasks.find(
          item =>
            item.status === "running" &&
            item.id !== id
        );


      if (running) {

        showInfoModal(
          "Schon eine Aufgabe aktiv",
          "Aktuell läuft bereits „" +
          running.text +
          "“. Pausiere oder beende sie zuerst."
        );

        return;

      }


      task.status =
        "running";

      task.startedAt =
        new Date()
          .toISOString();

      task.pausedAt =
        null;

      task.pauseTotalMs =
        0;


      saveTasks();

      renderTasks();

    }


    function pauseTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status !== "running"
      ) {
        return;
      }


      task.status =
        "paused";

      task.pausedAt =
        new Date()
          .toISOString();


      saveTasks();

      renderTasks();

    }


    function resumeTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status !== "paused"
      ) {
        return;
      }


      const running =
        tasks.find(
          item =>
            item.status === "running" &&
            item.id !== id
        );


      if (running) {

        showInfoModal(
          "Schon eine Aufgabe aktiv",
          "Aktuell läuft bereits „" +
          running.text +
          "“. Pausiere oder beende sie zuerst."
        );

        return;

      }


      const now =
        Date.now();


      const pauseStart =
        task.pausedAt
          ? new Date(
              task.pausedAt
            ).getTime()
          : now;


      task.pauseTotalMs +=
        Math.max(
          0,
          now - pauseStart
        );


      task.pausedAt =
        null;

      task.status =
        "running";


      saveTasks();

      renderTasks();

    }


    /*
      BEENDEN
    */

    function finishTask(id) {

      const task =
        getTask(id);


      if (
        !task ||
        (
          task.status !== "running" &&
          task.status !== "paused"
        )
      ) {
        return;
      }


      const now =
        Date.now();


      const duration =
        calculateActiveDuration(
          task,
          now
        );


      if (
        task.status === "paused" &&
        task.pausedAt
      ) {

        task.pauseTotalMs +=
          Math.max(
            0,
            now -
            new Date(
              task.pausedAt
            ).getTime()
          );

      }


      task.status =
        "completed";

      task.pausedAt =
        null;

      task.completedAt =
        new Date(now)
          .toISOString();

      task.activeDurationMs =
        duration;


      editingTaskId =
        null;


      saveTasks();

      renderTasks();

    }


    /*
      ABBRECHEN
    */

    function askAbort(id) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      const container =
        document.getElementById(
          "modalContainer"
        );


      container.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeModalOnBackdrop(event)"
        >

          <div class="modal">

            <h2>
              Aufgabe abbrechen?
            </h2>

            <p>
              „${escapeHtml(task.text)}“
              wird als abgebrochen markiert.
            </p>

            <div class="modal-actions">

              <button
                class="modal-button cancel-modal"
                onclick="closeModal()"
              >
                Zurück
              </button>

              <button
                class="modal-button danger-modal"
                onclick="abortTask(${id})"
              >
                Abbrechen
              </button>

            </div>

          </div>

        </div>
      `;

    }


    function abortTask(id) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      const now =
        Date.now();


      if (task.startedAt) {

        task.abortedActiveDurationMs =
          calculateActiveDuration(
            task,
            now
          );

      } else {

        task.abortedActiveDurationMs =
          null;

      }


      task.status =
        "aborted";

      task.abortedAt =
        new Date(now)
          .toISOString();

      task.pausedAt =
        null;


      editingTaskId =
        null;


      saveTasks();

      closeModal();

      renderTasks();

    }


    /*
      ZEIT
    */

    function calculateActiveDuration(
      task,
      endTime
    ) {

      if (!task.startedAt) {
        return 0;
      }


      const started =
        new Date(
          task.startedAt
        ).getTime();


      let pauseTotal =
        task.pauseTotalMs || 0;


      if (
        task.status === "paused" &&
        task.pausedAt
      ) {

        pauseTotal +=
          Math.max(
            0,
            endTime -
            new Date(
              task.pausedAt
            ).getTime()
          );

      }


      return Math.max(
        0,
        endTime -
        started -
        pauseTotal
      );

    }


    function getCurrentActiveDuration(
      task
    ) {

      return calculateActiveDuration(
        task,
        Date.now()
      );

    }


    /*
      WIEDERHOLEN
    */

    function repeatTask(id) {

      const oldTask =
        getTask(id);


      if (!oldTask) {
        return;
      }


      tasks.push({

        id:
          Date.now(),

        text:
          oldTask.text,

        status:
          "open",

        priority:
          oldTask.priority ||
          "normal",

        optional:
          oldTask.optional ||
          false,

        dueMode:
          "none",

        dueDate:
          null,

        startedAt:
          null,

        pausedAt:
          null,

        pauseTotalMs:
          0,

        completedAt:
          null,

        activeDurationMs:
          null,

        abortedAt:
          null,

        abortedActiveDurationMs:
          null

      });


      saveTasks();

      renderTasks();

    }


    /*
      BEARBEITEN
    */

    function startEditing(id) {

      const task =
        getTask(id);


      if (
        !task ||
        task.status === "completed" ||
        task.status === "aborted"
      ) {
        return;
      }


      editingTaskId =
        id;


      renderTasks();


      setTimeout(() => {

        const input =
          document.getElementById(
            "edit-" + id
          );


        if (input) {

          input.focus();

          input.setSelectionRange(
            input.value.length,
            input.value.length
          );

        }

      },0);

    }


    function cancelEditing() {

      editingTaskId =
        null;

      renderTasks();

    }


    function saveEdit(id) {

      const task =
        getTask(id);


      const input =
        document.getElementById(
          "edit-" + id
        );


      if (
        !task ||
        !input
      ) {
        return;
      }


      const text =
        input.value.trim();


      if (text === "") {
        return;
      }


      task.text =
        text;


      editingTaskId =
        null;


      saveTasks();

      renderTasks();

    }


    /*
      LÖSCHEN
    */

    function askDelete(id) {

      const task =
        getTask(id);


      if (!task) {
        return;
      }


      const container =
        document.getElementById(
          "modalContainer"
        );


      container.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeModalOnBackdrop(event)"
        >

          <div class="modal">

            <h2>
              Aufgabe löschen?
            </h2>

            <p>
              „${escapeHtml(task.text)}“
              wird endgültig gelöscht.
            </p>

            <div class="modal-actions">

              <button
                class="modal-button cancel-modal"
                onclick="closeModal()"
              >
                Abbrechen
              </button>

              <button
                class="modal-button danger-modal"
                onclick="deleteTask(${id})"
              >
                Löschen
              </button>

            </div>

          </div>

        </div>
      `;

    }


    function deleteTask(id) {

      tasks =
        tasks.filter(
          task =>
            task.id !== id
        );


      saveTasks();

      closeModal();

      renderTasks();

    }


    /*
      MODAL
    */

    function closeModal() {

      document.getElementById(
        "modalContainer"
      ).innerHTML =
        "";

    }


    function closeModalOnBackdrop(
      event
    ) {

      if (
        event.target.classList.contains(
          "modal-backdrop"
        )
      ) {

        closeModal();

      }

    }


    function showInfoModal(
      title,
      text
    ) {

      const container =
        document.getElementById(
          "modalContainer"
        );


      container.innerHTML = `

        <div
          class="modal-backdrop"

        >

          <div class="modal">

            <h2>

            </h2>

            <p>

    /*
      ESCAPE
    */

    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


    /*
      NUMMERIERUNG
    */

    function formatTaskNumber(
      number
    ) {

      return number < 10
        ? "0" + number
        : String(number);

    }


    function getDynamicTaskNumber(
      task
    ) {

      const index =
        tasks.findIndex(
          item =>
            item.id === task.id
        );


      return index === -1
        ? ""
        : formatTaskNumber(
            index + 1
          );

    }


    /*
      ZEITANZEIGE
    */

    function formatDateTime(
      value,
      label
    ) {

      if (!value) {
        return "";
      }


      const date =
        new Date(value);


      const datePart =
        date.toLocaleDateString(
          "de-DE",
          {
            timeZone:
              "Europe/Berlin",

            day:
              "2-digit",

            month:
              "2-digit",

            year:
              "numeric"
          }
        );


      const timePart =
        date.toLocaleTimeString(
          "de-DE",
          {
            timeZone:
              "Europe/Berlin",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit"
          }
        );


      return (
        label +
        " · " +
        datePart +
        " · " +
        timePart +
        " UHR"
      );

    }


    function formatDuration(ms) {

      if (
        ms === null ||
        typeof ms ===
          "undefined"
      ) {
        return "";
      }


      const totalSeconds =
        Math.floor(
          ms / 1000
        );


      const hours =
        Math.floor(
          totalSeconds /
          3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds %
            3600
          ) /
          60
        );


      const seconds =
        totalSeconds %
        60;


      return (
        String(hours)
          .padStart(2,"0") +
        ":" +
        String(minutes)
          .padStart(2,"0") +
        ":" +
        String(seconds)
          .padStart(2,"0")
      );

    }


    /*
      STATUS
    */

    function getStatusSymbol(
      task
    ) {

      if (
        task.status === "running" ||
        task.status === "paused"
      ) {
        return "🟨";
      }


      if (
        task.status === "completed"
      ) {
        return "✅";
      }


      if (
        task.status === "aborted"
      ) {
        return "❌";
      }


      return "⬜";

    }


    /*
      AKTIVE AUFGABEN
    */

    function createActiveTaskElement(
      task
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "task";


      if (
        task.status === "running"
      ) {

        element.classList.add(
          "running"
        );

      }


      if (
        task.status === "paused"
      ) {

        element.classList.add(
          "paused"
        );

      }


      const number =
        getDynamicTaskNumber(
          task
        );


      if (
        editingTaskId ===
        task.id
      ) {

        element.innerHTML = `

          <div class="task-number">
            ${number}
          </div>

          <div class="status-symbol">
            ${getStatusSymbol(task)}
          </div>

          <div class="edit-area">

            <input
              class="edit-input"
              id="edit-${task.id}"
              value="${escapeHtml(task.text)}"
              onkeydown="
                if(event.key === 'Enter') {
                  saveEdit(${task.id})
                }
              "
            >

            ${createEditOptions(task)}

            <div class="edit-actions">

              <button
                class="edit-button"
                onclick="saveEdit(${task.id})"
              >
                ✓ SPEICHERN
              </button>

              <button
                class="edit-button"
                onclick="cancelEditing()"
              >
                × ABBRECHEN
              </button>

            </div>

          </div>
        `;


        return element;

      }


      let meta =
        "";


      if (
        task.status === "running"
      ) {

        meta = `

          <div class="status-meta">
            LÄUFT
          </div>

          <div
            class="duration live-duration"
            data-task-id="${task.id}"
          >
            AKTIV ·
            ${formatDuration(
              getCurrentActiveDuration(
                task
              )
            )}
          </div>
        `;

      }


      if (
        task.status === "paused"
      ) {

        meta = `

          <div class="status-meta paused-meta">
            PAUSIERT
          </div>

          <div
            class="duration live-duration"
            data-task-id="${task.id}"
          >
            AKTIV ·
            ${formatDuration(
              getCurrentActiveDuration(
                task
              )
            )}
          </div>
        `;

      }


      let actions =
        "";


      if (
        task.status === "open"
      ) {

        actions = `

          <div class="task-actions">

            <button
              class="task-action-text start-button"
              onclick="startTask(${task.id})"
            >
              ▶ START
            </button>

            <button
              class="task-action-text"
              onclick="startEditing(${task.id})"
            >
              ✏️ BEARBEITEN
            </button>

            <button
              class="task-action-text"
              onclick="askDelete(${task.id})"
            >
              🗑 LÖSCHEN
            </button>

            <button
              class="task-action-text abort-button"
              onclick="askAbort(${task.id})"
            >
              ❌ ABBRUCH
            </button>

          </div>
        `;

      }


      if (
        task.status === "running"
      ) {

        actions = `

          <div class="task-actions">

            <button
              class="task-action-text pause-button"
              onclick="pauseTask(${task.id})"
            >
              ⏸ PAUSE
            </button>

            <button
              class="task-action-text finish-button"
              onclick="finishTask(${task.id})"
            >
              ✅ BEENDEN
            </button>

            <button
              class="task-action-text abort-button"
              onclick="askAbort(${task.id})"
            >
              ❌ ABBRUCH
            </button>

          </div>
        `;

      }


      if (
        task.status === "paused"
      ) {

        actions = `

          <div class="task-actions">

            <button
              class="task-action-text start-button"
              onclick="resumeTask(${task.id})"
            >
              ▶ WEITER
            </button>

            <button
              class="task-action-text finish-button"
              onclick="finishTask(${task.id})"
            >
              ✅ BEENDEN
            </button>

            <button
              class="task-action-text abort-button"
              onclick="askAbort(${task.id})"
            >
              ❌ ABBRUCH
            </button>

          </div>
        `;

      }


      element.innerHTML = `

        <div class="task-number">
          ${number}
        </div>

        <div class="status-symbol">
          ${getStatusSymbol(task)}
        </div>

        <div class="task-content">

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          ${createCompactFlags(task)}

          ${meta}

          ${actions}

        </div>
      `;


      return element;

    }


    /*
      ERLEDIGT
    */

    function createCompletedTaskElement(
      task
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "task completed";


      const number =
        getDynamicTaskNumber(
          task
        );


      element.innerHTML = `

        <div class="task-number">
          ${number}
        </div>

        <div class="status-symbol">
          ✅
        </div>

        <div class="task-content">

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          ${createCompactFlags(task)}

          ${
            task.completedAt
              ? `
                <div class="task-meta">
                  ${formatDateTime(
                    task.completedAt,
                    "ERLEDIGT"
                  )}
                </div>
              `
              : ""
          }

          ${
            task.activeDurationMs !==
              null
              ? `
                <div class="duration">
                  DAUER ·
                  ${formatDuration(
                    task.activeDurationMs
                  )}
                </div>
              `
              : ""
          }

        </div>

        <button
          class="repeat-button"
          onclick="repeatTask(${task.id})"
        >
          🔁
        </button>
      `;


      return element;

    }


    /*
      ABGEBROCHEN
    */

    function createAbortedTaskElement(
      task
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "task aborted";


      const number =
        getDynamicTaskNumber(
          task
        );


      element.innerHTML = `

        <div class="task-number">
          ${number}
        </div>

        <div class="status-symbol">
          ❌
        </div>

        <div class="task-content">

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          ${createCompactFlags(task)}

          ${
            task.abortedAt
              ? `
                <div class="abort-meta">
                  ${formatDateTime(
                    task.abortedAt,
                    "ABGEBROCHEN"
                  )}
                </div>
              `
              : ""
          }

          ${
            task.abortedActiveDurationMs !==
              null
              ? `
                <div class="duration aborted-duration">
                  AKTIV BIS ABBRUCH ·
                  ${formatDuration(
                    task.abortedActiveDurationMs
                  )}
                </div>
              `
              : ""
          }

        </div>

        <button
          class="repeat-button"
          onclick="repeatTask(${task.id})"
        >
          🔁
        </button>
      `;


      return element;

    }


    /*
      RENDER
    */

    function renderTasks() {

      applyAutomaticDateRules();


      const activeList =
        document.getElementById(
          "activeTaskList"
        );


      const completedList =
        document.getElementById(
          "completedTaskList"
        );


      const abortedList =
        document.getElementById(
          "abortedTaskList"
        );


      const activeTasks =
        tasks.filter(
          task =>
            task.status === "open" ||
            task.status === "running" ||
            task.status === "paused"
        );


      const completedTasks =
        tasks
          .filter(
            task =>
              task.status === "completed"
          )
          .sort(
            (a,b) =>
              new Date(
                b.completedAt || 0
              ) -
              new Date(
                a.completedAt || 0
              )
          );


      const abortedTasks =
        tasks
          .filter(
            task =>
              task.status === "aborted"
          )
          .sort(
            (a,b) =>
              new Date(
                b.abortedAt || 0
              ) -
              new Date(
                a.abortedAt || 0
              )
          );


      const openCount =
        tasks.filter(
          task =>
            task.status === "open"
        ).length;


      const runningCount =
        tasks.filter(
          task =>
            task.status === "running"
        ).length;


      const pausedCount =
        tasks.filter(
          task =>
            task.status === "paused"
        ).length;


      document.getElementById(
        "activeCounter"
      ).textContent =
        openCount +
        " offen · " +
        runningCount +
        " läuft · " +
        pausedCount +
        " pausiert";


      document.getElementById(
        "completedCounter"
      ).textContent =
        completedTasks.length +
        " erledigt";


      document.getElementById(
        "abortedCounter"
      ).textContent =
        abortedTasks.length +
        " abgebrochen";


      activeList.innerHTML =
        "";

      completedList.innerHTML =
        "";

      abortedList.innerHTML =
        "";


      if (
        activeTasks.length === 0
      ) {

        activeList.innerHTML = `
          <div class="empty-message">
            Nix offen. Verdächtig. 👀
          </div>
        `;

      } else {

        activeTasks.forEach(
          task => {

            activeList.appendChild(
              createActiveTaskElement(
                task
              )
            );

          }
        );

      }


      if (
        completedTasks.length === 0
      ) {

        completedList.innerHTML = `
          <div class="empty-message">
            Noch nix erledigt.
          </div>
        `;

      } else {

        completedTasks.forEach(
          task => {

            completedList.appendChild(
              createCompletedTaskElement(
                task
              )
            );

          }
        );

      }


      if (
        abortedTasks.length === 0
      ) {

        abortedList.innerHTML = `
          <div class="empty-message">
            Nix abgebrochen.
          </div>
        `;

      } else {

        abortedTasks.forEach(
          task => {

            abortedList.appendChild(
              createAbortedTaskElement(
                task
              )
            );

          }
        );

      }

    }


    /*
      LIVE TIMER
    */

    function updateLiveTimers() {

      document
        .querySelectorAll(
          ".live-duration"
        )
        .forEach(
          element => {

            const id =
              Number(
                element.dataset.taskId
              );


            const task =
              getTask(id);


            if (!task) {
              return;
            }


            element.textContent =
              "AKTIV · " +
              formatDuration(
                getCurrentActiveDuration(
                  task
                )
              );

          }
        );

    }


    setInterval(
      updateLiveTimers,
      1000
    );


    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState ===
          "visible"
        ) {

          renderTasks();

        }

      }
    );


    document
      .getElementById(
        "taskInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            addTask();

          }

        }
      );


    saveTasks();

    updateNewTaskOptions();

    renderTasks();

  </script>

</body>
</html>
