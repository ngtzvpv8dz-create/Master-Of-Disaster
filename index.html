<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">

  <title>Master of Disaster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #15191d 0%,
          #0b0d0f 45%,
          #070809 100%
        );

      color: #f3f3f3;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin: 10px 0 30px;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;

      color: #8c969f;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin-top: 10px;

      font-size: 14px;
      color: #7f8991;
    }

    /* EINGABE */

    .input-panel {
      padding: 14px;

      background: #171b1f;

      border: 1px solid #292f34;
      border-radius: 18px;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.28);

      margin-bottom: 26px;
    }

    #taskInput {
      width: 100%;

      padding: 16px;

      border: 1px solid #30373d;
      border-radius: 12px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 17px;

      margin-bottom: 10px;
    }

    #taskInput:focus {
      border-color: #7d8993;
    }

    #taskInput::placeholder {
      color: #626b72;
    }

    .add-button {
      width: 100%;

      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #e8ecef;
      color: #101214;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .add-button:active {
      transform: scale(0.985);
    }

    /* LISTENKOPF */

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 0 4px 12px;
    }

    .list-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;

      color: #8c969f;
    }

    #taskCounter {
      padding: 5px 9px;

      border: 1px solid #30363b;
      border-radius: 20px;

      background: #15191c;

      font-size: 12px;
      color: #aab1b7;
    }

    /* AUFGABEN */

    .task {
      display: flex;
      align-items: center;
      gap: 9px;

      min-height: 70px;

      padding: 10px;

      margin-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          #1c2125,
          #14181b
        );

      border: 1px solid #292f34;
      border-radius: 15px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .task.completed {
      opacity: 0.55;
    }

    .task.completed .task-text {
      text-decoration: line-through;
    }

    .task-text {
      flex: 1;

      min-width: 0;

      padding: 0 4px;

      font-size: 17px;
      font-weight: 600;

      line-height: 1.3;

      word-break: break-word;
    }

    /* BUTTONS */

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border: 1px solid #30363b;
      border-radius: 11px;

      background: #0e1113;

      font-size: 18px;

      cursor: pointer;
    }

    .icon-button:active,
    .move-button:active {
      transform: scale(0.92);
    }

    .move-buttons {
      display: flex;
      flex-direction: column;
      gap: 4px;

      flex-shrink: 0;
    }

    .move-button {
      width: 30px;
      height: 25px;

      padding: 0;

      border: 1px solid #30363b;
      border-radius: 7px;

      background: #0e1113;
      color: #929ba2;

      font-size: 11px;

      cursor: pointer;
    }

    /* LEERE LISTE */

    .empty-message {
      padding: 35px 20px;

      border: 1px dashed #30363b;
      border-radius: 15px;

      text-align: center;

      color: #626c73;
    }

    .empty-icon {
      display: block;

      margin-bottom: 10px;

      font-size: 28px;
    }

    /* KLEINE DISPLAYS */

    @media (max-width: 390px) {

      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .task {
        gap: 6px;
      }

      .icon-button {
        width: 38px;
        height: 40px;

        font-size: 16px;
      }

      .move-button {
        width: 27px;
      }

      .task-text {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="eyebrow">
        WEEK-AND-END
      </div>

      <h1>
        MASTER OF DISASTER
      </h1>

      <div class="subtitle">
        To-Do-Dingsi
      </div>

    </header>


    <section class="input-panel">

      <input
        type="text"
        id="taskInput"
        placeholder="Was steht an?"
        autocomplete="off"
      >

      <button
        class="add-button"
        onclick="addTask()"
      >
        + AUFGABE HINZUFÜGEN
      </button>

    </section>


    <div class="list-header">

      <div class="list-title">
        AUFGABEN
      </div>

      <div id="taskCounter">
        0 offen
      </div>

    </div>


    <div id="taskList"></div>

  </main>


  <script>

    let tasks =
      JSON.parse(
        localStorage.getItem(
          "masterOfDisasterTasks"
        )
      ) || [];


    function saveTasks() {

      localStorage.setItem(
        "masterOfDisasterTasks",
        JSON.stringify(tasks)
      );

    }


    function addTask() {

      const input =
        document.getElementById(
          "taskInput"
        );

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }

      tasks.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      saveTasks();

      input.value = "";

      renderTasks();

    }


    function toggleTask(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      task.completed =
        !task.completed;

      saveTasks();

      renderTasks();

    }


    function deleteTask(id) {

      tasks =
        tasks.filter(
          task => task.id !== id
        );

      saveTasks();

      renderTasks();

    }


    function editTask(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      const newText =
        prompt(
          "Aufgabe bearbeiten:",
          task.text
        );

      if (newText === null) {
        return;
      }

      const cleanedText =
        newText.trim();

      if (cleanedText === "") {
        return;
      }

      task.text =
        cleanedText;

      saveTasks();

      renderTasks();

    }


    function moveTaskUp(id) {

      const index =
        tasks.findIndex(
          task => task.id === id
        );

      if (index <= 0) {
        return;
      }

      [
        tasks[index - 1],
        tasks[index]
      ] = [
        tasks[index],
        tasks[index - 1]
      ];

      saveTasks();

      renderTasks();

    }


    function moveTaskDown(id) {

      const index =
        tasks.findIndex(
          task => task.id === id
        );

      if (
        index === -1 ||
        index >= tasks.length - 1
      ) {
        return;
      }

      [
        tasks[index],
        tasks[index + 1]
      ] = [
        tasks[index + 1],
        tasks[index]
      ];

      saveTasks();

      renderTasks();

    }


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }


    function renderTasks() {

      const taskList =
        document.getElementById(
          "taskList"
        );

      const taskCounter =
        document.getElementById(
          "taskCounter"
        );

      const openTasks =
        tasks.filter(
          task => !task.completed
        ).length;

      taskCounter.textContent =
        openTasks === 1
          ? "1 offen"
          : openTasks + " offen";

      taskList.innerHTML = "";


      if (tasks.length === 0) {

        taskList.innerHTML = `
          <div class="empty-message">

            <span class="empty-icon">
              ☕
            </span>

            Nix zu tun.<br>
            Verdächtig.

          </div>
        `;

        return;

      }


      tasks.forEach(task => {

        const taskElement =
          document.createElement(
            "div"
          );

        taskElement.className =
          "task" +
          (
            task.completed
              ? " completed"
              : ""
          );


        taskElement.innerHTML = `

          <div class="move-buttons">

            <button
              class="move-button"
              onclick="moveTaskUp(${task.id})"
              aria-label="Nach oben"
            >
              ▲
            </button>

            <button
              class="move-button"
              onclick="moveTaskDown(${task.id})"
              aria-label="Nach unten"
            >
              ▼
            </button>

          </div>


          <button
            class="icon-button"
            onclick="toggleTask(${task.id})"
            aria-label="Erledigt"
          >
            ${task.completed ? "✅" : "⬜"}
          </button>


          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>


          <button
            class="icon-button"
            onclick="editTask(${task.id})"
            aria-label="Bearbeiten"
          >
            ✏️
          </button>


          <button
            class="icon-button"
            onclick="deleteTask(${task.id})"
            aria-label="Löschen"
          >
            🗑️
          </button>

        `;


        taskList.appendChild(
          taskElement
        );

      });

    }


    document
      .getElementById(
        "taskInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {
            addTask();
          }

        }
      );


    renderTasks();

  </script>

</body>
</html>
