<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">

  <title>Master of Disaster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #15191d 0%,
          #0b0d0f 45%,
          #070809 100%
        );

      color: #f3f3f3;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin: 10px 0 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .eyebrow {
      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;

      color: #8c969f;
    }

    .title-bottom {
      margin-top: 10px;
      margin-bottom: 0;
      letter-spacing: 2.5px;
    }

    /* EINGABE */

    .input-panel {
      padding: 14px;
      margin-bottom: 26px;

      background: #171b1f;

      border: 1px solid #292f34;
      border-radius: 18px;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.28);
    }

    #taskInput {
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;

      border: 1px solid #30373d;
      border-radius: 12px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 17px;
    }

    #taskInput:focus,
    .edit-input:focus {
      border-color: #7d8993;
    }

    #taskInput::placeholder {
      color: #626b72;
    }

    .add-button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #e8ecef;
      color: #101214;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .add-button:active {
      transform: scale(0.98);
    }

    /* BEREICHE */

    .task-section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 0 4px 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;

      color: #8c969f;
    }

    .counter {
      padding: 5px 9px;

      border: 1px solid #30363b;
      border-radius: 20px;

      background: #15191c;

      font-size: 12px;
      color: #aab1b7;
    }

    /* AUFGABEN */

    .task {
      display: flex;
      align-items: center;
      gap: 9px;

      min-height: 70px;

      padding: 10px;
      margin-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          #1c2125,
          #14181b
        );

      border: 1px solid #292f34;
      border-radius: 15px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .task.completed {
      opacity: 0.55;
    }

    .task.completed .task-text,
    .task.aborted .task-text {
      text-decoration: line-through;
    }

    .task.aborted {
      opacity: 0.5;
    }

    .task.running {
      border-color: #6c642d;
    }

    .task-number {
      width: 36px;
      flex-shrink: 0;

      text-align: center;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;

      color: #647887;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;

      word-break: break-word;
    }

    .task-meta {
      margin-top: 5px;

      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.7px;

      color: #4f8ec4;
    }

    .status-meta {
      margin-top: 5px;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.8px;

      color: #9c9550;
    }

    .abort-meta {
      margin-top: 5px;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.8px;

      color: #9f5e5e;
    }

    /* BUTTONS */

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border: 1px solid #30363b;
      border-radius: 11px;

      background: #0e1113;

      font-size: 18px;

      cursor: pointer;
    }

    .icon-button:disabled {
      cursor: default;
    }

    .icon-button:active,
    .edit-button:active {
      transform: scale(0.96);
    }

    /* STATUS-AKTIONEN */

    .status-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .small-action-button {
      min-width: 40px;
      height: 40px;

      padding: 0 8px;

      border: 1px solid #30363b;
      border-radius: 10px;

      background: #0e1113;
      color: #d8dde0;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
    }

    /* BEARBEITEN */

    .edit-area {
      flex: 1;
      min-width: 0;
    }

    .edit-input {
      width: 100%;
      padding: 11px;

      border: 1px solid #30373d;
      border-radius: 9px;

      outline: none;

      background: #0d1012;
      color: white;

      font-size: 16px;
    }

    .edit-actions {
      display: flex;
      gap: 7px;

      margin-top: 7px;
    }

    .edit-button {
      flex: 1;

      padding: 8px;

      border: 1px solid #30363b;
      border-radius: 8px;

      background: #0e1113;
      color: #d8dde0;

      font-weight: 700;

      cursor: pointer;
    }

    /* LEERE BEREICHE */

    .empty-message {
      padding: 25px 20px;

      border: 1px dashed #30363b;
      border-radius: 15px;

      text-align: center;

      color: #626c73;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.72);

      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 360px;

      padding: 22px;

      background: #191d20;

      border: 1px solid #343b40;
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .modal p {
      margin: 0 0 20px;

      color: #9ba3a9;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-button {
      flex: 1;

      padding: 12px;

      border: 0;
      border-radius: 10px;

      font-weight: 800;

      cursor: pointer;
    }

    .cancel-delete {
      background: #30363b;
      color: white;
    }

    .confirm-delete {
      background: #e8ecef;
      color: #101214;
    }

    @media (max-width: 390px) {

      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .task {
        gap: 6px;
      }

      .task-number {
        width: 30px;
        font-size: 10px;
      }

      .icon-button {
        width: 38px;
        height: 40px;

        font-size: 16px;
      }

      .task-text {
        font-size: 16px;
      }

      .task-meta {
        font-size: 7.5px;
      }

      .status-meta,
      .abort-meta {
        font-size: 8px;
      }

      .small-action-button {
        min-width: 36px;
        height: 38px;
        padding: 0 6px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <h1>
        MASTER OF DISASTER
      </h1>

      <div class="eyebrow title-bottom">
        WEEK-AND-END-TO-DO-DINGSI
      </div>

    </header>


    <section class="input-panel">

      <input
        type="text"
        id="taskInput"
        placeholder="Was steht an?"
        autocomplete="off"
      >

      <button
        class="add-button"
        onclick="addTask()"
      >
        + AUFGABE HINZUFÜGEN
      </button>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          OFFENE UND LAUFENDE AUFGABEN
        </div>

        <div
          class="counter"
          id="activeCounter"
        >
          0 aktiv
        </div>

      </div>

      <div id="activeTaskList"></div>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          ERLEDIGT
        </div>

        <div
          class="counter"
          id="completedCounter"
        >
          0 erledigt
        </div>

      </div>

      <div id="completedTaskList"></div>

    </section>


    <section class="task-section">

      <div class="section-header">

        <div class="section-title">
          ABGEBROCHEN
        </div>

        <div
          class="counter"
          id="abortedCounter"
        >
          0 abgebrochen
        </div>

      </div>

      <div id="abortedTaskList"></div>

    </section>

  </main>


  <div id="modalContainer"></div>


  <script>

    let tasks =
      JSON.parse(
        localStorage.getItem(
          "masterOfDisasterTasks"
        )
      ) || [];

    let editingTaskId = null;


    /*
      MIGRATION ALTER TESTDATEN

      Frühere Versionen hatten nur:
      completed: true / false

      Jetzt nutzen wir:
      status: open | running | paused | completed | aborted

      Dadurch bleiben deine bisherigen Testaufgaben erhalten.
    */

    tasks = tasks.map(task => {

      if (!task.status) {

        if (task.completed === true) {
          task.status = "completed";
        } else {
          task.status = "open";
        }

      }

      if (
        typeof task.completedAt ===
        "undefined"
      ) {
        task.completedAt = null;
      }

      if (
        typeof task.abortedAt ===
        "undefined"
      ) {
        task.abortedAt = null;
      }

      return task;

    });

    saveTasks();


    function saveTasks() {

      localStorage.setItem(
        "masterOfDisasterTasks",
        JSON.stringify(tasks)
      );

    }


    function addTask() {

      const input =
        document.getElementById(
          "taskInput"
        );

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }

      tasks.push({
        id: Date.now(),
        text: text,
        status: "open",
        completedAt: null,
        abortedAt: null
      });

      saveTasks();

      input.value = "";

      renderTasks();

    }


    function setTaskStatus(
      id,
      newStatus
    ) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      task.status = newStatus;

      if (newStatus === "completed") {

        task.completedAt =
          new Date().toISOString();

        task.abortedAt = null;

      } else if (
        newStatus === "aborted"
      ) {

        task.abortedAt =
          new Date().toISOString();

        task.completedAt = null;

      } else {

        task.completedAt = null;
        task.abortedAt = null;

      }

      editingTaskId = null;

      saveTasks();

      renderTasks();

    }


    function repeatTask(id) {

      const oldTask =
        tasks.find(
          task => task.id === id
        );

      if (!oldTask) {
        return;
      }

      tasks.push({
        id: Date.now(),
        text: oldTask.text,
        status: "open",
        completedAt: null,
        abortedAt: null
      });

      saveTasks();

      renderTasks();

    }


    function startEditing(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (
        !task ||
        task.status === "completed" ||
        task.status === "aborted"
      ) {
        return;
      }

      editingTaskId = id;

      renderTasks();

      setTimeout(() => {

        const input =
          document.getElementById(
            "edit-" + id
          );

        if (input) {

          input.focus();

          input.setSelectionRange(
            input.value.length,
            input.value.length
          );

        }

      }, 0);

    }


    function cancelEditing() {

      editingTaskId = null;

      renderTasks();

    }


    function saveEdit(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      const input =
        document.getElementById(
          "edit-" + id
        );

      if (!task || !input) {
        return;
      }

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }

      task.text = text;

      editingTaskId = null;

      saveTasks();

      renderTasks();

    }


    function askDelete(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      const container =
        document.getElementById(
          "modalContainer"
        );

      container.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeModalOnBackdrop(event)"
        >

          <div class="modal">

            <h2>
              Aufgabe löschen?
            </h2>

            <p>
              „${escapeHtml(task.text)}“
              wird endgültig gelöscht.
            </p>

            <div class="modal-actions">

              <button
                class="modal-button cancel-delete"
                onclick="closeModal()"
              >
                Abbrechen
              </button>

              <button
                class="modal-button confirm-delete"
                onclick="deleteTask(${id})"
              >
                Löschen
              </button>

            </div>

          </div>

        </div>
      `;

    }


    function askAbort(id) {

      const task =
        tasks.find(
          task => task.id === id
        );

      if (!task) {
        return;
      }

      const container =
        document.getElementById(
          "modalContainer"
        );

      container.innerHTML = `

        <div
          class="modal-backdrop"
          onclick="closeModalOnBackdrop(event)"
        >

          <div class="modal">

            <h2>
              Aufgabe abbrechen?
            </h2>

            <p>
              „${escapeHtml(task.text)}“
              wird als endgültig abgebrochen markiert.
            </p>

            <div class="modal-actions">

              <button
                class="modal-button cancel-delete"
                onclick="closeModal()"
              >
                Zurück
              </button>

              <button
                class="modal-button confirm-delete"
                onclick="setTaskStatus(${id}, 'aborted'); closeModal();"
              >
                Abbrechen
              </button>

            </div>

          </div>

        </div>
      `;

    }


    function closeModalOnBackdrop(
      event
    ) {

      if (
        event.target.classList.contains(
          "modal-backdrop"
        )
      ) {
        closeModal();
      }

    }


    function closeModal() {

      document.getElementById(
        "modalContainer"
      ).innerHTML = "";

    }


    function deleteTask(id) {

      tasks =
        tasks.filter(
          task => task.id !== id
        );

      saveTasks();

      closeModal();

      renderTasks();

    }


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    function formatDateTime(
      value,
      label
    ) {

      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      const datePart =
        date.toLocaleDateString(
          "de-DE",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        );

      const timePart =
        date.toLocaleTimeString(
          "de-DE",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      return (
        label +
        " · " +
        datePart +
        " · " +
        timePart +
        " UHR"
      );

    }


    function formatTaskNumber(
      number
    ) {

      if (number < 10) {
        return "0" + number;
      }

      return String(number);

    }


    function getDynamicTaskNumber(
      task
    ) {

      const index =
        tasks.findIndex(
          item => item.id === task.id
        );

      if (index === -1) {
        return "";
      }

      return formatTaskNumber(
        index + 1
      );

    }


    function getStatusSymbol(
      status
    ) {

      switch (status) {

        case "running":
        case "paused":
          return "🟨";

        case "completed":
          return "✅";

        case "aborted":
          return "❌";

        default:
          return "⬜";

      }

    }


    function getStatusText(
      status
    ) {

      switch (status) {

        case "running":
          return "BEGONNEN / LÄUFT";

        case "paused":
          return "PAUSIERT";

        case "completed":
          return "ERLEDIGT";

        case "aborted":
          return "ABGEBROCHEN";

        default:
          return "OFFEN";

      }

    }


    function createActiveTaskElement(
      task
    ) {

      const taskElement =
        document.createElement(
          "div"
        );

      taskElement.className =
        "task";

      if (
        task.status === "running" ||
        task.status === "paused"
      ) {
        taskElement.classList.add(
          "running"
        );
      }

      const taskNumber =
        getDynamicTaskNumber(task);


      if (
        editingTaskId === task.id
      ) {

        taskElement.innerHTML = `

          <div class="task-number">
            ${taskNumber}
          </div>

          <div class="edit-area">

            <input
              class="edit-input"
              id="edit-${task.id}"
              value="${escapeHtml(task.text)}"
              onkeydown="
                if(event.key === 'Enter') {
                  saveEdit(${task.id})
                }
              "
            >

            <div class="edit-actions">

              <button
                class="edit-button"
                onclick="saveEdit(${task.id})"
              >
                ✓ Speichern
              </button>

              <button
                class="edit-button"
                onclick="cancelEditing()"
              >
                × Abbrechen
              </button>

            </div>

          </div>
        `;

        return taskElement;

      }


      taskElement.innerHTML = `

        <div class="task-number">
          ${taskNumber}
        </div>


        <button
          class="icon-button"
          disabled
          aria-label="${getStatusText(task.status)}"
          title="${getStatusText(task.status)}"
        >
          ${getStatusSymbol(task.status)}
        </button>


        <div class="task-content">

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          ${
            task.status === "running" ||
            task.status === "paused"
              ? `
                <div class="status-meta">
                  ${getStatusText(task.status)}
                </div>
              `
              : ""
          }

        </div>


        <button
          class="icon-button"
          onclick="startEditing(${task.id})"
          aria-label="Bearbeiten"
          title="Bearbeiten"
        >
          ✏️
        </button>


        <button
          class="icon-button"
          onclick="askDelete(${task.id})"
          aria-label="Löschen"
          title="Löschen"
        >
          🗑️
        </button>


        <button
          class="small-action-button"
          onclick="askAbort(${task.id})"
          aria-label="Aufgabe abbrechen"
          title="Abbrechen"
        >
          ❌
        </button>

      `;

      return taskElement;

    }


    function createCompletedTaskElement(
      task
    ) {

      const taskElement =
        document.createElement(
          "div"
        );

      taskElement.className =
        "task completed";

      const taskNumber =
        getDynamicTaskNumber(task);


      taskElement.innerHTML = `

        <div class="task-number">
          ${taskNumber}
        </div>


        <button
          class="icon-button"
          disabled
          aria-label="Erledigt"
          title="Erledigt"
        >
          ✅
        </button>


        <div class="task-content">

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          ${
            task.completedAt
              ? `
                <div class="task-meta">
                  ${formatDateTime(
                    task.completedAt,
                    "ERLEDIGT"
                  )}
                </div>
              `
              : ""
          }

        </div>


        <button
          class="icon-button"
          onclick="repeatTask(${task.id})"
          aria-label="Aufgabe wiederholen"
          title="Wiederholen"
        >
          🔁
        </button>

      `;

      return taskElement;

    }


    function createAbortedTaskElement(
      task
    ) {

      const taskElement =
        document.createElement(
          "div"
        );

      taskElement.className =
        "task aborted";

      const taskNumber =
        getDynamicTaskNumber(task);


      taskElement.innerHTML = `

        <div class="task-number">
          ${taskNumber}
        </div>


        <button
          class="icon-button"
          disabled
          aria-label="Abgebrochen"
          title="Abgebrochen"
        >
          ❌
        </button>


        <div class="task-content">

          <div class="task-text">
            ${escapeHtml(task.text)}
          </div>

          ${
            task.abortedAt
              ? `
                <div class="abort-meta">
                  ${formatDateTime(
                    task.abortedAt,
                    "ABGEBROCHEN"
                  )}
                </div>
              `
              : ""
          }

        </div>


        <button
          class="icon-button"
          onclick="repeatTask(${task.id})"
          aria-label="Aufgabe wiederholen"
          title="Wiederholen"
        >
          🔁
        </button>

      `;

      return taskElement;

    }


    function renderTasks() {

      const activeTaskList =
        document.getElementById(
          "activeTaskList"
        );

      const completedTaskList =
        document.getElementById(
          "completedTaskList"
        );

      const abortedTaskList =
        document.getElementById(
          "abortedTaskList"
        );


      const activeTasks =
        tasks.filter(
          task =>
            task.status === "open" ||
            task.status === "running" ||
            task.status === "paused"
        );


      const completedTasks =
        tasks
          .filter(
            task =>
              task.status === "completed"
          )
          .sort(
            (a, b) => {

              const aTime =
                a.completedAt
                  ? new Date(
                      a.completedAt
                    ).getTime()
                  : 0;

              const bTime =
                b.completedAt
                  ? new Date(
                      b.completedAt
                    ).getTime()
                  : 0;

              return bTime - aTime;

            }
          );


      const abortedTasks =
        tasks
          .filter(
            task =>
              task.status === "aborted"
          )
          .sort(
            (a, b) => {

              const aTime =
                a.abortedAt
                  ? new Date(
                      a.abortedAt
                    ).getTime()
                  : 0;

              const bTime =
                b.abortedAt
                  ? new Date(
                      b.abortedAt
                    ).getTime()
                  : 0;

              return bTime - aTime;

            }
          );


      const openCount =
        tasks.filter(
          task =>
            task.status === "open"
        ).length;

      const startedCount =
        tasks.filter(
          task =>
            task.status === "running" ||
            task.status === "paused"
        ).length;


      document.getElementById(
        "activeCounter"
      ).textContent =
        openCount +
        " offen · " +
        startedCount +
        " begonnen";


      document.getElementById(
        "completedCounter"
      ).textContent =
        completedTasks.length === 1
          ? "1 erledigt"
          : completedTasks.length +
            " erledigt";


      document.getElementById(
        "abortedCounter"
      ).textContent =
        abortedTasks.length === 1
          ? "1 abgebrochen"
          : abortedTasks.length +
            " abgebrochen";


      activeTaskList.innerHTML = "";

      completedTaskList.innerHTML = "";

      abortedTaskList.innerHTML = "";


      if (
        activeTasks.length === 0
      ) {

        activeTaskList.innerHTML = `
          <div class="empty-message">
            Nix offen. Verdächtig. 👀
          </div>
        `;

      } else {

        activeTasks.forEach(task => {

          activeTaskList.appendChild(
            createActiveTaskElement(task)
          );

        });

      }


      if (
        completedTasks.length === 0
      ) {

        completedTaskList.innerHTML = `
          <div class="empty-message">
            Noch nix erledigt.
          </div>
        `;

      } else {

        completedTasks.forEach(task => {

          completedTaskList.appendChild(
            createCompletedTaskElement(
              task
            )
          );

        });

      }


      if (
        abortedTasks.length === 0
      ) {

        abortedTaskList.innerHTML = `
          <div class="empty-message">
            Nix abgebrochen.
          </div>
        `;

      } else {

        abortedTasks.forEach(task => {

          abortedTaskList.appendChild(
            createAbortedTaskElement(
              task
            )
          );

        });

      }

    }


    document
      .getElementById(
        "taskInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {
            addTask();
          }

        }
      );


    renderTasks();

  </script>

</body>
</html>
