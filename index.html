  <script>
    (async()=>{
      try{
        const params=new URL(location.href).searchParams;
        const testRun=params.has('reg')||params.has('smoke');
        if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
        if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
        if(!testRun&&!sessionStorage.getItem('modV489TaskTimeWeightDetailsDone')){
          sessionStorage.setItem('modV489TaskTimeWeightDetailsDone','1');
          const u=new URL(location.href);
          u.searchParams.set('v489details',Date.now().toString());
          location.replace(u.toString());
        }
      }catch(e){console.warn('V489 task time/weight details cleanup:',e);}
