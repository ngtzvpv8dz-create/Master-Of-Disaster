<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171613">
<title>TO-DO · Master of Disaster 2.0</title>
<link rel="stylesheet" href="./app.css?v=2003">
<link rel="stylesheet" href="./todo.css?v=2010">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="todo-page">
<header class="v2-header todo-header">
  <div class="v2-header-inner">
    <a class="mini-home" href="./" aria-label="Homescreen" title="Homescreen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-4.75v-6h-5.5v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>
    </a>
    <div class="v2-brand-wrap">
      <div class="v2-brand">MASTER OF DISASTE<button id="todoUndo" class="undo-r" type="button" aria-label="Rückgängig und Verlauf">R</button></div>
      <div class="v2-subtitle">WEEK-AND-END-TO-DO-DINGSI</div>
    </div>
    <span class="v2-badge">2.0</span>
  </div>
</header>

<main class="todo-main">
  <section class="todo-title-row">
    <div>
      <p>TO-DO · 2.0</p>
      <h1>Aufgaben</h1>
    </div>
    <span id="taskCount" class="task-count">…</span>
  </section>

  <div class="todo-tabs-wrap">
    <nav class="todo-tabs" aria-label="TO-DO Bereiche">
      <button class="todo-tab active" data-filter="all">ALLE</button>
      <button class="todo-tab" data-filter="today">HEUTE</button>
      <button class="todo-tab" data-filter="priority">PRIORITÄT</button>
      <button class="todo-tab" data-filter="due">FÄLLIG</button>
      <button class="todo-tab" data-filter="paused">PAUSIERT</button>
      <button class="todo-tab" data-filter="archive">ARCHIV</button>
      <button class="todo-tab" data-filter="statistics">STATISTIK</button>
      <button class="todo-tab" data-filter="categories">KATEGORIEN</button>
      <button class="todo-tab" data-filter="titles">TITEL</button>
    </nav>
  </div>

  <section id="composer" class="composer">
    <div class="task-input-wrap">
      <input id="newTaskText" type="text" placeholder="Was steht an?" autocomplete="off">
      <div id="titleSuggestions" class="title-suggestions" hidden></div>
    </div>

    <div class="composer-row">
      <span class="composer-label">TYP</span>
      <div class="composer-options" data-option-group="type">
        <button type="button" class="choice selected" data-type="work">🔧 ARBEIT</button>
        <button type="button" class="choice" data-type="leisure">🎮 FREIZEIT</button>
        <button type="button" class="choice" data-type="selfrunner">🤖 SELBSTLÄUFER</button>
        <button type="button" class="choice" data-type="cooking">🍳 KOCHEN</button>
      </div>
    </div>

    <div class="composer-row">
      <span class="composer-label">PRIORITÄT</span>
      <div class="composer-options" data-option-group="priority">
        <button type="button" class="choice selected" data-priority="normal">⚪ NORMAL</button>
        <button type="button" class="choice" data-priority="medium">🟡 MITTEL</button>
        <button type="button" class="choice" data-priority="high">🔴 HOCH</button>
      </div>
    </div>

    <div class="composer-row">
      <span class="composer-label">OPTIONAL</span>
      <div class="composer-options">
        <button id="optionalChoice" type="button" class="choice">🟣 NEIN</button>
      </div>
    </div>

    <div class="composer-row">
      <span class="composer-label">KATEGORIE</span>
      <div class="composer-options category-editor">
        <input id="newCategoryInput" type="text" list="categorySuggestions" placeholder="Ohne Kategorie" autocomplete="off">
        <datalist id="categorySuggestions"></datalist>
      </div>
    </div>

    <div class="composer-row">
      <span class="composer-label">FÄLLIG</span>
      <div class="composer-options" data-option-group="due">
        <button type="button" class="choice selected" data-due="none">—</button>
        <button type="button" class="choice" data-due="tomorrowOnly">💠 MORGEN</button>
        <button type="button" class="choice" data-due="deadline">🔷 BIS MORGEN</button>
      </div>
    </div>

    <div class="composer-actions">
      <button id="newTaskButton" class="add-task" type="button">+ AUFGABE HINZUFÜGEN</button>
      <button id="cancelEditButton" class="cancel-edit" type="button" hidden>ABBRECHEN</button>
    </div>
  </section>

  <section id="todoSummary" class="todo-summary" aria-label="Aufgabenübersicht">
    <div><span>OFFEN</span><strong id="openSummary">–</strong></div>
    <div><span>PAUSIERT</span><strong id="pausedSummary">–</strong></div>
    <div><span>PRIORITÄT</span><strong id="prioritySummary">–</strong></div>
  </section>

  <section id="taskList" class="task-list" aria-live="polite">
    <div class="loading-card">Aufgaben werden aus Supabase geladen …</div>
  </section>
</main>
<div id="todoToast" class="toast" aria-live="polite"></div>\n<div id="todoModal" class="todo-modal-root"></div>
<script src="./data.js?v=2010"></script>\n<script src="./todo.js?v=2010"></script>
</body>
</html>
