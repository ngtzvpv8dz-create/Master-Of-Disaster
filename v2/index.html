          <stop offset=".52" stop-color="#141d29" stop-opacity=".58"/>
          <stop offset="1" stop-color="#070d14" stop-opacity=".98"/>

        <linearGradient id="ridgeGlow" x1="0" x2="1">
          <stop offset="0" stop-color="#d2a55f" stop-opacity="0"/>

        <path d="M19 13.1c.06-.36.1-.72.1-1.1s-.04-.74-.1-1.1l2-1.55-1.9-3.28-2.47 1a8 8 0 0 0-1.9-1.1L14.35 3h-3.8l-.38 2.97a8 8 0 0 0-1.9 1.1l-2.47-1L3.9 9.35l2 1.55c-.06.36-.1.72-.1 1.1s.04.74.1 1.1l-2 1.55 1.9 3.28 2.47-1a8 8 0 0 0 1.9 1.1l.38 2.97h3.8l.38-2.97a8 8 0 0 0 1.9-1.1l2.47 1 1.9-3.28-2-1.55Z"/>

    <div class="mountain-mark" aria-hidden="true">
      <svg viewBox="0 0 150 54">
        <path d="M4 48 39 17l10 11L72 3l27 30 15-15 32 30-36-20-10 12L74 17 54 38 39 30Z"/>
      </svg>
    </div>

    <div class="v2-brand">Master of Disaste<button class="undo-r" type="button" aria-label="Rückgängig und Verlauf">r</button></div>

      <a class="area-card sport" href="./placeholder.html?area=sport" style="--accent:#5f9271">
        <span class="icon-frame icon-sport" aria-hidden="true"></span>

      <a class="area-card kistology" href="./placeholder.html?area=kistology" style="--accent:#aa7753">

        <span class="icon-frame icon-backstage" aria-hidden="true"></span>
        <span class="area-label">BACKSTAGE</span>

    <section class="home-motto" aria-label="Motto">
      <span></span>
      <p>SMALL STEPS<br><strong>BIG RESULTS</strong></p>
      <span></span>

    <a class="version-back" href="../">Version wechseln</a>
