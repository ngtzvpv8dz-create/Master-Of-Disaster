<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <title>Master of Disaster · Recovery V496</title>
  <style>
    html,body{margin:0;height:100%;background:#0b0d0f;color:#fff;font-family:system-ui,-apple-system,sans-serif}#bar{position:fixed;z-index:99999;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));padding:9px 12px;border-radius:10px;background:rgba(15,17,19,.96);border:1px solid rgba(255,255,255,.2);font-size:13px;font-weight:750}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d0f;padding-top:48px;box-sizing:border-box}
  </style>
</head>
<body>
  <div id="bar">Recovery V496 wird geladen …</div>
  <iframe id="app" title="Master of Disaster Recovery"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('app'),bar=document.getElementById('bar');
      let injected=false;
      function set(text){bar.textContent=text;}
      function inject(){
        try{
          const w=frame.contentWindow,d=frame.contentDocument;
          if(!w||!d||!d.head)return;
          if(w.__modAccidentalCompletionRecoveryV496){set('Recovery V496 aktiv · Wiederherstellung wird geprüft …');w.__modAccidentalCompletionRecoveryV496.poll();return;}
          if(injected)return;injected=true;
          const s=d.createElement('script');
          s.src='./remote-accidental-completion-recovery-v496.js?v=496-recovery1';
          s.dataset.modRecoveryV496='1';
          s.onload=()=>{set('Recovery V496 aktiv · Wiederherstellung wird ausgeführt …');setTimeout(()=>w.__modAccidentalCompletionRecoveryV496?.poll?.(),100);};
          s.onerror=()=>{injected=false;set('Recovery V496 konnte nicht geladen werden.');};
          d.head.appendChild(s);
        }catch(error){injected=false;set('Recovery V496 wartet auf die App …');}
      }
      frame.addEventListener('load',()=>{injected=false;setTimeout(inject,250);});
      frame.src='./index.html?recovery496='+Date.now();
      setInterval(inject,1200);
    })();
  </script>
</body>
</html>
