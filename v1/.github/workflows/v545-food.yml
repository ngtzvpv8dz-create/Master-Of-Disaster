name: V545 FOOD interaction and mobile layout
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  food:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check food-v544.js
      - run: npm install --no-save --package-lock=false playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/food-v545.cjs
