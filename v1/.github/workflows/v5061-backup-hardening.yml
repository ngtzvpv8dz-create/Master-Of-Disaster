name: V506.2 Backup Hardening
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  backup-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and markers
        run: |
          node --check backup-stability-v506.js
          grep -q "patchRevision:PATCH_VERSION" backup-stability-v506.js
          grep -q "memorySafeFullBackupV5062:true" backup-stability-v506.js
          grep -q "historyCursorStreamingV5062:true" backup-stability-v506.js
          grep -q "nestedGithubSourceArchiveV5062:true" backup-stability-v506.js
          grep -q "crashStageMarkerV5062:true" backup-stability-v506.js
          grep -q "noAutomaticBlobNavigation:true" backup-stability-v506.js
          grep -q "weeklyCloudPayloadLightweight:true" backup-stability-v506.js
          if grep -n "api\.exportPackage" backup-stability-v506.js; then
            echo "Full backup must not materialize the whole V498 history through exportPackage"
            exit 1
          fi
      - name: Browser backup behavior
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v5062-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?v5062='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modRecoveryHistoryV498&&window.__modBackupStabilityV506?.patchRevision==='V506.2',{timeout:30000});
            const verify=await page.evaluate(()=>window.__modBackupStabilityV506.verify());
            if(!verify)throw new Error('V506.2 module verify failed');

            await page.evaluate(()=>{switchTab('dev');render();});
            await page.waitForTimeout(500);

            const full=await page.evaluate(async()=>{
              const mod=window.__modBackupStabilityV506;
              const api=window.__modRecoveryHistoryV498;
              const button=document.getElementById('fullBackupV397');
              if(!button)throw new Error('Full backup button missing');

              await new Promise((resolve,reject)=>{
                const req=indexedDB.open('MasterOfDisasterSafetyNetV498',1);
                req.onerror=()=>reject(req.error);
                req.onsuccess=()=>{
                  const db=req.result;
                  const tx=db.transaction(['recoveryPoints','logEntries'],'readwrite');
                  tx.objectStore('recoveryPoints').put({
                    id:'v5062-point',at:new Date().toISOString(),version:'V506.2',type:'test',label:'stream fixture',
                    snapshot:{schemaVersion:1,capturedAt:new Date().toISOString(),storage:{masterOfDisasterV5062Fixture:'x'.repeat(4000)}}
                  });
                  tx.objectStore('logEntries').put({
                    id:'v5062-log',at:new Date().toISOString(),area:'SYSTEM',level:'PASS',message:'stream fixture log'
                  });
                  tx.oncomplete=()=>{db.close();resolve();};
                  tx.onerror=()=>reject(tx.error);
                };
              });

              const oldFetch=window.fetch;
              window.fetch=async (url,opts)=>{
                const s=String(url);
                if(s.includes('api.github.com/repos/ngtzvpv8dz-create/Master-Of-Disaster/git/trees/main')){
                  return {ok:true,json:async()=>({sha:'test-tree'})};
                }
                if(s.includes('codeload.github.com/ngtzvpv8dz-create/Master-Of-Disaster/zip/refs/heads/main')){
                  return {ok:true,blob:async()=>new Blob(['fake-source-archive'],{type:'application/zip'})};
                }
                return oldFetch(url,opts);
              };
              const oldExport=api.exportPackage;
              api.exportPackage=async()=>{throw new Error('exportPackage MUST NOT be used by V506.2 full backup');};

              const before=location.href;
              await mod.createFullBackup(button);
              const after=location.href;
              const ready=!!document.querySelector('#modBackupModalV5061 [data-share-v5061]');
              const link=document.querySelector('#modBackupModalV5061 [data-download-v5061]');
              if(!link?.href)throw new Error('Generated backup blob URL missing');
              const response=await oldFetch(link.href);
              const outer=await JSZip.loadAsync(await response.blob());
              const names=Object.keys(outer.files);
              const safety=JSON.parse(await outer.file('DATA/recovery-history-v498.json').async('text'));
              const complete=JSON.parse(await outer.file('DATA/complete-data-backup.json').async('text'));
              const info=await outer.file('BACKUP-INFO.txt').async('text');

              api.exportPackage=oldExport;
              window.fetch=oldFetch;
              document.querySelector('#modBackupModalV5061 [data-close-v5061]')?.click();

              return {
                ready,
                sameUrl:before===after,
                buttonText:button.textContent,
                names,
                hasPoint:safety.points.some(x=>x.id==='v5062-point'),
                hasLog:safety.logs.some(x=>x.id==='v5062-log'),
                patch:complete.backupPatch,
                infoStreaming:/V506\.2-Hinweis/.test(info),
                marker:localStorage.getItem('modV5062FullBackupStage')
              };
            });

            for(const needed of [
              'APP/source-main.zip',
              'DATA/complete-data-backup.json',
              'DATA/localstorage-master-of-disaster.json',
              'DATA/recovery-history-v498.json',
              'DATA/live-log-7-days.json',
              'BACKUP-INFO.txt'
            ]) if(!full.names.includes(needed))throw new Error('Missing full backup entry '+needed);
            if(!full.ready||!full.sameUrl||!full.hasPoint||!full.hasLog||full.patch!=='V506.2'||!full.infoStreaming||full.marker!==null){
              throw new Error('V506.2 memory-safe full backup regression '+JSON.stringify(full));
            }

            const weekly=await page.evaluate(async()=>{
              const mod=window.__modBackupStabilityV506;
              const button=document.querySelector('[data-weekly-create-v498]');
              if(!button)throw new Error('Weekly backup button missing');
              localStorage.setItem('masterOfDisasterLiveLogV453','VERY-LARGE-LOG-MUST-NOT-BE-UPLOADED');
              localStorage.setItem('masterOfDisasterV5062Fixture','fixture');
              const calls={};
              const client={
                auth:{getSession:async()=>({data:{session:{user:{id:'test-user'}}},error:null})},
                from(){
                  return {
                    insert(rows){calls.insert=rows;return {select(){return {limit:async()=>({data:[{id:1,key:rows[0].key,created_at:new Date().toISOString()}],error:null})}}};},
                    select(){return {eq(){return {like(){return {order:async()=>({data:[{id:1}],error:null})}}}}};},
                    delete(){return {eq(){return {in:async()=>({error:null})}}};}
                  };
                }
              };
              const oldClient=window.getSupabaseClient;
              window.getSupabaseClient=()=>client;
              await mod.createWeeklyCloudBackup(button);
              window.getSupabaseClient=oldClient;
              const payload=calls.insert?.[0]?.payload;
              document.querySelector('#modBackupModalV5061 [data-close-v5061]')?.click();
              return {
                bundleVersion:payload?.bundleVersion,
                format:payload?.format,
                historyMode:payload?.history?.mode,
                hasSafety:Object.prototype.hasOwnProperty.call(payload||{},'safety'),
                containsLiveLog:Object.prototype.hasOwnProperty.call(payload?.localStorage||{},'masterOfDisasterLiveLogV453'),
                fixture:payload?.localStorage?.masterOfDisasterV5062Fixture
              };
            });
            if(weekly.bundleVersion!==2||weekly.format!=='weekly-light-v5061'||weekly.historyMode!=='local-only'||weekly.hasSafety||weekly.containsLiveLog||weekly.fixture!=='fixture'){
              throw new Error('Weekly lightweight payload regression '+JSON.stringify(weekly));
            }
            console.log('V506.2 backup hardening PASS',full,weekly);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
