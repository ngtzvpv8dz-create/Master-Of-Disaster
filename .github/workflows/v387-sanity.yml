name: V387 Sanity

on:
  push:
    branches:
      - v387-conflict-center
    paths:
      - .github/workflows/v387-sanity.yml

permissions:
  contents: write

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v387-conflict-center
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check conflict-center.js
      - name: Asset wiring checks
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('app.js').read_text(encoding='utf-8')
          assert 'conflict-center.js?v=387' in html
          assert 'conflict-center.css?v=387' in html
          assert 'const APP_VERSION =\n"V387";' in js
          Path('v387-build-ok.txt').write_text('V387 syntax and asset wiring OK\n', encoding='utf-8')
      - name: Commit sanity marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v387-build-ok.txt
          git commit -m "test: V387 syntax and wiring OK"
          git push origin v387-conflict-center
