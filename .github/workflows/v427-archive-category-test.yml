name: V427 Archive Category Test
on:
  push:
    branches: [ fix/v427-archive-category ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify category survives archive transfer
        run: |
          cat > test.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});await p.route('**/*',r=>/supabase\.co/.test(r.request().url())?r.abort():r.continue());try{await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?t='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.addScriptTag({content:fs.readFileSync('archive-category-v413.js','utf8')});const out=await p.evaluate(()=>{tasks=[{id:991827,text:'Archiv Kategorie Transfer (TEST)',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-19T20:00:00+02:00',completedAt:'2026-08-19T20:10:00+02:00',completedDate:'2026-08-19',activeDurationMs:600000,actualDurationMs:600000,pauseTotalMs:0,activeSegments:[],category:'Handwerk'}];archive=[];saveTasks();saveArchive();processDayTransition();const a=archive.find(x=>String(x.sourceTaskId)==='991827'||x.text==='Archiv Kategorie Transfer (TEST)');return {archived:!!a,category:a?.category||null,removed:!tasks.some(x=>x.id===991827),module:window.__modArchiveCategoryV413?.version};});console.log('V427_RESULT '+JSON.stringify(out));if(!out.archived||out.category!=='Handwerk'||!out.removed||out.module!=='V427')process.exitCode=1;}finally{await b.close();}})();
          JS
          node test.js
