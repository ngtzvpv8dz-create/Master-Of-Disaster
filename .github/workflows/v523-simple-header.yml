name: V523 Simple Header
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  simple-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wiring checks
        run: |
          test -f app-hub-simple-header-v523.css
          grep -q 'app-hub-simple-header-v523.css?v=523-0656' app-hub-floating-v522.css
          grep -q 'border-radius:0 !important' app-hub-simple-header-v523.css
          grep -q 'box-shadow:none !important' app-hub-simple-header-v523.css
          grep -q 'font-size:clamp(28px,8vw,42px) !important' app-hub-simple-header-v523.css
          grep -q 'letter-spacing:-1.5px !important' app-hub-simple-header-v523.css
      - name: Browser simple-header regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v523-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg=v523',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV520,null,{timeout:30000});
            await page.evaluate(()=>{window.__modAppHubV515.show();window.__modHubLauncherV520.render();});
            await page.waitForFunction(()=>document.getElementById('modAppHubV515')?.dataset.modHubAssetsV520==='ready',null,{timeout:10000});
            await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
            await page.waitForTimeout(400);
            const result=await page.evaluate(()=>{
              const fixed=document.getElementById('appFixedTopV475');
              const header=fixed?.querySelector('.header')||document.querySelector('main.app > header.header')||document.querySelector('.header');
              const launcher=document.querySelector('#modAppHubV515 .mod-hub-shell-v515');
              if(!fixed||!header||!launcher) throw new Error('required-elements-missing');
              const fsx=getComputedStyle(fixed), hs=getComputedStyle(header), ls=getComputedStyle(launcher), bs=getComputedStyle(document.body);
              return {
                viewport:innerWidth,
                title:(header.querySelector('h1')?.textContent||'').trim(),
                bodyBackground:bs.backgroundImage,
                fixed:{rect:fixed.getBoundingClientRect().toJSON(),radius:parseFloat(fsx.borderTopLeftRadius||'0'),shadow:fsx.boxShadow,bg:fsx.backgroundColor,borderBottom:parseFloat(fsx.borderBottomWidth||'0')},
                header:{radius:parseFloat(hs.borderTopLeftRadius||'0'),shadow:hs.boxShadow,bgImage:hs.backgroundImage,border:parseFloat(hs.borderTopWidth||'0')},
                launcher:{bg:ls.backgroundImage,slots:document.querySelectorAll('.mod-hub-app-slot-v517').length}
              };
            });
            if(!result.bodyBackground.includes('radial-gradient')) throw new Error('ambient background changed '+JSON.stringify(result));
            if(result.fixed.rect.left>1||result.fixed.rect.right<result.viewport-1) throw new Error('header shell not full width '+JSON.stringify(result));
            if(result.fixed.radius!==0||result.header.radius!==0) throw new Error('rounded header corners remain '+JSON.stringify(result));
            if(result.fixed.shadow!=='none'||result.header.shadow!=='none') throw new Error('floating header shadow remains '+JSON.stringify(result));
            if(result.fixed.bg==='rgba(0, 0, 0, 0)'||result.fixed.borderBottom<1) throw new Error('simple header bar missing '+JSON.stringify(result));
            if(result.header.bgImage!=='none'||result.header.border!==0) throw new Error('header still rendered as card '+JSON.stringify(result));
            if(!result.launcher.bg.includes('conic-gradient')||result.launcher.slots!==6) throw new Error('launcher regression '+JSON.stringify(result));
            if(!/MASTER\s+OF\s+DISASTER/i.test(result.title)) throw new Error('title regression '+JSON.stringify(result));

            const measureTitle=()=>page.evaluate(()=>{
              const title=document.querySelector('.header h1');
              if(!title)throw new Error('title-missing');
              const style=getComputedStyle(title),rect=title.getBoundingClientRect();
              return {fontSize:parseFloat(style.fontSize),letterSpacing:parseFloat(style.letterSpacing),lineHeight:parseFloat(style.lineHeight),height:rect.height};
            });
            const titleMetrics={hub:await measureTitle()};

            await page.click('.mod-hub-app-button-todo-v517');
            await page.waitForTimeout(180);
            titleMetrics.todo=await measureTitle();

            await page.click('#modHomeButtonV525');
            await page.waitForTimeout(180);
            await page.click('.mod-hub-app-button-sport-v517');
            await page.waitForTimeout(220);
            titleMetrics.sport=await measureTitle();

            const same=(a,b,tolerance=.05)=>Math.abs(a-b)<=tolerance;
            for(const mode of ['todo','sport']){
              const m=titleMetrics[mode],h=titleMetrics.hub;
              if(!same(h.fontSize,m.fontSize)||!same(h.letterSpacing,m.letterSpacing)||!same(h.lineHeight,m.lineHeight)||!same(h.height,m.height,.2)){
                throw new Error('V526 header title typography jump '+JSON.stringify(titleMetrics));
              }
            }
            if(errors.length) throw new Error('page errors '+JSON.stringify(errors));
            await page.screenshot({path:'/tmp/v523-simple-header.png',fullPage:true});
            fs.writeFileSync('/tmp/v523-result.json',JSON.stringify({...result,titleMetrics},null,2));
            console.log('V523 SIMPLE HEADER + V526 SIZE PARITY PASS');
            await browser.close();
          })().catch(error=>{fs.writeFileSync('/tmp/v523-error.txt',String(error&&error.stack||error));console.error(error);process.exit(1);});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v523-simple-header-diagnostics
          path: |
            /tmp/v523-simple-header.png
            /tmp/v523-result.json
            /tmp/v523-error.txt
            /tmp/mod-v523-http.log
            app-hub-simple-header-v523.css
          if-no-files-found: ignore
