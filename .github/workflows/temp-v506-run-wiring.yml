name: Temporary V506 Wiring Runner
on:
  push:
    branches: [ fix/v506-backup-safety-stability ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply non-workflow wiring
        run: python scripts/temp_v506_wiring.py
      - name: Verify syntax and wiring
        run: |
          node --check history-safety-net-v498.js
          node --check backup-stability-v506.js
          node --check paused-today-v447.js
          grep -q 'BUILD: V506' index.html
          grep -q 'backup-stability-v506.js?v=506-1131' index.html
          grep -q 'master-of-disaster-v506-backup-safety-stability' sw.js
      - name: Commit non-workflow wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js paused-today-v447.js
          git commit -m "V506: wire backup stability into current app shell"
          git push
