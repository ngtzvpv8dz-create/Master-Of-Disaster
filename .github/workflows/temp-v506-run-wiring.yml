name: Temporary V506 Wiring Runner
on:
  push:
    branches: [ fix/v506-backup-safety-stability ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply wiring patches
        run: |
          python scripts/temp_v506_wiring.py
          python scripts/temp_v506_ci.py
          python scripts/temp_v506_regression.py
      - name: Verify syntax and wiring
        run: |
          node --check history-safety-net-v498.js
          node --check backup-stability-v506.js
          node --check paused-today-v447.js
          grep -q 'BUILD: V506' index.html
          grep -q 'backup-stability-v506.js?v=506-1131' index.html
          grep -q 'master-of-disaster-v506-backup-safety-stability' sw.js
          grep -q 'V506 backup reconnect regression' .github/workflows/regression.yml
          grep -q 'v506Verified' .github/workflows/runtime-smoke.yml
      - name: Commit wiring and remove helpers
        run: |
          rm .github/workflows/temp-v506-run-wiring.yml scripts/temp_v506_wiring.py scripts/temp_v506_ci.py scripts/temp_v506_regression.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js paused-today-v447.js .github/workflows/build-consistency.yml .github/workflows/regression.yml .github/workflows/runtime-smoke.yml .github/workflows/temp-v506-run-wiring.yml scripts/temp_v506_wiring.py scripts/temp_v506_ci.py scripts/temp_v506_regression.py
          git commit -m "V506: wire backup stability into current build and tests"
          git push
