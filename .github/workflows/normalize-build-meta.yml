name: Normalize Build Metadata
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align app.js and sw.js with index build marker
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<!-- BUILD: V(\d+) · (\d{2}\.\d{2}\.\d{4}) · (\d{2}:\d{2}) ·', index)
          if not m:
              raise SystemExit('Build marker not found in index.html')
          version, date, time = m.groups()

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app, n1 = re.subn(r'const APP_VERSION =\s*\n?"V\d+";', f'const APP_VERSION =\n"V{version}";', app, count=1)
          app, n2 = re.subn(r'const APP_BUILD_DATE =\s*\n?"\d{2}\.\d{2}\.\d{4}";', f'const APP_BUILD_DATE =\n"{date}";', app, count=1)
          app, n3 = re.subn(r'const APP_BUILD_TIME =\s*\n?"\d{2}:\d{2}";', f'const APP_BUILD_TIME =\n"{time}";', app, count=1)
          if (n1,n2,n3) != (1,1,1):
              raise SystemExit(f'Could not normalize app metadata: {(n1,n2,n3)}')
          app_path.write_text(app, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, n4 = re.subn(r'CACHE_NAME = "master-of-disaster-v\d+"', f'CACHE_NAME = "master-of-disaster-v{version}"', sw, count=1)
          if n4 != 1:
              raise SystemExit('Could not normalize service-worker cache version')
          sw_path.write_text(sw, encoding='utf-8')

          print(f'Normalized build metadata to V{version} · {date} · {time}')
      - name: Commit normalization when needed
        shell: bash
        run: |
          if git diff --quiet -- app.js sw.js; then
            echo "Build metadata already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js
          git commit -m "chore: align build metadata [skip ci]"
          git push
