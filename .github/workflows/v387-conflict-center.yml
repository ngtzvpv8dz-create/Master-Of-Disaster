name: V387 Conflict Center

on:
  push:
    branches:
      - v387-conflict-center
    paths:
      - .github/workflows/v387-conflict-center.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v387-conflict-center

      - name: Build V387 read-only conflict center
        shell: python
        run: |
          from pathlib import Path
          import re

          js_path = Path('app.js')
          css_path = Path('app.css')
          index_path = Path('index.html')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          html = index_path.read_text(encoding='utf-8')

          helpers = r'''
/* ======================================
   V387 – LOCAL ↔ CLOUD KONFLIKTZENTRALE
   READ ONLY: KEIN AUTOMATISCHES ÜBERSCHREIBEN
====================================== */

function conflictNormalize(value) {
  if (value === undefined) return null;
  if (value === null) return null;
  if (typeof value === "number" && !Number.isFinite(value)) return null;
  if (Array.isArray(value)) return value.map(conflictNormalize);
  if (value && typeof value === "object") {
    const result = {};
    Object.keys(value).sort().forEach(key => {
      const normalized = conflictNormalize(value[key]);
      if (normalized !== undefined) result[key] = normalized;
    });
    return result;
  }
  return value;
}

function conflictEqual(a,b) {
  return JSON.stringify(conflictNormalize(a)) === JSON.stringify(conflictNormalize(b));
}

function conflictLatestIso(values) {
  let best = null;
  let bestMs = -1;
  (Array.isArray(values) ? values : []).flat(Infinity).forEach(value => {
    if (!value) return;
    const ms = new Date(value).getTime();
    if (Number.isFinite(ms) && ms > bestMs) {
      bestMs = ms;
      best = new Date(ms).toISOString();
    }
  });
  return best;
}

function conflictWinner(localTime,cloudTime) {
  const l = localTime ? new Date(localTime).getTime() : NaN;
  const c = cloudTime ? new Date(cloudTime).getTime() : NaN;
  if (Number.isFinite(l) && Number.isFinite(c)) {
    if (Math.abs(l - c) < 1000) return "same-time";
    return l > c ? "local-newer" : "cloud-newer";
  }
  if (Number.isFinite(l) && !Number.isFinite(c)) return "local-time-only";
  if (!Number.isFinite(l) && Number.isFinite(c)) return "cloud-time-only";
  return "unknown";
}

function conflictWinnerLabel(value) {
  if (value === "local-newer") return "📱 LOKAL NEUER";
  if (value === "cloud-newer") return "☁️ CLOUD NEUER";
  if (value === "same-time") return "🕒 GLEICHER ZEITPUNKT";
  if (value === "local-time-only") return "📱 NUR LOKALER ZEITPUNKT";
  if (value === "cloud-time-only") return "☁️ NUR CLOUD-ZEITPUNKT";
  return "❔ ZEITPUNKT UNKLAR";
}

function conflictFormatTime(value) {
  return value ? formatSupabaseSyncTimestamp(value) : "nicht sicher bestimmbar";
}

function conflictChangedFields(localValue,cloudValue,labels) {
  const keys = new Set([
    ...Object.keys(localValue || {}),
    ...Object.keys(cloudValue || {})
  ]);
  return [...keys]
    .filter(key => !conflictEqual(localValue ? localValue[key] : null, cloudValue ? cloudValue[key] : null))
    .map(key => labels && labels[key] ? labels[key] : key);
}

function conflictTaskLocal(task,activeSegments,cookingSegments) {
  return {
    text:String(task && task.text || ""),
    status:task && task.status || "open",
    type:task && task.type || "work",
    priority:task && task.priority || "normal",
    optional:Boolean(task && task.optional),
    dueMode:task && task.dueMode || "none",
    dueDate:task && task.dueDate || null,
    todayDate:task && task.todayDate || null,
    todayOrder:Number.isInteger(Number(task && task.todayOrder)) ? Number(task.todayOrder) : null,
    planDurationMs:importNonNegativeNumberOrNull(task && task.planDurationMs),
    startedAt:task && task.startedAt || null,
    pausedAt:task && task.pausedAt || null,
    completedAt:task && task.completedAt || null,
    abortedAt:task && task.abortedAt || null,
    pauseTotalMs:importNonNegativeNumberOrNull(task && task.pauseTotalMs) || 0,
    activeDurationMs:importNonNegativeNumberOrNull(task && task.activeDurationMs),
    actualDurationMs:importNonNegativeNumberOrNull(task && task.actualDurationMs),
    leisureDurationMs:importNonNegativeNumberOrNull(task && task.leisureDurationMs),
    passiveDurationMs:importNonNegativeNumberOrNull(task && task.passiveDurationMs),
    cookingActiveDurationMs:importNonNegativeNumberOrNull(task && task.cookingActiveDurationMs),
    cookingPassiveDurationMs:importNonNegativeNumberOrNull(task && task.cookingPassiveDurationMs),
    cookingMode:task && task.cookingMode || "active",
    abortedActiveDurationMs:importNonNegativeNumberOrNull(task && task.abortedActiveDurationMs),
    activeSegments:activeSegments,
    cookingSegments:cookingSegments
  };
}

function conflictTaskCloud(row,activeSegments,cookingSegments) {
  return {
    text:String(row && row.text || ""),
    status:row && row.status || "open",
    type:row && row.type || "work",
    priority:row && row.priority || "normal",
    optional:Boolean(row && row.optional),
    dueMode:row && row.due_mode || "none",
    dueDate:row && row.due_date || null,
    todayDate:row && row.today_date || null,
    todayOrder:Number.isInteger(Number(row && row.today_order)) ? Number(row.today_order) : null,
    planDurationMs:importNonNegativeNumberOrNull(row && row.plan_duration_ms),
    startedAt:row && row.started_at || null,
    pausedAt:row && row.paused_at || null,
    completedAt:row && row.completed_at || null,
    abortedAt:row && row.aborted_at || null,
    pauseTotalMs:importNonNegativeNumberOrNull(row && row.pause_total_ms) || 0,
    activeDurationMs:importNonNegativeNumberOrNull(row && row.active_duration_ms),
    actualDurationMs:importNonNegativeNumberOrNull(row && row.actual_duration_ms),
    leisureDurationMs:importNonNegativeNumberOrNull(row && row.leisure_duration_ms),
    passiveDurationMs:importNonNegativeNumberOrNull(row && row.passive_duration_ms),
    cookingActiveDurationMs:importNonNegativeNumberOrNull(row && row.cooking_active_duration_ms),
    cookingPassiveDurationMs:importNonNegativeNumberOrNull(row && row.cooking_passive_duration_ms),
    cookingMode:row && row.cooking_mode || "active",
    abortedActiveDurationMs:importNonNegativeNumberOrNull(row && row.aborted_active_duration_ms),
    activeSegments:activeSegments,
    cookingSegments:cookingSegments
  };
}

function conflictSegmentList(rows,kind) {
  return (Array.isArray(rows) ? rows : []).map(row => kind === "cooking"
    ? { mode:row.mode || null, startedAt:row.started_at || null, endedAt:row.ended_at || null, durationMs:importNonNegativeNumberOrNull(row.duration_ms) }
    : { startedAt:row.started_at || null, endedAt:row.ended_at || null, durationMs:importNonNegativeNumberOrNull(row.duration_ms), weightKg:importPositiveNumberOrNull(row.weight_kg) }
  ).sort((a,b) => String(a.startedAt || "").localeCompare(String(b.startedAt || "")));
}

function conflictLocalTaskSegments(task,kind) {
  const source = kind === "cooking" ? (task && task.cookingSegments) : (task && task.activeSegments);
  return (Array.isArray(source) ? source : []).map(segment => kind === "cooking"
    ? { mode:segment.mode || null, startedAt:segment.startedAt || null, endedAt:segment.endedAt || null, durationMs:importSegmentDurationMs(segment) }
    : { startedAt:segment.startedAt || null, endedAt:segment.endedAt || null, durationMs:importSegmentDurationMs(segment), weightKg:importPositiveNumberOrNull(segment.weightKg) }
  ).sort((a,b) => String(a.startedAt || "").localeCompare(String(b.startedAt || "")));
}

function conflictArchiveLocal(item,segments) {
  return {
    text:String(item && item.text || ""), status:item && item.status || "completed", type:item && item.type || "work",
    priority:item && item.priority || "normal", optional:Boolean(item && item.optional), dueMode:item && item.dueMode || "none",
    dueDate:item && item.dueDate || null, completedDate:item && item.completedDate || null, startedAt:item && item.startedAt || null,
    completedAt:item && item.completedAt || null, activeDurationMs:importNonNegativeNumberOrNull(item && item.activeDurationMs),
    actualDurationMs:importNonNegativeNumberOrNull(item && item.actualDurationMs), leisureDurationMs:importNonNegativeNumberOrNull(item && item.leisureDurationMs),
    cookingActiveDurationMs:importNonNegativeNumberOrNull(item && item.cookingActiveDurationMs), cookingPassiveDurationMs:importNonNegativeNumberOrNull(item && item.cookingPassiveDurationMs),
    pauseTotalMs:importNonNegativeNumberOrNull(item && item.pauseTotalMs) || 0, category:item && item.category || null, activeSegments:segments
  };
}

function conflictArchiveCloud(row,segments) {
  return {
    text:String(row && row.text || ""), status:row && row.status || "completed", type:row && row.type || "work",
    priority:row && row.priority || "normal", optional:Boolean(row && row.optional), dueMode:row && row.due_mode || "none",
    dueDate:row && row.due_date || null, completedDate:row && row.completed_date || null, startedAt:row && row.started_at || null,
    completedAt:row && row.completed_at || null, activeDurationMs:importNonNegativeNumberOrNull(row && row.active_duration_ms),
    actualDurationMs:importNonNegativeNumberOrNull(row && row.actual_duration_ms), leisureDurationMs:importNonNegativeNumberOrNull(row && row.leisure_duration_ms),
    cookingActiveDurationMs:importNonNegativeNumberOrNull(row && row.cooking_active_duration_ms), cookingPassiveDurationMs:importNonNegativeNumberOrNull(row && row.cooking_passive_duration_ms),
    pauseTotalMs:importNonNegativeNumberOrNull(row && row.pause_total_ms) || 0, category:row && row.category || null, activeSegments:segments
  };
}

const CONFLICT_FIELD_LABELS = {
  text:"Text",status:"Status",type:"Typ",priority:"Priorität",optional:"Optional",dueMode:"Fälligkeit",dueDate:"Fälligkeitsdatum",
  todayDate:"Heute-Zuordnung",todayOrder:"Heute-Reihenfolge",planDurationMs:"Planzeit",startedAt:"Startzeit",pausedAt:"Pausenzeit",
  completedAt:"Abschlusszeit",abortedAt:"Abbruchzeit",pauseTotalMs:"Pausendauer",activeDurationMs:"Aktive Zeit",actualDurationMs:"Gesamtzeit",
  leisureDurationMs:"Freizeit",passiveDurationMs:"Passive Zeit",cookingActiveDurationMs:"Kochen aktiv",cookingPassiveDurationMs:"Kochen passiv",
  cookingMode:"Kochmodus",abortedActiveDurationMs:"Abbruch-Aktivzeit",activeSegments:"Aktivsegmente",cookingSegments:"Kochsegmente",
  completedDate:"Archivdatum",category:"Kategorie",weightKg:"Gewicht",phaseDate:"Gewichtsdatum",nextArchiveNumber:"Nächste Archivnummer"
};

function conflictSummary(type,value,key) {
  if (!value) return "NICHT VORHANDEN";
  if (type === "task") return `${value.status || "?"} · ${value.text || "Unbenannte Aufgabe"}${value.activeDurationMs !== null && value.activeDurationMs !== undefined ? " · aktiv " + formatDuration(value.activeDurationMs) : ""}`;
  if (type === "archive") return `A${key} · ${value.text || "Unbenannte Archivaufgabe"}${value.activeDurationMs !== null && value.activeDurationMs !== undefined ? " · aktiv " + formatDuration(value.activeDurationMs) : ""}`;
  if (type === "weight") return `${value.weightKg || "?"} kg · ${value.startedAt ? conflictFormatTime(value.startedAt) : "Start unklar"}${value.endedAt ? " → " + conflictFormatTime(value.endedAt) : " · läuft"}`;
  if (type === "app") return `Nächste Archivnummer A${value.nextArchiveNumber || "?"}`;
  return String(value);
}

function conflictCardHtml(item,index) {
  const winnerClass = item.winner === "local-newer" ? "local" : item.winner === "cloud-newer" ? "cloud" : "unknown";
  return `
  <div class="cloud-conflict-item">
    <div class="cloud-conflict-head">
      <div>
        <div class="cloud-conflict-kind">${escapeHtml(item.kindLabel)}</div>
        <div class="cloud-conflict-title">${escapeHtml(item.title)}</div>
      </div>
      <div class="cloud-conflict-winner ${winnerClass}">${escapeHtml(conflictWinnerLabel(item.winner))}</div>
    </div>
    <div class="cloud-conflict-fields">ABWEICHEND · ${escapeHtml(item.changedFields.join(" · ") || "Datensatz fehlt auf einer Seite")}</div>
    <div class="cloud-conflict-columns">
      <div class="cloud-conflict-side local">
        <div class="cloud-conflict-side-title">📱 LOKAL</div>
        <div class="cloud-conflict-summary">${escapeHtml(item.localSummary)}</div>
        <div class="cloud-conflict-time">Letzte erkennbare Änderung: ${escapeHtml(conflictFormatTime(item.localTime))}</div>
      </div>
      <div class="cloud-conflict-side cloud">
        <div class="cloud-conflict-side-title">☁️ CLOUD</div>
        <div class="cloud-conflict-summary">${escapeHtml(item.cloudSummary)}</div>
        <div class="cloud-conflict-time">Letzte erkennbare Änderung: ${escapeHtml(conflictFormatTime(item.cloudTime))}</div>
      </div>
    </div>
    <div class="cloud-conflict-actions">
      <button class="cloud-conflict-choice" disabled>📱 LOKAL ÜBERNEHMEN</button>
      <button class="cloud-conflict-choice" disabled>☁️ CLOUD ÜBERNEHMEN</button>
    </div>
    <div class="cloud-conflict-readonly">V387 · NUR VERGLEICH · NOCH KEIN ÜBERSCHREIBEN</div>
  </div>`;
}

function renderSupabaseConflictCenterHtml() {
  const conflicts = Array.isArray(supabaseCloudStartCheckState.conflicts) ? supabaseCloudStartCheckState.conflicts : null;
  if (!conflicts) return "";
  if (!conflicts.length) {
    return `<div class="cloud-conflict-center ok"><div class="cloud-conflict-center-title">🛡️ KONFLIKTZENTRALE</div><div class="cloud-conflict-empty">Keine inhaltlichen Abweichungen gefunden. Lokal und Cloud sind auf Datensatzebene synchron. ✅</div></div>`;
  }
  return `<div class="cloud-conflict-center warn"><div class="cloud-conflict-center-title">⚠️ KONFLIKTZENTRALE · ${conflicts.length} ABWEICHUNG${conflicts.length === 1 ? "" : "EN"}</div><div class="cloud-conflict-intro">Nichts wurde automatisch überschrieben. Zeitangaben sind die jeweils letzte sicher erkennbare Änderung; fehlt ein eindeutiger Änderungszeitpunkt, wird das ausdrücklich angezeigt.</div>${conflicts.map(conflictCardHtml).join("")}</div>`;
}

'''

          new_function = r'''async function runSupabaseCloudStartCheck(manual = true) {
const client = getSupabaseClient();
if (!client) {
supabaseCloudStartCheckState = { status:"warn", label:"OFFLINE / KEIN CLIENT ⚠️", detail:"Lokale Daten bleiben führend. Es wird nichts aus der Cloud geladen.", checkedAt:new Date().toISOString(), counts:null, conflicts:null };
render();
return supabaseCloudStartCheckState;
}
try {
const { data:sessionData, error:sessionError } = await client.auth.getSession();
if (sessionError || !sessionData || !sessionData.session || !sessionData.session.user) {
supabaseCloudStartCheckState = { status:"warn", label:"NICHT ANGEMELDET ⚠️", detail:"Kein Cloud-Vergleich möglich. Local bleibt Master.", checkedAt:new Date().toISOString(), counts:null, conflicts:null };
render();
return supabaseCloudStartCheckState;
}
const userId = sessionData.session.user.id;
const tableNames=["app_state","tasks","task_active_segments","task_cooking_segments","archive_entries","archive_active_segments","weight_phases","legacy_metadata"];
const cloud={};
for (const table of tableNames) {
  const { data, error } = await client.from(table).select("*").eq("user_id",userId);
  if (error) throw new Error(table + ": " + error.message);
  cloud[table]=Array.isArray(data) ? data : [];
}
const counts={};
tableNames.forEach(table => counts[table]=cloud[table].length);
const conflicts=[];

const localTasks=tasks.filter(task => !isTestTask(task));
const localTaskMap=new Map(localTasks.filter(task => Number.isInteger(Number(task && task.id))).map(task => [Number(task.id),task]));
const cloudTaskMap=new Map(cloud.tasks.filter(row => Number.isInteger(Number(row && row.legacy_task_id))).map(row => [Number(row.legacy_task_id),row]));
const cloudTaskActiveById=new Map();
cloud.task_active_segments.forEach(row => { const list=cloudTaskActiveById.get(row.task_id)||[]; list.push(row); cloudTaskActiveById.set(row.task_id,list); });
const cloudTaskCookingById=new Map();
cloud.task_cooking_segments.forEach(row => { const list=cloudTaskCookingById.get(row.task_id)||[]; list.push(row); cloudTaskCookingById.set(row.task_id,list); });
const taskKeys=[...new Set([...localTaskMap.keys(),...cloudTaskMap.keys()])].sort((a,b)=>a-b);
for (const key of taskKeys) {
  const local=localTaskMap.get(key)||null;
  const row=cloudTaskMap.get(key)||null;
  const localValue=local ? conflictTaskLocal(local,conflictLocalTaskSegments(local,"active"),conflictLocalTaskSegments(local,"cooking")) : null;
  const cloudValue=row ? conflictTaskCloud(row,conflictSegmentList(cloudTaskActiveById.get(row.id)||[],"active"),conflictSegmentList(cloudTaskCookingById.get(row.id)||[],"cooking")) : null;
  if (!conflictEqual(localValue,cloudValue)) {
    const localTime=local ? conflictLatestIso([local.updatedAt,local.modifiedAt,local.completedAt,local.abortedAt,local.pausedAt,local.startedAt,(local.activeSegments||[]).map(s=>[s.endedAt,s.startedAt]),(local.cookingSegments||[]).map(s=>[s.endedAt,s.startedAt]), Number(local.id)>1577836800000 ? new Date(Number(local.id)).toISOString() : null]) : null;
    const cloudTime=row ? conflictLatestIso([row.updated_at,row.modified_at,row.completed_at,row.aborted_at,row.paused_at,row.started_at,row.created_at]) : null;
    conflicts.push({ kind:"task", kindLabel:"AUFGABE", title:localValue ? localValue.text : cloudValue ? cloudValue.text : `Aufgabe ${key}`, key, changedFields:conflictChangedFields(localValue||{},cloudValue||{},CONFLICT_FIELD_LABELS), localSummary:conflictSummary("task",localValue,key), cloudSummary:conflictSummary("task",cloudValue,key), localTime, cloudTime, winner:conflictWinner(localTime,cloudTime) });
  }
}

const localArchive=getRealArchiveForSupabaseImport();
const localArchiveMap=new Map(localArchive.filter(item => Number.isInteger(Number(item && item.archiveNumber))).map(item => [Number(item.archiveNumber),item]));
const cloudArchiveMap=new Map(cloud.archive_entries.filter(row => Number.isInteger(Number(row && row.archive_number))).map(row => [Number(row.archive_number),row]));
const cloudArchiveSegmentsById=new Map();
cloud.archive_active_segments.forEach(row => { const list=cloudArchiveSegmentsById.get(row.archive_entry_id)||[]; list.push(row); cloudArchiveSegmentsById.set(row.archive_entry_id,list); });
const archiveKeys=[...new Set([...localArchiveMap.keys(),...cloudArchiveMap.keys()])].sort((a,b)=>a-b);
for (const key of archiveKeys) {
  const local=localArchiveMap.get(key)||null;
  const row=cloudArchiveMap.get(key)||null;
  const localSegments=local ? (Array.isArray(local.activeSegments) ? local.activeSegments.map(segment => ({startedAt:segment.startedAt||null,endedAt:segment.endedAt||null,durationMs:importSegmentDurationMs(segment)})).sort((a,b)=>String(a.startedAt||"").localeCompare(String(b.startedAt||""))) : []) : [];
  const cloudSegments=row ? conflictSegmentList(cloudArchiveSegmentsById.get(row.id)||[],"archive").map(s=>({startedAt:s.startedAt,endedAt:s.endedAt,durationMs:s.durationMs})) : [];
  const localValue=local ? conflictArchiveLocal(local,localSegments) : null;
  const cloudValue=row ? conflictArchiveCloud(row,cloudSegments) : null;
  if (!conflictEqual(localValue,cloudValue)) {
    const localTime=local ? conflictLatestIso([local.updatedAt,local.modifiedAt,local.archivedAt,local.completedAt,(local.activeSegments||[]).map(s=>[s.endedAt,s.startedAt])]) : null;
    const cloudTime=row ? conflictLatestIso([row.updated_at,row.modified_at,row.archived_at,row.completed_at,row.created_at]) : null;
    conflicts.push({ kind:"archive", kindLabel:"ARCHIV", title:`A${String(key).padStart(3,"0")} · ${(localValue&&localValue.text)||(cloudValue&&cloudValue.text)||"Unbenannt"}`, key, changedFields:conflictChangedFields(localValue||{},cloudValue||{},CONFLICT_FIELD_LABELS), localSummary:conflictSummary("archive",localValue,key), cloudSummary:conflictSummary("archive",cloudValue,key), localTime, cloudTime, winner:conflictWinner(localTime,cloudTime) });
  }
}

const localWeightMap=new Map((Array.isArray(weightPhases)?weightPhases:[]).filter(phase=>Number.isInteger(Number(phase&&phase.id))).map(phase=>[Number(phase.id),phase]));
const cloudWeightMap=new Map(cloud.weight_phases.filter(row=>Number.isInteger(Number(row&&row.legacy_phase_id))).map(row=>[Number(row.legacy_phase_id),row]));
const weightKeys=[...new Set([...localWeightMap.keys(),...cloudWeightMap.keys()])].sort((a,b)=>a-b);
for (const key of weightKeys) {
  const local=localWeightMap.get(key)||null;
  const row=cloudWeightMap.get(key)||null;
  const localValue=local ? {weightKg:importPositiveNumberOrNull(local.weightKg),startedAt:local.startedAt||null,endedAt:local.endedAt||null,phaseDate:local.date||null} : null;
  const cloudValue=row ? {weightKg:importPositiveNumberOrNull(row.weight_kg),startedAt:row.started_at||null,endedAt:row.ended_at||null,phaseDate:row.phase_date||null} : null;
  if (!conflictEqual(localValue,cloudValue)) {
    const localTime=local ? conflictLatestIso([local.updatedAt,local.endedAt,local.startedAt]) : null;
    const cloudTime=row ? conflictLatestIso([row.updated_at,row.ended_at,row.started_at,row.created_at]) : null;
    conflicts.push({ kind:"weight", kindLabel:"ZUSATZGEWICHT", title:`Gewichtsphase ${key}`, key, changedFields:conflictChangedFields(localValue||{},cloudValue||{},CONFLICT_FIELD_LABELS), localSummary:conflictSummary("weight",localValue,key), cloudSummary:conflictSummary("weight",cloudValue,key), localTime, cloudTime, winner:conflictWinner(localTime,cloudTime) });
  }
}

const cloudState=cloud.app_state.length ? cloud.app_state[0] : null;
const localStateValue={nextArchiveNumber:Number(nextArchiveNumber)};
const cloudStateValue=cloudState ? {nextArchiveNumber:Number(cloudState.next_archive_number)} : null;
if (!conflictEqual(localStateValue,cloudStateValue)) {
  const cloudTime=cloudState ? conflictLatestIso([cloudState.updated_at,cloudState.created_at]) : null;
  conflicts.push({ kind:"app", kindLabel:"APP-ZUSTAND", title:"Nächste Archivnummer", key:"app_state", changedFields:conflictChangedFields(localStateValue,cloudStateValue||{},CONFLICT_FIELD_LABELS), localSummary:conflictSummary("app",localStateValue), cloudSummary:conflictSummary("app",cloudStateValue), localTime:null, cloudTime, winner:conflictWinner(null,cloudTime) });
}

const matches=conflicts.length===0;
supabaseCloudStartCheckState={
status:matches ? "ok" : "warn",
label:matches ? "LOCAL ↔ CLOUD VOLLVERGLEICH OK ✅" : `${conflicts.length} ABWEICHUNG${conflicts.length===1?"":"EN"} ERKANNT ⚠️`,
detail:matches ? `Datensatzvergleich sauber: ${localTasks.length} Tasks · ${localArchive.length} Archiv · ${localWeightMap.size} Gewichtsphasen. Es wurde nichts geschrieben.` : `Die Konfliktzentrale zeigt jede gefundene Abweichung einzeln. Es wird NICHTS automatisch überschrieben.`,
checkedAt:new Date().toISOString(),
counts,
conflicts
};
render();
return supabaseCloudStartCheckState;
} catch(error) {
supabaseCloudStartCheckState={ status:"error", label:"STARTCHECK-FEHLER ❌", detail:error&&error.message?error.message:"Unbekannter Fehler.", checkedAt:new Date().toISOString(), counts:null, conflicts:null };
render();
return supabaseCloudStartCheckState;
}
}'''

          marker = 'async function runSupabaseCloudStartCheck(manual = true) {'
          if marker not in js:
              raise SystemExit('Cloud startcheck function not found')
          js = js.replace(marker, helpers + marker, 1)
          pattern = r'async function runSupabaseCloudStartCheck\(manual = true\) \{.*?\n\}\n\nlet supabaseLiveSyncTimer = null;'
          replacement = new_function + '\n\nlet supabaseLiveSyncTimer = null;'
          js, count = re.subn(pattern, replacement, js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Cloud startcheck replacement count={count}')

          old_button = '<button class="supabase-dev-button secondary supabase-startcheck-action" onclick="runSupabaseCloudStartCheck(true)">☁️ LOCAL ↔ CLOUD VERGLEICHEN</button>'
          new_button = old_button + '\n${renderSupabaseConflictCenterHtml()}'
          if old_button not in js:
              raise SystemExit('DEV cloud compare button not found')
          js = js.replace(old_button,new_button,1)

