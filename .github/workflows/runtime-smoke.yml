name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check action-icons-v416.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V418 priority and free due date model
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});const r={status:'FAIL',version:'V418',module:false,inputModel:false,createdData:false,optionalRing:false,futureDue:false,overdueDue:false,todayNotOverdue:false,editModel:false,legacyOptional:false,errors:[]};try{let live=false;for(let i=0;i<18;i++){await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});if(/BUILD: V418/.test(await p.content())&&await p.evaluate(()=>window.__modActionIconsV416?.version==='V418')){live=true;break;}await p.waitForTimeout(10000);}if(!live)throw new Error('V418 not deployed');r.module=true;await p.waitForTimeout(250);r.inputModel=await p.evaluate(()=>!!document.getElementById('newPriorityOptional')&&!!document.getElementById('newDueDateV418')&&![...document.querySelectorAll('.option-label')].some(x=>x.textContent.trim()==='OPTIONAL'));
          await p.fill('#taskInput','Smoke V418 Frei');await p.click('#newPriorityOptional');await p.fill('#newDueDateV418','2027-03-22');await p.click('.add-button');await p.waitForTimeout(250);const id=await p.evaluate(()=>tasks.find(t=>t.text==='Smoke V418 Frei')?.id);if(!id)throw new Error('created task missing');r.createdData=await p.evaluate(id=>{const t=tasks.find(x=>x.id===id);return t&&t.priority==='optional'&&t.optional===true&&t.dueMode==='deadline'&&t.dueDate==='2027-03-22';},id);const cardXPath='xpath=ancestor::div[contains(concat(" ", normalize-space(@class), " "), " task ")][1]';const card=p.locator(`button[onclick="startTask(${id})"]`).locator(cardXPath);r.optionalRing=await card.locator('.priority-ring-v417.optional').count()===1;r.futureDue=await card.locator('.due-ring-v417.upcoming').evaluate(el=>el.textContent.includes('22.03.2027')&&!el.textContent.includes('!'));
          await p.evaluate(()=>{tasks.push({id:9418002,text:'Smoke V418 Alt Optional',status:'open',type:'work',priority:'normal',optional:true,dueMode:'none',dueDate:null,todayDate:null,startedAt:null,pausedAt:null,pauseTotalMs:0,activeSegments:[]});tasks.push({id:9418003,text:'Smoke V418 Ueberfaellig',status:'open',type:'work',priority:'normal',optional:false,dueMode:'deadline',dueDate:'2026-08-19',todayDate:null,startedAt:null,pausedAt:null,pauseTotalMs:0,activeSegments:[]});tasks.push({id:9418004,text:'Smoke V418 Heute',status:'open',type:'work',priority:'normal',optional:false,dueMode:'deadline',dueDate:getBerlinDateKey(),todayDate:null,startedAt:null,pausedAt:null,pauseTotalMs:0,activeSegments:[]});render();});await p.waitForTimeout(250);const legacy=p.locator('button[onclick="startTask(9418002)"]').locator(cardXPath),over=p.locator('button[onclick="startTask(9418003)"]').locator(cardXPath),today=p.locator('button[onclick="startTask(9418004)"]').locator(cardXPath);r.legacyOptional=await legacy.locator('.priority-ring-v417.optional').count()===1;r.overdueDue=await over.locator('.due-ring-v417.overdue').evaluate(el=>el.textContent.includes('19.08.2026')&&el.textContent.includes('!'));r.todayNotOverdue=await today.locator('.due-ring-v417.upcoming').evaluate(el=>!el.textContent.includes('!'));
          await card.locator('button[title="Bearbeiten"]').click();await p.waitForTimeout(120);r.editModel=await p.evaluate(()=>!!document.querySelector('.edit-area .priority-option-v418')&&document.querySelectorAll('.edit-area .priority-option-v418').length===4&&document.querySelector('.edit-area .due-date-input-v418')?.value==='2027-03-22'&&![...document.querySelectorAll('.edit-area .option-label')].some(x=>x.textContent.trim()==='OPTIONAL'));
          await p.evaluate(id=>{tasks=tasks.filter(t=>![id,9418002,9418003,9418004].includes(t.id));saveTasks();editingTaskId=null;render();},id);r.status=Object.entries(r).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';}catch(e){r.errors.push(String(e.stack||e))}fs.writeFileSync('runtime-status.txt',JSON.stringify(r,null,2));await b.close();if(r.status!=='PASS')process.exitCode=1})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
