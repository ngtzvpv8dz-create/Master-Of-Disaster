name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check active modules
        run: |
          node --check iphone-backup-v400.js
          node --check stats-and-rules-v403.js
          node --check categories.js
          node --check dev-version-v412.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V412 runtime and interactions
        run: |
          cat > smoke.js <<'JS'
          const { chromium }=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const errors=[];page.on('pageerror',e=>errors.push(e.message));let result={status:'FAIL',version:'unknown',categoriesTab:false,managerInTab:false,noToolbarManage:false,archiveEdit:false,archiveCategorySaved:false,archiveImmutable:false,normalBadgePassive:false,backup:false,statistics:false,deleteGuard:false,deployAttempts:0,errors:[]};
          try{let live=false;for(let i=1;i<=18;i++){result.deployAttempts=i;await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});const s=await page.evaluate(()=>({cat:!!window.__modCategoriesV412,backup:!!window.__modIphoneBackupV401}));const html=await page.content();live=s.cat&&s.backup&&/BUILD: V412/.test(html);if(live)break;await page.waitForTimeout(10000);}if(!live)throw new Error('V412 runtime not deployed');result.backup=true;
          result.deleteGuard=await page.evaluate(()=>window.__modStatsV403.hasStarted({status:'paused',startedAt:new Date().toISOString()})===true);
          await page.click('[data-tab="categories"]');await page.waitForTimeout(180);result.categoriesTab=(await page.locator('.category-page-v412').count())===1;result.managerInTab=(await page.locator('#categoryNewNameV412').count())===1;
          await page.click('[data-tab="all"]');await page.waitForTimeout(120);result.noToolbarManage=(await page.locator('#categoryToolbarV412 button').count())===0;
          await page.evaluate(()=>{tasks.push({id:9420001,text:'Smoke Normal',status:'open',type:'work',priority:'normal',optional:false,dueMode:'none',category:'Arbeit'});archive.push({archiveNumber:999998,archiveId:'smoke-archive-v412',text:'Smoke Archiv',status:'completed',type:'work',priority:'normal',optional:false,activeDurationMs:4321,completedAt:'2026-08-20T10:00:00.000Z',completedDate:'2026-08-20',category:null});localStorage.setItem('masterOfDisasterCategoriesV405',JSON.stringify(['Küche','Arbeit']));render();});await page.waitForTimeout(120);
          const normal=page.locator('button[onclick="startTask(9420001)"]').locator('xpath=ancestor::div[contains(@class,"task")][1]');result.normalBadgePassive=await normal.locator('.category-inline-v412').evaluate(el=>getComputedStyle(el).pointerEvents==='none');
          await page.click('[data-tab="archive"]');await page.waitForTimeout(180);const acard=page.locator('.archive-task').filter({hasText:'Smoke Archiv'}).first();const edit=acard.locator('.archive-category-edit-v412');result.archiveEdit=(await edit.count())===1;const before=await page.evaluate(()=>{const x=archive.find(a=>a.archiveId==='smoke-archive-v412');return JSON.stringify({text:x.text,status:x.status,activeDurationMs:x.activeDurationMs,completedAt:x.completedAt,completedDate:x.completedDate,archiveNumber:x.archiveNumber});});await edit.click();await page.waitForTimeout(50);await page.locator('#archiveCategoryV412').selectOption({label:'KÜCHE'});await page.locator('#archiveCategorySaveV412').click();await page.waitForTimeout(80);result.archiveCategorySaved=await page.evaluate(()=>archive.find(a=>a.archiveId==='smoke-archive-v412')?.category==='Küche');const after=await page.evaluate(()=>{const x=archive.find(a=>a.archiveId==='smoke-archive-v412');return JSON.stringify({text:x.text,status:x.status,activeDurationMs:x.activeDurationMs,completedAt:x.completedAt,completedDate:x.completedDate,archiveNumber:x.archiveNumber});});result.archiveImmutable=before===after;
          await page.click('[data-tab="statistics"]');await page.waitForTimeout(180);result.statistics=await page.locator('#extendedStatsV403').count()===1;result.version='V412';result.errors=errors;result.status=Object.entries(result).filter(([k])=>!['status','version','deployAttempts','errors'].includes(k)).every(([,v])=>v===true)&&!errors.length?'PASS':'FAIL';
          await page.evaluate(()=>{tasks=tasks.filter(t=>t.id!==9420001);archive=archive.filter(t=>t.archiveId!=='smoke-archive-v412');saveTasks();render();});}catch(e){result.errors.push(String(e.stack||e));}fs.writeFileSync('runtime-status.txt',JSON.stringify(result,null,2));console.log(result);await browser.close();if(result.status!=='PASS')process.exitCode=1;})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status
          cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" . || echo '{"status":"FAIL","errors":["runtime-status missing"]}' > runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
