name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V488
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:640}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            const out={status:'FAIL',version:'V488',live:false,bundle:false,metricsCurrent:false,segmentActiveCorrect:false,historicalActivePreserved:false,totalActiveCorrect:false,segmentGapsExcluded:false,cardBreakdownCorrect:false,editorBreakdownCorrect:false,scrollFixPreserved:false,terminalDeletePreserved:false,archiveSequenceRepair:true,remoteReopenCompleted:true,cookingParallel:true,integrity:true,renderStability:true,workBlocksPreserved:true,fixedShell:true,errors:[]};
            try{
              for(let i=0;i<24;i++){
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                const build=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V488'&&window.__modDevVersion?.version==='V488'&&!!window.__modHistoricalSegmentBreakdownV488).catch(()=>false);
                let metrics=null;try{metrics=await page.evaluate(async()=>{const r=await fetch('./development-metrics.json?smoke='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;});}catch(_){}
                if(build&&metrics?.version==='V488'&&metrics?.sourceCommit&&metrics.sourceCommit!=='pending'){out.live=true;break;}
                await page.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V488 build or generated metrics not deployed');
              out.bundle=await page.evaluate(()=>!!(window.__modHistoricalSegmentBreakdownV488&&window.__modSegmentActiveDurationV487&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485));
              out.metricsCurrent=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V488');

              await page.evaluate(()=>{
                tasks=[{id:217,text:'Kisten sortieren',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:null,todayOrder:null,
                  importedHistoricalProgressDurationMs:8760000,historicalAlreadyArchivedDurationMs:3360000,
                  startedAt:'2026-08-23T08:00:00Z',pausedAt:'2026-08-23T12:54:00Z',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,
                  activeSegments:[
                    {startedAt:'2026-08-23T08:00:00Z',endedAt:'2026-08-23T09:00:00Z'},
                    {startedAt:'2026-08-23T10:00:00Z',endedAt:'2026-08-23T10:48:00Z'},
                    {startedAt:'2026-08-23T12:14:00Z',endedAt:'2026-08-23T12:54:00Z'}
                  ]}];archive=[];nextArchiveNumber=265;saveTasks();saveArchive();switchTab('all');render();
              });await page.waitForTimeout(150);
              const state=await page.evaluate(()=>{const t=tasks[0],m=window.__modHistoricalSegmentBreakdownV488.segmentMetrics(t);return {m,calc:liveDuration(t),card:document.querySelector('.task .duration')?.innerText||''};});
              out.segmentActiveCorrect=state.m.activeMs===8880000;
              out.historicalActivePreserved=state.m.historicalMs===8760000;
              out.totalActiveCorrect=state.m.totalActiveMs===17640000&&state.calc===17640000;
              out.segmentGapsExcluded=state.m.gapMs===8760000&&state.m.activeMs!==state.m.totalActiveMs;
              out.cardBreakdownCorrect=['AKTIV · 02:28:00','HISTORISCH · 02:26:00','GESAMT AKTIV · 04:54:00','PAUSEN ZWISCHEN SEGMENTEN · 02:26:00 · NICHT ENTHALTEN'].every(x=>state.card.includes(x));

              await page.evaluate(()=>askManualTimes(217));await page.waitForTimeout(80);
              const editor=await page.locator('#segmentTotalV443').innerText();
              out.editorBreakdownCorrect=['AKTIVE SEGMENTE · 02:28:00','HISTORISCHER FORTSCHRITT · 02:26:00','AKTIVE GESAMTZEIT · 04:54:00','PAUSEN ZWISCHEN SEGMENTEN · 02:26:00 · NICHT ENTHALTEN'].every(x=>editor.includes(x));
              await page.getByRole('button',{name:'Zurück'}).click();

              await page.evaluate(()=>{tasks=[{id:4861,text:'Kochen',type:'cooking',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-23T12:00:00Z',pausedAt:'2026-08-23T12:20:00Z',pauseTotalMs:0,cookingMode:'passive',activeSegments:[{startedAt:'2026-08-23T12:00:00Z',endedAt:'2026-08-23T12:05:00Z'}],cookingSegments:[{mode:'active',startedAt:'2026-08-23T12:00:00Z',endedAt:'2026-08-23T12:05:00Z'},{mode:'passive',startedAt:'2026-08-23T12:05:00Z',endedAt:'2026-08-23T12:20:00Z'}]}];saveTasks();askManualTimes(4861);});
              await page.getByRole('button',{name:/KOCHABSCHNITT HINZUFÜGEN/i}).click();await page.waitForTimeout(120);
              const modal=await page.evaluate(()=>{const m=document.querySelector('.segment-editor-modal'),a=m?.querySelector('.modal-actions');return m&&a?{rows:document.querySelectorAll('#segmentRowsV443 [data-segment-row]').length,overflow:getComputedStyle(m).overflowY,sticky:getComputedStyle(a).position}:null;});
              out.scrollFixPreserved=!!modal&&modal.rows===3&&modal.overflow==='auto'&&modal.sticky==='sticky';
              await page.getByRole('button',{name:'Zurück'}).click();

              await page.evaluate(()=>{tasks=[{id:4851,text:'Delete smoke',status:'completed',type:'work',priority:'normal',activeDurationMs:180000,actualDurationMs:180000,activeSegments:[]}];archive=[];saveTasks();saveArchive();switchTab('all');render();});await page.waitForTimeout(100);
              await page.locator('.task',{hasText:'Delete smoke'}).first().locator('.terminal-delete-v485').click();out.terminalDeletePreserved=await page.locator('#terminalDeleteConfirmV485').isVisible();
              out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));await browser.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
