name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check app-hub-v515.js
          node --check app-hub-launcher-v603.js
          node --check surface-header-v603.js
          node --check service-worker-gate-v605.js
          node --check area-runtime-v605.js
          node --check kistology-v603.js
          node --check log-core-v603.js
          node --check backstage-v531.js
          node --check backstage-backup-v533.js
          node --check backup-model-v600.js
          node --check iphone-backup-v400.js
          node --check backup-stability-v506.js
          node --check backup-source-fallback-v506.js
          node --check history-safety-net-v498.js
          node --check sw.js
      - name: Resolve expected build
        run: |
          METRICS_OUTPUT=/tmp/runtime-expected.json node scripts/generate-development-metrics.mjs >/tmp/runtime-expected.log
          EXPECTED_VERSION=$(node -e "const m=require('/tmp/runtime-expected.json');if(!/^V\d+$/.test(m.version||''))process.exit(1);process.stdout.write(m.version)")
          echo "EXPECTED_VERSION=${EXPECTED_VERSION}" >> "$GITHUB_ENV"
          echo "Testing ${EXPECTED_VERSION}"
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live current build
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const expected=process.env.EXPECTED_VERSION;
          const vn=v=>Number(String(v||'').match(/^V(\d+)$/i)?.[1]||0);
          (async()=>{
            const out={status:'FAIL',version:expected,live:false,bootstrap:false,preloadOnly:false,reentry:false,home:false,todo:false,kistology:false,backstage:false,log:false,backup:false,serviceWorker:false,errors:[]};
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.route('**/*.supabase.co/**',route=>route.abort());
              let metrics=null;
              for(let i=0;i<12;i++){
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke=current-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1200);
                const state=await page.evaluate(()=>({
                  build:window.__MOD_BUILD__?.version||'',
                  hub:!!window.__modAppHubV603,
                  launcher:!!window.__modHubLauncherV603,
                  runtime:!!window.__modAreaRuntimeV605,
                  gate:!!window.__modWorkerGateV605
                })).catch(()=>({}));
                try{
                  metrics=await page.evaluate(async()=>{const r=await fetch('./development-metrics.json?smoke='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;});
                }catch(_){}
                if(vn(state.build)>=vn(expected)&&vn(metrics?.version)>=vn(expected)&&state.hub&&state.launcher&&state.runtime&&state.gate){
                  out.live=true;break;
                }
                await page.waitForTimeout(2500);
              }
              if(!out.live)throw new Error('Current build not deployed: expected '+expected+', metrics='+(metrics?.version||'none'));
              await page.evaluate(()=>window.__modAppHubV603.show());
              await page.waitForFunction(()=>!!window.__modAreaRuntimeV605,null,{timeout:30000});
              const liveBoot=await page.evaluate(()=>window.__modAreaRuntimeV605.preloadAll());
              if(liveBoot!==true)throw new Error('V605 live bootstrap returned false');
              await page.waitForFunction(()=>window.__modAreaRuntimeV605?.ready===true,null,{timeout:30000});
              out.bootstrap=await page.evaluate(()=>window.__modAreaRuntimeV605.ready===true&&window.__modAreaRuntimeV605.progress.percent===100);
              out.preloadOnly=await page.evaluate(()=>window.__modAreaRuntimeV605?.preloadMode==='worker-gated-light-cache-warm'&&window.__modAreaRuntimeV605?.executedCount===0&&window.__modAreaRuntimeV605?.warmAssetCount>0&&typeof window.render!=='function'&&!window.__modKistologyV603&&!window.__modFoodV544&&!window.__modBackstageV531);
              out.home=await page.evaluate(()=>document.body.classList.contains('mod-app-hub-v515')&&document.querySelector('.mod-hub-preload-v603')?.textContent.includes('100'));
              await page.evaluate(()=>window.__modAreaRuntimeV605.openArea('todo'));
              await page.waitForFunction(()=>typeof window.render==='function'&&window.__modBackupModelV600&&window.__modIphoneBackupV600,null,{timeout:30000});
              out.todo=await page.evaluate(()=>window.__modBackupModelV600?.version==='V600'&&window.__modIphoneBackupV600?.version==='V600');
              await page.evaluate(()=>window.__modAppHubV603.show());
              await page.evaluate(()=>window.__modAreaRuntimeV605.openArea('kistology'));
              await page.waitForFunction(()=>document.body.classList.contains('mod-kistology-v535')&&window.__modKistologyV603,null,{timeout:30000});
              out.kistology=await page.evaluate(()=>!!window.__modKistologyV603&&document.body.dataset.modAppSurfaceV515==='kistology');
              await page.evaluate(()=>window.__modAppHubV603.show());
              await page.evaluate(()=>window.__modAreaRuntimeV605.openArea('backstage'));
              await page.waitForFunction(()=>window.__modBackstageV531&&document.body.classList.contains('mod-backstage-v530'),null,{timeout:30000});
              out.backstage=await page.evaluate(()=>document.body.dataset.modAppSurfaceV515==='backstage');
              await page.evaluate(()=>window.__modBackstageV531.setSection('log'));
              await page.waitForFunction(()=>!!document.querySelector('#viewContainer .mod-log-v498'),null,{timeout:30000});
              out.log=await page.evaluate(()=>!!document.querySelector('#viewContainer .mod-log-v498')&&!document.querySelector('#viewContainer .live-log-v453'));
              await page.evaluate(async()=>{
                await window.__modAreaRuntimeV605.loadSection('backup');
                window.__modBackstageV531?.setSection?.('backup');
                window.__modBackstageBackupV533?.renderBackupDashboard?.();
              });
              await page.waitForFunction(()=>window.__modBackstageBackupV533&&window.__modBackupStabilityV506&&window.__modBackupSourceFallbackV506,null,{timeout:30000});
              out.backup=await page.evaluate(()=>!!(
                window.__modBackupModelV600?.weeklyCloudBackups===false &&
                window.__modBackupStabilityV506?.unifiedSupabaseExportV600===true &&
                window.__modBackupSourceFallbackV506?.patchRevision==='V506.3' &&
                document.querySelector('[data-backup-action-v533="fullbackup"]')
              ));
              const swPage=await browser.newPage({viewport:{width:390,height:640}});
              await swPage.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?runtime='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await swPage.waitForTimeout(1000);
              out.serviceWorker=await swPage.evaluate(async()=>{
                if(!('serviceWorker' in navigator))return false;
                try{
                  const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
                  return !!reg&&/sw\.js/.test(reg.active?.scriptURL||reg.waiting?.scriptURL||reg.installing?.scriptURL||'');
                }catch(_){return false;}
              });
              await swPage.close();

              const reentryPage=await browser.newPage({viewport:{width:390,height:844}});
              await reentryPage.route('**/*.supabase.co/**',route=>route.abort());
              await reentryPage.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?reentry='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await reentryPage.waitForFunction(()=>window.__modAreaRuntimeV605?.ready===true,null,{timeout:30000});
              out.reentry=await reentryPage.evaluate(async()=>{
                const gate=window.__modWorkerGateV605;
                const controllerVersion=await gate?.controllerVersion?.();
                return gate?.version==='V605'&&controllerVersion==='V605'&&window.__modAreaRuntimeV605?.preloadMode==='worker-gated-light-cache-warm'&&window.__modAreaRuntimeV605?.progress?.percent===100&&window.__modAreaRuntimeV605?.executedCount===0&&document.body.classList.contains('mod-app-hub-v515');
              });
              await reentryPage.waitForTimeout(1200);
              await reentryPage.close();

              out.status=['live','bootstrap','preloadOnly','reentry','home','todo','kistology','backstage','log','backup','serviceWorker'].every(k=>out[k]===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));
            await browser.close();
            if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
