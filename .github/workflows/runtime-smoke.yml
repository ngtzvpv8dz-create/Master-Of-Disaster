name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V417 compact three-line cards
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});const r={status:'FAIL',version:'V417',threeLine:false,timeFull:false,titleWider:false,actionsLeft:false,fixedMeta:false,errors:[]};try{let live=false;for(let i=0;i<18;i++){await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});if(/BUILD: V417/.test(await p.content())){live=true;break;}await p.waitForTimeout(10000);}if(!live)throw new Error('V417 runtime not deployed');await p.evaluate(()=>{const now=Date.now();tasks.push({id:9417001,text:'Smoke sehr lange Aufgabenbeschreibung fuer Wohnbereich und Buero',status:'paused',type:'work',priority:'high',optional:false,dueMode:'deadline',dueDate:getBerlinDateKey(),category:'Arbeit',startedAt:new Date(now-6540000).toISOString(),pausedAt:new Date(now-5400000).toISOString(),pauseTotalMs:0,activeSegments:[{startedAt:new Date(now-6540000).toISOString(),endedAt:new Date(now-5400000).toISOString()}]});render();});await p.waitForTimeout(180);const card=p.locator('button[onclick="resumeTask(9417001)"]').locator('xpath=ancestor::div[contains(@class,"task")][1]');r.threeLine=await card.evaluate(el=>getComputedStyle(el).gridTemplateRows.split(' ').length===3);r.timeFull=await card.locator('.compact-status-time-v416').evaluate(el=>el.scrollWidth<=el.clientWidth+1&&!el.textContent.includes('...'));const title=await card.locator('.task-text').boundingBox();r.titleWider=!!title&&title.width>220;r.actionsLeft=await card.locator('.compact-actions-v416').evaluate(el=>getComputedStyle(el).justifySelf==='start');const type=await card.locator('.compact-type-v416').boundingBox(),cat=await card.locator('.compact-category-v416').boundingBox();r.fixedMeta=!!type&&!!cat&&cat.x>type.x;r.status=Object.entries(r).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';await p.evaluate(()=>{tasks=tasks.filter(t=>t.id!==9417001);saveTasks();render();});}catch(e){r.errors.push(String(e.stack||e))}fs.writeFileSync('runtime-status.txt',JSON.stringify(r,null,2));await b.close();if(r.status!=='PASS')process.exitCode=1})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
