name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check today-create-render-v480.js && node --check remote-archive-sequence-v478.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V487
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:560}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            const out={status:'FAIL',version:'V487',live:false,bundle:false,metricsCurrent:false,segmentDurationFromActiveSegments:false,segmentGapsExcluded:false,segmentCardCorrect:false,completedDurationPreserved:false,segmentModalScrollable:false,segmentActionsSticky:false,thirdSegmentReachable:false,terminalDeleteButtons:false,deleteConfirmation:false,archiveSequenceRepair:false,remoteReopenCompleted:false,cookingParallel:false,integrity:false,renderStability:false,workBlocksPreserved:false,fixedShell:false,errors:[]};
            try{
              for(let i=0;i<24;i++){
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                const build=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V487'&&window.__modDevVersion?.version==='V487'&&!!window.__modSegmentActiveDurationV487).catch(()=>false);
                let metrics=null;try{metrics=await page.evaluate(async()=>{const r=await fetch('./development-metrics.json?smoke='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;});}catch(_){}
                if(build&&metrics?.version==='V487'&&metrics?.sourceCommit&&metrics.sourceCommit!=='pending'&&metrics?.repository?.currentTextLines>10000){out.live=true;break;}
                await page.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V487 build or generated metrics not deployed');
              out.bundle=await page.evaluate(()=>!!(window.__modSegmentActiveDurationV487&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modTodayCreateRenderV480&&window.__modRemoteArchiveSequenceV478&&window.__modTodayWorkBlocksV474));
              out.metricsCurrent=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V487');

              await page.evaluate(()=>{
                tasks=[{id:265,text:'Aufgabe 265 Live Segmenttest',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:null,todayOrder:null,startedAt:'2026-08-23T08:00:00Z',pausedAt:'2026-08-23T12:54:00Z',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,activeSegments:[
                  {startedAt:'2026-08-23T08:00:00Z',endedAt:'2026-08-23T09:00:00Z'},
                  {startedAt:'2026-08-23T10:00:00Z',endedAt:'2026-08-23T10:48:00Z'},
                  {startedAt:'2026-08-23T12:14:00Z',endedAt:'2026-08-23T12:54:00Z'}
                ]}];archive=[];saveTasks();saveArchive();switchTab('all');render();
              });await page.waitForTimeout(140);
              const segmentState=await page.evaluate(()=>({live:liveDuration(tasks[0]),wall:Date.parse(tasks[0].pausedAt)-Date.parse(tasks[0].startedAt),card:document.querySelector('.task .duration')?.innerText||''}));
              out.segmentDurationFromActiveSegments=segmentState.live===8880000;
              out.segmentGapsExcluded=segmentState.wall===17640000&&segmentState.live!==segmentState.wall;
              out.segmentCardCorrect=/2:28:00/.test(segmentState.card);
              await page.evaluate(()=>finishTask(265));await page.waitForTimeout(80);
              out.completedDurationPreserved=await page.evaluate(()=>tasks[0]?.status==='completed'&&tasks[0]?.activeDurationMs===8880000&&tasks[0]?.actualDurationMs===8880000&&tasks[0]?.activeSegments?.length===3);

              await page.evaluate(()=>{tasks=[{id:4861,text:'Kochabschnitt Live Scrolltest',type:'cooking',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-23T12:00:00Z',pausedAt:'2026-08-23T12:20:00Z',pauseTotalMs:0,cookingMode:'passive',activeSegments:[{startedAt:'2026-08-23T12:00:00Z',endedAt:'2026-08-23T12:05:00Z'}],cookingSegments:[{mode:'active',startedAt:'2026-08-23T12:00:00Z',endedAt:'2026-08-23T12:05:00Z'},{mode:'passive',startedAt:'2026-08-23T12:05:00Z',endedAt:'2026-08-23T12:20:00Z'}]}];saveTasks();askManualTimes(4861);});
              await page.getByRole('button',{name:/KOCHABSCHNITT HINZUFÜGEN/i}).click();await page.waitForTimeout(150);
              const modal=await page.evaluate(()=>{const m=document.querySelector('.segment-editor-modal'),a=m?.querySelector('.modal-actions');return m&&a?{rows:document.querySelectorAll('#segmentRowsV443 [data-segment-row]').length,overflow:getComputedStyle(m).overflowY,sticky:getComputedStyle(a).position,overflowing:m.scrollHeight>m.clientHeight,scrollTop:m.scrollTop}:null;});
              out.segmentModalScrollable=!!modal&&modal.overflow==='auto'&&modal.overflowing;
              out.segmentActionsSticky=!!modal&&modal.sticky==='sticky';
              out.thirdSegmentReachable=!!modal&&modal.rows===3&&modal.scrollTop>0;
              await page.getByRole('button',{name:'Zurück'}).click();

              await page.evaluate(()=>{tasks=[{id:4851,text:'Completed smoke delete',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeDurationMs:180000,actualDurationMs:180000,activeSegments:[]}];archive=[];saveTasks();saveArchive();switchTab('all');render();});await page.waitForTimeout(120);
              out.terminalDeleteButtons=await page.evaluate(()=>document.querySelectorAll('.terminal-delete-v485').length>=1);
              await page.locator('.task',{hasText:'Completed smoke delete'}).first().locator('.terminal-delete-v485').click();out.deleteConfirmation=await page.locator('#terminalDeleteConfirmV485').isVisible();await page.locator('#terminalDeleteCancelV485').click();

              out.remoteReopenCompleted=await page.evaluate(()=>{tasks=[{id:48491,text:'Reopen smoke',status:'completed',type:'work',todayOrder:3,startedAt:'2026-08-23T07:29:00Z',completedAt:'2026-08-23T07:32:00Z',activeDurationMs:180000,actualDurationMs:180000,activeSegments:[]}];saveTasks();window.__modRemoteTaskReopenV484.reopenCompletedTask({text:'Reopen smoke'});return tasks[0].status==='open'&&tasks[0].activeDurationMs===null&&tasks[0].todayOrder===3;});
              out.archiveSequenceRepair=await page.evaluate(()=>{archive=Array.from({length:254},(_,i)=>({archiveNumber:i+1,archiveId:`stable-${i+1}`}));for(let n=256;n<=262;n++)archive.push({archiveNumber:n,archiveId:`stable-${n}`});nextArchiveNumber=263;const r=window.__modRemoteArchiveSequenceV478.repairArchiveGap(255),nums=archive.map(x=>Number(x.archiveNumber)).sort((a,b)=>a-b);return nums.every((n,i)=>n===i+1)&&nextArchiveNumber===262&&r.shifted===7;});

              const cooking=await page.evaluate(()=>{tasks=[{id:48791,text:'Kochen',type:'cooking',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:48792,text:'Arbeit',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],pauseTotalMs:0}];saveTasks();startTask(48791);switchCookingMode(48791,'passive');startTask(48792);const rep=collectDataIntegrityReport();return {parallel:tasks[1].status==='running',errors:rep.errors||[]};});out.cookingParallel=cooking.parallel;out.integrity=cooking.errors.length===0;
              out.renderStability=await page.evaluate(()=>!!window.__modRenderStabilityV479&&!!window.__modTodayCreateRenderV480);
              out.workBlocksPreserved=await page.evaluate(()=>!!window.__modTodayWorkBlocksV474);
              out.fixedShell=await page.evaluate(()=>{const e=document.getElementById('appFixedTopV475');return !!e&&getComputedStyle(e).position==='sticky';});
              out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));await browser.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
