name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check voice-result-v483.js && node --check voice-commands-v482.js && node --check today-create-render-v480.js && node --check remote-archive-sequence-v478.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V483
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.addInitScript(()=>{
              class FakeRecognition{
                constructor(){window.__v483Fake=this;this.stopCount=0;this.abortCount=0;this.lang='';this.continuous=false;this.interimResults=false;this.maxAlternatives=1;}
                start(){queueMicrotask(()=>this.onstart?.());}
                stop(){this.stopCount++;queueMicrotask(()=>this.onaudioend?.());}
                abort(){this.abortCount++;queueMicrotask(()=>{this.onerror?.({error:'aborted'});this.onend?.();});}
                emit(text){const row=[{transcript:text,confidence:1}];row.isFinal=true;this.onresult?.({resultIndex:0,results:[row]});}
                end(){this.onend?.();}
              }
              window.webkitSpeechRecognition=FakeRecognition;
            });
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            const out={status:'FAIL',version:'V483',live:false,bundle:false,metricsCurrent:false,fixedShell:false,workBlocksPreserved:false,archiveSequenceRepair:false,cookingParallel:false,integrity:false,voiceTest:false,voiceConfirmation:false,voiceBlockCleanup:false,voiceMicrophoneStop:false,voiceResultAfterStop:false,voiceNoEarlyAbort:false,voiceCreate:false,voiceStart:false,voiceFinishParse:false,errors:[]};
            try{
              for(let i=0;i<24;i++){
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                const ready=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V483'&&window.__modDevVersion?.version==='V483'&&window.__modVoiceResultV483?.supported).catch(()=>false);
                let metrics=null;try{metrics=await page.evaluate(async()=>{const r=await fetch('./development-metrics.json?smoke='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;});}catch(_){}
                if(ready&&metrics?.version==='V483'&&metrics?.sourceCommit&&metrics.sourceCommit!=='pending'){out.live=true;break;}
                await page.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V483 build or metrics not deployed');
              out.bundle=await page.evaluate(()=>!!(window.__modVoiceResultV483&&window.__modVoiceCommandsV482&&window.__modTodayCreateRenderV480&&window.__modTodayWorkBlocksV474&&window.__modRemoteArchiveSequenceV478));
              out.metricsCurrent=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V483');
              out.voiceTest=await page.evaluate(()=>window.__modVoiceResultV483?.noOpenAiApi===true&&window.__modVoiceResultV483?.confirmationRequired===true&&!!document.getElementById('voiceCommandTestV483')&&!document.getElementById('voiceCommandTestV482'));
              out.voiceBlockCleanup=await page.evaluate(()=>{const p=window.__modVoiceCommandsV482.parseTranscript('Neue Aufgabe, Bart putzen, heute, Arbeits Block 2');return p.text==='Bart putzen'&&p.block===2&&p.today===true;});

              const setup=await page.evaluate(()=>{tasks=[];archive=[];saveTasks();localStorage.removeItem('masterOfDisasterTodayWorkBlocksV474');const date=getBerlinDateKey(),api=window.__modTodayWorkBlocksV474;api.addBlock('',{date,render:false});const b2=api.addBlock('SPÄTER',{date,render:false});switchTab('all');render();return b2.id;});
              await page.click('#voiceStartV483');await page.waitForFunction(()=>window.__modVoiceResultV483.listening===true);
              await page.click('#voiceStartV483');await page.waitForFunction(()=>window.__modVoiceResultV483.stopping===true&&window.__v483Fake.stopCount===1);
              out.voiceMicrophoneStop=await page.evaluate(()=>window.__v483Fake.stopCount===1);
              await page.waitForTimeout(900);
              out.voiceNoEarlyAbort=await page.evaluate(()=>window.__v483Fake.abortCount===0&&window.__modVoiceResultV483.pending===null&&window.__modVoiceResultV483.audioEnded===true);
              await page.evaluate(()=>window.__v483Fake.emit('Neue Aufgabe, Bart putzen, heute, Arbeitsblock 2'));
              await page.waitForFunction(()=>window.__modVoiceResultV483.pending?.type==='create');
              await page.evaluate(()=>window.__v483Fake.end());
              const preview=await page.evaluate(()=>({p:window.__modVoiceResultV483.pending,count:tasks.filter(t=>t.text==='Bart putzen').length,html:document.getElementById('voicePreviewV483')?.textContent||''}));
              out.voiceResultAfterStop=preview.p?.text==='Bart putzen'&&preview.p?.block===2&&preview.p?.today===true&&preview.count===0&&/AUSFÜHREN/.test(preview.html);
              out.voiceConfirmation=out.voiceResultAfterStop;
              await page.click('[data-v483-execute]');
              out.voiceCreate=await page.evaluate((b2)=>{const t=tasks.find(x=>x.text==='Bart putzen');return !!t&&t.todayDate===getBerlinDateKey()&&t.todayWorkBlockId===b2&&t.status==='open';},setup);

              await page.evaluate(()=>window.__modVoiceResultV483.acceptTranscript('Starte Bart putzen'));
              const sp=await page.evaluate(()=>({p:window.__modVoiceResultV483.pending,s:tasks.find(t=>t.text==='Bart putzen')?.status}));
              await page.click('[data-v483-execute]');
              out.voiceStart=sp.p?.resolvedTask?.text==='Bart putzen'&&sp.s==='open'&&await page.evaluate(()=>tasks.find(t=>t.text==='Bart putzen')?.status==='running');
              await page.evaluate(()=>window.__modVoiceResultV483.acceptTranscript('Bart putzen ist fertig'));
              out.voiceFinishParse=await page.evaluate(()=>window.__modVoiceResultV483.pending?.type==='finish'&&window.__modVoiceResultV483.pending?.resolvedTask?.text==='Bart putzen');

              out.workBlocksPreserved=await page.evaluate(()=>{switchTab('today');render();return !!document.querySelector('.work-block-toolbar-v474')&&document.querySelectorAll('.work-block-v474').length>=1;});
              out.fixedShell=await page.evaluate(()=>{const e=document.getElementById('appFixedTopV475');return !!e&&getComputedStyle(e).position==='sticky';});
              out.archiveSequenceRepair=await page.evaluate(()=>{archive=Array.from({length:254},(_,i)=>({archiveNumber:i+1,archiveId:`s-${i+1}`,text:`A${i+1}`}));for(let n=256;n<=262;n++)archive.push({archiveNumber:n,archiveId:`s-${n}`,text:`A${n}`});nextArchiveNumber=263;const r=window.__modRemoteArchiveSequenceV478.repairArchiveGap(255),ok=archive.length===261&&nextArchiveNumber===262&&r.shifted===7&&r.sequence_contiguous;archive=[];nextArchiveNumber=1;saveArchive();return ok;});
              const cooking=await page.evaluate(()=>{tasks=[{id:48391,text:'Kochen',type:'cooking',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:48392,text:'Arbeit',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],pauseTotalMs:0}];saveTasks();startTask(48391);switchCookingMode(48391,'passive');startTask(48392);const rep=collectDataIntegrityReport();return {parallel:tasks[1].status==='running',errors:rep.errors||[]};});
              out.cookingParallel=cooking.parallel;out.integrity=cooking.errors.length===0;
              out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));
            await browser.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
