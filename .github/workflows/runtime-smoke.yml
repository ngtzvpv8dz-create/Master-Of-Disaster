name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: runtime-smoke
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test live runtime and tab switching
        shell: bash
        run: |
          cat > /tmp/smoke.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror', e=>errors.push('PAGEERROR: '+e.message));
            page.on('console', m=>{ if(m.type()==='error') errors.push('CONSOLE: '+m.text()); });
            let status='PASS';
            let detail='';
            try {
              await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?runtime_probe='+Date.now(), {waitUntil:'networkidle', timeout:60000});
              await page.waitForSelector('[data-tab="today"]', {timeout:15000});
              await page.click('[data-tab="today"]');
              await page.waitForTimeout(500);
              const todayActive = await page.locator('[data-tab="today"]').evaluate(el=>el.classList.contains('active'));
              await page.click('[data-tab="dev"]');
              await page.waitForTimeout(500);
              const devActive = await page.locator('[data-tab="dev"]').evaluate(el=>el.classList.contains('active'));
              if (!todayActive || !devActive || errors.length) {
                status='FAIL';
                detail=`today=${todayActive} dev=${devActive} errors=${errors.join(' | ')}`;
              } else detail='today=true dev=true errors=none';
            } catch(e) {
              status='FAIL'; detail='EXCEPTION: '+e.stack+' ERRORS: '+errors.join(' | ');
            }
            require('fs').writeFileSync('/tmp/runtime-status.txt', `STATUS=${status}\nDETAIL=${detail}\nCHECKED_AT=${new Date().toISOString()}\n`);
            console.log(require('fs').readFileSync('/tmp/runtime-status.txt','utf8'));
            await browser.close();
            if(status!=='PASS') process.exitCode=1;
          })();
          JS
          node /tmp/smoke.js || true
      - name: Publish runtime result
        shell: bash
        run: |
          git init /tmp/statusrepo
          cd /tmp/statusrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/runtime-status.txt ./runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
