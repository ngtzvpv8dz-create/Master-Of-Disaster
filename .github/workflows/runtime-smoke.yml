name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check active modules
        run: |
          node --check iphone-backup-v400.js
          node --check stats-and-rules-v403.js
          node --check categories.js
          node --check archive-category-v413.js
          node --check dev-version-v413.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V413 archive category interaction
        run: |
          cat > smoke.js <<'JS'
          const { chromium }=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const errors=[];page.on('pageerror',e=>errors.push(e.message));let result={status:'FAIL',version:'unknown',categoriesTab:false,noExtraArchiveButton:false,archiveBadgeClickable:false,archiveModal:false,archiveCategorySaved:false,archiveImmutable:false,normalBadgePassive:false,backup:false,deployAttempts:0,errors:[]};
          try{let live=false;for(let i=1;i<=18;i++){result.deployAttempts=i;await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});const s=await page.evaluate(()=>({cat:!!window.__modCategoriesV412,archive:!!window.__modArchiveCategoryV413,backup:!!window.__modIphoneBackupV401}));const html=await page.content();live=s.cat&&s.archive&&s.backup&&/BUILD: V413/.test(html);if(live)break;await page.waitForTimeout(10000);}if(!live)throw new Error('V413 runtime not deployed');result.backup=true;
          await page.click('[data-tab="categories"]');await page.waitForTimeout(120);result.categoriesTab=(await page.locator('.category-page-v412').count())===1;
          await page.click('[data-tab="all"]');await page.evaluate(()=>{tasks.push({id:9430001,text:'Smoke Normal',status:'open',type:'work',priority:'normal',optional:false,dueMode:'none',category:'Arbeit'});localStorage.setItem('masterOfDisasterCategoriesV405',JSON.stringify(['Küche','Arbeit']));render();});await page.waitForTimeout(120);
          const normal=page.locator('button[onclick="startTask(9430001)"]').locator('xpath=ancestor::div[contains(@class,"task")][1]');result.normalBadgePassive=await normal.locator('.category-inline-v412').evaluate(el=>getComputedStyle(el).pointerEvents==='none');
          await page.click('[data-tab="archive"]');await page.waitForTimeout(180);const filter=page.locator('#categoryFilterV412');if(await filter.count()){await filter.selectOption('all');await page.waitForTimeout(80);}const acard=page.locator('.archive-task:visible').first();if(!(await acard.count()))throw new Error('No visible archive card');const target=await acard.evaluate(card=>{const r=window.__modCategoriesV412.rowForCard(card);return {archiveNumber:r?.archiveNumber,category:r?.category??null};});if(!target.archiveNumber)throw new Error('Visible archive card could not be resolved');const badge=acard.locator('.category-inline-v412');result.noExtraArchiveButton=(await acard.locator('.archive-category-edit-v412').count())===0;result.archiveBadgeClickable=(await badge.count())===1&&await badge.evaluate(el=>getComputedStyle(el).pointerEvents==='auto'&&el.getAttribute('role')==='button');const before=await page.evaluate(n=>{const x=archive.find(a=>Number(a.archiveNumber)===Number(n));const y={...x};delete y.category;return JSON.stringify(y);},target.archiveNumber);await badge.click();await page.waitForTimeout(60);result.archiveModal=(await page.locator('#archiveCategoryV412').count())===1;const next=String(target.category||'').toLowerCase()==='arbeit'?'Küche':'Arbeit';await page.locator('#archiveCategoryV412').selectOption({label:next.toUpperCase()});await page.locator('#archiveCategorySaveV412').click();await page.waitForTimeout(80);result.archiveCategorySaved=await page.evaluate(({n,next})=>archive.find(a=>Number(a.archiveNumber)===Number(n))?.category===next,{n:target.archiveNumber,next});const after=await page.evaluate(n=>{const x=archive.find(a=>Number(a.archiveNumber)===Number(n));const y={...x};delete y.category;return JSON.stringify(y);},target.archiveNumber);result.archiveImmutable=before===after;await page.evaluate(({n,category})=>{const x=archive.find(a=>Number(a.archiveNumber)===Number(n));if(x)x.category=category||null;tasks=tasks.filter(t=>t.id!==9430001);saveTasks();render();},{n:target.archiveNumber,category:target.category});
          result.version='V413';result.errors=errors;result.status=Object.entries(result).filter(([k])=>!['status','version','deployAttempts','errors'].includes(k)).every(([,v])=>v===true)&&!errors.length?'PASS':'FAIL';}catch(e){result.errors.push(String(e.stack||e));}fs.writeFileSync('runtime-status.txt',JSON.stringify(result,null,2));console.log(result);await browser.close();if(result.status!=='PASS')process.exitCode=1;})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status
          cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" . || echo '{"status":"FAIL","errors":["runtime-status missing"]}' > runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
