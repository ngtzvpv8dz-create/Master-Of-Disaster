name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check active V416 modules
        run: |
          node --check compact-task-layout-v416.js
          node --check tab-visibility-v415.js
          node --check categories.js
          node --check archive-category-v413.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V416 compact two-line cards
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});const r={status:'FAIL',version:'V416',module:false,twoLine:false,heightCompact:false,openSquareGone:false,pausedCoffeeLeft:false,pausedTimeLeft:false,fixedMeta:false,actionsCompact:false,editWorks:false,dataImmutable:false,inputPanelRule:false,errors:[]};try{
          let live=false;for(let i=0;i<18;i++){await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});if(/BUILD: V416/.test(await p.content())&&await p.evaluate(()=>!!window.__modCompactTaskV416)){live=true;break;}await p.waitForTimeout(10000);}if(!live)throw new Error('V416 runtime not deployed');r.module=true;
          const ids={open:9416001,paused:9416002};await p.evaluate(ids=>{const today=typeof getBerlinDateKey==='function'?getBerlinDateKey():'2026-08-20';const now=Date.now();tasks.push({id:ids.open,text:'Smoke kompakte Aufgabe mit etwas längerem Titel',status:'open',type:'work',priority:'high',optional:false,dueMode:'deadline',dueDate:today,todayDate:today,todayOrder:1,category:'Arbeit',startedAt:null,pausedAt:null,pauseTotalMs:0,activeSegments:[]});tasks.push({id:ids.paused,text:'Smoke Pause',status:'paused',type:'leisure',priority:'medium',optional:false,dueMode:'none',dueDate:null,todayDate:today,todayOrder:2,category:'Outdoor',startedAt:new Date(now-600000).toISOString(),pausedAt:new Date(now-300000).toISOString(),pauseTotalMs:0,activeSegments:[{startedAt:new Date(now-600000).toISOString(),endedAt:new Date(now-300000).toISOString()}]});localStorage.setItem('masterOfDisasterCategoriesV405',JSON.stringify(['Arbeit','Outdoor']));render();},ids);await p.waitForTimeout(180);
          const open=p.locator('button[onclick="startTask(9416001)"]').locator('xpath=ancestor::div[contains(@class,"task")][1]');const paused=p.locator('button[onclick="resumeTask(9416002)"]').locator('xpath=ancestor::div[contains(@class,"task")][1]');const oh=await open.boundingBox(),ph=await paused.boundingBox();r.heightCompact=!!oh&&!!ph&&oh.height<=60&&ph.height<=60;r.twoLine=await open.evaluate(el=>{const s=getComputedStyle(el);return s.display==='grid'&&s.gridTemplateRows.split(' ').length===2&&!!el.querySelector('.compact-info-v416')&&!!el.querySelector('.compact-content-v416');});r.openSquareGone=await open.locator('.compact-left-v416 .status-symbol').evaluate(el=>!el.textContent.includes('⬜'));r.pausedCoffeeLeft=await paused.locator('.compact-left-v416').evaluate(el=>el.textContent.includes('☕'));r.pausedTimeLeft=await paused.locator('.compact-left-v416 .compact-status-time-v416').evaluate(el=>el.textContent.trim().length>0);
          const opType=await open.locator('.compact-type-v416').boundingBox(),paType=await paused.locator('.compact-type-v416').boundingBox(),opCat=await open.locator('.compact-category-v416').boundingBox(),paCat=await paused.locator('.compact-category-v416').boundingBox();r.fixedMeta=!!opType&&!!paType&&!!opCat&&!!paCat&&Math.abs(opType.x-paType.x)<2&&Math.abs(opCat.x-paCat.x)<2;r.actionsCompact=await open.locator('.compact-actions-v416 .icon-action').evaluateAll(btns=>btns.length>=4&&btns.every(b=>b.getBoundingClientRect().width<=26&&b.getBoundingClientRect().height<=26));
          const before=await p.evaluate(id=>JSON.stringify(tasks.find(t=>t.id===id)),ids.paused);await paused.locator('button[title="Bearbeiten"]').click();await p.waitForTimeout(80);r.editWorks=(await p.locator('#edit-9416002').count())===1;await p.locator('.edit-actions .edit-button').filter({hasText:'ABBRECHEN'}).click();await p.waitForTimeout(100);const after=await p.evaluate(id=>JSON.stringify(tasks.find(t=>t.id===id)),ids.paused);r.dataImmutable=before===after;
          const tabs=['all','today','priority','due','active','completed','archive','statistics','categories','dev'];const states={};for(const tab of tabs){await p.click('[data-tab="'+tab+'"]');await p.waitForTimeout(50);states[tab]=await p.locator('#inputPanel').evaluate(el=>getComputedStyle(el).display!=='none');}r.inputPanelRule=states.all===true&&tabs.filter(t=>t!=='all').every(t=>states[t]===false);
          await p.evaluate(ids=>{tasks=tasks.filter(t=>![ids.open,ids.paused].includes(t.id));saveTasks();render();},ids);r.status=Object.entries(r).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
          }catch(e){r.errors.push(String(e.stack||e))}fs.writeFileSync('runtime-status.txt',JSON.stringify(r,null,2));console.log(r);await b.close();if(r.status!=='PASS')process.exitCode=1})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
