name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check ui-alignment-v493.js && node --check task-card-rail-polish-v492.js && node --check ui-card-stability-v491.js && node --check nested-task-weight-layout-v490.js && node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V493
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            const out={status:'FAIL',version:'V493',live:false,bundle:false,metricsCurrent:false,numberStatusRailAllTabs:false,fourDigitReady:false,numberTitleAligned:false,statusBelowNumber:false,archiveRailReady:false,activeSourceSplit:false,historicalDuplicateRemoved:false,inputOptionIndent:false,subtleWeightStyle:false,weightSecondLineAligned:false,segmentSeparator:false,actionsBottom:false,todayArrows:false,todayIconsConsistent:false,cardStable:false,nestedWeightPreserved:false,archiveCompactPreserved:false,compactLog:false,v492Preserved:false,v491Preserved:false,v490Preserved:false,v489Preserved:false,v488Preserved:false,scrollFixPreserved:false,terminalDeletePreserved:false,remoteReopenCompleted:false,archiveSequenceRepair:false,cookingParallel:false,integrity:false,renderStability:false,workBlocksPreserved:false,fixedShell:false,errors:[]};
            try{
              for(let i=0;i<24;i++){
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                const build=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V493'&&window.__modDevVersion?.version==='V493'&&!!window.__modUiAlignmentV493).catch(()=>false);
                let metrics=null;try{metrics=await page.evaluate(async()=>{const r=await fetch('./development-metrics.json?smoke='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;});}catch(_){}
                if(build&&metrics?.version==='V493'&&metrics?.sourceCommit&&metrics.sourceCommit!=='pending'){out.live=true;break;}
                await page.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V493 build or generated metrics not deployed');
              out.bundle=await page.evaluate(()=>!!(window.__modUiAlignmentV493&&window.__modTaskCardRailPolishV492&&window.__modUiCardStabilityV491&&window.__modNestedTaskWeightLayoutV490&&window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modRemoteArchiveSequenceV478));
              out.metricsCurrent=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V493');

              await page.evaluate(()=>{
                const day=getBerlinDateKey();localStorage.removeItem(window.__modTodayWorkBlocksV474.storageKey);
                tasks=[
                  {id:263,text:'V493 Live Nur Altzeit 30m',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,todayWorkBlockId:null,importedHistoricalProgressDurationMs:1800000,activeDurationMs:1800000,actualDurationMs:1800000,startedAt:'2026-06-12T10:00:00+02:00',pausedAt:'2026-06-12T10:30:00+02:00',pauseTotalMs:0,activeSegments:[]},
                  {id:264,text:'V493 Live Nur Altzeit 90m',type:'work',status:'paused',priority:'high',optional:false,dueMode:'deadline',dueDate:day,todayDate:day,todayOrder:2,todayWorkBlockId:null,importedHistoricalProgressDurationMs:5400000,activeDurationMs:5400000,actualDurationMs:5400000,startedAt:'2026-06-12T11:00:00+02:00',pausedAt:'2026-06-12T12:30:00+02:00',pauseTotalMs:0,activeSegments:[]},
                  {id:265,text:'V493 Live Alt plus App',type:'work',status:'paused',priority:'high',optional:false,dueMode:'deadline',dueDate:day,todayDate:day,todayOrder:3,todayWorkBlockId:null,importedHistoricalProgressDurationMs:1800000,activeDurationMs:null,actualDurationMs:null,startedAt:'2026-08-23T18:00:00+02:00',pausedAt:'2026-08-23T18:10:00+02:00',pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-23T18:00:00+02:00',endedAt:'2026-08-23T18:10:00+02:00'}]}
                ];
                weightPhases=[{id:49301,weightKg:12.3,startedAt:'2026-08-23T18:00:00+02:00',endedAt:'2026-08-23T18:10:00+02:00'}];weightState={isWearing:false,currentWeightKg:12.3};archive=[];nextArchiveNumber=1;saveTasks();saveArchive();saveWeight();window.__modTodayWorkBlocksV474.ensureTodayModel(day,[]);saveTasks();switchTab('all');render();
              });await page.waitForTimeout(500);

              const railResults=[];
              for(const tab of ['all','today','priority','due','active']){
                await page.evaluate(t=>{switchTab(t);render();},tab);await page.waitForTimeout(250);
                const card=page.locator('.task[data-v490-task-id="265"]:visible').first();
                const result=await card.evaluate(card=>{const rail=card.querySelector(':scope>.v492-number-status-rail'),num=rail?.querySelector('.task-number'),status=rail?.querySelector('.status-symbol');if(num)num.textContent='9.999';window.__modUiAlignmentV493.alignNumberWithTitle(card);const nr=num?.getBoundingClientRect(),sr=status?.getBoundingClientRect(),rr=rail?.getBoundingClientRect();return {rail:!!rail,numTop:nr?.top,statusTop:sr?.top,width:rr?.width,overflow:num?num.scrollWidth-num.clientWidth:999};});railResults.push(result);
              }
              out.numberStatusRailAllTabs=railResults.every(r=>r.rail&&r.numTop<r.statusTop&&r.width>=41);
              out.fourDigitReady=railResults.every(r=>r.overflow<=0);

              await page.evaluate(()=>{switchTab('all');render();});await page.waitForTimeout(300);
              const historical=await page.evaluate(()=>{
                const result={};for(const id of [263,264,265]){const card=document.querySelector(`.task[data-v490-task-id="${id}"]`);result[id]={text:card?.querySelector('.historical-segment-duration-v488')?.innerText||'',hist:card?.querySelectorAll('.v490-historical').length||0,seg:card?.querySelectorAll('.task-detail-v490 .v490-segment').length||0};}return result;
              });
              out.activeSourceSplit=historical[263].text.includes('SEIT APP AKTIV · 00:00:00')&&historical[263].text.includes('+ VOR APP AKTIV · 00:30:00')&&historical[263].text.includes('= GESAMT AKTIV · 00:30:00')&&historical[264].text.includes('SEIT APP AKTIV · 00:00:00')&&historical[264].text.includes('+ VOR APP AKTIV · 01:30:00')&&historical[264].text.includes('= GESAMT AKTIV · 01:30:00')&&historical[265].text.includes('SEIT APP AKTIV · 00:10:00')&&historical[265].text.includes('+ VOR APP AKTIV · 00:30:00')&&historical[265].text.includes('= GESAMT AKTIV · 00:40:00');
              out.historicalDuplicateRemoved=historical[263].hist===0&&historical[263].seg===0&&historical[264].hist===0&&historical[264].seg===0&&historical[265].hist===0&&historical[265].seg===1;

              const detail=await page.locator('.task[data-v490-task-id="265"]:visible').evaluate(card=>{
                function glyph(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const t=n.textContent||'';const i=t.search(/\S/);if(i>=0){const r=document.createRange();r.setStart(n,i);r.setEnd(n,Math.min(i+1,t.length));return r.getBoundingClientRect();}}return el.getBoundingClientRect();}
                const rail=card.querySelector(':scope>.v492-number-status-rail'),num=rail.querySelector('.task-number'),status=rail.querySelector('.status-symbol'),title=card.querySelector('.task-text');num.textContent='9.999';window.__modUiAlignmentV493.alignNumberWithTitle(card);const nr=glyph(num),tr=glyph(title),sr=status.getBoundingClientRect();const partial=card.querySelector('.v490-weight-full,.v490-weight-partial'),copy=partial?.querySelector('.v492-weight-copy'),sub=card.querySelector('.v490-weight-subline'),overall=card.querySelector('.v490-overall-weight'),block=card.querySelector('.task-detail-v490');const ps=partial?getComputedStyle(partial):null,os=overall?getComputedStyle(overall):null;return {headingDiff:Math.abs(nr.bottom-tr.bottom),statusBelow:sr.top>=nr.bottom-0.5,color:ps?.color,fontWeight:Number(ps?.fontWeight||999),overallColor:os?.color,overallWeight:Number(os?.fontWeight||999),copyX:copy?.getBoundingClientRect().left,subX:sub?sub.getBoundingClientRect().left+(parseFloat(getComputedStyle(sub).paddingLeft)||0):null,border:block?getComputedStyle(block).borderTopWidth:null,actionsLast:card.querySelector('.task-content')?.lastElementChild===card.querySelector('.icon-actions'),todayIcon:card.querySelector('button[data-v480-today-action="1"]')?.dataset.iconV416||null,nested:card.querySelectorAll('.v490-weight-nested').length};
              });
              out.numberTitleAligned=detail.headingDiff<=0.8;out.statusBelowNumber=detail.statusBelow;out.subtleWeightStyle=detail.color==='rgb(126, 139, 104)'&&detail.overallColor==='rgb(126, 139, 104)'&&detail.fontWeight<=500&&detail.overallWeight<=500;out.weightSecondLineAligned=detail.subX===null||Math.abs(detail.copyX-detail.subX)<=0.75;out.segmentSeparator=detail.border==='1px';out.actionsBottom=detail.actionsLast;out.todayIconsConsistent=detail.todayIcon==='calendarPin';out.nestedWeightPreserved=detail.nested>=1;

              const optionResult=await page.evaluate(()=>{const rows=[...document.querySelectorAll('#inputPanel .option-row')];rows.forEach(r=>r.style.width='220px');window.__modUiAlignmentV493.alignInputOptions();const a=document.getElementById('newTypeWork').getBoundingClientRect(),b=document.getElementById('newTypeSelfrunner').getBoundingClientRect(),c=document.getElementById('newPriorityNormal').getBoundingClientRect(),d=document.getElementById('newPriorityHigh').getBoundingClientRect();return {type:b.top>a.top+1&&Math.abs(b.left-a.left)<=0.8,priority:d.top>c.top+1&&Math.abs(d.left-c.left)<=0.8,wraps:document.querySelectorAll('#inputPanel .v493-option-buttons').length};});out.inputOptionIndent=optionResult.type&&optionResult.priority&&optionResult.wraps===4;

              await page.evaluate(()=>{switchTab('today');render();});await page.waitForTimeout(350);const todayCard=page.locator('.today-task-active[data-v490-task-id="265"]:visible').first();out.todayArrows=(await todayCard.locator('.v491-order-button').count())===2&&(await todayCard.locator('.drag-handle').count())===0;const before=await todayCard.evaluate(card=>({h:card.getBoundingClientRect().height,html:card.innerHTML}));await page.waitForTimeout(2200);const after=await todayCard.evaluate(card=>({h:card.getBoundingClientRect().height,html:card.innerHTML}));out.cardStable=Math.abs(before.h-after.h)<=0.5&&before.html===after.html;

              await page.evaluate(()=>{switchTab('all');render();const item={archiveNumber:9999,archiveId:'live-v493-a',text:'V493 Live Archiv',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:'2026-08-22T13:00:00+02:00',completedAt:'2026-08-22T14:00:00+02:00',activeDurationMs:3600000,archiveAccountingActiveDurationMs:3600000,actualDurationMs:3600000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00'}],historicalWeightKg:12.3,weightedActiveDurationMs:3600000,weightActiveSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00',historicalWeightKg:12.3}]};const host=document.getElementById('viewContainer');host.innerHTML='';host.appendChild(archiveCard(item));window.__modTaskCardRailPolishV492.enhanceAll();window.__modUiAlignmentV493.enhanceAll();});await page.waitForTimeout(100);
              const archived=page.locator('.archive-task:visible',{hasText:'V493 Live Archiv'}).first();const ar=await archived.evaluate(card=>{const rail=card.querySelector(':scope>.v492-number-status-rail'),num=rail.querySelector('.archive-number'),status=rail.querySelector('.status-symbol');num.textContent='A9999';window.__modUiAlignmentV493.alignNumberWithTitle(card);return {ok:num.scrollWidth<=num.clientWidth&&status.getBoundingClientRect().top>=num.getBoundingClientRect().bottom-1,font:[...card.querySelectorAll('.task-detail-v490>div')].map(x=>getComputedStyle(x).fontSize)};});out.archiveRailReady=ar.ok;out.archiveCompactPreserved=ar.font.every(x=>x==='8.5px');

              await page.evaluate(()=>{window.__modLiveLogV453.clear();window.__modLiveLogV453.append('TASK','INFO','V493 Live Log');switchTab('log');});await page.waitForTimeout(120);out.compactLog=await page.evaluate(()=>getComputedStyle(document.querySelector('.log-message-v453')).fontSize==='8.5px');
              out.v492Preserved=await page.evaluate(()=>!!window.__modTaskCardRailPolishV492?.numberTopLeftEverywhere);out.v491Preserved=await page.evaluate(()=>!!window.__modUiCardStabilityV491?.dragHandleReplacedByArrows);out.v490Preserved=await page.evaluate(()=>!!window.__modNestedTaskWeightLayoutV490?.nestedSegmentWeight);out.v489Preserved=await page.evaluate(()=>!!window.__modTaskTimeWeightDetailsV489?.perTaskWeightOverlap);out.v488Preserved=await page.evaluate(()=>!!window.__modHistoricalSegmentBreakdownV488?.historicalProgressPreserved&&!!window.__modHistoricalSegmentBreakdownV488?.activeSourceLabelsV493);out.scrollFixPreserved=await page.evaluate(()=>!!window.__modTimeSegmentScrollV486);out.terminalDeletePreserved=await page.evaluate(()=>!!window.__modTerminalDeleteV485?.confirmationRequired);out.remoteReopenCompleted=await page.evaluate(()=>!!window.__modRemoteTaskReopenV484);out.archiveSequenceRepair=await page.evaluate(()=>!!window.__modRemoteArchiveSequenceV478);
              const cooking=await page.evaluate(()=>{tasks=[{id:4951,text:'Kochen',type:'cooking',status:'open',priority:'normal',optional:false,dueMode:'none',activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:4952,text:'Arbeit',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',activeSegments:[],pauseTotalMs:0}];saveTasks();startTask(4951);switchCookingMode(4951,'passive');startTask(4952);const rep=collectDataIntegrityReport();return {parallel:tasks[1].status==='running',errors:rep.errors||[]};});out.cookingParallel=cooking.parallel;out.integrity=cooking.errors.length===0;out.renderStability=await page.evaluate(()=>!!window.__modRenderStabilityV479&&!!window.__modTodayCreateRenderV480);out.workBlocksPreserved=await page.evaluate(()=>!!window.__modTodayWorkBlocksV474);out.fixedShell=await page.evaluate(()=>{const e=document.getElementById('appFixedTopV475');return !!e&&getComputedStyle(e).position==='sticky';});
              out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));await browser.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
