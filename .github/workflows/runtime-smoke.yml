name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check visible-icon-fix-v423.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V423 visible icon and color fix
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});const r={status:'FAIL',version:'V423',module:false,recordIcons:false,recordNeutral:false,weightIcons:false,archiveWeight:false,noLegacyRecordEmoji:false,dueModelIntact:false,errors:[]};try{let live=false;for(let i=0;i<18;i++){await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});if(/BUILD: V423/.test(await p.content())&&await p.evaluate(()=>window.__modVisibleIconFixV423?.version==='V423')){live=true;break;}await p.waitForTimeout(10000);}if(!live)throw new Error('V423 not deployed');r.module=true;
          await p.evaluate(()=>switchTab('statistics'));await p.waitForTimeout(500);
          r.recordIcons=await p.locator('.statistics-record-label.v423-fixed-label svg').count()>=3;
          r.recordNeutral=await p.locator('.statistics-record-label').evaluateAll(els=>els.length>=3&&els.every(el=>getComputedStyle(el).color==='rgb(140, 150, 159)'));
          r.noLegacyRecordEmoji=await p.locator('.statistics-record-label').evaluateAll(els=>els.every(el=>!/[🏆🏋💪🛋🕒⏱🔁📊🧱⚖🎖🥇🏅]/u.test(el.textContent||'')));
          r.weightIcons=await p.locator('.statistics-label.v423-fixed-label .v423-icon').count()>=4;
          await p.evaluate(()=>switchTab('archive'));await p.waitForTimeout(500);
          const archiveCount=await p.locator('.archive-task-weight-details').count();r.archiveWeight=archiveCount===0||await p.locator('.archive-task-weight-details.v423-fixed-label svg').count()===archiveCount;
          r.dueModelIntact=await p.evaluate(()=>window.__modActionIconsV416?.version==='V418'&&typeof setNewDueDateV418==='function'&&typeof setTaskDueDateV418==='function');
          r.status=Object.entries(r).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';}catch(e){r.errors.push(String(e.stack||e))}fs.writeFileSync('runtime-status.txt',JSON.stringify(r,null,2));await b.close();if(r.status!=='PASS')process.exitCode=1})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
