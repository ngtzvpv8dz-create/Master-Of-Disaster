name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check active modules
        run: |
          node --check iphone-backup-v400.js
          node --check stats-and-rules-v403.js
          node --check categories-v405.js
          node --check categories-v406.js
          node --check ux-fixes-v408.js
          node --check dev-version-v408.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V408 runtime
        run: |
          cat > smoke.js <<'JS'
          const { chromium }=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));let result={status:'FAIL',version:'unknown',categoryBadge:false,categoryPicker:false,editInline:false,editWorks:false,deleteGuard:false,statistics:false,backup:false,deployAttempts:0,errors:[]};
          try{let live=false;for(let i=1;i<=18;i++){result.deployAttempts=i;await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});const s=await page.evaluate(()=>({ux:!!window.__modUxV408,backup:!!window.__modIphoneBackupV401}));const html=await page.content();live=s.ux&&s.backup&&/BUILD: V408/.test(html);if(live)break;await page.waitForTimeout(10000);}if(!live)throw new Error('V408 runtime not deployed');result.backup=true;
          result.deleteGuard=await page.evaluate(()=>window.__modStatsV403.hasStarted({status:'paused',startedAt:new Date().toISOString()})===true);
          await page.click('[data-tab="all"]');await page.waitForTimeout(700);
          result.categoryBadge=await page.evaluate(()=>[...document.querySelectorAll('.task')].every(card=>{const b=card.querySelector(':scope > .category-badge-v408');return !b||/OHNE KATEGORIE|\S/.test(b.innerText); }));
          const cat=page.locator('.task .category-badge-v408').first();if(await cat.count()){await cat.click();await page.waitForTimeout(120);result.categoryPicker=await page.locator('#catPickerV408').count()===1&&await page.locator('[data-cat]').count()>0;await page.locator('#catCancelV408').click();}else result.categoryPicker=true;
          await page.evaluate(()=>{tasks.push({id:'smoke-v408',text:'Smoke Titel',status:'paused',startedAt:new Date().toISOString(),activeDurationMs:1000,type:'work',priority:'normal',optional:false,dueMode:'none'});render();});await page.waitForTimeout(400);
          const card=page.locator('.task').filter({hasText:'Smoke Titel'}).first();const edit=card.locator('.title-edit-v408-button');result.editInline=(await edit.count())===1&&await edit.evaluate(b=>b.parentElement!==b.closest('.task'));
          if(await edit.count()){await edit.click();await page.waitForTimeout(100);const input=page.locator('#titleInputV408');result.editWorks=(await input.count())===1;await page.locator('#titleCancelV408').click();}
          await page.evaluate(()=>{const i=tasks.findIndex(t=>t&&t.id==='smoke-v408');if(i>=0)tasks.splice(i,1);render();});
          await page.click('[data-tab="statistics"]');await page.waitForTimeout(400);result.statistics=await page.locator('#extendedStatsV403').count()===1;await page.click('[data-tab="dev"]');await page.waitForTimeout(300);result.version=/V408/.test(await page.locator('body').innerText())?'V408':'unknown';result.errors=errors;result.status=(result.categoryBadge&&result.categoryPicker&&result.editInline&&result.editWorks&&result.deleteGuard&&result.statistics&&result.backup&&result.version==='V408'&&!errors.length)?'PASS':'FAIL';}catch(e){result.errors.push(String(e.stack||e));}fs.writeFileSync('runtime-status.txt',JSON.stringify(result,null,2));console.log(result);await browser.close();if(result.status!=='PASS')process.exitCode=1;})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status
          cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" . || echo '{"status":"FAIL","errors":["runtime-status missing"]}' > runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
