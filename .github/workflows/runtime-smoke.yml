name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check today-create-render-v480.js && node --check render-stability-v479.js && node --check remote-archive-sequence-v478.js && node --check statistics-alignment-v477.js && node --check development-stats-current-v476.js && node --check fixed-app-header-v475.js && node --check today-work-blocks-v474.js && node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V485
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            const out={status:'FAIL',version:'V485',live:false,bundle:false,metricsCurrent:false,fixedShell:false,workBlocksPreserved:false,archiveSequenceRepair:false,cookingParallel:false,integrity:false,renderStability:false,remoteReopenCompleted:false,terminalDeleteButtons:false,deleteConfirmation:false,completedDelete:false,abortedDelete:false,abortedTasksVisible:false,archiveDelete:false,archiveRenumber:false,statisticsAdjusted:false,errors:[]};
            try{
              for(let i=0;i<24;i++){
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                const build=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V485'&&window.__modDevVersion?.version==='V485'&&!!window.__modTerminalDeleteV485).catch(()=>false);
                let metrics=null;try{metrics=await page.evaluate(async()=>{const r=await fetch('./development-metrics.json?smoke='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;});}catch(_){}
                if(build&&metrics?.version==='V485'&&metrics?.sourceCommit&&metrics.sourceCommit!=='pending'&&metrics?.repository?.currentTextLines>10000){out.live=true;break;}
                await page.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V485 build or generated metrics not deployed');
              out.bundle=await page.evaluate(()=>!!(window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modTodayCreateRenderV480&&window.__modRenderStabilityV479&&window.__modRemoteArchiveSequenceV478&&window.__modStatisticsAlignmentV477&&window.__modFixedAppHeaderV475&&window.__modTodayWorkBlocksV474&&window.__modUxCookingEditorV460));
              out.metricsCurrent=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V485');
              out.remoteReopenCompleted=await page.evaluate(()=>{
                tasks=[{id:48491,text:'Reopen smoke',status:'completed',type:'work',priority:'normal',todayDate:'2026-08-23',todayOrder:3,startedAt:'2026-08-23T07:29:00Z',completedAt:'2026-08-23T07:32:00Z',activeDurationMs:180000,actualDurationMs:180000,activeSegments:[]}];saveTasks();
                window.__modRemoteTaskReopenV484.reopenCompletedTask({text:'Reopen smoke'});const t=tasks[0];return t.status==='open'&&t.startedAt===null&&t.activeDurationMs===null&&t.todayOrder===3;
              });
              await page.evaluate(()=>{
                tasks=[
                  {id:48501,text:'Completed smoke delete',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-23T07:00:00Z',completedAt:'2026-08-23T07:03:00Z',activeDurationMs:180000,actualDurationMs:180000,activeSegments:[]},
                  {id:48502,text:'Aborted smoke delete',status:'aborted',type:'work',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-23T07:10:00Z',abortedAt:'2026-08-23T07:16:00Z',activeDurationMs:360000,actualDurationMs:360000,activeSegments:[]},
                  {id:48503,text:'Open smoke keep',status:'open',type:'work',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[]}
                ];archive=[];nextArchiveNumber=1;saveTasks();saveArchive();switchTab('all');render();
              });await page.waitForTimeout(160);
              out.abortedTasksVisible=await page.evaluate(()=>!!document.getElementById('abortedSectionV485')&&document.getElementById('abortedSectionV485').innerText.includes('Aborted smoke delete'));
              out.terminalDeleteButtons=await page.evaluate(()=>document.querySelectorAll('.terminal-delete-v485').length>=2);
              const completed=page.locator('.task',{hasText:'Completed smoke delete'}).first();await completed.locator('.terminal-delete-v485').click();
              out.deleteConfirmation=(await page.locator('#terminalDeleteConfirmV485').isVisible())&&(await page.locator('.terminal-delete-warning-v485').innerText()).includes('wirklich dauerhaft löschen');
              await page.locator('#terminalDeleteCancelV485').click();
              if(!(await page.evaluate(()=>tasks.some(t=>t.id===48501))))throw new Error('Cancel path removed completed task');
              await completed.locator('.terminal-delete-v485').click();await page.locator('#terminalDeleteConfirmV485').click();await page.waitForTimeout(120);
              out.completedDelete=await page.evaluate(()=>!tasks.some(t=>t.id===48501));
              const aborted=page.locator('#abortedSectionV485 .task',{hasText:'Aborted smoke delete'}).first();await aborted.locator('.terminal-delete-v485').click();await page.locator('#terminalDeleteConfirmV485').click();await page.waitForTimeout(120);
              out.abortedDelete=await page.evaluate(()=>!tasks.some(t=>t.id===48502));
              await page.evaluate(()=>{
                archive=[
                  {archiveNumber:1,archiveId:'live-stable-1',text:'Archive one',status:'completed',type:'work',priority:'normal',activeDurationMs:600000,archiveAccountingActiveDurationMs:600000},
                  {archiveNumber:2,archiveId:'live-stable-2',text:'Archive delete',status:'completed',type:'work',priority:'normal',activeDurationMs:180000,archiveAccountingActiveDurationMs:180000},
                  {archiveNumber:3,archiveId:'live-stable-3',text:'Archive three',status:'completed',type:'work',priority:'normal',activeDurationMs:1200000,archiveAccountingActiveDurationMs:1200000}
                ];nextArchiveNumber=4;saveArchive();switchTab('archive');render();
              });await page.waitForTimeout(160);
              const archiveCard=page.locator('.archive-task',{hasText:'Archive delete'}).first();out.archiveDelete=await archiveCard.locator('.terminal-delete-v485').isVisible();
              await archiveCard.locator('.terminal-delete-v485').click();await page.locator('#terminalDeleteConfirmV485').click();await page.waitForTimeout(160);
              const archiveState=await page.evaluate(()=>({rows:archive.map(r=>({n:r.archiveNumber,id:r.archiveId})),next:nextArchiveNumber,sum:archive.reduce((n,r)=>n+(Number(r.archiveAccountingActiveDurationMs)||0),0)}));
              out.archiveDelete=out.archiveDelete&&archiveState.rows.length===2&&!archiveState.rows.some(r=>r.id==='live-stable-2');
              out.archiveRenumber=JSON.stringify(archiveState.rows)===JSON.stringify([{n:1,id:'live-stable-1'},{n:2,id:'live-stable-3'}])&&archiveState.next===3;
              out.statisticsAdjusted=archiveState.sum===1800000;
              out.archiveSequenceRepair=await page.evaluate(()=>{archive=Array.from({length:254},(_,i)=>({archiveNumber:i+1,archiveId:`stable-${i+1}`,text:`A${i+1}`}));for(let n=256;n<=262;n++)archive.push({archiveNumber:n,archiveId:`stable-${n}`,text:`A${n}`});nextArchiveNumber=263;const r=window.__modRemoteArchiveSequenceV478.repairArchiveGap(255),nums=archive.map(x=>Number(x.archiveNumber)).sort((a,b)=>a-b);return nums.every((n,i)=>n===i+1)&&nextArchiveNumber===262&&r.shifted===7;});
              await page.evaluate(()=>localStorage.setItem('masterOfDisasterThemeStateLayoutV460',JSON.stringify({gridStep:2,selectedState:'open',positions:{open:{actions:{anchor:'free',x:12,y:4}}}})));
              await page.reload({waitUntil:'networkidle',timeout:60000});await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V485'&&window.__modTodayCreateRenderV480&&window.__modTerminalDeleteV485,{timeout:30000});
              out.fixedShell=await page.evaluate(()=>{const e=document.getElementById('appFixedTopV475');return !!e&&getComputedStyle(e).position==='sticky'&&Math.abs(e.getBoundingClientRect().top)<1;});
              out.workBlocksPreserved=await page.evaluate(()=>!!window.__modTodayWorkBlocksV474);
              out.renderStability=await page.evaluate(()=>!!window.__modRenderStabilityV479&&!!window.__modTodayCreateRenderV480);
              const cooking=await page.evaluate(()=>{tasks=[{id:48591,text:'Kochen',type:'cooking',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:48592,text:'Arbeit',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],pauseTotalMs:0}];saveTasks();startTask(48591);switchCookingMode(48591,'passive');startTask(48592);const rep=collectDataIntegrityReport();return {parallel:tasks[1].status==='running',errors:rep.errors||[]};});out.cookingParallel=cooking.parallel;out.integrity=cooking.errors.length===0;
              out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));await browser.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
