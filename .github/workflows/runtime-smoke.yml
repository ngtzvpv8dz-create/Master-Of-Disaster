name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check active modules
        run: |
          node --check iphone-backup-v400.js
          node --check dev-cleanup-v401.js
          node --check stats-and-rules-v403.js
          node --check categories-v405.js
          node --check categories-v406.js
          node --check ux-fixes-v407.js
          node --check dev-version-v407.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V407 runtime
        run: |
          cat > smoke.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            let result={status:'FAIL',version:'unknown',categories:false,categorySafeFilter:false,categoryDirect:false,categoryPicker:false,pausedTitleEdit:false,deleteGuard:false,statistics:false,dev:false,iphoneBackup:false,deployAttempts:0,errors:[]};
            try{
              let live=false;
              for(let i=1;i<=18;i++){
                result.deployAttempts=i;
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                const state=await page.evaluate(()=>({backup:!!window.__modIphoneBackupV401,stats:!!window.__modStatsV403,c405:!!window.__modCategoriesV405,c406:!!window.__modCategoriesV406,ux:!!window.__modUxV407}));
                const html=await page.content();
                live=state.backup&&state.stats&&state.c405&&state.c406&&state.ux&&/BUILD: V407/.test(html);
                if(live)break;
                await page.waitForTimeout(10000);
              }
              if(!live)throw new Error('V407 runtime not deployed after retry window');
              result.iphoneBackup=true;result.categories=true;
              result.deleteGuard=await page.evaluate(()=>window.__modStatsV403.hasStarted({status:'open'})===false&&window.__modStatsV403.hasStarted({status:'paused',startedAt:new Date().toISOString()})===true);
              await page.click('[data-tab="statistics"]');await page.waitForTimeout(500);result.statistics=await page.locator('#extendedStatsV403').count()===1;
              await page.click('[data-tab="all"]');await page.waitForTimeout(700);
              result.categoryDirect=await page.locator('.task .category-quick-v406').count()===await page.locator('.task').count();
              result.categorySafeFilter=await page.evaluate(()=>{try{window.__modCategoriesV406.applySafeFilter();return [...document.querySelectorAll('.task,.archive-task')].every(card=>[...card.children].every(ch=>ch.style.display!=='none'));}catch(_){return false;}});
              const firstCat=page.locator('.task .category-quick-v406').first();if(await firstCat.count()){await firstCat.click();await page.waitForTimeout(150);result.categoryPicker=await page.locator('#catPickerV407').count()===1&&await page.locator('[data-v407-cat]').count()>0;await page.locator('#catCancelV407').click();}else result.categoryPicker=true;
              result.pausedTitleEdit=await page.evaluate(()=>{const t={id:'smoke-v407-paused',text:'Smoke editierbar',status:'paused',startedAt:new Date().toISOString(),activeDurationMs:1000,type:'work',priority:'normal',optional:false,dueMode:'none'};tasks.push(t);render();return true;});
              await page.waitForTimeout(300);const edit=page.locator('.task .title-edit-v407-button').last();result.pausedTitleEdit=(await edit.count())>0;await page.evaluate(()=>{const i=tasks.findIndex(t=>t&&t.id==='smoke-v407-paused');if(i>=0)tasks.splice(i,1);render();});
              await page.click('[data-tab="dev"]');await page.waitForTimeout(500);result.dev=/V407/.test(await page.locator('body').innerText());result.version=result.dev?'V407':'unknown';
              result.errors=errors;result.status=(result.categories&&result.categorySafeFilter&&result.categoryDirect&&result.categoryPicker&&result.pausedTitleEdit&&result.deleteGuard&&result.statistics&&result.dev&&result.iphoneBackup&&result.version==='V407'&&!errors.length)?'PASS':'FAIL';
            }catch(e){result.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(result,null,2));console.log(result);await browser.close();if(result.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status
          cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" . || echo '{"status":"FAIL","errors":["runtime-status missing"]}' > runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
