name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: node --check summary-weight-due-polish-v494.js && node --check ui-alignment-v493.js && node --check task-card-rail-polish-v492.js && node --check ui-card-stability-v491.js && node --check nested-task-weight-layout-v490.js && node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V494
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            const out={status:'FAIL',version:'V494',live:false,bundle:false,metricsCurrent:false,totalActiveHighlighted:false,activeTimeValuesColumnAligned:false,summarySeparatorMatches:false,partialWeightHierarchy:false,dueDynamicControlsIndented:false,activeSourceSplit:false,historicalDuplicateRemoved:false,numberTitleAligned:false,fourDigitReady:false,subtleWeightStyle:false,cardStable:false,todayArrows:false,todayRowUntouched:false,compactLog:false,v493Preserved:false,v492Preserved:false,v491Preserved:false,v490Preserved:false,v489Preserved:false,v488Preserved:false,scrollFixPreserved:false,terminalDeletePreserved:false,remoteReopenCompleted:false,archiveSequenceRepair:false,cookingParallel:false,integrity:false,renderStability:false,workBlocksPreserved:false,fixedShell:false,errors:[]};
            try{
              for(let i=0;i<24;i++){
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                const build=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V494'&&window.__modDevVersion?.version==='V494'&&!!window.__modSummaryWeightDuePolishV494).catch(()=>false);
                let metrics=null;try{metrics=await page.evaluate(async()=>{const r=await fetch('./development-metrics.json?smoke='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;});}catch(_){}
                if(build&&metrics?.version==='V494'&&metrics?.sourceCommit&&metrics.sourceCommit!=='pending'){out.live=true;break;}
                await page.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V494 build or generated metrics not deployed');
              out.bundle=await page.evaluate(()=>!!(window.__modSummaryWeightDuePolishV494&&window.__modUiAlignmentV493&&window.__modTaskCardRailPolishV492&&window.__modUiCardStabilityV491&&window.__modNestedTaskWeightLayoutV490&&window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modRemoteArchiveSequenceV478));out.metricsCurrent=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V494');
              await page.evaluate(()=>{const day=getBerlinDateKey();localStorage.removeItem(window.__modTodayWorkBlocksV474.storageKey);tasks=[{id:263,text:'V494 Live Alt 30m',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,todayWorkBlockId:null,importedHistoricalProgressDurationMs:1800000,activeDurationMs:1800000,actualDurationMs:1800000,startedAt:'2026-06-12T10:00:00+02:00',pausedAt:'2026-06-12T10:30:00+02:00',pauseTotalMs:0,activeSegments:[]},{id:265,text:'V494 Live Kisten',type:'work',status:'paused',priority:'high',optional:false,dueMode:'deadline',dueDate:day,todayDate:day,todayOrder:2,todayWorkBlockId:null,importedHistoricalProgressDurationMs:8760000,activeDurationMs:null,actualDurationMs:null,startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T14:00:00+02:00',pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'}]}];weightPhases=[{id:49401,weightKg:12.3,startedAt:'2026-08-23T13:10:00+02:00',endedAt:'2026-08-23T13:30:00+02:00'}];weightState={isWearing:false,currentWeightKg:12.3};archive=[];nextArchiveNumber=1;saveTasks();saveArchive();saveWeight();window.__modTodayWorkBlocksV474.ensureTodayModel(day,[]);saveTasks();switchTab('all');render();});await page.waitForTimeout(650);
              const alt=await page.locator('.task[data-v490-task-id="263"]:visible').evaluate(card=>({text:(card.querySelector('.historical-segment-duration-v488')?.innerText||'').replace(/\s+/g,' ').trim(),hist:card.querySelectorAll('.v490-historical').length,seg:card.querySelectorAll('.task-detail-v490 .v490-segment').length}));
              const card=page.locator('.task[data-v490-task-id="265"]:visible').first();
              const d=await card.evaluate(card=>{function glyph(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const t=n.textContent||'',i=t.search(/\S/);if(i>=0){const r=document.createRange();r.setStart(n,i);r.setEnd(n,Math.min(i+1,t.length));return r.getBoundingClientRect();}}return el.getBoundingClientRect();}const summary=card.querySelector('.historical-segment-duration-v488'),rows=[...summary.querySelectorAll(':scope>.v494-time-row')],vals=rows.map(r=>r.querySelector('.v494-time-value')),xs=vals.map(v=>v.getBoundingClientRect().left),total=summary.querySelector('.v494-total-row .v494-time-value'),source=summary.querySelector('.v494-source-row .v494-time-value'),ts=getComputedStyle(total),ss=getComputedStyle(source),sumStyle=getComputedStyle(summary),detail=card.querySelector('.task-detail-v490'),ds=getComputedStyle(detail),partial=card.querySelector('.v490-weight-partial'),copy=partial?.querySelector('.v492-weight-copy'),sub=partial?.nextElementSibling,ps=partial?getComputedStyle(partial):null,rail=card.querySelector(':scope>.v492-number-status-rail'),num=rail.querySelector('.task-number'),title=card.querySelector('.task-text');num.textContent='9.999';window.__modUiAlignmentV493.alignNumberWithTitle(card);const nr=glyph(num),tr=glyph(title);return {summaryText:(summary.innerText||'').replace(/\s+/g,' ').trim(),timeSpread:Math.max(...xs)-Math.min(...xs),totalWeight:Number(ts.fontWeight),sourceWeight:Number(ss.fontWeight),totalColor:ts.color,sourceColor:ss.color,sumBorder:sumStyle.borderTopWidth,sumMargin:sumStyle.marginTop,sumPadding:sumStyle.paddingTop,detailBorder:ds.borderTopWidth,detailMargin:ds.marginTop,detailPadding:ds.paddingTop,partialCopy:copy?.textContent||'',subText:sub?.textContent||'',partialReordered:partial?.dataset.v494PartialReordered||'',weightColor:ps?.color,weightWeight:Number(ps?.fontWeight||999),headingDiff:Math.abs(nr.bottom-tr.bottom),overflow:num.scrollWidth-num.clientWidth};});
              out.activeSourceSplit=alt.text.includes('SEIT APP AKTIV · 00:00:00')&&alt.text.includes('+ VOR APP AKTIV · 00:30:00')&&alt.text.includes('= GESAMT AKTIV · 00:30:00')&&d.summaryText.includes('SEIT APP AKTIV · 01:00:00')&&d.summaryText.includes('+ VOR APP AKTIV · 02:26:00')&&d.summaryText.includes('= GESAMT AKTIV · 03:26:00');out.historicalDuplicateRemoved=alt.hist===0&&alt.seg===0;out.totalActiveHighlighted=d.totalWeight>=800&&d.totalWeight>d.sourceWeight&&d.totalColor==='rgb(217, 224, 228)'&&d.sourceColor==='rgb(143, 154, 161)';out.activeTimeValuesColumnAligned=d.timeSpread<=0.75;out.summarySeparatorMatches=d.sumBorder==='1px'&&d.sumBorder===d.detailBorder&&d.sumMargin===d.detailMargin&&d.sumPadding===d.detailPadding;out.partialWeightHierarchy=d.partialCopy.includes('INKL. ZUSATZGEWICHT · 12,3 kg')&&!/13:10|13:30/.test(d.partialCopy)&&d.subText.includes('13:10:00–13:30:00')&&d.subText.includes('00:20:00')&&!/kg/i.test(d.subText)&&d.partialReordered==='true';out.subtleWeightStyle=d.weightColor==='rgb(126, 139, 104)'&&d.weightWeight<=500;out.numberTitleAligned=d.headingDiff<=0.8;out.fourDigitReady=d.overflow<=0;
              const due=await page.evaluate(()=>{const row=[...document.querySelectorAll('#inputPanel .option-row')].find(r=>(r.querySelector(':scope>.option-label')?.textContent||'').trim()==='FÄLLIG');const input=document.createElement('input');input.type='date';row.appendChild(input);const clear=document.createElement('button');clear.className='option-button';clear.textContent='KEIN DATUM';row.appendChild(clear);window.__modSummaryWeightDuePolishV494.alignDueControls();const wrap=row.querySelector(':scope>.v494-due-controls'),today=document.getElementById('newTodayRowV480');return {input:input.parentElement===wrap,clear:clear.parentElement===wrap,today:!!today?.querySelector('.v494-due-controls')};});out.dueDynamicControlsIndented=due.input&&due.clear;out.todayRowUntouched=!due.today;
              await page.evaluate(()=>{switchTab('today');render();});await page.waitForTimeout(350);const tc=page.locator('.today-task-active[data-v490-task-id="265"]:visible').first();out.todayArrows=(await tc.locator('.v491-order-button').count())===2&&(await tc.locator('.drag-handle').count())===0;const before=await tc.evaluate(c=>({h:c.getBoundingClientRect().height,html:c.innerHTML}));await page.waitForTimeout(1600);const after=await tc.evaluate(c=>({h:c.getBoundingClientRect().height,html:c.innerHTML}));out.cardStable=Math.abs(before.h-after.h)<=0.5&&before.html===after.html;
              await page.evaluate(()=>{window.__modLiveLogV453.clear();window.__modLiveLogV453.append('TASK','INFO','V494 Live Log');switchTab('log');});await page.waitForTimeout(120);out.compactLog=await page.evaluate(()=>getComputedStyle(document.querySelector('.log-message-v453')).fontSize==='8.5px');out.v493Preserved=await page.evaluate(()=>!!window.__modUiAlignmentV493?.numberTitleBottomAligned);out.v492Preserved=await page.evaluate(()=>!!window.__modTaskCardRailPolishV492?.numberTopLeftEverywhere);out.v491Preserved=await page.evaluate(()=>!!window.__modUiCardStabilityV491?.dragHandleReplacedByArrows);out.v490Preserved=await page.evaluate(()=>!!window.__modNestedTaskWeightLayoutV490?.nestedSegmentWeight);out.v489Preserved=await page.evaluate(()=>!!window.__modTaskTimeWeightDetailsV489?.perTaskWeightOverlap);out.v488Preserved=await page.evaluate(()=>!!window.__modHistoricalSegmentBreakdownV488?.historicalOnlyUsesStoredTotalV493);out.scrollFixPreserved=await page.evaluate(()=>!!window.__modTimeSegmentScrollV486);out.terminalDeletePreserved=await page.evaluate(()=>!!window.__modTerminalDeleteV485?.confirmationRequired);out.remoteReopenCompleted=await page.evaluate(()=>!!window.__modRemoteTaskReopenV484);out.archiveSequenceRepair=await page.evaluate(()=>!!window.__modRemoteArchiveSequenceV478);
              const cooking=await page.evaluate(()=>{tasks=[{id:4951,text:'Kochen',type:'cooking',status:'open',priority:'normal',optional:false,dueMode:'none',activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:4952,text:'Arbeit',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',activeSegments:[],pauseTotalMs:0}];saveTasks();startTask(4951);switchCookingMode(4951,'passive');startTask(4952);const rep=collectDataIntegrityReport();return {parallel:tasks[1].status==='running',errors:rep.errors||[]};});out.cookingParallel=cooking.parallel;out.integrity=cooking.errors.length===0;out.renderStability=await page.evaluate(()=>!!window.__modRenderStabilityV479&&!!window.__modTodayCreateRenderV480);out.workBlocksPreserved=await page.evaluate(()=>!!window.__modTodayWorkBlocksV474);out.fixedShell=await page.evaluate(()=>{const e=document.getElementById('appFixedTopV475');return !!e&&getComputedStyle(e).position==='sticky';});out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));await browser.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
