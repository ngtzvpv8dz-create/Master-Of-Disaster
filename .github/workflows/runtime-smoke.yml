name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check sync core
        run: node --check sync-core-v399.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V399 runtime and sync decisions
        run: |
          cat > smoke.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            let result={status:'FAIL',version:'unknown',today:false,dev:false,weightHiddenInDev:false,syncCore:false,oldSyncLayersGone:false,decisionTests:false,deployAttempts:0,errors:[]};
            try{
              let live=false;
              for(let i=1;i<=18;i++){
                result.deployAttempts=i;
                await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                live=await page.evaluate(()=>typeof window.__modSyncDecisionV399==='function');
                if(live) break;
                await page.waitForTimeout(10000);
              }
              if(!live) throw new Error('V399 sync core not deployed after retry window');
              result.syncCore=true;
              await page.waitForSelector('[data-tab="today"]',{timeout:15000});
              result.decisionTests=await page.evaluate(()=>{
                const d=window.__modSyncDecisionV399;
                return d('A','A','A',false)==='equal' &&
                  d('A','B','A',false)==='pull' &&
                  d('B','A','A',true)==='push' &&
                  d('B','C','A',true)==='conflict' &&
                  d('B','C',null,true)==='conflict';
              });
              result.oldSyncLayersGone=await page.evaluate(()=>{
                const srcs=Array.from(document.scripts).map(s=>s.src||'').join('\n');
                return !/offline-sync-v396|offline-conflict-v398|multidevice-sync-fix/.test(srcs) && /sync-core-v399/.test(srcs);
              });
              await page.click('[data-tab="today"]');
              await page.waitForTimeout(300);
              result.today=await page.locator('[data-tab="today"]').evaluate(e=>e.classList.contains('active'));
              await page.click('[data-tab="dev"]');
              await page.waitForTimeout(500);
              result.dev=await page.locator('[data-tab="dev"]').evaluate(e=>e.classList.contains('active'));
              result.weightHiddenInDev=await page.locator('#weightContainer').evaluate(e=>getComputedStyle(e).display==='none');
              const body=await page.locator('body').innerText();
              const matches=body.match(/V\d{3}/g)||[];
              result.version=matches.includes('V399')?'V399':(matches[0]||'unknown');
              result.errors=errors;
              result.status=(result.today&&result.dev&&result.weightHiddenInDev&&result.syncCore&&result.oldSyncLayersGone&&result.decisionTests&&result.version==='V399'&&!errors.length)?'PASS':'FAIL';
            }catch(e){result.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(result,null,2));
            console.log(result);
            await browser.close();
            if(result.status!=='PASS') process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status
          cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" . || echo '{"status":"FAIL","errors":["runtime-status missing"]}' > runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
