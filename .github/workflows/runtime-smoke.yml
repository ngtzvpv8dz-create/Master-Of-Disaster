name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check fixed-app-header-v475.js && node --check today-work-blocks-v474.js && node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check theme-editor-help-stability-v470.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V475 fixed app header
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            await p.route('**/*',r=>/supabase\.co/.test(r.request().url())?r.abort():r.continue());
            const out={status:'FAIL',version:'V475',live:false,bundle:false,fixedShell:false,headerVisible:false,tabsVisible:false,opaqueShell:false,contentScrolls:false,shellStableAcrossTabs:false,dynamicHeight:false,workBlocksPreserved:false,allSearchPreserved:false,categoryGroupingPreserved:false,themeHelpPreserved:false,previewOffset:false,archiveMaintenance:false,cookingParallel:false,integrity:false,errors:[]};
            try{
              for(let i=0;i<18;i++){
                await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                if(/BUILD: V475/.test(await p.content())&&await p.evaluate(()=>window.__modDevVersion?.version==='V475')){out.live=true;break;}
                await p.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V475 not deployed');
              out.bundle=await p.evaluate(()=>!!(window.__modFixedAppHeaderV475&&window.__modTodayWorkBlocksV474&&window.__modCategoryGroupDragV473&&window.__modThemeEditorHelpStabilityV470&&window.__modRemoteArchiveMaintenanceV472&&window.__modUxCookingEditorV460));

              const date=await p.evaluate(()=>getBerlinDateKey());
              await p.evaluate((date)=>{
                localStorage.removeItem('masterOfDisasterTodayWorkBlocksV474');
                tasks=Array.from({length:34},(_,i)=>({id:47500+i,text:`Scroll Aufgabe ${i+1}`,category:i%3===0?'Haushalt':i%3===1?'Böden wischen':'Sonstiges',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:i<8?date:null,todayOrder:i<8?i+1:null,startedAt:null,pausedAt:null,pauseTotalMs:0,completedAt:null,activeDurationMs:null,abortedAt:null,activeSegments:[]}));
                archive=[];saveTasks();switchTab('all');render();window.scrollTo(0,0);
              },date);
              await p.waitForTimeout(500);

              const before=await p.evaluate(()=>{const s=document.getElementById('appFixedTopV475'),h=s?.querySelector('.header'),t=s?.querySelector('.tabs-wrapper');const cs=s?getComputedStyle(s):null;return {shell:!!s,position:cs?.position||'',top:s?.getBoundingClientRect().top??999,height:s?.getBoundingClientRect().height||0,header:!!h,tabs:!!t,bg:cs?.backgroundColor||'',apiHeight:window.__modFixedAppHeaderV475?.height||0};});
              out.fixedShell=before.shell&&before.position==='sticky'&&Math.abs(before.top)<1&&before.header&&before.tabs;
              out.dynamicHeight=before.height>80&&Math.abs(before.apiHeight-before.height)<3&&parseFloat(getComputedStyle(await p.locator('html').elementHandle()).scrollPaddingTop||'0')>=before.height;

              await p.evaluate(()=>window.scrollTo(0,1500));await p.waitForTimeout(300);
              const after=await p.evaluate(()=>{const s=document.getElementById('appFixedTopV475'),h=s?.querySelector('.header'),t=s?.querySelector('.tabs-wrapper');const sr=s?.getBoundingClientRect(),hr=h?.getBoundingClientRect(),tr=t?.getBoundingClientRect();const hit=document.elementFromPoint(20,Math.max(2,(sr?.bottom||2)-4));return {scrollY:window.scrollY,top:sr?.top??999,bottom:sr?.bottom??0,headerTop:hr?.top??-999,headerBottom:hr?.bottom??999,tabsTop:tr?.top??-999,tabsBottom:tr?.bottom??999,hitInside:!!hit?.closest?.('#appFixedTopV475'),bg:getComputedStyle(s).backgroundColor};});
              out.contentScrolls=after.scrollY>500&&Math.abs(after.top)<1;
              out.headerVisible=after.headerTop>=-1&&after.headerBottom<=after.bottom+1;
              out.tabsVisible=after.tabsTop>=-1&&after.tabsBottom<=after.bottom+1;
              out.opaqueShell=after.hitInside&&after.bg!=='rgba(0, 0, 0, 0)'&&after.bg!=='transparent';

              await p.evaluate(()=>{window.scrollTo(0,0);switchTab('today');render();});await p.waitForTimeout(450);
              out.workBlocksPreserved=await p.evaluate(()=>!!document.querySelector('.work-block-toolbar-v474')&&document.querySelectorAll('.work-block-v474').length>=1&&!document.getElementById('categoryViewToggleV473'));
              out.shellStableAcrossTabs=await p.evaluate(()=>{const s=document.getElementById('appFixedTopV475');return !!s&&s.querySelector('.header')&&s.querySelector('.tabs-wrapper')&&getComputedStyle(s).position==='sticky';});

              await p.evaluate(()=>switchTab('all'));await p.waitForTimeout(350);
              out.allSearchPreserved=await p.evaluate(()=>!!document.getElementById('allTaskSearchV474'));
              out.categoryGroupingPreserved=await p.evaluate(()=>!!document.getElementById('categoryViewToggleV473')&&!!document.querySelector('[data-v473-mode="grouped"]'));

              await p.evaluate(()=>switchTab('theme'));await p.waitForTimeout(900);
              out.themeHelpPreserved=await p.evaluate(()=>window.__modThemeEditorHelpStabilityV470?.stickyHelpStable===true);
              out.previewOffset=await p.evaluate(()=>{const e=document.getElementById('themeStickyPreviewV460');return !!e&&Math.abs(parseFloat(getComputedStyle(e).bottom)-50)<1;});
              out.shellStableAcrossTabs=out.shellStableAcrossTabs&&await p.evaluate(()=>!!document.getElementById('appFixedTopV475')&&getComputedStyle(document.getElementById('appFixedTopV475')).position==='sticky');

              out.archiveMaintenance=await p.evaluate(()=>window.__modRemoteArchiveMaintenanceV472?.queueStatus==='processing'&&window.__modRemoteArchiveMaintenanceV472?.command==='DELETE_ARCHIVE_ENTRY');
              const cooking=await p.evaluate(()=>{tasks=[{id:47591,text:'Kochen',type:'cooking',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:47592,text:'Arbeitsfläche',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],pauseTotalMs:0}];saveTasks();startTask(47591);switchCookingMode(47591,'passive');startTask(47592);const rep=collectDataIntegrityReport();return {parallel:tasks[1].status==='running',errors:rep.errors||[]};});
              out.cookingParallel=cooking.parallel;out.integrity=cooking.errors.length===0;
              out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));await b.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
