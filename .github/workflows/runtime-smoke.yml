name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check theme-editor-help-v469.js && node --check theme-editor-polish-v468.js && node --check theme-package-stability-v467.js && node --check theme-package-actions-v466.js && node --check theme-state-design-v464.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V469 complete Theme editor help
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            await p.route('**/*',r=>/supabase\.co/.test(r.request().url())?r.abort():r.continue());
            const out={status:'FAIL',version:'V469',live:false,bundle:false,completeHelp:false,allFieldHelp:false,noPaletteDuplicates:false,toolbarHelp:false,stateHelp:false,roleHelp:false,actionHelp:false,anchorHelp:false,dpadHelp:false,groupHelp:false,helpPopup:false,presetStaysTheme:false,previewOffset:false,scrollRetention:false,individualActions:false,abortedVisible:false,cookingParallel:false,integrity:false,errors:[]};
            try{
              for(let i=0;i<18;i++){
                await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                if(/BUILD: V469/.test(await p.content())&&await p.evaluate(()=>window.__modDevVersion?.version==='V469')){out.live=true;break;}
                await p.waitForTimeout(10000);
              }
              if(!out.live)throw new Error('V469 not deployed');
              out.bundle=await p.evaluate(()=>!!(window.__modThemeEditorHelpV469&&window.__modThemeEditorPolishV468&&window.__modThemePackageActionsV466&&window.__modUxCookingEditorV460));
              out.completeHelp=await p.evaluate(()=>window.__modThemeEditorHelpV469?.completeHelp===true);
              await p.evaluate(()=>switchTab('theme'));await p.waitForTimeout(1700);
              await p.evaluate(()=>window.__modUxCookingEditorV460.setState('open'));await p.waitForTimeout(600);

              out.previewOffset=await p.evaluate(()=>{const e=document.getElementById('themeStickyPreviewV460');return !!e&&Math.abs(parseFloat(getComputedStyle(e).bottom)-50)<1;});
              out.allFieldHelp=await p.evaluate(()=>{const fields=[...document.querySelectorAll('.theme-editor-v458 .theme-field-v458')];return fields.length>20&&fields.every(f=>!!f.querySelector('.theme-label-v458 .theme-info-v468'));});
              out.noPaletteDuplicates=await p.evaluate(()=>{const panel=[...document.querySelectorAll('.theme-panel-v458')].find(x=>(x.querySelector('.theme-panel-title-v458')?.textContent||'').includes('APP-FARBEN · ZENTRALE PALETTE'));return !!panel&&[...panel.querySelectorAll('.theme-field-v458')].every(f=>f.querySelectorAll('.theme-label-v458 .theme-info-v468').length===1);});
              out.toolbarHelp=await p.evaluate(()=>{const ids=['themeSaveSnapshotV458','themeLoadSnapshotV458','themeExportV458','themeImportV458','themeResetV458'];return ids.every(id=>document.getElementById(id)?.parentElement?.querySelector('.theme-info-v469'))&&[...document.querySelectorAll('[data-preset]')].every(b=>b.parentElement?.querySelector('.theme-info-v469'));});
              out.stateHelp=await p.evaluate(()=>{const buttons=[...document.querySelectorAll('#themeStickyPreviewV460 [data-sticky-state-v460]')];return buttons.length>=6&&buttons.every(b=>b.parentElement?.querySelector('.theme-info-v469'));});
              out.roleHelp=await p.evaluate(()=>{const buttons=[...document.querySelectorAll('.theme-editor-v458 [data-theme-role-select]')];return buttons.length>=5&&buttons.every(b=>b.parentElement?.querySelector('.theme-info-v469'));});
              out.actionHelp=await p.evaluate(()=>{const buttons=[...document.querySelectorAll('.v466-action-panel [data-v466-select]')];return buttons.length>=5&&buttons.every(b=>b.parentElement?.querySelector('.theme-info-v469'));});
              out.anchorHelp=await p.evaluate(()=>{const buttons=[...document.querySelectorAll('.v466-action-panel [data-v466-anchor]')];return buttons.length>=5&&buttons.every(b=>b.parentElement?.querySelector('.theme-info-v469'));});
              out.dpadHelp=await p.evaluate(()=>{const buttons=[...document.querySelectorAll('.v466-action-panel [data-v466-dir]')];return buttons.length>=4&&buttons.every(b=>b.parentElement?.querySelector('.theme-info-v469'));});
              out.groupHelp=await p.evaluate(()=>[...document.querySelectorAll('.theme-editor-v458 .theme-panel-title-v458')].every(h=>h.nextElementSibling?.classList.contains('theme-info-v469')));
              out.individualActions=await p.evaluate(()=>!!document.querySelector('.v466-action-panel [data-v466-path="open.0.angle"]'));

              const helpClicked=await p.evaluate(()=>{const field=[...document.querySelectorAll('.theme-field-v458')].find(f=>(f.querySelector('.theme-label-v458 span')?.textContent||'').trim()==='MINDESTHÖHE');const info=field?.querySelector('.theme-info-v469');info?.click();return !!info;});
              await p.waitForTimeout(150);
              out.helpPopup=helpClicked&&await p.evaluate(()=>!!document.getElementById('themeInfoBackdropV468')&&document.body.textContent.includes('Mindesthöhe')&&document.body.textContent.includes('Wo sehe ich das?')&&!!document.querySelector('#themeInfoBackdropV468 .v469-mini .hit'));
              await p.evaluate(()=>document.querySelector('.theme-info-close-v468')?.click());

              const scroll=await p.evaluate(async()=>{const max=Math.max(0,document.documentElement.scrollHeight-innerHeight),target=Math.min(650,Math.max(160,max-100));window.scrollTo(0,target);await new Promise(r=>setTimeout(r,60));const before=window.scrollY;document.querySelector('[data-theme-role-select="type"]')?.click();await new Promise(r=>setTimeout(r,260));return {before,after:window.scrollY};});
              out.scrollRetention=scroll.before>50&&Math.abs(scroll.after-scroll.before)<=4;

              await p.evaluate(()=>document.querySelector('[data-preset="graphite"]')?.click());await p.waitForTimeout(1500);await p.waitForLoadState('networkidle',{timeout:60000}).catch(()=>{});await p.waitForTimeout(500);
              out.presetStaysTheme=await p.evaluate(()=>currentTab==='theme'&&!!document.querySelector('.theme-editor-v458'));

              const today=await p.evaluate(()=>getBerlinDateKey());
              await p.evaluate((today)=>{const iso=new Date().toISOString();tasks=[{id:46901,text:'Abbruch V469',status:'aborted',type:'work',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:null,todayOrder:null,startedAt:iso,abortedAt:iso,activeSegments:[{startedAt:iso,endedAt:iso}],activeDurationMs:1,actualDurationMs:1}];archive=[];saveTasks();switchTab('today');render();},today);await p.waitForTimeout(250);
              out.abortedVisible=await p.evaluate(()=>document.body.textContent.includes('ERLEDIGT / ABGEBROCHEN HEUTE')&&document.body.textContent.includes('Abbruch V469'));

              const cooking=await p.evaluate(()=>{tasks=[{id:46911,text:'Kochen',type:'cooking',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:46912,text:'Arbeitsfläche',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,activeSegments:[],pauseTotalMs:0}];saveTasks();startTask(46911);switchCookingMode(46911,'passive');const passive=tasks[0].activeSegments.filter(s=>!s.endedAt).length===0;startTask(46912);const parallel=tasks[1].status==='running';const rep=collectDataIntegrityReport();return {passive,parallel,errors:rep.errors||[]};});
              out.cookingParallel=cooking.passive&&cooking.parallel;out.integrity=cooking.errors.length===0;
              out.status=Object.entries(out).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';
            }catch(e){out.errors.push(String(e.stack||e));}
            fs.writeFileSync('runtime-status.txt',JSON.stringify(out,null,2));await b.close();if(out.status!=='PASS')process.exitCode=1;
          })();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
