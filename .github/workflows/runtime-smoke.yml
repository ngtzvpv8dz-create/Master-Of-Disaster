name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check active modules
        run: |
          node --check iphone-backup-v400.js
          node --check stats-and-rules-v403.js
          node --check categories-v409.js
          node --check dev-version-v409.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V409 runtime and interactions
        run: |
          cat > smoke.js <<'JS'
          const { chromium }=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const errors=[];page.on('pageerror',e=>errors.push(e.message));let result={status:'FAIL',version:'unknown',categoryBadge:false,categoryPicker:false,categoryOne:false,categoryAll:false,editInline:false,editWorks:false,editPreservesState:false,deleteGuard:false,testDelete:false,statistics:false,backup:false,deployAttempts:0,errors:[]};
          try{let live=false;for(let i=1;i<=18;i++){result.deployAttempts=i;await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});const s=await page.evaluate(()=>({cat:!!window.__modCategoriesV409,backup:!!window.__modIphoneBackupV401}));const html=await page.content();live=s.cat&&s.backup&&/BUILD: V409/.test(html);if(live)break;await page.waitForTimeout(10000);}if(!live)throw new Error('V409 runtime not deployed');result.backup=true;
          result.deleteGuard=await page.evaluate(()=>window.__modStatsV403.hasStarted({status:'paused',startedAt:new Date().toISOString()})===true);
          await page.click('[data-tab="all"]');await page.waitForTimeout(300);
          await page.evaluate(()=>{tasks.push({id:'smoke-v409-a',text:'Smoke Kategorie',status:'paused',startedAt:'2026-08-20T10:00:00.000Z',activeDurationMs:1234,activeSegments:[{startedAt:'2026-08-20T10:00:00.000Z',endedAt:'2026-08-20T10:00:01.234Z'}],type:'work',priority:'normal',optional:false,dueMode:'none',category:null});tasks.push({id:'smoke-v409-b',text:'  SMOKE   KATEGORIE ',status:'open',type:'work',priority:'normal',optional:false,dueMode:'none',category:null});archive.push({archiveNumber:999999,archiveId:'smoke-archive-v409',text:'Smoke Kategorie',status:'completed',type:'work',priority:'normal',optional:false,activeDurationMs:500,category:null});localStorage.setItem('masterOfDisasterCategoriesV405',JSON.stringify(['Küche','Arbeit']));render();});await page.waitForTimeout(150);
          const card=page.locator('.task').filter({hasText:'Smoke Kategorie'}).first();const badge=card.locator(':scope > .category-badge-v409');result.categoryBadge=(await badge.count())===1&&/OHNE KATEGORIE/.test(await badge.innerText());await badge.click();result.categoryPicker=await page.locator('#catPickerV409').count()===1&&await page.locator('[data-cat-v409]').count()>=3;await page.locator('[data-cat-v409="Küche"]').click();await page.locator('#catOneV409').click();await page.waitForTimeout(80);result.categoryOne=await page.evaluate(()=>tasks.find(t=>t.id==='smoke-v409-a')?.category==='Küche'&&!tasks.find(t=>t.id==='smoke-v409-b')?.category&&!archive.find(t=>t.archiveId==='smoke-archive-v409')?.category);
          await page.locator('.task').filter({hasText:'Smoke Kategorie'}).first().locator(':scope > .category-badge-v409').click();await page.locator('[data-cat-v409="Arbeit"]').click();await page.locator('#catAllV409').click();await page.waitForTimeout(80);result.categoryAll=await page.evaluate(()=>tasks.filter(t=>String(t.text).trim().toLowerCase().replace(/\s+/g,' ')==='smoke kategorie').every(t=>t.category==='Arbeit')&&archive.find(t=>t.archiveId==='smoke-archive-v409')?.category==='Arbeit');
          const edit=page.locator('.task').filter({hasText:'Smoke Kategorie'}).first().locator('.icon-actions .category-title-edit-v409');result.editInline=(await edit.count())===1;if(await edit.count()){await edit.click();await page.waitForTimeout(60);const input=page.locator('#edit-smoke-v409-a');result.editWorks=(await input.count())===1;if(await input.count()){await input.fill('Smoke Titel geändert');await page.getByRole('button',{name:'SPEICHERN'}).click();await page.waitForTimeout(60);result.editPreservesState=await page.evaluate(()=>{const t=tasks.find(x=>x.id==='smoke-v409-a');return t&&t.text==='Smoke Titel geändert'&&t.status==='paused'&&t.activeDurationMs===1234&&t.activeSegments?.length===1;});}}
          result.testDelete=await page.evaluate(()=>typeof isTestTask==='function'&&isTestTask({text:'Irgendwas (TEST)'})===true);
          await page.click('[data-tab="statistics"]');await page.waitForTimeout(200);result.statistics=await page.locator('#extendedStatsV403').count()===1;result.version='V409';result.errors=errors;result.status=Object.entries(result).filter(([k])=>!['status','version','deployAttempts','errors'].includes(k)).every(([,v])=>v===true)&&!errors.length?'PASS':'FAIL';
          await page.evaluate(()=>{tasks=tasks.filter(t=>!String(t.id).startsWith('smoke-v409'));archive=archive.filter(t=>t.archiveId!=='smoke-archive-v409');saveTasks();render();});}catch(e){result.errors.push(String(e.stack||e));}fs.writeFileSync('runtime-status.txt',JSON.stringify(result,null,2));console.log(result);await browser.close();if(result.status!=='PASS')process.exitCode=1;})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status
          cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" . || echo '{"status":"FAIL","errors":["runtime-status missing"]}' > runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
