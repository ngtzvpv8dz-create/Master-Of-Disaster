name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check active modules
        run: |
          node --check iphone-backup-v400.js
          node --check stats-and-rules-v403.js
          node --check categories.js
          node --check dev-version-v410.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V410 runtime and interactions
        run: |
          cat > smoke.js <<'JS'
          const { chromium }=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:390,height:844}});const errors=[];page.on('pageerror',e=>errors.push(e.message));let result={status:'FAIL',version:'unknown',newTaskCategory:true,noInputManage:false,filterToolbar:false,inlineCategory:false,inlineCategoryPassive:false,pausedEdit:false,editCategory:false,categoryOne:false,categoryAll:false,pausedOrder:false,openOrder:false,editPreservesState:false,deleteGuard:false,testDelete:false,statistics:false,backup:false,deployAttempts:0,errors:[]};
          try{let live=false;for(let i=1;i<=18;i++){result.deployAttempts=i;await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});const s=await page.evaluate(()=>({cat:!!window.__modCategoriesV410,backup:!!window.__modIphoneBackupV401}));const html=await page.content();live=s.cat&&s.backup&&/BUILD: V410/.test(html);if(live)break;await page.waitForTimeout(10000);}if(!live)throw new Error('V410 runtime not deployed');result.backup=true;
          result.deleteGuard=await page.evaluate(()=>window.__modStatsV403.hasStarted({status:'paused',startedAt:new Date().toISOString()})===true);
          await page.click('[data-tab="all"]');await page.waitForTimeout(250);
          result.noInputManage=(await page.locator('#categoryRowV410 #categoryManageV409').count())===0&&(await page.locator('#categoryRowV410 select').count())===1;
          result.filterToolbar=(await page.locator('#categoryToolbarV410 select').count())===1&&(await page.locator('#categoryManagerOpenV410').count())===1;
          await page.evaluate(()=>{tasks.push({id:'smoke-v410-a',text:'Smoke Kategorie',status:'paused',startedAt:'2026-08-20T10:00:00.000Z',activeDurationMs:1234,activeSegments:[{startedAt:'2026-08-20T10:00:00.000Z',endedAt:'2026-08-20T10:00:01.234Z'}],type:'work',priority:'normal',optional:false,dueMode:'none',category:null});tasks.push({id:'smoke-v410-b',text:'  SMOKE   KATEGORIE ',status:'open',type:'work',priority:'normal',optional:false,dueMode:'none',category:null});archive.push({archiveNumber:999999,archiveId:'smoke-archive-v410',text:'Smoke Kategorie',status:'completed',type:'work',priority:'normal',optional:false,activeDurationMs:500,category:null});localStorage.setItem('masterOfDisasterCategoriesV405',JSON.stringify(['Küche','Arbeit']));render();});await page.waitForTimeout(120);
          const paused=page.locator('.task').filter({hasText:'Smoke Kategorie'}).first();const inline=paused.locator('.task-main-row').locator('..').locator('.category-inline-v410').first();result.inlineCategory=(await paused.locator('.category-inline-v410').count())===1&&/OHNE KATEGORIE/.test(await paused.locator('.category-inline-v410').innerText());result.inlineCategoryPassive=await paused.locator('.category-inline-v410').evaluate(el=>getComputedStyle(el).pointerEvents==='none');
          const edit=paused.locator('.icon-actions .category-title-edit-v410');result.pausedEdit=(await edit.count())===1;const pausedTitles=await paused.locator('.icon-actions button').evaluateAll(bs=>bs.map(b=>b.title));result.pausedOrder=pausedTitles.join('|').includes('Weiter|Endzeit manuell eintragen|Beenden|Bearbeiten|Abbruch');
          if(await edit.count()){await edit.click();await page.waitForTimeout(70);result.editCategory=(await page.locator('#editCategoryV410').count())===1;await page.locator('#editCategoryV410').selectOption({label:'KÜCHE'});await page.getByRole('button',{name:'SPEICHERN'}).click();await page.waitForTimeout(80);result.categoryOne=await page.evaluate(()=>tasks.find(t=>t.id==='smoke-v410-a')?.category==='Küche'&&!tasks.find(t=>t.id==='smoke-v410-b')?.category&&!archive.find(t=>t.archiveId==='smoke-archive-v410')?.category);}
          const paused2=page.locator('.task').filter({hasText:'Smoke Kategorie'}).first();await paused2.locator('.icon-actions .category-title-edit-v410').click();await page.waitForTimeout(50);await page.locator('#editCategoryV410').selectOption({label:'ARBEIT'});await page.locator('[data-scope-v410="all"]').click();await page.locator('#edit-smoke-v410-a').fill('Smoke Titel geändert');await page.getByRole('button',{name:'SPEICHERN'}).click();await page.waitForTimeout(80);result.categoryAll=await page.evaluate(()=>tasks.find(t=>t.id==='smoke-v410-a')?.category==='Arbeit'&&tasks.find(t=>t.id==='smoke-v410-b')?.category==='Arbeit'&&archive.find(t=>t.archiveId==='smoke-archive-v410')?.category==='Arbeit');result.editPreservesState=await page.evaluate(()=>{const t=tasks.find(x=>x.id==='smoke-v410-a');return t&&t.text==='Smoke Titel geändert'&&t.status==='paused'&&t.activeDurationMs===1234&&t.activeSegments?.length===1;});
          const open=page.locator('.task').filter({hasText:/SMOKE\s+KATEGORIE/i}).last();const openTitles=await open.locator('.icon-actions button').evaluateAll(bs=>bs.map(b=>b.title));const di=openTitles.indexOf('Löschen'),ai=openTitles.indexOf('Abbruch');result.openOrder=ai>=0&&di>=0&&ai<di;
          result.testDelete=await page.evaluate(()=>typeof isTestTask==='function'&&isTestTask({text:'Irgendwas (TEST)'})===true);
          await page.click('[data-tab="statistics"]');await page.waitForTimeout(180);result.statistics=await page.locator('#extendedStatsV403').count()===1;result.version='V410';result.errors=errors;result.status=Object.entries(result).filter(([k])=>!['status','version','deployAttempts','errors'].includes(k)).every(([,v])=>v===true)&&!errors.length?'PASS':'FAIL';
          await page.evaluate(()=>{tasks=tasks.filter(t=>!String(t.id).startsWith('smoke-v410'));archive=archive.filter(t=>t.archiveId!=='smoke-archive-v410');saveTasks();render();});}catch(e){result.errors.push(String(e.stack||e));}fs.writeFileSync('runtime-status.txt',JSON.stringify(result,null,2));console.log(result);await browser.close();if(result.status!=='PASS')process.exitCode=1;})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status
          cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" . || echo '{"status":"FAIL","errors":["runtime-status missing"]}' > runtime-status.txt
          git add runtime-status.txt
          git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
