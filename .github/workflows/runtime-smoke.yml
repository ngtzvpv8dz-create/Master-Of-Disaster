name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check action-icons-v416.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V416 icon states
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});const r={status:'FAIL',version:'V416',module:false,icons:false,dueAlert:false,todayPin:false,coffee:false,errors:[]};try{let live=false;for(let i=0;i<18;i++){await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});if(/BUILD: V416/.test(await p.content())&&await p.evaluate(()=>!!window.__modActionIconsV416)){live=true;break;}await p.waitForTimeout(10000);}if(!live)throw new Error('V416 icons not deployed');r.module=true;await p.evaluate(()=>{const d=getBerlinDateKey();const now=Date.now();tasks.push({id:9416001,text:'Smoke Icons Offen',status:'open',type:'work',priority:'high',optional:false,dueMode:'deadline',dueDate:d,todayDate:d,category:'Arbeit',startedAt:null,pausedAt:null,pauseTotalMs:0,activeSegments:[]});tasks.push({id:9416002,text:'Smoke Icons Pause',status:'paused',type:'work',priority:'medium',optional:false,dueMode:'none',dueDate:null,todayDate:null,category:'Arbeit',startedAt:new Date(now-600000).toISOString(),pausedAt:new Date(now-300000).toISOString(),pauseTotalMs:0,activeSegments:[{startedAt:new Date(now-600000).toISOString(),endedAt:new Date(now-300000).toISOString()}]});render();});await p.waitForTimeout(250);const open=p.locator('button[onclick="startTask(9416001)"]').locator('xpath=ancestor::div[contains(@class,"task")][1]');const paused=p.locator('button[onclick="resumeTask(9416002)"]').locator('xpath=ancestor::div[contains(@class,"task")][1]');r.icons=await open.locator('button.mono-action-v416 .action-svg-v416').count()>=4;r.dueAlert=await open.locator('.due-inline-v416 .due-alert-circle-v416').count()===1;r.todayPin=await open.locator('button[data-icon-v416="calendarPin"]').count()===1;r.coffee=await paused.locator('.status-symbol.mono-status-v416 .action-svg-v416').count()===1;await p.evaluate(()=>{tasks=tasks.filter(t=>![9416001,9416002].includes(t.id));saveTasks();render();});r.status=r.module&&r.icons&&r.dueAlert&&r.todayPin&&r.coffee?'PASS':'FAIL';}catch(e){r.errors.push(String(e.stack||e))}fs.writeFileSync('runtime-status.txt',JSON.stringify(r,null,2));await b.close();if(r.status!=='PASS')process.exitCode=1})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
