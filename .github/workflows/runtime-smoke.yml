name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify V414 popup behavior
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});const r={status:'FAIL',version:'V414',popupFixed:false,popupCentered:false,saved:false,immutable:false,errors:[]};try{for(let i=0;i<18;i++){await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle'});if(/BUILD: V414/.test(await p.content()))break;await p.waitForTimeout(10000);}await p.evaluate(()=>{localStorage.setItem('masterOfDisasterCategoriesV405',JSON.stringify(['Küche','Arbeit']));archive.push({archiveNumber:999996,archiveId:'smoke-v414',text:'Smoke Archiv Popup',status:'completed',type:'work',activeDurationMs:4321,completedAt:'2026-08-20T10:00:00.000Z',completedDate:'2026-08-20',category:null});document.getElementById('viewContainer').innerHTML='<div class="task completed archive-task"><div class="archive-number">A999996</div><div class="task-content"><span class="task-type-badge">ARBEIT</span><span class="task-type-badge category-inline-v412">🏷️ OHNE KATEGORIE</span></div></div>';window.__modArchiveCategoryV413.enhanceArchiveBadges();});const before=await p.evaluate(()=>{const x={...archive.find(a=>a.archiveId==='smoke-v414')};delete x.category;return JSON.stringify(x)});await p.locator('.archive-task .category-inline-v412').click();const ov=p.locator('.modal-overlay'),box=await ov.locator('.archive-category-modal-v412').boundingBox(),vp=p.viewportSize();r.popupFixed=await ov.evaluate(e=>getComputedStyle(e).position==='fixed'&&getComputedStyle(e).zIndex==='2000');r.popupCentered=!!box&&box.y>0&&box.y+box.height<vp.height&&Math.abs((box.x+box.width/2)-vp.width/2)<8;await p.locator('#archiveCategoryV412').selectOption({label:'KÜCHE'});await p.locator('#archiveCategorySaveV412').click();r.saved=await p.evaluate(()=>archive.find(a=>a.archiveId==='smoke-v414')?.category==='Küche');const after=await p.evaluate(()=>{const x={...archive.find(a=>a.archiveId==='smoke-v414')};delete x.category;return JSON.stringify(x)});r.immutable=before===after;r.status=r.popupFixed&&r.popupCentered&&r.saved&&r.immutable?'PASS':'FAIL';}catch(e){r.errors.push(String(e.stack||e))}fs.writeFileSync('runtime-status.txt',JSON.stringify(r,null,2));await b.close();if(r.status!=='PASS')process.exitCode=1})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
