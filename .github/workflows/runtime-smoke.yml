name: Runtime Smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check priority-header-v424.js && node --check visible-icon-fix-v423.js
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - name: Verify live V424 priority header alignment and colors
        run: |
          cat > smoke.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});const r={status:'FAIL',version:'V424',module:false,headers:false,colors:false,aligned:false,countersRight:false,iconFixIntact:false,dueModelIntact:false,errors:[]};try{let live=false;for(let i=0;i<18;i++){await p.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v='+Date.now(),{waitUntil:'networkidle',timeout:60000});if(/BUILD: V424/.test(await p.content())&&await p.evaluate(()=>window.__modPriorityHeaderV424?.version==='V424')){live=true;break;}await p.waitForTimeout(10000);}if(!live)throw new Error('V424 not deployed');r.module=true;
          await p.evaluate(()=>switchTab('priority'));await p.waitForTimeout(700);
          r.headers=await p.locator('.priority-header-v424 .priority-label-v424').count()>=4;
          r.colors=await p.locator('.priority-header-v424').evaluateAll(h=>h.length>=4&&h.every(x=>getComputedStyle(x.querySelector('.priority-label-v424')).color===getComputedStyle(x.querySelector('.priority-ring-v424')).borderTopColor));
          r.aligned=await p.locator('.section').evaluateAll(secs=>{const pairs=secs.map(s=>[s.querySelector('.priority-label-v424'),s.querySelector('.task .task-text')]).filter(([a,b])=>a&&b);return pairs.length>=3&&pairs.every(([a,b])=>Math.abs(a.getBoundingClientRect().left-b.getBoundingClientRect().left)<=2)});
          r.countersRight=await p.locator('.priority-count-v424').evaluateAll(els=>els.length>=4&&els.every(e=>e.getBoundingClientRect().right>350));
          r.iconFixIntact=await p.evaluate(()=>window.__modVisibleIconFixV423?.version==='V423');
          r.dueModelIntact=await p.evaluate(()=>window.__modActionIconsV416?.version==='V418'&&typeof setNewDueDateV418==='function'&&typeof setTaskDueDateV418==='function');
          r.status=Object.entries(r).filter(([k])=>!['status','version','errors'].includes(k)).every(([,v])=>v===true)?'PASS':'FAIL';}catch(e){r.errors.push(String(e.stack||e))}fs.writeFileSync('runtime-status.txt',JSON.stringify(r,null,2));await b.close();if(r.status!=='PASS')process.exitCode=1})();
          JS
          node smoke.js
      - name: Publish result
        if: always()
        run: |
          git init /tmp/status && cd /tmp/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/runtime-status.txt" .
          git add runtime-status.txt && git commit -m "Runtime smoke result"
          git branch -M runtime-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin runtime-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
