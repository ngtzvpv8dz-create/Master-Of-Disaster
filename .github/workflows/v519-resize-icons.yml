name: V519 Resize Launcher Icons

on:
  push:
    branches: [ v519-valid-icons-hotfix ]
    paths:
      - '.github/workflows/v519-resize-icons.yml'

permissions:
  contents: write

jobs:
  resize-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resize and validate launcher PNGs
        run: |
          python -m pip install --disable-pip-version-check pillow >/dev/null 2>&1
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          names = ('todo', 'sport', 'food', 'future')
          for name in names:
              path = Path(f'assets/icons/{name}-v519-1024.png')
              raw = path.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG signature before resize: {path}')
              with Image.open(path) as source:
                  source.load()
                  if source.format != 'PNG':
                      raise SystemExit(f'Not PNG: {path} -> {source.format}')
                  final = source.resize((1024, 1024), Image.Resampling.LANCZOS)
                  final.save(path, format='PNG', optimize=True)
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG signature after resize: {path}')
              with Image.open(path) as check:
                  check.load()
                  if check.format != 'PNG' or check.size != (1024, 1024):
                      raise SystemExit(f'Validation failed: {path} -> {check.format} {check.size}')
              print(f'{path}: PNG 1024x1024 PASS ({len(data)} bytes)')
          PY
      - name: Commit resized PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/todo-v519-1024.png \
                  assets/icons/sport-v519-1024.png \
                  assets/icons/food-v519-1024.png \
                  assets/icons/future-v519-1024.png
          if git diff --cached --quiet; then
            echo "No resize changes needed."
            exit 0
          fi
          git commit -m "V519: normalize launcher icons to 1024x1024"
          git push
