name: V539 Kistology Rummage Cards
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  kistology-rummage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wiring checks
        run: |
          node --check app-hub-launcher-v517.js
          node --check kistology-v539.js
          node --check sw.js
          test -f kistology-v539.css
          grep -q "const VERSION='V539'" kistology-v539.js
          grep -q "RPC_NAME='kistology_snapshot_v1'" kistology-v539.js
          grep -q 'inlineItemDetailsV539:true' kistology-v539.js
          grep -q 'singleExpandedItemV539:true' kistology-v539.js
          grep -q 'searchJumpsToExpandedItemV539:true' kistology-v539.js
          grep -q 'permanentCardOffsetsRemovedV539:true' kistology-v539.js
          grep -q 'objectNameOnlySearchV539:true' kistology-v539.js
          grep -q 'containerTypeAndDimensionsHiddenV539:true' kistology-v539.js
          grep -q 'kistologyRummageLoaderV539:true' app-hub-launcher-v517.js
          grep -q "return 'v539'" app-hub-launcher-v517.js
          grep -q '"./kistology-v539.js"' sw.js
          grep -q '"./kistology-v539.css"' sw.js
          grep -q 'disabledInProductionV5382:true' sport-s-noop-v538.js
      - name: Browser rummage regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v539-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const deadline=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timeout')),ms))]);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg=v539',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV524&&window.__modKistologyV539?.version==='V539',null,{timeout:30000});

            const fixture={schema_version:1,mode:'readonly_snapshot',containers:[
              {code:'K1',name:null,container_type:'IKEA SAMLA Klein',dimensions:'39 × 28 × 14 cm',notes:'Interne Notiz',updated_at:'2026-09-06T15:40:37Z'},
              {code:'K2',name:'FOTO · ACTIONCAM · OPTIK UND WEITERES ZUBEHÖR',container_type:'IKEA SAMLA Klein',dimensions:'39 × 28 × 14 cm',notes:'',updated_at:'2026-09-06T16:03:09Z'}
            ],items:[
              {source_id:'R1-P01',designation:'Anker Powerbank 20.000 mAh',category:'Powerbank',container_code:'K1',section:'Einsatz Fach 2',status:'eingelagert',details:{},verified_at:'2026-09-06T15:00:00Z',updated_at:'2026-09-06T15:00:00Z'},
              {source_id:'R1-P02',designation:'Steckdosenadapter UK',category:'Powerbank',container_code:'K1',section:'Hauptfach',status:'eingelagert',details:{},verified_at:'2026-09-06T15:00:00Z',updated_at:'2026-09-06T15:00:00Z'},
              {source_id:'R1-P03',designation:'USB-C Kabel 2 m',category:'Kabel',container_code:'K1',section:'NOJIG 20 × 25 cm',status:'eingelagert',details:{},verified_at:'2026-09-06T15:00:00Z',updated_at:'2026-09-06T15:00:00Z'},
              {source_id:'R2-P01',designation:'Actioncam Halterung',category:'FOTO · ACTIONCAM · OPTIK UND WEITERES ZUBEHÖR',container_code:'K2',section:'Hauptfach',status:'eingelagert',details:{},verified_at:'2026-09-06T16:00:00Z',updated_at:'2026-09-06T16:00:00Z'}
            ]};

            await page.evaluate(fixture=>{
              const day=typeof getBerlinDateKey==='function'?getBerlinDateKey():'2026-09-12';
              tasks=[{id:53901,text:'V539 Bestandsschutz',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,activeSegments:[]}];
              if(typeof saveTasks==='function')saveTasks();
              window.getSupabaseClient=()=>({auth:{getSession:async()=>({data:{session:{user:{id:'v539-test-user'}}},error:null})},rpc:async name=>name==='kistology_snapshot_v1'?({data:fixture,error:null}):({data:null,error:{message:'unexpected rpc'}})});
              window.__modAppHubV515.show();window.__modHubLauncherV524.render();window.__modKistologyV539.patchLauncher();
            },fixture);
            await page.waitForTimeout(180);

            await page.click('[data-mod-hub-launch-v517="kistology"]');
            await page.waitForSelector('[data-kistology-view-v539="regal"]',{timeout:10000});
            const shelf=await page.evaluate(()=>{
              const k1=document.querySelector('[data-kistology-box-v539="K1"]');
              const k2=document.querySelector('[data-kistology-box-v539="K2"]');
              const k1Text=k1?.innerText||'', k2Text=k2?.innerText||'';
              const longName=k2?.querySelector('.mod-kistology-box-name-v539');
              return {
                boxes:document.querySelectorAll('[data-kistology-box-v539]').length,
                meta:window.__modKistologyV539.getSnapshotMeta(),
                k1Text,k2Text,
                k1CodeCount:(k1Text.match(/K1/g)||[]).length,
                codeBadge:!!k1?.querySelector('.mod-kistology-box-code-v539'),
                lineClamp:longName?getComputedStyle(longName).webkitLineClamp:null,
                typeLeak:/SAMLA|39 × 28/.test(k1Text+k2Text),
                sourceLeak:/R1-P01|R1-P02|R1-P03|R2-P01/.test(document.getElementById('modKistologyV535')?.innerText||''),
                task:(tasks||[]).find(t=>t.id===53901)?.text
              };
            });
            if(shelf.boxes!==2||shelf.meta.items!==4||shelf.k1CodeCount!==1||!shelf.codeBadge||shelf.lineClamp!=='2'||shelf.typeLeak||shelf.sourceLeak||shelf.task!=='V539 Bestandsschutz')throw new Error('V539 shelf '+JSON.stringify(shelf));
            if(!shelf.k1Text.includes('3 Gegenstände')||!shelf.k1Text.includes('2 Kategorien'))throw new Error('V539 shelf content '+JSON.stringify(shelf));

            await page.click('[data-kistology-box-v539="K1"]');
            await page.waitForSelector('[data-kistology-view-v539="box"]');
            const opened=await page.evaluate(()=>{
              const box=document.querySelector('[data-kistology-view-v539="box"]');
              const text=box?.innerText||'';
              const section=box?.querySelector('[data-kistology-item-v539="R1-P03"] .mod-kistology-section-badge-v539');
              const first=box?.querySelector('[data-kistology-item-v539="R1-P01"]');
              const second=box?.querySelector('[data-kistology-item-v539="R1-P02"]');
              return {
                codeCount:(text.match(/K1/g)||[]).length,
                chips:[...box.querySelectorAll('.mod-kistology-category-chip-v539')].map(x=>x.textContent.trim()),
                typeLeak:/SAMLA|39 × 28/.test(text),
                sourceLeak:/R1-P01/.test(text),
                sectionText:section?.textContent.trim(),
                sectionAlign:section?getComputedStyle(section).textAlign:null,
                sectionJustify:section?getComputedStyle(section).justifyContent:null,
                sectionFont:section?parseFloat(getComputedStyle(section).fontSize):99,
                firstTransform:first?getComputedStyle(first).transform:null,
                secondTransform:second?getComputedStyle(second).transform:null,
                backX:box?.querySelector('[data-kistology-back-v539]')?.getBoundingClientRect().left
              };
            });
            if(opened.codeCount!==1||opened.typeLeak||opened.sourceLeak||opened.chips.length!==2||!opened.chips.includes('Powerbank')||!opened.chips.includes('Kabel'))throw new Error('V539 opened '+JSON.stringify(opened));
            if(opened.sectionText!=='NOJIG 20 × 25 cm'||opened.sectionAlign!=='center'||opened.sectionJustify!=='center'||opened.sectionFont>=9)throw new Error('V539 section badge '+JSON.stringify(opened));
            if(opened.firstTransform!=='none'||opened.secondTransform!=='none')throw new Error('V539 permanent staggering still active '+JSON.stringify(opened));

            const firstCard='[data-kistology-item-v539="R1-P01"]';
            const secondCard='[data-kistology-item-v539="R1-P02"]';
            const closedHeight=await page.locator(firstCard).evaluate(el=>el.getBoundingClientRect().height);
            await page.click(firstCard+' [data-kistology-item-toggle-v539]');
            await page.waitForTimeout(420);
            const expanded=await page.evaluate(({firstCard})=>{
              const first=document.querySelector(firstCard);
              return {count:document.querySelectorAll('.mod-kistology-item-card-v539.is-expanded').length,firstOpen:first?.classList.contains('is-expanded'),height:first?.getBoundingClientRect().height,text:first?.innerText||'',aria:first?.querySelector('[data-kistology-item-toggle-v539]')?.getAttribute('aria-expanded')};
            },{firstCard});
            if(expanded.count!==1||!expanded.firstOpen||expanded.aria!=='true'||expanded.height<=closedHeight+20||!expanded.text.includes('Kategorie')||!expanded.text.includes('Powerbank'))throw new Error('V539 first expand '+JSON.stringify({closedHeight,expanded}));

            await page.click(secondCard+' [data-kistology-item-toggle-v539]');
            await page.waitForTimeout(420);
            const switched=await page.evaluate(({firstCard,secondCard})=>({count:document.querySelectorAll('.mod-kistology-item-card-v539.is-expanded').length,firstOpen:document.querySelector(firstCard)?.classList.contains('is-expanded'),secondOpen:document.querySelector(secondCard)?.classList.contains('is-expanded'),firstAbove:document.querySelector(firstCard)?.classList.contains('is-above-expanded')}),{firstCard,secondCard});
            if(switched.count!==1||switched.firstOpen||!switched.secondOpen||!switched.firstAbove)throw new Error('V539 switch expand '+JSON.stringify(switched));
            await page.click(secondCard+' [data-kistology-item-toggle-v539]');
            await page.waitForTimeout(380);
            const closed=await page.evaluate(()=>document.querySelectorAll('.mod-kistology-item-card-v539.is-expanded').length);
            if(closed!==0)throw new Error('V539 close same card failed '+closed);

            const search=page.locator('[data-kistology-search-v539]');
            await search.fill('Powerbank');
            await page.waitForSelector('[data-kistology-view-v539="search"]');
            const results=await page.evaluate(()=>({count:document.querySelectorAll('[data-kistology-result-v539]').length,text:document.querySelector('[data-kistology-view-v539="search"]')?.innerText||''}));
            if(results.count!==1||!results.text.includes('Anker Powerbank 20.000 mAh')||results.text.includes('Steckdosenadapter UK')||results.text.includes('K1')||results.text.includes('eingelagert'))throw new Error('V539 object-only search '+JSON.stringify(results));
            await page.click('[data-kistology-result-v539]');
            await page.waitForSelector('[data-kistology-view-v539="box"]');
            await page.waitForSelector('[data-kistology-item-v539="R1-P01"].is-expanded');
            const searchJump=await page.evaluate(()=>({detailPages:document.querySelectorAll('[data-kistology-view-v539="detail"]').length,expanded:document.querySelectorAll('.mod-kistology-item-card-v539.is-expanded').length,text:document.querySelector('[data-kistology-item-v539="R1-P01"]')?.innerText||''}));
            if(searchJump.detailPages!==0||searchJump.expanded!==1||!searchJump.text.includes('Powerbank'))throw new Error('V539 search jump '+JSON.stringify(searchJump));

            await page.click('#modHomeButtonV525');await page.waitForTimeout(150);
            await deadline(page.click('[data-mod-hub-launch-v517="sport"]'),2500,'Sport launcher');
            await page.waitForTimeout(180);
            const sport=await deadline(page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>resolve({mode:window.__modSportModeV510.currentMode(),surface:document.body.dataset.modAppSurfaceV515})))),2000,'Sport responsiveness');
            if(sport.mode!=='sport'||sport.surface!=='sport')throw new Error('V539 protected Sport path '+JSON.stringify(sport));
            await page.click('#modHomeButtonV525');await page.waitForTimeout(150);

            const final=await page.evaluate(()=>({hub:document.body.classList.contains('mod-app-hub-v515'),surface:document.body.dataset.modAppSurfaceV515,task:(tasks||[]).find(t=>t.id===53901)?.text,kistologyKeys:Object.keys(localStorage).filter(k=>/kistology/i.test(k)),flags:window.__modKistologyV539}));
            if(!final.hub||final.surface!=='hub'||final.task!=='V539 Bestandsschutz'||final.kistologyKeys.length||!final.flags.inlineItemDetailsV539||!final.flags.singleExpandedItemV539)throw new Error('V539 final '+JSON.stringify(final));
            if(errors.length)throw new Error('V539 page errors '+JSON.stringify(errors));
            await page.screenshot({path:'/tmp/v539-kistology.png',fullPage:true});
            fs.writeFileSync('/tmp/v539-result.json',JSON.stringify({shelf,opened,expanded,switched,results,searchJump,sport,final:{hub:final.hub,surface:final.surface,task:final.task,kistologyKeys:final.kistologyKeys},errors},null,2));
            console.log('V539 KISTOLOGY RUMMAGE PASS');
            await browser.close();
          })().catch(error=>{fs.writeFileSync('/tmp/v539-error.txt',String(error&&error.stack||error));console.error(error);process.exit(1);});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v539-kistology-rummage-diagnostics
          path: |
            /tmp/v539-kistology.png
            /tmp/v539-result.json
            /tmp/v539-error.txt
            /tmp/mod-v539-http.log
          if-no-files-found: ignore
