name: V535 Kistology Preview
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  kistology-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wiring checks
        run: |
          node --check app-hub-launcher-v517.js
          node --check kistology-v535.js
          node --check sw.js
          test -f kistology-v535.css
          grep -q "const VERSION='V535'" kistology-v535.js
          grep -q 'kistologyPreviewLoaderV535:true' app-hub-launcher-v517.js
          grep -q 'kistology-v535.css?v=535-preview' app-hub-launcher-v517.js
          grep -q 'kistology-v535.js?v=535-preview' app-hub-launcher-v517.js
          grep -q '"./kistology-v535.css"' sw.js
          grep -q '"./kistology-v535.js"' sw.js
          grep -q 'previewOnly:true' kistology-v535.js
          grep -q 'inventoryPersistenceUntouched:true' kistology-v535.js
          grep -q 'searchWorksV535:true' kistology-v535.js
          grep -q 'pulledBoxV535:true' kistology-v535.js
      - name: Browser Kistology preview regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v535-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg=v535',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV524&&window.__modKistologyV535?.version==='V535',null,{timeout:30000});
            await page.evaluate(()=>{
              const day=typeof getBerlinDateKey==='function'?getBerlinDateKey():'2026-09-11';
              tasks=[{id:53501,text:'V535 Bestandsschutz',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,activeSegments:[]}];
              if(typeof saveTasks==='function')saveTasks();
              window.__modAppHubV515.show();
              window.__modHubLauncherV524.render();
              window.__modKistologyV535.patchLauncher();
              window.__modBackstageV531?.patchLauncher?.();
            });
            await page.waitForTimeout(250);

            const launcher=await page.evaluate(()=>{
              const b=document.querySelector('[data-mod-hub-launch-v517="kistology"]');
              return {disabled:b?.getAttribute('aria-disabled'),active:b?.dataset.modKistologyActiveV535,task:(tasks||[]).find(t=>t.id===53501)?.text};
            });
            if(launcher.disabled!==null||launcher.active!=='true'||launcher.task!=='V535 Bestandsschutz')throw new Error('V535 launcher '+JSON.stringify(launcher));

            await page.click('[data-mod-hub-launch-v517="kistology"]');
            await page.waitForSelector('body.mod-kistology-v535 #modKistologyV535:not([hidden])');
            await page.waitForTimeout(180);
            const shelf=await page.evaluate(()=>({
              surface:document.body.dataset.modAppSurfaceV515,
              open:window.__modKistologyV535.isOpen(),
              preview:window.__modKistologyV535.previewOnly,
              boxes:document.querySelectorAll('[data-kistology-box-v535]').length,
              view:document.querySelector('[data-kistology-view-v535]')?.dataset.kistologyViewV535,
              previewText:document.querySelector('.mod-kistology-preview-v535')?.textContent.trim(),
              task:(tasks||[]).find(t=>t.id===53501)?.text
            }));
            if(shelf.surface!=='kistology'||!shelf.open||!shelf.preview||shelf.boxes!==6||shelf.view!=='regal'||shelf.previewText!=='PREVIEW'||shelf.task!=='V535 Bestandsschutz')throw new Error('V535 shelf '+JSON.stringify(shelf));

            await page.click('[data-kistology-box-v535="box-01"]');
            await page.waitForSelector('[data-kistology-view-v535="box"]');
            const opened=await page.evaluate(()=>({
              pulled:!!document.querySelector('.mod-kistology-pulled-box-v535'),
              items:document.querySelectorAll('[data-kistology-item-v535]').length,
              title:document.querySelector('.mod-kistology-pulled-box-v535 strong')?.textContent.trim(),
              task:(tasks||[]).find(t=>t.id===53501)?.text
            }));
            if(!opened.pulled||opened.items!==4||opened.title!=='KISTE 01'||opened.task!=='V535 Bestandsschutz')throw new Error('V535 open box '+JSON.stringify(opened));

            const search=page.locator('[data-kistology-search-v535]');
            await search.fill('Panzerband');
            await page.waitForSelector('[data-kistology-view-v535="search"]');
            const results=await page.evaluate(()=>({
              count:document.querySelectorAll('[data-kistology-result-open-v535]').length,
              text:document.querySelector('.mod-kistology-result-main-v535 h4')?.textContent.trim(),
              task:(tasks||[]).find(t=>t.id===53501)?.text
            }));
            if(results.count!==1||results.text!=='Graues Panzer-/Gewebeband'||results.task!=='V535 Bestandsschutz')throw new Error('V535 search '+JSON.stringify(results));

            await page.click('[data-kistology-result-open-v535]');
            await page.waitForSelector('[data-kistology-item-v535="DEMO-02"].is-highlighted');
            const jump=await page.evaluate(()=>({
              view:document.querySelector('[data-kistology-view-v535]')?.dataset.kistologyViewV535,
              highlighted:!!document.querySelector('[data-kistology-item-v535="DEMO-02"].is-highlighted'),
              task:(tasks||[]).find(t=>t.id===53501)?.text,
              kistologyKeys:Object.keys(localStorage).filter(k=>/kistology/i.test(k))
            }));
            if(jump.view!=='box'||!jump.highlighted||jump.task!=='V535 Bestandsschutz'||jump.kistologyKeys.length)throw new Error('V535 jump '+JSON.stringify(jump));

            await page.click('#modHomeButtonV525');
            await page.waitForTimeout(180);
            const home=await page.evaluate(()=>({
              hub:document.body.classList.contains('mod-app-hub-v515'),
              kistology:document.body.classList.contains('mod-kistology-v535'),
              surface:document.body.dataset.modAppSurfaceV515,
              task:(tasks||[]).find(t=>t.id===53501)?.text
            }));
            if(!home.hub||home.kistology||home.surface!=='hub'||home.task!=='V535 Bestandsschutz')throw new Error('V535 home '+JSON.stringify(home));
            if(errors.length)throw new Error('V535 page errors '+JSON.stringify(errors));

            await page.screenshot({path:'/tmp/v535-kistology.png',fullPage:true});
            fs.writeFileSync('/tmp/v535-result.json',JSON.stringify({launcher,shelf,opened,results,jump,home,errors},null,2));
            console.log('V535 KISTOLOGY PREVIEW PASS');
            await browser.close();
          })().catch(error=>{fs.writeFileSync('/tmp/v535-error.txt',String(error&&error.stack||error));console.error(error);process.exit(1);});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v535-kistology-preview-diagnostics
          path: |
            /tmp/v535-kistology.png
            /tmp/v535-result.json
            /tmp/v535-error.txt
            /tmp/mod-v535-http.log
          if-no-files-found: ignore
