name: V595 Backstage + Header Stability
on:
  push:
    branches: [ main ]
    paths:
      - 'build-freshness-v502.js'
      - 'surface-brand-v556.css'
      - 'header-consolidated-v560.css'
      - 'stability-v595.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/v595-stability.yml'
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static guards
        run: |
          node --check build-freshness-v502.js
          node --check stability-v595.js
          grep -q "value.textContent!==next" build-freshness-v502.js
          grep -q "backstageMutationLoopFixed:true" stability-v595.js
          grep -q "kistologyHeaderSlotStable:true" stability-v595.js
          grep -q "width:.56em!important" header-consolidated-v560.css
          grep -q "min-width:.72em!important" surface-brand-v556.css
          grep -q "v=595-backstage-loopfix" index.html
          grep -q "v=595-header-stability" index.html
          grep -q "master-of-disaster-v595-backstage-header-stability" sw.js
      - name: Browser regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v595-http.log 2>&1 &
          timeout 120s node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*',route=>/\.supabase\.co\//.test(route.request().url())?route.abort():route.continue());

            await page.goto('http://127.0.0.1:8787/?v595='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV517&&window.__modStabilityV595?.version==='V595',null,{timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-mod-hub-launch-v517="kistology"]')?.getAttribute('aria-disabled')===null&&document.querySelector('[data-mod-hub-launch-v517="backstage"]')?.getAttribute('aria-disabled')===null,null,{timeout:15000});

            const home=await page.evaluate(()=>{
              const title=document.querySelector('.mod-brand-title-v525');
              const marker=document.querySelector('.sport-switch-v510.mod-surface-mark-v556');
              return {title:title.getBoundingClientRect().width,marker:marker.getBoundingClientRect().width};
            });

            await page.click('[data-mod-hub-launch-v517="kistology"]');
            await page.waitForFunction(()=>document.body.classList.contains('mod-kistology-v535'),null,{timeout:30000});
            await page.waitForTimeout(250);
            const kistology=await page.evaluate(()=>{
              const title=document.querySelector('.mod-brand-title-v525');
              const marker=document.querySelector('.sport-switch-v510.mod-surface-mark-v556');
              const before=getComputedStyle(marker,'::before');
              return {
                title:title.getBoundingClientRect().width,
                marker:marker.getBoundingClientRect().width,
                folderWidth:parseFloat(before.width)||0
              };
            });
            if(Math.abs(home.marker-kistology.marker)>0.75)throw new Error('Kistology marker slot changed width '+JSON.stringify({home,kistology}));
            if(Math.abs(home.title-kistology.title)>1.25)throw new Error('MASTER title jumped '+JSON.stringify({home,kistology}));
            if(!(kistology.folderWidth>0&&kistology.folderWidth<kistology.marker*0.9))throw new Error('Kistology folder was not slimmed '+JSON.stringify(kistology));

            await page.click('#modHomeButtonV525');
            await page.waitForFunction(()=>document.body.dataset.modAppSurfaceV515==='hub',null,{timeout:10000});

            await page.click('[data-mod-hub-launch-v517="backstage"]');
            await page.waitForFunction(()=>document.body.classList.contains('mod-backstage-v530')&&document.body.dataset.modAppSurfaceV515==='backstage',null,{timeout:30000});
            await page.waitForTimeout(650);

            const backstage=await page.evaluate(()=>({
              section:window.__modBackstageV531?.activeSection,
              devCard:!!document.querySelector('#viewContainer .dev-build-card'),
              fresh:document.querySelector('#viewContainer .dev-build-card')?.dataset.v502FreshBuild||'',
              marker:window.__modStabilityV595?.backstageMutationLoopFixed===true
            }));
            if(backstage.section!=='dev'||!backstage.devCard||backstage.fresh!=='true'||!backstage.marker)throw new Error('Backstage did not reach stable DEV '+JSON.stringify(backstage));

            // This second interaction is the important freeze regression:
            // the old MutationObserver loop starved the event loop here.
            await page.click('#modHomeButtonV525',{timeout:8000});
            await page.waitForFunction(()=>document.body.dataset.modAppSurfaceV515==='hub'&&!document.body.classList.contains('mod-backstage-v530'),null,{timeout:8000});
            const alive=await page.evaluate(()=>new Promise(resolve=>setTimeout(()=>resolve(true),80)));
            if(!alive)throw new Error('Event loop not responsive after Backstage');

            const relevantErrors=errors.filter(e=>!/Failed to fetch|supabase/i.test(e));
            if(relevantErrors.length)throw new Error('Page errors '+JSON.stringify(relevantErrors));
            console.log('V595 STABILITY PASS',JSON.stringify({home,kistology,backstage}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
