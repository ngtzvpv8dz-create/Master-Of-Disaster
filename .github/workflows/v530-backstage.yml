name: V530 Backstage
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  backstage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wiring checks
        run: |
          node --check backstage-v530.js
          node --check sw.js
          test -f backstage-v530.css
          grep -q 'backstage-v530.css?v=530-1425' index.html
          grep -q 'backstage-v530.js?v=600-backup-model' index.html
          grep -q 'const CACHE_NAME=' sw.js
          grep -q '"./backstage-v530.css"' sw.js
          grep -q '"./backstage-v530.js"' sw.js
          grep -q "const VERSION='V530'" backstage-v530.js
          grep -q 'devAndLogMoved:true' backstage-v530.js
          grep -q 'existingRenderersReused:true' backstage-v530.js
          grep -q 'todoDataUntouched:true' backstage-v530.js
          if grep -q 'data-tab="dev" onclick="switchTab' index.html; then echo 'DEV still present in To-do tabs'; exit 1; fi
          if grep -q 'data-tab="log" onclick="switchTab' index.html; then echo 'LOG still present in To-do tabs'; exit 1; fi
      - name: Browser Backstage regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v530-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*.supabase.co/**',route=>route.abort());
            await page.goto('http://127.0.0.1:8787/?reg=v530',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV524&&window.__modAreaRuntimeV591,null,{timeout:30000});

            await page.evaluate(()=>{window.__modAppHubV515.show();window.__modHubLauncherV524?.render?.();});
            await page.waitForTimeout(120);
            const home=await page.evaluate(()=>({
              hub:document.body.classList.contains('mod-app-hub-v515'),
              surface:document.body.dataset.modAppSurfaceV515,
              backstageButton:!!document.querySelector('[data-mod-hub-launch-v517="backstage"]')
            }));
            if(!home.hub||home.surface!=='hub'||!home.backstageButton)throw new Error('V530 home '+JSON.stringify(home));

            await page.evaluate(async()=>window.__modAreaRuntimeV591.openArea('backstage'));
            await page.waitForFunction(()=>window.__modBackstageV531&&document.body.classList.contains('mod-backstage-v530'),null,{timeout:30000});
            const backstage=await page.evaluate(()=>({
              surface:document.body.dataset.modAppSurfaceV515,
              section:window.__modBackstageV531?.activeSection,
              root:!!document.getElementById('modBackstageV530')
            }));
            if(backstage.surface!=='backstage'||backstage.section!=='dev'||!backstage.root)throw new Error('V530 Backstage '+JSON.stringify(backstage));

            await page.evaluate(()=>window.__modBackstageV531?.close?.({restoreTodo:true}));
            await page.evaluate(()=>window.__modAppHubV515.show());
            await page.waitForTimeout(120);
            const returned=await page.evaluate(()=>document.body.classList.contains('mod-app-hub-v515')&&document.body.dataset.modAppSurfaceV515==='hub');
            if(!returned)throw new Error('V530 home return failed');
            if(errors.length)throw new Error('V530 page errors '+JSON.stringify(errors));
            fs.writeFileSync('/tmp/v530-result.json',JSON.stringify({home,backstage,returned,errors},null,2));
            console.log('V530 LAZY BACKSTAGE PASS');
            await browser.close();
          })().catch(error=>{fs.writeFileSync('/tmp/v530-error.txt',String(error&&error.stack||error));console.error(error);process.exit(1);});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v530-backstage-diagnostics
          path: |
            /tmp/v530-backstage-dev.png
            /tmp/v530-backstage-log.png
            /tmp/v530-result.json
            /tmp/v530-error.txt
            /tmp/mod-v530-http.log
          if-no-files-found: ignore
