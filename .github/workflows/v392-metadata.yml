name: V392 metadata updater
on:
  push:
    branches: [v392-weight-stable-identity]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[v392-meta]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v392-weight-stable-identity
      - name: Update app metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text()
          s=s.replace('const APP_VERSION =\n"V391";', 'const APP_VERSION =\n"V392";', 1)
          s=re.sub(r'const APP_BUILD_TIME =\n"[^"]+";', 'const APP_BUILD_TIME =\n"05:28";', s, count=1)
          p.write_text(s)
          PY
          node --check app.js
          node --check conflict-center.js
          node --check conflict-filter-v388.js
          node --check weight-conflict-v392.js
          node --check conflict-actions-v390.js
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet || git commit -m "build: V392 metadata [v392-meta]"
          git push origin HEAD:v392-weight-stable-identity
