name: Food physical produce stock regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'food-v544.js'
      - 'food-stock-resolver-v746.js'
      - 'tests/food-stock-meal-shopping.test.cjs'
      - 'tests/food-lot-provenance-retention-v912.test.cjs'
      - 'supabase/migrations/20261121092300_food_preserve_consumed_lot_provenance_v912.sql'
      - '.github/workflows/food-physical-produce-regression.yml'
  push:
    branches: [main]
    paths:
      - 'food-v544.js'
      - 'food-stock-resolver-v746.js'
      - 'tests/food-stock-meal-shopping.test.cjs'
      - 'tests/food-lot-provenance-retention-v912.test.cjs'
      - 'supabase/migrations/20261121092300_food_preserve_consumed_lot_provenance_v912.sql'
      - '.github/workflows/food-physical-produce-regression.yml'
permissions:
  contents: read
jobs:
  stock-and-shopping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check food-v544.js
          node --check food-stock-resolver-v746.js
          node --check tests/food-stock-meal-shopping.test.cjs
          node --check tests/food-lot-provenance-retention-v912.test.cjs
      - name: Stock, meal, and shopping regression
        run: |
          node --test tests/food-stock-meal-shopping.test.cjs
          node tests/v746-food-stock-resolver.test.cjs
          node --test tests/food-lot-provenance-retention-v912.test.cjs
