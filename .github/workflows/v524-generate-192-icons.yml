name: V524 Generate 192 Icons
on:
  push:
    branches: [ v524-launcher-icons-192 ]
permissions:
  contents: write
jobs:
  generate-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact 192px launcher PNGs
        run: |
          python -m pip install --disable-pip-version-check pillow >/dev/null 2>&1
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          icons = {
            'todo': Path('assets/icons/todo-v519-1024.png'),
            'sport': Path('assets/icons/sport-v519-1024.png'),
            'kistology': Path('assets/icons/kistology-v520-1024.PNG'),
            'food': Path('assets/icons/food-v519-1024.png'),
            'future': Path('assets/icons/future-v519-1024.png'),
            'backstage': Path('assets/icons/backstage-v520-1024.PNG'),
          }
          outdir = Path('assets/icons')
          resampling = getattr(Image, 'Resampling', Image).LANCZOS
          for name, src in icons.items():
            with Image.open(src) as im:
              im.load()
              im = im.convert('RGBA')
              w, h = im.size
              side = min(w, h)
              left = (w - side) // 2
              top = (h - side) // 2
              im = im.crop((left, top, left + side, top + side))
              im = im.resize((192, 192), resampling)
              out = outdir / f'{name}-v524-192.png'
              im.save(out, 'PNG', optimize=True)
              print(f'{src} -> {out} ({out.stat().st_size} bytes)')
          PY
      - name: Commit generated binary assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/*-v524-192.png
          if git diff --cached --quiet; then
            echo 'No icon changes to commit.'
            exit 0
          fi
          git commit -m 'V524: 192px launcher icons [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
