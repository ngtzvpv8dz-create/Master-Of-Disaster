name: V506.2 Backup Hardening
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  backup-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and unified-backup markers
        run: |
          node --check backup-stability-v506.js
          node --check backup-model-v600.js
          node --check iphone-backup-v400.js
          grep -q "memorySafeFullBackupV5062:true" backup-stability-v506.js
          grep -q "unifiedSupabaseExportV600:true" backup-stability-v506.js
          grep -q "SUPABASE/complete-export.json" backup-stability-v506.js
          grep -q "requestSupabaseExport" backup-model-v600.js
          grep -q "previous_complete_backup_v1" iphone-backup-v400.js
          grep -q "dailySnapshotsDisabled:true" iphone-backup-v400.js
          if grep -q "data-weekly-create-v498" backstage-backup-v533.js; then
            echo "Backstage must not expose weekly cloud backup controls"
            exit 1
          fi
      - name: Browser unified full-backup smoke
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v600-backup-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*.supabase.co/**',route=>route.abort());
            await page.goto('http://127.0.0.1:8787/?backup600='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAreaRuntimeV591,{timeout:30000});
            await page.evaluate(async()=>{
              await window.__modAreaRuntimeV591.loadArea('backstage');
              await window.__modAreaRuntimeV591.loadBackstageSection('backup');
            });
            await page.waitForFunction(()=>window.__modRecoveryHistoryV498&&window.__modBackupStabilityV506?.patchRevision==='V506.2',{timeout:30000});

            const result=await page.evaluate(async()=>{
              const mod=window.__modBackupStabilityV506;
              const button=document.createElement('button');
              button.id='v600BackupSmokeButton';
              document.body.appendChild(button);

              const model=window.__modBackupModelV600||{};
              model.syncSafetyNow=async()=>true;
              model.requestSupabaseExport=async()=>({
                format:'Master of Disaster Unified Supabase Backup',
                schema_version:1,
                created_at:new Date().toISOString(),
                current_data:{'public.tasks':[]},
                migrations:[],
                catalog:{},
                storage:{buckets:[],objects:[],files:[]}
              });
              window.__modBackupModelV600=model;

              const oldFetch=window.fetch;
              window.fetch=async(url,opts)=>{
                const s=String(url);
                if(s.includes('api.github.com/repos/ngtzvpv8dz-create/Master-Of-Disaster/git/trees/main')){
                  return {ok:true,json:async()=>({sha:'test-tree'})};
                }
                if(s.includes('codeload.github.com/ngtzvpv8dz-create/Master-Of-Disaster/zip/refs/heads/main')){
                  return {ok:true,blob:async()=>new Blob(['fake-source-archive'],{type:'application/zip'})};
                }
                return oldFetch(url,opts);
              };

              await mod.createFullBackup(button);
              const link=document.querySelector('#modBackupModalV5061 [data-download-v5061]');
              if(!link?.href)throw new Error('Generated backup blob URL missing');
              const response=await oldFetch(link.href);
              const outer=await JSZip.loadAsync(await response.blob());
              const names=Object.keys(outer.files);
              const supabase=JSON.parse(await outer.file('SUPABASE/complete-export.json').async('text'));
              const info=await outer.file('BACKUP-INFO.txt').async('text');
              window.fetch=oldFetch;
              return {
                names,
                format:supabase.format,
                infoHasSupabase:/SUPABASE\/complete-export\.json/.test(info),
                marker:localStorage.getItem('modV5062FullBackupStage')
              };
            });

            for(const needed of [
              'APP/source-main.zip',
              'DATA/complete-data-backup.json',
              'DATA/localstorage-master-of-disaster.json',
              'SUPABASE/complete-export.json',
              'DATA/recovery-history-v498.json',
              'DATA/live-log-7-days.json',
              'BACKUP-INFO.txt'
            ]) if(!result.names.includes(needed))throw new Error('Missing full backup entry '+needed);
            if(result.format!=='Master of Disaster Unified Supabase Backup'||!result.infoHasSupabase||result.marker!==null){
              throw new Error('Unified backup regression '+JSON.stringify(result));
            }
            console.log('UNIFIED BACKUP PASS',result);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
