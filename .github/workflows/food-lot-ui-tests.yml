name: Food Lot UI Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lot-browser:
    runs-on: ubuntu-24.04
    # Browsers AND Linux dependencies preinstalled; avoid flaky/slow apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and iPhone WebKit
        run: |
          npm init -y
          npm install --no-save playwright@1.48.2
          node -e "const p=require('playwright'); console.log('Chromium:',p.chromium.executablePath(),'WebKit:',p.webkit.executablePath())"
      - name: Test independent Food lot rendering, update, removal and creation
        run: node tests/food-lot-individual-v848.cjs
      - name: Test recipe instructions, water and fixed drink mixtures
        run: node --test tests/food-recipe-quality-v880.test.cjs
      - name: Whole bread slice display
        run: node --test tests/food-whole-bread-slices-v881.test.cjs
