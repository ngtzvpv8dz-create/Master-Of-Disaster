name: Food Lot UI Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lot-browser:
    runs-on: ubuntu-24.04
    # Browsers AND Linux dependencies preinstalled; avoid flaky/slow apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and iPhone WebKit
        run: |
          npm init -y
          npm install --no-save playwright@1.48.2
          node -e "const p=require('playwright'); console.log('Chromium:',p.chromium.executablePath(),'WebKit:',p.webkit.executablePath())"
      - name: Test independent Food lot rendering, update, removal and creation
        run: node tests/food-lot-individual-v848.cjs
      - name: Test recipe instructions, water and fixed drink mixtures
        run: node --test tests/food-recipe-quality-v880.test.cjs
      - name: Whole bread slice display
        run: node --test tests/food-whole-bread-slices-v881.test.cjs

      - name: Verify current shopping deficit and explicit purchase in both browsers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/food-shopping-test.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node -e '(async()=>{for(let i=0;i<40;i++){try{if((await fetch("http://127.0.0.1:8898/index.html")).ok)return}catch{}await new Promise(r=>setTimeout(r,250))}throw Error("Local test server did not start")})().catch(e=>{console.error(e);process.exit(1)})'
          FOOD_SHOPPING_TEST_BASE_URL=http://127.0.0.1:8898 node tests/shopping-live-mobile-v905.cjs
