name: Food Lot UI Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and iPhone WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Test independent Food lot rendering, update, removal and creation
        run: node tests/food-lot-individual-v848.cjs
      - name: Test recipe instructions, water and fixed drink mixtures
        run: node --test tests/food-recipe-quality-v880.test.cjs
      - name: Whole bread slice display
        run: node --test tests/food-whole-bread-slices-v881.test.cjs
