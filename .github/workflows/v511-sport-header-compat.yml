name: V511 Sport Header Compatibility
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  header-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check sport-header-compat-v511.js
          node --check sport-mode-v510.js
          node --check running-task-render-stability-v505.js
      - name: Browser S and recovery R regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v511-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg=v511',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modSportModeV510&&window.__modRecoveryHistoryV498&&window.__modSportHeaderCompatV511&&document.getElementById('sportSwitchV510')&&document.querySelector('.mod-undo-r-v498'),{timeout:30000});

            await page.evaluate(()=>{
              const day=typeof getBerlinDateKey==='function'?getBerlinDateKey():'2026-09-08';
              tasks=[{id:51101,text:'V511 Bestandsschutz',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,activeSegments:[]}];
              if(typeof saveTasks==='function')saveTasks();
              if(typeof render==='function')render();
            });
            await page.waitForTimeout(300);

            const initial=await page.evaluate(()=>{
              const h1=document.querySelector('.header h1');
              const r=document.querySelector('.mod-undo-r-v498');
              const s=document.getElementById('sportSwitchV510');
              return {text:h1?.textContent?.trim(),hasR:!!r,hasS:!!s,rColor:r?getComputedStyle(r).color:null,verify:window.__modSportHeaderCompatV511.verify(),task:(tasks||[]).find(t=>t.id===51101)?.text};
            });
            if(initial.text!=='MASTER OF DISASTER'||!initial.hasR||!initial.hasS||!initial.verify||initial.task!=='V511 Bestandsschutz')throw new Error('V511 initial header '+JSON.stringify(initial));

            await page.click('.mod-undo-r-v498');
            await page.waitForSelector('#modSafetyNetModalV498',{state:'visible',timeout:10000});
            await page.click('#modSafetyNetModalV498 [data-close-v498]');

            await page.click('#sportSwitchV510');
            await page.waitForTimeout(450);
            const sport=await page.evaluate(()=>({
              mode:window.__modSportModeV510.currentMode(),
              hasR:!!document.querySelector('.mod-undo-r-v498'),
              hasS:!!document.getElementById('sportSwitchV510'),
              text:document.querySelector('.header h1')?.textContent?.trim(),
              task:(tasks||[]).find(t=>t.id===51101)?.text
            }));
            if(sport.mode!=='sport'||!sport.hasR||!sport.hasS||sport.text!=='MASTER OF DISASTER'||sport.task!=='V511 Bestandsschutz')throw new Error('V511 sport header '+JSON.stringify(sport));

            await page.click('.mod-undo-r-v498');
            await page.waitForSelector('#modSafetyNetModalV498',{state:'visible',timeout:10000});
            await page.click('#modSafetyNetModalV498 [data-close-v498]');
            await page.click('#sportSwitchV510');
            await page.waitForTimeout(300);

            const back=await page.evaluate(()=>({
              mode:window.__modSportModeV510.currentMode(),
              hasR:!!document.querySelector('.mod-undo-r-v498'),
              hasS:!!document.getElementById('sportSwitchV510'),
              text:document.querySelector('.header h1')?.textContent?.trim(),
              task:(tasks||[]).find(t=>t.id===51101)?.text
            }));
            if(back.mode!=='todo'||!back.hasR||!back.hasS||back.text!=='MASTER OF DISASTER'||back.task!=='V511 Bestandsschutz')throw new Error('V511 return header '+JSON.stringify(back));
            console.log('V511 S + recovery R PASS',initial,sport,back);
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
