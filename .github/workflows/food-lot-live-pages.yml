name: Food Lot Live GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-food-lots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify published Food lot bundle
        shell: bash
        run: |
          set -euo pipefail
          base="https://ngtzvpv8dz-create.github.io/Master-Of-Disaster"
          ready=0
          # Test the deployed bytes rather than obsolete hardcoded version labels.
          for retry in {1..18}; do
            if curl -fsSL --max-time 18 "$base/food-v544.js?ci=$GITHUB_SHA-$retry" -o /tmp/food-live.js \
              && curl -fsSL --max-time 18 "$base/shopping-v678.js?ci=$GITHUB_SHA-$retry" -o /tmp/shopping-live.js \
              && curl -fsSL --max-time 18 "$base/area-runtime-v609.js?ci=$GITHUB_SHA-$retry" -o /tmp/area-live.js \
              && curl -fsSL --max-time 18 "$base/index.html?ci=$GITHUB_SHA-$retry" -o /tmp/index-live.html \
              && cmp -s food-v544.js /tmp/food-live.js \
              && cmp -s shopping-v678.js /tmp/shopping-live.js \
              && cmp -s area-runtime-v609.js /tmp/area-live.js \
              && cmp -s index.html /tmp/index-live.html; then
              ready=1
              echo "LIVE GitHub Pages serves current FOOD, SHOPPING and loader files"
              break
            fi
            echo "Waiting for published current build $retry"
            sleep 8
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Published FOOD/SHOPPING build does not match repository sources"
            exit 1
          fi
      - name: Install browser engines
        run: |
          npm init -y
          npm install --no-audit --no-fund --no-save playwright@1.48.2
          npx playwright install --with-deps chromium webkit
      - name: Verify each Food lot on actual published website
        env:
          FOOD_LOT_TEST_BASE_URL: https://ngtzvpv8dz-create.github.io/Master-Of-Disaster
        run: |
          node tests/food-lot-individual-v848.cjs
          node tests/shopping-live-mobile-v905.cjs
