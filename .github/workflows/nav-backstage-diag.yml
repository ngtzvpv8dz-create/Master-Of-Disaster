name: Navigation Backstage Diagnostic
on:
  push:
    branches: [diagnostic/nav-backstage-current-20260920-0911]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - run: |
          cat > diag.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:390,height:844}});
            const p=await c.newPage();
            const out={errors:[]};
            p.on('pageerror',e=>out.errors.push('page:'+e.message));
            p.on('console',m=>{if(m.type()==='error')out.errors.push('console:'+m.text())});
            const base='https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?navdiag='+Date.now();
            await p.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            await p.click('[data-mod-hub-launch-v517="sport"]');
            await p.waitForFunction(()=>document.body.classList.contains('mod-sport-mode-v510'),{timeout:20000});
            out.sportBefore=await p.evaluate(()=>({
              surface:document.body.dataset.modAppSurfaceV515,
              sport:document.body.classList.contains('mod-sport-mode-v510'),
              homePointer:getComputedStyle(document.getElementById('modHomeButtonV525')).pointerEvents,
              sPointer:getComputedStyle(document.getElementById('sportSwitchV510')).pointerEvents,
              sRole:document.getElementById('sportSwitchV510').getAttribute('role'),
              sTab:document.getElementById('sportSwitchV510').getAttribute('tabindex')
            }));
            await p.click('#modHomeButtonV525',{force:true});
            await p.waitForTimeout(500);
            out.afterHome=await p.evaluate(()=>({
              surface:document.body.dataset.modAppSurfaceV515,
              hub:document.body.classList.contains('mod-app-hub-v515'),
              sport:document.body.classList.contains('mod-sport-mode-v510')
            }));
            await p.click('[data-mod-hub-launch-v517="sport"]');
            await p.waitForFunction(()=>document.body.classList.contains('mod-sport-mode-v510'),{timeout:20000});
            await p.click('#sportSwitchV510',{force:true});
            await p.waitForTimeout(400);
            out.afterS=await p.evaluate(()=>({
              surface:document.body.dataset.modAppSurfaceV515,
              hub:document.body.classList.contains('mod-app-hub-v515'),
              sport:document.body.classList.contains('mod-sport-mode-v510'),
              todoVisible:getComputedStyle(document.getElementById('viewContainer')).display!=='none'
            }));
            await p.goto(base+'&b=1',{waitUntil:'domcontentloaded',timeout:60000});
            const t0=Date.now();
            await p.click('[data-mod-hub-launch-v517="backstage"]');
            await p.waitForFunction(()=>document.body.classList.contains('mod-backstage-v530'),{timeout:30000});
            out.backstageMs=Date.now()-t0;
            out.backstage=await p.evaluate(()=>({
              surface:document.body.dataset.modAppSurfaceV515,
              active:window.__modBackstageV531?.activeSection,
              shell:!!document.getElementById('modBackstageV530')
            }));
            console.log(JSON.stringify(out,null,2));
            await b.close();
          })();
          NODE
          node diag.js
