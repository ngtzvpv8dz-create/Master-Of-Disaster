name: V533 Backstage Backup Deck
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  backstage-backup-deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wiring checks
        run: |
          node --check backstage-v530.js
          node --check backstage-backup-v533.js
          node --check backup-model-v600.js
          node --check sw.js
          grep -q "backupDeck:'V533'" backstage-v530.js
          grep -q 'backstage-backup-v533.js?v=600-unified' backstage-v530.js
          grep -q "unifiedBackupModelV600:true" backstage-backup-v533.js
          grep -q "AUTOMATISCHE CLOUD-SICHERHEIT" backstage-backup-v533.js
          grep -q "7-TAGE-SICHERHEITSNETZ" backstage-backup-v533.js
          if grep -q "weekly-create\|weekly-list" backstage-backup-v533.js; then
            echo "Weekly backup actions must be gone from Backstage"
            exit 1
          fi
      - name: Browser Backstage unified backup regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v533-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*.supabase.co/**',route=>route.abort());
            await page.goto('http://127.0.0.1:8787/?reg=v533',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV524&&window.__modAreaRuntimeV591,null,{timeout:30000});
            await page.evaluate(async()=>{
              await window.__modAreaRuntimeV591.openArea('backstage');
              await window.__modAreaRuntimeV591.loadBackstageSection('backup');
              window.__modBackstageV531?.setSection?.('backup');
              window.__modBackstageBackupV533?.renderBackupDashboard?.();
            });
            await page.waitForSelector('[data-backstage-backup-v533="true"]',{timeout:30000});
            await page.waitForFunction(()=>window.__modBackupStabilityV506&&window.__modRecoveryHistoryV498,{timeout:30000});

            await page.evaluate(()=>{
              window.__v533Calls={full:0,import:0};
              window.__modBackupStabilityV506.createFullBackup=async()=>{window.__v533Calls.full++;};
              window.__modRecoveryHistoryV498.importFullBackupZip=async file=>{if(file?.name==='backup.zip')window.__v533Calls.import++;};
            });

            const backup=await page.evaluate(()=>({
              cards:[...document.querySelectorAll('[data-backup-card-v533]')].map(x=>x.dataset.backupCardV533),
              actions:[...document.querySelectorAll('[data-backup-action-v533]')].map(x=>x.dataset.backupActionV533),
              weeklyButtons:document.querySelectorAll('[data-weekly-create-v498],[data-weekly-list-v498]').length,
              text:document.querySelector('[data-backstage-backup-v533="true"]')?.textContent||''
            }));
            if(JSON.stringify(backup.cards)!==JSON.stringify(['B01','B02','B03','B04','B05']))throw new Error('Card set '+JSON.stringify(backup));
            if(JSON.stringify(backup.actions)!==JSON.stringify(['fullbackup','zip-import']))throw new Error('Action set '+JSON.stringify(backup));
            if(backup.weeklyButtons!==0||!/LIVE \+ PREVIOUS/.test(backup.text)||!/7-TAGE-SICHERHEITSNETZ/.test(backup.text))throw new Error('Unified copy '+JSON.stringify(backup));

            await page.click('[data-backup-action-v533="fullbackup"]');
            await page.setInputFiles('[data-backup-file-v533]',{name:'backup.zip',mimeType:'application/zip',buffer:Buffer.from('PK-v600-test')});
            await page.waitForTimeout(120);
            const calls=await page.evaluate(()=>window.__v533Calls);
            if(calls.full!==1||calls.import!==1)throw new Error('Action wiring '+JSON.stringify(calls));
            if(errors.length)throw new Error('Page errors '+JSON.stringify(errors));
            console.log('V533 UNIFIED BACKUP DECK PASS',backup,calls);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
