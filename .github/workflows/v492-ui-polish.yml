name: V492 UI Polish
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source markers
        run: |
          node --check task-card-rail-polish-v492.js
          grep -q 'numberAndStatusLeftAligned:true' task-card-rail-polish-v492.js
          grep -q 'fourDigitTaskNumberReady:true' task-card-rail-polish-v492.js
          grep -q 'archiveNumberFutureReady:true' task-card-rail-polish-v492.js
          grep -q 'subtleWeightStyle:true' task-card-rail-polish-v492.js
          grep -q 'weightSecondLineAligned:true' task-card-rail-polish-v492.js
          grep -q 'segmentSeparator:true' task-card-rail-polish-v492.js
      - name: Verify V492 computed layout
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/v492-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?v492reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V492'&&window.__modTaskCardRailPolishV492,{timeout:30000});
            await page.evaluate(()=>{
              const day=getBerlinDateKey();
              tasks=[{
                id:9921,text:'V492 Rail Test',type:'work',status:'paused',priority:'high',optional:false,dueMode:'deadline',dueDate:day,todayDate:day,todayOrder:1,todayWorkBlockId:null,
                importedHistoricalProgressDurationMs:8760000,startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T16:00:00+02:00',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,
                activeSegments:[{startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},{startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'}]
              }];
              weightPhases=[{id:1,weightKg:12.3,startedAt:'2026-08-23T13:10:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},{id:2,weightKg:12.3,startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'}];
              weightState={isWearing:false,currentWeightKg:12.3};archive=[];nextArchiveNumber=1;saveTasks();saveArchive();saveWeight();
              localStorage.removeItem(window.__modTodayWorkBlocksV474.storageKey);window.__modTodayWorkBlocksV474.ensureTodayModel(day,[]);saveTasks();
            });
            for(const tab of ['all','today','priority','due','active']){
              await page.evaluate(t=>{switchTab(t);render();},tab);await page.waitForTimeout(250);
              const card=page.locator('.task:not(.archive-task)',{hasText:'V492 Rail Test'}).first();
              if(!(await card.count()))throw new Error(tab+': task missing');
              const r=await card.evaluate(card=>{
                const rail=card.querySelector(':scope > .v492-number-status-rail'),num=rail?.querySelector('.task-number'),status=rail?.querySelector('.status-symbol'),content=card.querySelector(':scope > .task-content');
                if(num)num.textContent='9.999';
                const nr=num?.getBoundingClientRect(),sr=status?.getBoundingClientRect(),rr=rail?.getBoundingClientRect(),cr=content?.getBoundingClientRect();
                const ns=num?getComputedStyle(num):null,ss=status?getComputedStyle(status):null,rs=rail?getComputedStyle(rail):null;
                return {rail:!!rail,numTop:nr?.top,statusTop:sr?.top,railLeft:rr?.left,numLeft:nr?.left,contentLeft:cr?.left,width:rr?.width,overflow:num?num.scrollWidth-num.clientWidth:999,numAlign:ns?.textAlign,statusAlign:ss?.textAlign,statusJustify:ss?.justifyContent,railAlign:rs?.alignItems};
              });
              if(!r.rail||!(r.numTop<r.statusTop)||r.overflow>0||r.numAlign!=='left'||r.statusAlign!=='left'||r.statusJustify!=='flex-start'||r.railAlign!=='flex-start'||Math.abs(r.numLeft-r.railLeft-2)>1.5||!(r.contentLeft>=r.railLeft+r.width-1))throw new Error(tab+': top-left rail failed '+JSON.stringify(r));
            }
            await page.evaluate(()=>{switchTab('all');render();});await page.waitForTimeout(250);
            const weight=await page.locator('.task:not(.archive-task)',{hasText:'V492 Rail Test'}).first().evaluate(card=>{
              const partial=card.querySelector('.v490-weight-partial'),copy=partial?.querySelector('.v492-weight-copy'),sub=partial?.nextElementSibling,overall=card.querySelector('.v490-overall-weight'),detail=card.querySelector('.task-detail-v490');
              const ps=partial?getComputedStyle(partial):null,os=overall?getComputedStyle(overall):null,ds=detail?getComputedStyle(detail):null;
              const copyX=copy?.getBoundingClientRect().left;const subX=sub?.getBoundingClientRect().left+(parseFloat(getComputedStyle(sub).paddingLeft)||0);
              return {copyX,subX,color:ps?.color,fontWeight:ps?.fontWeight,overallColor:os?.color,overallWeight:os?.fontWeight,borderWidth:ds?.borderTopWidth,borderColor:ds?.borderTopColor,aligned:partial?.dataset.v492Aligned,subAligned:sub?.classList.contains('v492-weight-subline-aligned')};
            });
            if(weight.aligned!=='true'||!weight.subAligned||Math.abs(weight.copyX-weight.subX)>0.75)throw new Error('Weight continuation not aligned '+JSON.stringify(weight));
            if(weight.color!=='rgb(126, 139, 104)'||weight.overallColor!=='rgb(126, 139, 104)'||weight.fontWeight!=='400'||weight.overallWeight!=='400')throw new Error('Weight not subdued like archive metadata '+JSON.stringify(weight));
            if(weight.borderWidth!=='1px')throw new Error('Separator missing '+JSON.stringify(weight));
            await page.evaluate(()=>{archive=[{archiveNumber:9999,archiveId:'a9999',text:'V492 Archive Rail',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:'2026-08-22T13:00:00+02:00',completedAt:'2026-08-22T14:00:00+02:00',activeDurationMs:3600000,archiveAccountingActiveDurationMs:3600000,actualDurationMs:3600000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00'}]}];nextArchiveNumber=10000;saveArchive();switchTab('archive');render();});await page.waitForTimeout(250);
            const ar=await page.locator('.archive-task',{hasText:'V492 Archive Rail'}).first().evaluate(card=>{const rail=card.querySelector(':scope > .v492-number-status-rail'),num=rail?.querySelector('.archive-number'),status=rail?.querySelector('.status-symbol');if(num)num.textContent='A9999';const nr=num?.getBoundingClientRect(),sr=status?.getBoundingClientRect();const ns=num?getComputedStyle(num):null,ss=status?getComputedStyle(status):null;return {ok:!!rail&&nr.top<sr.top&&num.scrollWidth<=num.clientWidth&&ns.textAlign==='left'&&ss.justifyContent==='flex-start',width:rail?.getBoundingClientRect().width};});
            if(!ar.ok||ar.width<45)throw new Error('Archive future-number rail failed '+JSON.stringify(ar));
            console.log('V492 UI polish regression OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify deployed V492 top-left rail
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            let live=false;
            for(let i=0;i<24;i++){
              await page.goto('https://ngtzvpv8dz-create.github.io/Master-Of-Disaster/?v492live='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              live=await page.evaluate(()=>window.__MOD_BUILD__?.version==='V492'&&window.__modTaskCardRailPolishV492?.numberAndStatusLeftAligned===true).catch(()=>false);
              if(live)break;
              await page.waitForTimeout(10000);
            }
            if(!live)throw new Error('V492 not deployed');
            await page.evaluate(()=>{const day=getBerlinDateKey();tasks=[{id:9999,text:'V492 Live Rail',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,todayWorkBlockId:null,startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T14:00:00+02:00',pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'}]}];archive=[];saveTasks();saveArchive();switchTab('all');render();});await page.waitForTimeout(300);
            const r=await page.locator('.task:not(.archive-task)',{hasText:'V492 Live Rail'}).first().evaluate(card=>{const rail=card.querySelector(':scope > .v492-number-status-rail'),num=rail?.querySelector('.task-number'),status=rail?.querySelector('.status-symbol');if(num)num.textContent='9.999';const nr=num?.getBoundingClientRect(),sr=status?.getBoundingClientRect();return {ok:!!rail&&nr.top<sr.top&&num.scrollWidth<=num.clientWidth&&getComputedStyle(num).textAlign==='left'&&getComputedStyle(status).justifyContent==='flex-start'};});
            if(!r.ok)throw new Error('LIVE V492 top-left rail mismatch '+JSON.stringify(r));
            console.log('LIVE V492 UI POLISH PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
