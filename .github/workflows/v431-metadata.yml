name: V431 One-Shot Metadata Alignment
on:
  push:
    branches: [ refactor/v431-consolidate ]
permissions:
  contents: write
jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, '[v431-meta]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v431-consolidate
          fetch-depth: 0
      - name: Align app metadata and remove this workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'const APP_VERSION =\s*\n?"V\d+";', 'const APP_VERSION =\n"V431";', s, count=1)
          s,n2=re.subn(r'const APP_BUILD_DATE =\s*\n?"\d{2}\.\d{2}\.\d{4}";', 'const APP_BUILD_DATE =\n"21.08.2026";', s, count=1)
          s,n3=re.subn(r'const APP_BUILD_TIME =\s*\n?"\d{2}:\d{2}";', 'const APP_BUILD_TIME =\n"00:07";', s, count=1)
          if (n1,n2,n3)!=(1,1,1): raise SystemExit(f'Could not align app metadata {(n1,n2,n3)}')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/v431-metadata.yml').unlink()
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js
          git add -u -- .github/workflows/v431-metadata.yml
          git commit -m "[v431-meta] align app build metadata"
          git push origin HEAD:refactor/v431-consolidate
