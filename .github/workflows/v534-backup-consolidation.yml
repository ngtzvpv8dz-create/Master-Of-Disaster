name: V534 Backstage Backup Consolidation
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  backstage-backup-consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wiring checks
        run: |
          node --check backstage-backup-v534.js
          node --check backstage-backup-v533.js
          node --check sw.js
          grep -q 'backstage-backup-v534.js?v=534-backup-consolidation' area-runtime-v603.js
          grep -q 'duplicateQuickFullBackupRemoved:true' backstage-backup-v534.js
          grep -q 'fullBackupRemainsInBackupSector:true' backstage-backup-v534.js
          grep -q 'unifiedBackupModelV600:true' backstage-backup-v533.js
      - name: Browser Backstage consolidation regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v534-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*.supabase.co/**',route=>route.abort());
            await page.goto('http://127.0.0.1:8787/?smoke=v534',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV524&&window.__modAreaRuntimeV591,null,{timeout:30000});
            await page.evaluate(async()=>{
              await window.__modAreaRuntimeV591.openArea('backstage');
            });
            await page.waitForFunction(()=>window.__modBackstageV531&&window.__modBackstageBackupV534?.version==='V534',null,{timeout:30000});
            await page.waitForTimeout(350);

            const deck=await page.evaluate(()=>{
              const root=document.getElementById('modBackstageV530');
              const quick=root.querySelector('[data-backstage-action-v533="fullbackup"]');
              const visible=[...root.querySelectorAll('.mod-backstage-tabs-v531 > button')].filter(b=>getComputedStyle(b).display!=='none');
              return {
                visibleCount:visible.length,
                labels:visible.map(b=>b.querySelector('.mod-backstage-tab-label-v531')?.textContent.trim()),
                quickHidden:!!quick?.hidden,
                quickDisplay:quick?getComputedStyle(quick).display:null
              };
            });
            if(deck.visibleCount!==5||JSON.stringify(deck.labels)!==JSON.stringify(['DEV','LOG','BACKUP','RESTORE','SYSTEM'])||!deck.quickHidden||deck.quickDisplay!=='none')throw new Error('V534 deck '+JSON.stringify(deck));

            await page.evaluate(async()=>{
              await window.__modAreaRuntimeV591.loadBackstageSection('backup');
              window.__modBackstageV531?.setSection?.('backup');
              window.__modBackstageBackupV533?.renderBackupDashboard?.();
            });
            await page.waitForSelector('[data-backstage-backup-v533="true"]',{timeout:30000});
            await page.waitForFunction(()=>window.__modBackupStabilityV506,{timeout:30000});
            await page.evaluate(()=>{
              window.__v534Calls={full:0};
              window.__modBackupStabilityV506.createFullBackup=async()=>{window.__v534Calls.full++;};
            });

            const backup=await page.evaluate(()=>({
              fullCard:!!document.querySelector('[data-backup-card-v533="B01"]'),
              fullAction:!!document.querySelector('[data-backup-action-v533="fullbackup"]'),
              weekly:document.querySelectorAll('[data-backup-action-v533="weekly-create"],[data-backup-action-v533="weekly-list"]').length,
              verify:window.__modBackstageBackupV534.verifyBackupSector()
            }));
            if(!backup.fullCard||!backup.fullAction||backup.weekly!==0||!backup.verify)throw new Error('V534 backup sector '+JSON.stringify(backup));
            await page.click('[data-backup-action-v533="fullbackup"]');
            await page.waitForTimeout(100);
            const calls=await page.evaluate(()=>window.__v534Calls);
            if(calls.full!==1)throw new Error('V534 fullbackup wiring '+JSON.stringify(calls));
            if(errors.length)throw new Error('V534 page errors '+JSON.stringify(errors));
            console.log('V534 UNIFIED CONSOLIDATION PASS',deck,backup,calls);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
