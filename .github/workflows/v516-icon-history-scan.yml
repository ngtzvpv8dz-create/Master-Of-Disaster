name: V516 Icon History Scan
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  scan-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all branches and tags
        run: |
          git fetch --all --tags --prune
      - name: Scan image assets in all refs and history
        run: |
          {
            echo '=== IMAGE PATHS CURRENTLY PRESENT IN ANY REMOTE BRANCH ==='
            for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/); do
              git ls-tree -r --name-only "$ref" 2>/dev/null | grep -Ei '\.(png|jpe?g|webp|gif|svg)$' | sed "s#^#$ref | #" || true
            done
            echo
            echo '=== UNIQUE IMAGE PATHS EVER SEEN IN GIT HISTORY ==='
            git log --all --name-only --pretty=format: -- '*.png' '*.jpg' '*.jpeg' '*.webp' '*.gif' '*.svg' | sed '/^$/d' | sort -u
            echo
            echo '=== IMAGE ADD/DELETE HISTORY ==='
            git log --all --date=iso --pretty='format:COMMIT %H | %ad | %s' --name-status --diff-filter=AD -- '*.png' '*.jpg' '*.jpeg' '*.webp' '*.gif' '*.svg'
          } | tee /tmp/v516-icon-history.txt
      - name: Upload icon history
        uses: actions/upload-artifact@v4
        with:
          name: v516-icon-history
          path: /tmp/v516-icon-history.txt
