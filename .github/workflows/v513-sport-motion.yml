name: V513 Sport Motion
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  sport-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check sport-motion-v513.js
          node --check build-version-v513.js
          node --check running-task-render-stability-v505.js
      - name: Browser visible motion regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v513-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg=v513',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modSportModeV510&&window.__modSportTabsV512&&window.__modSportMotionV513&&window.__modSportHeaderCompatV511&&document.getElementById('sportSwitchV510'),null,{timeout:30000});
            await page.waitForTimeout(900);

            await page.evaluate(()=>{
              const day=typeof getBerlinDateKey==='function'?getBerlinDateKey():'2026-09-09';
              tasks=[{id:51301,text:'V513 Bestandsschutz',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,activeSegments:[]}];
              if(typeof saveTasks==='function')saveTasks();
              if(typeof render==='function')render();
            });
            await page.waitForTimeout(700);
            await page.click('#sportSwitchV510');
            await page.waitForFunction(()=>document.body.classList.contains('mod-sport-mode-v510')&&document.querySelectorAll('button[data-sport-tab-v512]').length===4&&document.querySelector('.sport-wave-runner-v513')&&document.querySelector('.sport-border-runner-v513'),null,{timeout:10000});
            await page.waitForTimeout(100);

            const visual=await page.evaluate(()=>{
              const wave=document.querySelector('.sport-wave-runner-v513');
              const border=document.querySelector('.sport-border-runner-v513');
              return {
                waveAnimation:getComputedStyle(wave).animationName,
                waveDuration:getComputedStyle(wave).animationDuration,
                borderAnimation:getComputedStyle(border,'::before').animationName,
                borderDuration:getComputedStyle(border,'::before').animationDuration,
                tabs:[...document.querySelectorAll('button[data-sport-tab-v512]')].map(x=>x.textContent.trim()),
                hasR:!!document.querySelector('.mod-undo-r-v498'),
                hasS:!!document.getElementById('sportSwitchV510'),
                build:window.__modBuildVersionV513?.version||window.__MOD_BUILD__?.version||null,
                task:(tasks||[]).find(t=>t.id===51301)?.text
              };
            });
            if(visual.waveAnimation==='none'||visual.borderAnimation==='none'||visual.tabs.length!==4||!visual.hasR||!visual.hasS||visual.build!=='V513'||visual.task!=='V513 Bestandsschutz')throw new Error('V513 visual '+JSON.stringify(visual));

            await page.click('button[data-sport-tab-v512="statistics"]');
            await page.waitForFunction(()=>window.__modSportTabsV512.currentTab()==='statistics');
            await page.waitForTimeout(750);
            await page.click('button[data-sport-tab-v512="fitx"]');
            await page.waitForFunction(()=>window.__modSportTabsV512.currentTab()==='fitx'&&document.getElementById('sportDurationV510'));
            await page.waitForTimeout(90);
            const mid=await page.locator('#sportDurationV510').innerText();
            await page.waitForTimeout(700);
            const final=await page.locator('#sportDurationV510').innerText();
            if(final.trim()!=='2:33')throw new Error(`V513 final count ${final}`);
            if(mid.trim()==='2:33'||mid.trim()==='0:00')throw new Error(`V513 count not visibly progressing mid=${mid} final=${final}`);

            await page.click('button[data-sport-tab-v512="statistics"]');
            await page.waitForTimeout(90);
            const statMid=await page.locator('[data-sport-panel-v512="statistics"] .sport-duration-v510').innerText();
            await page.waitForTimeout(700);
            const statFinal=await page.locator('[data-sport-panel-v512="statistics"] .sport-duration-v510').innerText();
            if(statFinal.trim()!=='2:33'||statMid.trim()==='2:33')throw new Error(`V513 statistic count mid=${statMid} final=${statFinal}`);

            await page.click('#sportSwitchV510');
            await page.waitForTimeout(250);
            const back=await page.evaluate(()=>({mode:window.__modSportModeV510.currentMode(),task:(tasks||[]).find(t=>t.id===51301)?.text}));
            if(back.mode!=='todo'||back.task!=='V513 Bestandsschutz'||errors.length)throw new Error('V513 return '+JSON.stringify({back,errors}));
            fs.writeFileSync('/tmp/v513-result.json',JSON.stringify({visual,mid,final,statMid,statFinal,back,errors},null,2));
            console.log('V513 visible sport motion PASS');
            await browser.close();
          })().catch(error=>{fs.writeFileSync('/tmp/v513-error.txt',String(error&&error.stack||error));console.error(error);process.exit(1);});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v513-sport-motion-diagnostics
          path: |
            /tmp/v513-result.json
            /tmp/v513-error.txt
            /tmp/mod-v513-http.log
          if-no-files-found: ignore
