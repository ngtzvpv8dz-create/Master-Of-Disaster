name: Temporary source backup packager

on:
  push:
    paths:
      - ".github/workflows/__temp_hyper_backup_transport.yml"

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact clean backup commit
        uses: actions/checkout@v4
        with:
          ref: 0dfd1f7c3670fb18d3b064b853a57334a1df6e39
          path: source

      - name: Write backup metadata
        run: |
          printf '%s\n' 'repository=ngtzvpv8dz-create/Master-Of-Disaster' > source/BACKUP_SOURCE_COMMIT.txt
          printf '%s\n' 'commit=0dfd1f7c3670fb18d3b064b853a57334a1df6e39' >> source/BACKUP_SOURCE_COMMIT.txt

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: mod-source-0dfd1f7c
          path: source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
