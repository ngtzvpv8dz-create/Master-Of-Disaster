name: V387 Version Update

on:
  push:
    branches:
      - v387-conflict-center
    paths:
      - .github/workflows/v387-version.yml

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v387-conflict-center
      - name: Update V387 app metadata
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('app.js')
          js = path.read_text(encoding='utf-8')
          js = js.replace('const APP_VERSION =\n"V386";', 'const APP_VERSION =\n"V387";', 1)
          js = re.sub(r'const APP_BUILD_DATE =\n"[0-9]{2}\.[0-9]{2}\.[0-9]{4}";', 'const APP_BUILD_DATE =\n"19.08.2026";', js, count=1)
          js = re.sub(r'const APP_BUILD_TIME =\n"[0-9]{2}:[0-9]{2}";', 'const APP_BUILD_TIME =\n"00:40";', js, count=1)
          if 'const APP_VERSION =\n"V387";' not in js:
              raise SystemExit('V387 version update failed')
          path.write_text(js, encoding='utf-8')
      - name: Commit V387 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "build: set V387 app metadata"
          git push origin v387-conflict-center
