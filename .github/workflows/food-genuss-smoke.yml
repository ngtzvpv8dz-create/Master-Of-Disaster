name: Food Genuss Smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  food-genuss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax FOOD changes
        run: |
          node --check area-runtime-v609.js
          node --check food-v544.js
          node --check food-extra-snacks-v828.js
          node --check food-planned-extras-v880.js
          node --check food-nutrition-v711.js
      - name: Relevant FOOD regression tests
        run: |
          node --test tests/food-planned-extras-mount-v885.test.cjs tests/food-planned-extras-v880.test.cjs tests/food-extras-v828.test.cjs tests/food-daily-warning-v838.test.cjs tests/food-recipe-quality-v880.test.cjs tests/food-inactive-product-history-v850.test.cjs tests/food-ratings-and-prepared-nutrition-v886.test.cjs tests/food-history-feedback-v887.test.cjs tests/food-rating-notes-click-v888.test.cjs tests/food-snack-recorded-v890.test.cjs
      - name: FOOD inventory MHD and traceability regression
        run: node --test tests/food-inventory-mhd-traceability-v906.test.cjs
      - name: Red paprika product-source and edible-weight regressions
        run: node --test tests/food-red-paprika-link-and-net-weight-v907.test.cjs
      - name: ELO Frost product protein and current lot nutrition regression
        run: node --test tests/food-elo-frost-protein-provenance-v909.test.cjs
      - name: Loader and database wiring
        run: |
          grep -Eq 'food-planned-extras-v880[.]js[?]v=[0-9]+-' area-runtime-v609.js
          grep -Eq 'area-runtime-v609[.]js[?]v=[0-9]+-' index.html
          grep -Fq 'work-coffee-employer-v1' food-planned-extras-v880.js
          ! grep -Fq 'recordedSnack' food-v544.js
          grep -Fq 'edit_food_planned_extra_v1' supabase/migrations/20261025202100_food_planned_extra_edit_v1.sql
  audit-migration-replay:
    name: Food audit migration replay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay nutrient dependency and audit migration in isolated PostgreSQL
        run: |
          cat tests/food-audit-replay-schema.sql \
            supabase/migrations/20261126065814_food_nutrient_bounds_preserve_exact_v1_20261126.sql \
            supabase/migrations/20261126095447_food_audit_recognize_documented_nutrient_bounds_v1_20261126.sql \
            tests/food-audit-replay-assert.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
