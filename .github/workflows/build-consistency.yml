name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V442 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          remote=Path('remote-commands.js').read_text(encoding='utf-8')
          integrity=Path('integrity-v439.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V442','21.08.2026 · 11:12','integrity-v439.js?v=442-1112',"version:'V442'",'__MOD_BUILD__']:
              if marker not in index: raise SystemExit(f'Missing V442 index marker: {marker}')
          for marker in ['master-of-disaster-v442-paused-task-integrity','integrity-v439.js?v=442-1112']:
              if marker not in sw: raise SystemExit(f'Missing V442 cache marker: {marker}')
          for marker in ['REPORT_INTEGRITY','REPORT_TASK_DETAILS','taskDetailResult','__modRemoteCommandsV441']:
              if marker not in remote: raise SystemExit(f'Missing diagnostic behavior: {marker}')
          for marker in ['validUnfinalizedTaskLabels','activeDurationMs','Laufende/pausierte Aufgabe','__modIntegrityV442']:
              if marker not in integrity: raise SystemExit(f'Missing V442 integrity behavior: {marker}')
          print('V442 build consistency OK')
      - name: JavaScript syntax
        run: node --check integrity-v439.js && node --check remote-commands.js && node --check task-search.js && node --check ui.js && node --check archive-category-v413.js && node --check categories.js && node --check app.js
