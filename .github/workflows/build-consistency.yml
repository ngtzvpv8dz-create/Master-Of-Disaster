name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V462 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          guard=Path('theme-ui-guard-v462.js').read_text(encoding='utf-8')
          stability=Path('theme-editor-stability-v461.js').read_text(encoding='utf-8')
          ux=Path('ux-cooking-editor-v460.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V462','21.08.2026 · 23:35','theme-ui-guard-v462.js?v=462-2335',"version:'V462'",'modV462ThemeUiGuardDone']:
              if marker not in index: raise SystemExit(f'Missing V462 index marker: {marker}')
          for marker in ['master-of-disaster-v462-theme-ui-guard','theme-ui-guard-v462.js?v=462-2335','/theme-ui-guard-v462.js']:
              if marker not in sw: raise SystemExit(f'Missing V462 cache marker: {marker}')
          for marker in ['theme-panel-v458:has(.theme-preview-v458)','task-note-v456','task-note-editor-v456','theme-note-preview-v459','data-theme-role-select="note"','card.noteLines','palette.note','elements.note','__modThemeUiGuardV462']:
              if marker not in guard: raise SystemExit(f'Missing V462 UI guard behavior: {marker}')
          for marker in ['replaceObservedHostAfterLegacyObserversAttached','__modThemeStabilityV461']:
              if marker not in stability: raise SystemExit(f'Missing preserved V461 stability behavior: {marker}')
          for marker in ['themeStickyPreviewV460','ERLEDIGT / ABGEBROCHEN HEUTE','segment-mode-v460','passiveCookingParallel:true','__modUxCookingEditorV460']:
              if marker not in ux: raise SystemExit(f'Missing preserved V460 behavior: {marker}')
          if 'delete task.note' in guard or 'delete row.note' in guard:
              raise SystemExit('V462 must not destructively delete legacy note data')
          print('V462 build consistency OK')
      - name: JavaScript syntax
        run: node --check theme-ui-guard-v462.js && node --check theme-editor-stability-v461.js && node --check ux-cooking-editor-v460.js && node --check theme-preview-fix-v459.js && node --check theme-layout-editor-v458.js && node --check safe-undo-v457.js && node --check task-notes-v456.js && node --check goals-milestones-v455.js && node --check background-log-v454.js && node --check live-log-v453.js && node --check project-history-v452.js && node --check development-stats-v451.js && node --check completed-category-v449.js && node --check paused-today-v447.js && node --check today-paused-v446.js && node --check retroactive-complete-v445.js && node --check segment-duration-v444.js && node --check time-segments-v443.js && node --check integrity-v439.js && node --check remote-commands.js && node --check app.js
