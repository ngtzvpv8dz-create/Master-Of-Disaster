name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V476 build
        shell: python
        run: |
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v476=Path('development-stats-current-v476.js').read_text(encoding='utf-8')
          v475=Path('fixed-app-header-v475.js').read_text(encoding='utf-8')
          generator=Path('scripts/generate-development-metrics.mjs').read_text(encoding='utf-8')
          updater=Path('.github/workflows/update-development-metrics.yml').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V476','22.08.2026 · 14:19','development-stats-current-v476.js?v=476-1419',"version:'V476'",'modV476DevelopmentMetricsDone']:
              if marker not in index: raise SystemExit(f'Missing V476 index marker: {marker}')
          for marker in ['master-of-disaster-v476-live-development-metrics','development-stats-current-v476.js','development-metrics.json']:
              if marker not in sw: raise SystemExit(f'Missing V476 service worker marker: {marker}')
          for marker in ['APP-ENTWICKLUNG · AKTUELL','AUTOMATISCHER IST-STAND','dynamicIndent:true','autoGenerated:true','historicalFromGit:true','development-metrics.json','__modDevelopmentStatsCurrentV476']:
              if marker not in v476: raise SystemExit(f'Missing V476 behavior: {marker}')
          for marker in ['git rev-list --count HEAD','currentTextLines','currentBytes','METRICS_WILL_COMMIT','PR_COUNT','MERGED_PR_COUNT']:
              if marker not in generator: raise SystemExit(f'Missing metrics generator marker: {marker}')
          for marker in ['Update Development Metrics','METRICS_WILL_COMMIT','gh api','git push']:
              if marker not in updater: raise SystemExit(f'Missing metrics workflow marker: {marker}')
          if metrics.get('version')!='V476' or metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics placeholder is not V476/automated')
          for marker in ['appFixedTopV475','headerAndTabsTogether:true','opaqueShell:true','dynamicHeight:true','__modFixedAppHeaderV475']:
              if marker not in v475: raise SystemExit(f'Missing preserved V475 behavior: {marker}')
          print('V476 build consistency OK')
      - name: JavaScript syntax
        run: node --check development-stats-current-v476.js && node --check scripts/generate-development-metrics.mjs && node --check fixed-app-header-v475.js && node --check today-work-blocks-v474.js && node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check theme-editor-help-stability-v470.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - name: Generator produces current repository metrics
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const m=require('/tmp/development-metrics.json');
          if(m.version!=='V476'||!m.automated)throw new Error('Generated version/automation flag wrong');
          if(m.repository.reachableCommits<500)throw new Error('Commit history unexpectedly short');
          if(m.repository.currentFiles<40)throw new Error('File count unexpectedly low');
          if(m.repository.currentTextLines<10000)throw new Error('Text line count unexpectedly low');
          if(m.repository.currentBytes<500000)throw new Error('Repository byte count unexpectedly low');
          console.log('V476 generated metrics sane');
          NODE
