name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V474 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v474=Path('today-work-blocks-v474.js').read_text(encoding='utf-8')
          v473=Path('category-group-drag-v473.js').read_text(encoding='utf-8')
          v472=Path('remote-archive-maintenance-v472.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V474','22.08.2026 · 13:05','today-work-blocks-v474.js?v=474-1305',"version:'V474'",'modV474WorkBlocksDone']:
              if marker not in index: raise SystemExit(f'Missing V474 index marker: {marker}')
          for marker in ['master-of-disaster-v474-today-work-blocks','today-work-blocks-v474.js']:
              if marker not in sw: raise SystemExit(f'Missing V474 service worker marker: {marker}')
          for marker in ['masterOfDisasterTodayWorkBlocksV474','ARBEITSBLOCK','dynamicBlockNumbering:true','emptyBlocksPersist:true','manualDeleteOnly:true','optionalNames:true','blockDrag:true','crossBlockTaskDrag:true','allSearch:true','directTodayAssignment:true','assignTaskToToday','moveTaskToBlock','swapBlocks','task-drag-position-v474','work-block-drag-v474','editWorkBlockV474','allTaskSearchV474','__modTodayWorkBlocksV474']:
              if marker not in v474: raise SystemExit(f'Missing V474 behavior: {marker}')
          for marker in ['GROUP_TABS','task-category-group-v473','groupingIsViewOnly:true','__modCategoryGroupDragV473']:
              if marker not in v473: raise SystemExit(f'Missing preserved V473 behavior: {marker}')
          for marker in ["QUEUE_STATUS='processing'",'DELETE_ARCHIVE_ENTRY','__modRemoteArchiveMaintenanceV472']:
              if marker not in v472: raise SystemExit(f'Missing preserved V472 behavior: {marker}')
          print('V474 build consistency OK')
      - name: JavaScript syntax
        run: node --check today-work-blocks-v474.js && node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check remote-commands.js && node --check theme-editor-help-stability-v470.js && node --check theme-editor-help-v469.js && node --check ux-cooking-editor-v460.js && node --check app.js
