name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V416 monochrome action icons
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('action-icons-v416.js').read_text(encoding='utf-8')
          css=Path('action-icons-v416.css').read_text(encoding='utf-8')
          for marker in ['BUILD: V416','action-icons-v416.css?v=416-1621','action-icons-v416.js?v=416-1621','dev-version-v416.js?v=416-1621']:
              if marker not in index: raise SystemExit(f'Missing V416 marker: {marker}')
          for marker in ['master-of-disaster-v416-icons','action-icons-v416.css','action-icons-v416.js','dev-version-v416.js']:
              if marker not in sw: raise SystemExit(f'Missing V416 cache marker: {marker}')
          for marker in ['calendarPin','due-alert-circle-v416','coffee','mono-action-v416','requestAnimationFrame']:
              if marker not in js+css: raise SystemExit(f'Missing V416 icon behavior: {marker}')
          print('V416 monochrome icon consistency OK')
