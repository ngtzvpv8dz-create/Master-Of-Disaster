name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V438 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          remote=Path('remote-commands.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V438','21.08.2026 · 10:08','remote-commands.js?v=438-1008',"version:'V438'",'__MOD_BUILD__']:
              if marker not in index: raise SystemExit(f'Missing V438 index marker: {marker}')
          for marker in ['master-of-disaster-v438-weight-time','remote-commands.js?v=438-1008']:
              if marker not in sw: raise SystemExit(f'Missing V438 cache marker: {marker}')
          for marker in ['START_WEIGHT','STOP_WEIGHT','ADJUST_WEIGHT_START','requestedAt','currentPhaseStartedAt=requestedAt','__modRemoteCommandsV438']:
              if marker not in remote: raise SystemExit(f'Missing V438 remote behavior: {marker}')
          print('V438 build consistency OK')
      - name: JavaScript syntax
        run: node --check remote-commands.js && node --check task-search.js && node --check ui.js && node --check archive-category-v413.js && node --check categories.js && node --check app.js
