name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V608 staged-area wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          gate=Path('service-worker-gate-v607.js').read_text(encoding='utf-8')
          runtime=Path('area-runtime-v608.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in [
            "version:'V608'",
            'service-worker-gate-v607.js?v=607-worker-gate',
            'area-runtime-v608.js?v=608-staged-heavy',
            'area-loader-v608.css?v=608-staged',
            'app-hub-launcher-v603.js?v=603-loader',
            'surface-header-v603.js?v=603-header'
          ]:
              if marker not in index: raise SystemExit(f'Missing V608 index marker: {marker}')
          for marker in [
            "preloadMode:'worker-warm-staged-heavy-execution'",
            "new Set(['todo','backstage'])",
            'browserBreather',
            "label:(LABELS[id]||id)+' wird geladen · Modul '",
            'recoveryDeferred:true',
            'backstageLogDeferred:true',
            "log:[...HISTORY_GROUP]",
            "history:[...HISTORY_GROUP]"
          ]:
              if marker not in runtime: raise SystemExit(f'Missing V608 staged-runtime marker: {marker}')
          for marker in ["reloadAuthority:'none'","singleReloadAuthority:'none'"]:
              if marker not in gate: raise SystemExit(f'Missing stable V607 gate marker: {marker}')
          for marker in ['location.reload()','client.navigate(']:
              if marker in gate or marker in sw:
                  raise SystemExit(f'Automatic navigation reintroduced: {marker}')
          if metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics snapshot is not automated')
          print('V608 staged-area wiring OK')
      - name: JavaScript syntax
        run: |
          for f in             app.js app-hub-v515.js app-hub-launcher-v603.js surface-header-v603.js service-worker-gate-v607.js area-runtime-v608.js             kistology-v603.js log-core-v603.js background-log-v454.js history-safety-net-v498.js meaningful-history-v500.js             sport-v568.js food-v544.js finance-v552.js finance-data-v553.js             backstage-v531.js backstage-size-v532.js backstage-backup-v533.js backstage-backup-v534.js             backup-source-fallback-v506.js backup-stability-v506.js backup-model-v600.js iphone-backup-v400.js             task-title-library-v507.js archive-weight-layout-v508.js summary-weight-due-polish-v494.js; do
            node --check "$f"
          done
          node --check sw.js
      - name: Generator follows highest current module version
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const fs=require('fs');
          const m=require('/tmp/development-metrics.json');
          const versions=fs.readdirSync('.').map(name=>{const x=name.match(/(?:^|-)v(\d+)\.js$/i);return x?Number(x[1]):0;});
          const expected='V'+Math.max(...versions);
          if(m.version!==expected||!m.automated)throw new Error(`Generated version wrong: ${m.version}, expected ${expected}`);
          if(m.repository.currentFiles<40||m.repository.currentTextLines<10000||m.repository.currentBytes<500000)throw new Error('Generated repository metrics unexpectedly small');
          console.log('Generated metrics sane',expected);
          NODE
