name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V426 priority tab rebuild
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('priority-header-v424.js').read_text(encoding='utf-8')
          css=Path('priority-header-v424.css').read_text(encoding='utf-8')
          dev=Path('dev-version-v426.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V426','priority-header-v424.css?v=426-2136','priority-header-v424.js?v=426-2136','dev-version-v426.js?v=426-2136']:
              if marker not in index: raise SystemExit(f'Missing V426 marker: {marker}')
          for marker in ['master-of-disaster-v426-priority-source-cleanup','dev-version-v426.js']:
              if marker not in sw: raise SystemExit(f'Missing V426 cache marker: {marker}')
          for marker in ['HOHE PRIORITÄT','MITTLERE PRIORITÄT','NORMALE PRIORITÄT','OPTIONAL','slice(0,4)','priority-label-offset-v426','priority-header-v426']:
              if marker not in js+css: raise SystemExit(f'Missing V426 priority behavior: {marker}')
          if 'margin-left:auto' in css: raise SystemExit('Old right-shifting label rule still present')
          if 'V426' not in dev or '21:36 Uhr' not in dev: raise SystemExit('V426 DEV label mismatch')
          print('V426 priority tab rebuild OK')
      - name: JavaScript syntax
        run: node --check priority-header-v424.js && node --check visible-icon-fix-v423.js && node --check dev-version-v426.js
