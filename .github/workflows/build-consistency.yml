name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V489 build
        shell: python
        run: |
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v489=Path('task-time-weight-details-v489.js').read_text(encoding='utf-8')
          v488=Path('historical-segment-breakdown-v488.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V489','23.08.2026 · 18:25','task-time-weight-details-v489.js?v=489-1825',"version:'V489'",'modV489TaskTimeWeightDetailsDone']:
              if marker not in index: raise SystemExit(f'Missing V489 index marker: {marker}')
          for marker in ['master-of-disaster-v489-task-time-weight-details','task-time-weight-details-v489.js','historical-segment-breakdown-v488.js','segment-active-duration-v487.js','time-segment-scroll-v486.js']:
              if marker not in sw: raise SystemExit(f'Missing V489 service worker marker: {marker}')
          for marker in ["const BUILD_VERSION='V489'",'perTaskTimeRanges:true','perTaskWeightOverlap:true','appliesToPausedCompletedAbortedAndArchive:true','historicalTimesNeverInvented:true','compactLogFontPx:8.5','detailFontPx:8.5','__modTaskTimeWeightDetailsV489']:
              if marker not in v489: raise SystemExit(f'Missing V489 behavior: {marker}')
          for marker in ["const BUILD_VERSION='V488'",'historicalProgressPreserved:true','cardBreakdownFontPx:8.5','__modHistoricalSegmentBreakdownV488']:
              if marker not in v488: raise SystemExit(f'Missing preserved V488 behavior: {marker}')
          if metrics.get('version')!='V489' or metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics snapshot is not V489/automated')
          print('V489 build consistency OK')
      - name: JavaScript syntax
        run: node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check today-create-render-v480.js && node --check render-stability-v479.js && node --check remote-archive-sequence-v478.js && node --check ux-cooking-editor-v460.js && node --check time-segments-v443.js && node --check live-log-v453.js && node --check app.js
      - name: Generator produces current repository metrics
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const m=require('/tmp/development-metrics.json');
          if(m.version!=='V489'||!m.automated)throw new Error('Generated version/automation flag wrong');
          if(m.repository.currentFiles<40||m.repository.currentTextLines<10000||m.repository.currentBytes<500000)throw new Error('Generated repository metrics unexpectedly small');
          console.log('V489 generated metrics sane');
          NODE
