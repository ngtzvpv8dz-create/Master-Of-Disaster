name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V445 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          retro=Path('retroactive-complete-v445.js').read_text(encoding='utf-8')
          duration=Path('segment-duration-v444.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V445','21.08.2026 · 11:53','retroactive-complete-v445.js?v=445-1153',"version:'V445'",'__MOD_BUILD__']:
              if marker not in index: raise SystemExit(f'Missing V445 index marker: {marker}')
          for marker in ['master-of-disaster-v445-retroactive-complete','retroactive-complete-v445.js?v=445-1153']:
              if marker not in sw: raise SystemExit(f'Missing V445 cache marker: {marker}')
          for marker in ['SPEICHERN & ERLEDIGEN','saveManualSegmentsAndCompleteV445','hasClosedHistory','task.activeSegments.push','__modRetroactiveV445']:
              if marker not in retro: raise SystemExit(f'Missing V445 retroactive behavior: {marker}')
          for marker in ['calculateActiveDuration=function','sumTaskSegmentsMs','__modV444SegmentDuration']:
              if marker not in duration: raise SystemExit(f'Missing V444 duration behavior: {marker}')
          print('V445 build consistency OK')
      - name: JavaScript syntax
        run: node --check retroactive-complete-v445.js && node --check segment-duration-v444.js && node --check time-segments-v443.js && node --check integrity-v439.js && node --check remote-commands.js && node --check app.js
