name: Build Consistency Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V408 task-card UX
        shell: python
        run: |
          from pathlib import Path
          import re
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          ux=Path('ux-fixes-v408.js').read_text(encoding='utf-8')
          css=Path('ux-fixes-v408.css').read_text(encoding='utf-8')
          stats=Path('stats-and-rules-v403.js').read_text(encoding='utf-8')
          iphone=Path('iphone-backup-v400.js').read_text(encoding='utf-8')
          html_v=re.search(r'<!-- BUILD: V(\d+) ·',index)
          cache_v=re.search(r'CACHE_NAME = "master-of-disaster-v(\d+)"',sw)
          if not html_v or not cache_v or html_v.group(1)!='408' or cache_v.group(1)!='408':
              raise SystemExit('Expected V408 metadata')
          for marker in ['ux-fixes-v408.js?v=408-1240','ux-fixes-v408.css?v=408-1240','dev-version-v408.js?v=408-1240','app.js?v=408']:
              if marker not in index: raise SystemExit(f'Missing V408 asset: {marker}')
          for marker in ['OHNE KATEGORIE','openPicker','actionParent','title-edit-v408-button','ALLE GLEICHNAMIGEN']:
              if marker not in ux: raise SystemExit(f'Missing V408 UX behavior: {marker}')
          for marker in ['position:absolute','top:10px','right:10px']:
              if marker not in css: raise SystemExit(f'Missing V408 badge placement: {marker}')
          for marker in ['isAdministrativeTest','hasStarted(task) && !isAdministrativeTest(task)']:
              if marker not in stats: raise SystemExit(f'Missing delete rule: {marker}')
          for marker in ['localStorage ist Master','AUTO_BACKUP_DELAY_MS=10000']:
              if marker not in iphone: raise SystemExit(f'Missing backup behavior: {marker}')
          print('Build V408 task-card category + edit UX OK')
