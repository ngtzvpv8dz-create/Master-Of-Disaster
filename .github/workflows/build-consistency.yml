name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V417 priority due and edit polish
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('action-icons-v416.js').read_text(encoding='utf-8')
          css=Path('action-icons-v416.css').read_text(encoding='utf-8')
          dev=Path('dev-version-v417.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V417','action-icons-v416.css?v=417-1636','action-icons-v416.js?v=417-1636','dev-version-v417.js?v=417-1636']:
              if marker not in index: raise SystemExit(f'Missing V417 marker: {marker}')
          for marker in ['master-of-disaster-v417-polish','dev-version-v417.js','action-icons-v416.js']:
              if marker not in sw: raise SystemExit(f'Missing V417 cache marker: {marker}')
          for marker in ['priority-ring-v417','due-ring-v417','due-date-v417',".edit-area","task.status==='open'"]:
              if marker not in js+css: raise SystemExit(f'Missing V417 UI behavior: {marker}')
          if 'V417' not in dev or '16:36 Uhr' not in dev: raise SystemExit('V417 DEV label mismatch')
          print('V417 priority/due/edit consistency OK')
