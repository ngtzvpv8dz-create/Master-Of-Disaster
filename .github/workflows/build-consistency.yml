name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V475 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v475=Path('fixed-app-header-v475.js').read_text(encoding='utf-8')
          v474=Path('today-work-blocks-v474.js').read_text(encoding='utf-8')
          v472=Path('remote-archive-maintenance-v472.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V475','22.08.2026 · 13:45','fixed-app-header-v475.js?v=475-1345',"version:'V475'",'modV475FixedAppHeaderDone']:
              if marker not in index: raise SystemExit(f'Missing V475 index marker: {marker}')
          for marker in ['master-of-disaster-v475-fixed-app-header','fixed-app-header-v475.js']:
              if marker not in sw: raise SystemExit(f'Missing V475 service worker marker: {marker}')
          for marker in ['appFixedTopV475','position:sticky','headerAndTabsTogether:true','opaqueShell:true','dynamicHeight:true','--mod-fixed-top-height-v475','__modFixedAppHeaderV475']:
              if marker not in v475: raise SystemExit(f'Missing V475 behavior: {marker}')
          for marker in ['ARBEITSBLOCK','dynamicBlockNumbering:true','crossBlockTaskDrag:true','allSearch:true','directTodayAssignment:true','__modTodayWorkBlocksV474']:
              if marker not in v474: raise SystemExit(f'Missing preserved V474 behavior: {marker}')
          for marker in ["QUEUE_STATUS='processing'",'DELETE_ARCHIVE_ENTRY','__modRemoteArchiveMaintenanceV472']:
              if marker not in v472: raise SystemExit(f'Missing preserved V472 behavior: {marker}')
          print('V475 build consistency OK')
      - name: JavaScript syntax
        run: node --check fixed-app-header-v475.js && node --check today-work-blocks-v474.js && node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check remote-commands.js && node --check theme-editor-help-stability-v470.js && node --check theme-editor-help-v469.js && node --check ux-cooking-editor-v460.js && node --check app.js
