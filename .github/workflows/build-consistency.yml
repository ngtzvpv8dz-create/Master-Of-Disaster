name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V491 build
        shell: python
        run: |
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v491=Path('ui-card-stability-v491.js').read_text(encoding='utf-8')
          v490=Path('nested-task-weight-layout-v490.js').read_text(encoding='utf-8')
          v488=Path('historical-segment-breakdown-v488.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V491','23.08.2026 · 19:26','ui-card-stability-v491.js?v=491-1926',"version:'V491'",'modV491CardStabilityDone']:
              if marker not in index: raise SystemExit(f'Missing V491 index marker: {marker}')
          for marker in ['master-of-disaster-v491-card-stability-controls','ui-card-stability-v491.js','nested-task-weight-layout-v490.js','historical-segment-breakdown-v488.js','today-work-blocks-v474.js']:
              if marker not in sw: raise SystemExit(f'Missing V491 service worker marker: {marker}')
          for marker in ["const BUILD_VERSION='V491'",'dragHandleReplacedByArrows:true','actionsAlwaysBottom:true','todayActionAfterClock:true','todayIconConsistentAcrossStatuses:true','selectedTodayUsesCalendarPin:true','stableCardLayout:true','__modUiCardStabilityV491']:
              if marker not in v491: raise SystemExit(f'Missing V491 behavior: {marker}')
          for marker in ["const BUILD_VERSION='V490'",'periodicDomRewriteRemoved:true','subSecondSegmentsHidden:true','nestedSegmentWeight:true','archiveDetailFontPx:8.5','__modNestedTaskWeightLayoutV490']:
              if marker not in v490: raise SystemExit(f'Missing preserved/updated V490 behavior: {marker}')
          for marker in ["const BUILD_VERSION='V488'",'cardPauseLineRemoved:true','nestedWeightPreservedOnTicker:true','unchangedCardsDoNotRewriteDom:true','historicalProgressPreserved:true','__modHistoricalSegmentBreakdownV488']:
              if marker not in v488: raise SystemExit(f'Missing V488/V491 stability behavior: {marker}')
          if metrics.get('version')!='V491' or metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics snapshot is not V491/automated')
          print('V491 build consistency OK')
      - name: JavaScript syntax
        run: node --check ui-card-stability-v491.js && node --check nested-task-weight-layout-v490.js && node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check today-create-render-v480.js && node --check render-stability-v479.js && node --check remote-archive-sequence-v478.js && node --check ux-cooking-editor-v460.js && node --check time-segments-v443.js && node --check live-log-v453.js && node --check app.js
      - name: Generator produces current repository metrics
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const m=require('/tmp/development-metrics.json');
          if(m.version!=='V491'||!m.automated)throw new Error('Generated version/automation flag wrong');
          if(m.repository.currentFiles<40||m.repository.currentTextLines<10000||m.repository.currentBytes<500000)throw new Error('Generated repository metrics unexpectedly small');
          console.log('V491 generated metrics sane');
          NODE
