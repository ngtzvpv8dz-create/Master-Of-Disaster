name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V436 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          search=Path('task-search.js').read_text(encoding='utf-8')
          remote=Path('remote-commands.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V436','21.08.2026 · 09:28','task-search.js?v=436-0928','remote-commands.js?v=436-0928']:
              if marker not in index: raise SystemExit(f'Missing V436 index marker: {marker}')
          for marker in ['master-of-disaster-v436-remote-actions','remote-commands.js?v=436-0928','/remote-commands.js']:
              if marker not in sw: raise SystemExit(f'Missing V436 cache marker: {marker}')
          for marker in ["version:'V436'","date:'21.08.2026'","time:'09:28'"]:
              if marker not in search: raise SystemExit(f'Missing V436 visible version: {marker}')
          for marker in ['ADD_TASK','START_TASK','PAUSE_TASK','RESUME_TASK','COMPLETE_TASK','START_WEIGHT','STOP_WEIGHT','__modRemoteCommandsV436']:
              if marker not in remote: raise SystemExit(f'Missing V436 remote behavior: {marker}')
          print('V436 build consistency OK')
      - name: JavaScript syntax
        run: node --check remote-commands.js && node --check task-search.js && node --check ui.js && node --check archive-category-v413.js && node --check categories.js && node --check app.js
