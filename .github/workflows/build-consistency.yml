name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V437 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          remote=Path('remote-commands.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V437','21.08.2026 · 09:44','task-search.js?v=437-0944','remote-commands.js?v=437-0944',"version:'V437'","build:'21.08.2026 · 09:44 Uhr'",'__MOD_BUILD__']:
              if marker not in index: raise SystemExit(f'Missing V437 index marker: {marker}')
          for marker in ['master-of-disaster-v437-build-meta','remote-commands.js?v=437-0944','/remote-commands.js']:
              if marker not in sw: raise SystemExit(f'Missing V437 cache marker: {marker}')
          for marker in ['ADD_TASK','START_TASK','PAUSE_TASK','RESUME_TASK','COMPLETE_TASK','START_WEIGHT','STOP_WEIGHT','__modRemoteCommandsV436']:
              if marker not in remote: raise SystemExit(f'Missing remote behavior: {marker}')
          print('V437 build consistency OK')
      - name: JavaScript syntax
        run: node --check remote-commands.js && node --check task-search.js && node --check ui.js && node --check archive-category-v413.js && node --check categories.js && node --check app.js
