name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V417 compact three-line task layout
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          css=Path('compact-task-layout-v416.css').read_text(encoding='utf-8')
          for marker in ['BUILD: V417','compact-task-layout-v416.css?v=417-1523','compact-task-layout-v416.js?v=417-1523','dev-version-v416.js?v=417-1523']:
              if marker not in index: raise SystemExit(f'Missing V417 marker: {marker}')
          if 'master-of-disaster-v417' not in sw: raise SystemExit('V417 cache missing')
          for marker in ['grid-template-columns:52px minmax(0,1fr)','grid-template-rows:28px 22px 26px','grid-row:3','justify-self:start','width:46px','overflow:visible']:
              if marker not in css: raise SystemExit(f'Missing V417 compact layout rule: {marker}')
          print('V417 compact three-line layout consistency OK')
