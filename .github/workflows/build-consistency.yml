name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V478 build
        shell: python
        run: |
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v478=Path('remote-archive-sequence-v478.js').read_text(encoding='utf-8')
          v477=Path('statistics-alignment-v477.js').read_text(encoding='utf-8')
          v476=Path('development-stats-current-v476.js').read_text(encoding='utf-8')
          v475=Path('fixed-app-header-v475.js').read_text(encoding='utf-8')
          generator=Path('scripts/generate-development-metrics.mjs').read_text(encoding='utf-8')
          updater=Path('.github/workflows/update-development-metrics.yml').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V478','23.08.2026 · 07:32','remote-archive-sequence-v478.js?v=478-0732',"version:'V478'",'modV478ArchiveSequenceDone']:
              if marker not in index: raise SystemExit(f'Missing V478 index marker: {marker}')
          for marker in ['master-of-disaster-v478-archive-sequence-repair','remote-archive-sequence-v478.js','development-metrics.json']:
              if marker not in sw: raise SystemExit(f'Missing V478 service worker marker: {marker}')
          for marker in ["const BUILD_VERSION='V478'","const COMMAND='RENUMBER_ARCHIVE_GAP'",'repairArchiveGap','before.gaps.length!==1','archive_id_preserved:true','sequence_contiguous:true','__modRemoteArchiveSequenceV478']:
              if marker not in v478: raise SystemExit(f'Missing V478 behavior: {marker}')
          for marker in ['padding:12px 13px!important','margin-left:0!important','width:100%!important','fixedSummaryPadding:true','dynamicIndentRemoved:true','targetBlockCount:5','__modStatisticsAlignmentV477']:
              if marker not in v477: raise SystemExit(f'Missing preserved V477 behavior: {marker}')
          for marker in ['APP-ENTWICKLUNG · AKTUELL','AUTOMATISCHER IST-STAND','autoGenerated:true','historicalFromGit:true','development-metrics.json','__modDevelopmentStatsCurrentV476']:
              if marker not in v476: raise SystemExit(f'Missing preserved V476 behavior: {marker}')
          for marker in ['git rev-list --count HEAD','currentTextLines','currentBytes','METRICS_WILL_COMMIT','PR_COUNT','MERGED_PR_COUNT']:
              if marker not in generator: raise SystemExit(f'Missing metrics generator marker: {marker}')
          for marker in ['Update Development Metrics','METRICS_WILL_COMMIT','gh api','git push']:
              if marker not in updater: raise SystemExit(f'Missing metrics workflow marker: {marker}')
          if metrics.get('version')!='V478' or metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics placeholder is not V478/automated')
          for marker in ['appFixedTopV475','headerAndTabsTogether:true','opaqueShell:true','dynamicHeight:true','__modFixedAppHeaderV475']:
              if marker not in v475: raise SystemExit(f'Missing preserved V475 behavior: {marker}')
          print('V478 build consistency OK')
      - name: JavaScript syntax
        run: node --check remote-archive-sequence-v478.js && node --check statistics-alignment-v477.js && node --check development-stats-current-v476.js && node --check scripts/generate-development-metrics.mjs && node --check fixed-app-header-v475.js && node --check today-work-blocks-v474.js && node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check theme-editor-help-stability-v470.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - name: Generator produces current repository metrics
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const m=require('/tmp/development-metrics.json');
          if(m.version!=='V478'||!m.automated)throw new Error('Generated version/automation flag wrong');
          if(m.repository.reachableCommits<500)throw new Error('Commit history unexpectedly short');
          if(m.repository.currentFiles<40)throw new Error('File count unexpectedly low');
          if(m.repository.currentTextLines<10000)throw new Error('Text line count unexpectedly low');
          if(m.repository.currentBytes<500000)throw new Error('Repository byte count unexpectedly low');
          console.log('V478 generated metrics sane');
          NODE
