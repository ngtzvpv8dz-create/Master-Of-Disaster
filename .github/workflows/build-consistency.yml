name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V469 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          helpjs=Path('theme-editor-help-v469.js').read_text(encoding='utf-8')
          polish=Path('theme-editor-polish-v468.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V469','22.08.2026 · 09:57','theme-editor-help-v469.js?v=469-0957',"version:'V469'",'modV469ThemeEditorHelpDone']:
              if marker not in index: raise SystemExit(f'Missing V469 index marker: {marker}')
          for marker in ['master-of-disaster-v469-theme-editor-help','theme-editor-help-v469.js']:
              if marker not in sw: raise SystemExit(f'Missing V469 service worker marker: {marker}')
          for marker in ['COMPLETE THEME EDITOR HELP','patchFields','patchToolbar','patchChoiceGroups','patchGroupHeadings','theme-info-v469','completeHelp:true','__modThemeEditorHelpV469']:
              if marker not in helpjs: raise SystemExit(f'Missing V469 help behavior: {marker}')
          for marker in ['theme-info-v468','theme-mini-v468','presetStaysTheme:true','actionControlsUnified:true','rootBackground:true']:
              if marker not in polish: raise SystemExit(f'Missing preserved V468 behavior: {marker}')
          print('V469 build consistency OK')
      - name: JavaScript syntax
        run: node --check theme-editor-help-v469.js && node --check theme-editor-polish-v468.js && node --check theme-package-stability-v467.js && node --check theme-package-actions-v466.js && node --check theme-state-sync-v465.js && node --check theme-state-design-v464.js && node --check theme-editor-comfort-v463.js && node --check ux-cooking-editor-v460.js && node --check safe-undo-v457.js && node --check app.js
