name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V461 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          stability=Path('theme-editor-stability-v461.js').read_text(encoding='utf-8')
          ux=Path('ux-cooking-editor-v460.js').read_text(encoding='utf-8')
          theme=Path('theme-layout-editor-v458.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V461','21.08.2026 · 23:28','ux-cooking-editor-v460.js?v=460-2320','theme-editor-stability-v461.js?v=461-2328',"version:'V461'",'modV461ThemeStabilityDone']:
              if marker not in index: raise SystemExit(f'Missing V461 index marker: {marker}')
          for marker in ['master-of-disaster-v461-theme-editor-stability','theme-editor-stability-v461.js?v=461-2328','/theme-editor-stability-v461.js']:
              if marker not in sw: raise SystemExit(f'Missing V461 cache marker: {marker}')
          for marker in ['replaceObservedHostAfterLegacyObserversAttached','scheduleThemeRefresh','theme-state-position-v460','__modThemeStabilityV461HostReplaced','__modThemeStabilityV461']:
              if marker not in stability: raise SystemExit(f'Missing V461 stability behavior: {marker}')
          for marker in ['themeStickyPreviewV460','POSITION NUR FÜR ZUSTAND','ERLEDIGT / ABGEBROCHEN','segment-mode-v460','passiveCookingParallel:true','__modUxCookingEditorV460']:
              if marker not in ux: raise SystemExit(f'Missing preserved V460 behavior: {marker}')
          for marker in ['THEME & LAYOUT EDITOR','__modThemeLayoutV458']:
              if marker not in theme: raise SystemExit(f'Missing preserved V458 theme behavior: {marker}')
          print('V461 build consistency OK')
      - name: JavaScript syntax
        run: node --check theme-editor-stability-v461.js && node --check ux-cooking-editor-v460.js && node --check theme-preview-fix-v459.js && node --check theme-layout-editor-v458.js && node --check safe-undo-v457.js && node --check task-notes-v456.js && node --check goals-milestones-v455.js && node --check background-log-v454.js && node --check live-log-v453.js && node --check project-history-v452.js && node --check development-stats-v451.js && node --check completed-category-v449.js && node --check paused-today-v447.js && node --check today-paused-v446.js && node --check retroactive-complete-v445.js && node --check segment-duration-v444.js && node --check time-segments-v443.js && node --check integrity-v439.js && node --check remote-commands.js && node --check app.js
