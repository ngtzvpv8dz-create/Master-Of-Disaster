name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V460 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          ux=Path('ux-cooking-editor-v460.js').read_text(encoding='utf-8')
          theme=Path('theme-layout-editor-v458.js').read_text(encoding='utf-8')
          preview=Path('theme-preview-fix-v459.js').read_text(encoding='utf-8')
          notes=Path('task-notes-v456.js').read_text(encoding='utf-8')
          undo=Path('safe-undo-v457.js').read_text(encoding='utf-8')
          background=Path('background-log-v454.js').read_text(encoding='utf-8')
          log=Path('live-log-v453.js').read_text(encoding='utf-8')
          history=Path('project-history-v452.js').read_text(encoding='utf-8')
          remote=Path('remote-commands.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V460','21.08.2026 · 23:20','data-tab="theme"','ux-cooking-editor-v460.js?v=460-2320',"version:'V460'",'modV460UxCookingDone']:
              if marker not in index: raise SystemExit(f'Missing V460 index marker: {marker}')
          for marker in ['master-of-disaster-v460-editor-abort-cooking','ux-cooking-editor-v460.js?v=460-2320','/ux-cooking-editor-v460.js']:
              if marker not in sw: raise SystemExit(f'Missing V460 cache marker: {marker}')
          for marker in ['masterOfDisasterThemeStateLayoutV460','themeStickyPreviewV460','POSITION NUR FÜR ZUSTAND','OBEN LINKS','OBEN RECHTS','UNTEN LINKS','UNTEN RECHTS','notesDisabled:true','ERLEDIGT / ABGEBROCHEN','segment-mode-v460','AKTIV KOCHEN','WARTE-/GARZEIT','passiveCookingParallel:true','__modUxCookingEditorV460']:
              if marker not in ux: raise SystemExit(f'Missing V460 UX/cooking behavior: {marker}')
          for marker in ['masterOfDisasterThemeLayoutV458','THEME & LAYOUT EDITOR','__modThemeLayoutV458']:
              if marker not in theme: raise SystemExit(f'Missing preserved V458 theme/editor behavior: {marker}')
          for marker in ['theme-note-preview-v459','__modThemePreviewFixV459']:
              if marker not in preview: raise SystemExit(f'Missing preserved V459 preview module: {marker}')
          for marker in ['MAX_NOTE=1200','__modTaskNotesV456']:
              if marker not in notes: raise SystemExit(f'Missing legacy V456 note compatibility: {marker}')
          for marker in ['TTL_MS=10*60*1000','RÜCKGÄNGIG','__modSafeUndoV457']:
              if marker not in undo: raise SystemExit(f'Missing preserved V457 undo behavior: {marker}')
          for marker in ['SYNC_DELAY_MS=900','emptyRemotePollSuppressed:true','__modBackgroundLogV454']:
              if marker not in background: raise SystemExit(f'Missing preserved V454 behavior: {marker}')
          for marker in ['WINDOW_MS=24*60*60*1000','__modLiveLogV453']:
              if marker not in log: raise SystemExit(f'Missing preserved V453 behavior: {marker}')
          for marker in ['GESAMTCHRONIK','__modProjectHistoryV452']:
              if marker not in history: raise SystemExit(f'Missing preserved V452 behavior: {marker}')
          for marker in ['findReusableTask','reused_existing','__modRemoteCommandsV450']:
              if marker not in remote: raise SystemExit(f'Missing preserved V450 behavior: {marker}')
          print('V460 build consistency OK')
      - name: JavaScript syntax
        run: node --check ux-cooking-editor-v460.js && node --check theme-preview-fix-v459.js && node --check theme-layout-editor-v458.js && node --check safe-undo-v457.js && node --check task-notes-v456.js && node --check goals-milestones-v455.js && node --check background-log-v454.js && node --check live-log-v453.js && node --check project-history-v452.js && node --check development-stats-v451.js && node --check completed-category-v449.js && node --check paused-today-v447.js && node --check today-paused-v446.js && node --check retroactive-complete-v445.js && node --check segment-duration-v444.js && node --check time-segments-v443.js && node --check integrity-v439.js && node --check remote-commands.js && node --check app.js
