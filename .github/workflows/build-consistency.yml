name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V418 priority and due-date model
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('action-icons-v416.js').read_text(encoding='utf-8')
          css=Path('action-icons-v416.css').read_text(encoding='utf-8')
          dev=Path('dev-version-v418.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V418','action-icons-v416.css?v=418-1702','action-icons-v416.js?v=418-1702','dev-version-v418.js?v=418-1702']:
              if marker not in index: raise SystemExit(f'Missing V418 marker: {marker}')
          for marker in ['master-of-disaster-v418-due-model','dev-version-v418.js','action-icons-v416.js']:
              if marker not in sw: raise SystemExit(f'Missing V418 cache marker: {marker}')
          for marker in ["priority==='optional'",'setNewDueDateV418','setTaskDueDateV418','formatDue','due-ring-v417','priority-choice-ring-v418']:
              if marker not in js+css: raise SystemExit(f'Missing V418 behavior: {marker}')
          if '.priority-ring-v417.optional' not in css: raise SystemExit('Optional ring style missing')
          if 'V418' not in dev or '17:02 Uhr' not in dev: raise SystemExit('V418 DEV label mismatch')
          print('V418 priority/free-due consistency OK')
      - name: JavaScript syntax
        run: node --check action-icons-v416.js && node --check dev-version-v418.js
