name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V457 build
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          goals=Path('goals-milestones-v455.js').read_text(encoding='utf-8')
          notes=Path('task-notes-v456.js').read_text(encoding='utf-8')
          undo=Path('safe-undo-v457.js').read_text(encoding='utf-8')
          background=Path('background-log-v454.js').read_text(encoding='utf-8')
          log=Path('live-log-v453.js').read_text(encoding='utf-8')
          history=Path('project-history-v452.js').read_text(encoding='utf-8')
          remote=Path('remote-commands.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V457','21.08.2026 · 17:25','goals-milestones-v455.js?v=455-1725','task-notes-v456.js?v=456-1725','safe-undo-v457.js?v=457-1725',"version:'V457'",'modV457FunctionalDone']:
              if marker not in index: raise SystemExit(f'Missing V457 index marker: {marker}')
          for marker in ['master-of-disaster-v457-goals-notes-undo','goals-milestones-v455.js?v=455-1725','task-notes-v456.js?v=456-1725','safe-undo-v457.js?v=457-1725']:
              if marker not in sw: raise SystemExit(f'Missing V457 cache marker: {marker}')
          for marker in ['masterOfDisasterGoalsV455','DEFAULTS={archiveTasks:250,activeHours:100,activeDays:30,weightedTasks:100}','ZIELE & MEILENSTEINE','ZIELE BEARBEITEN','reachedMilestones','__modGoalsMilestonesV455']:
              if marker not in goals: raise SystemExit(f'Missing V455 goals behavior: {marker}')
          for marker in ['MAX_NOTE=1200','note-edit-','NOTIZ · OPTIONAL','task-note-v456','archiveCompletedTask','__modTaskNotesV456']:
              if marker not in notes: raise SystemExit(f'Missing V456 notes behavior: {marker}')
          for marker in ['TTL_MS=10*60*1000','RÜCKGÄNGIG','analyzeTaskChange','archiveSignature','__modSafeUndoV457']:
              if marker not in undo: raise SystemExit(f'Missing V457 undo behavior: {marker}')
          for marker in ['SYNC_DELAY_MS=900','wrapSupabaseClient','emptyRemotePollSuppressed:true','__modBackgroundLogV454']:
              if marker not in background: raise SystemExit(f'Missing preserved V454 behavior: {marker}')
          for marker in ['WINDOW_MS=24*60*60*1000','__modLiveLogV453']:
              if marker not in log: raise SystemExit(f'Missing preserved V453 behavior: {marker}')
          for marker in ['GESAMTCHRONIK','data-stat-open-v452','data-stat-close-v452','__modProjectHistoryV452']:
              if marker not in history: raise SystemExit(f'Missing preserved V452 behavior: {marker}')
          for marker in ['findReusableTask','reused_existing','__modRemoteCommandsV450']:
              if marker not in remote: raise SystemExit(f'Missing preserved V450 behavior: {marker}')
          print('V457 build consistency OK')
      - name: JavaScript syntax
        run: node --check safe-undo-v457.js && node --check task-notes-v456.js && node --check goals-milestones-v455.js && node --check background-log-v454.js && node --check live-log-v453.js && node --check project-history-v452.js && node --check development-stats-v451.js && node --check completed-category-v449.js && node --check paused-today-v447.js && node --check today-paused-v446.js && node --check retroactive-complete-v445.js && node --check segment-duration-v444.js && node --check time-segments-v443.js && node --check integrity-v439.js && node --check remote-commands.js && node --check app.js
