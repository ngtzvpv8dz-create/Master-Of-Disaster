name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V603 current wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          runtime=Path('area-runtime-v603.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in [
            "version:'V603'",
            'app-hub-launcher-v603.css?v=603-loader',
            'app-hub-launcher-v603.js?v=603-loader',
            'surface-header-v603.css?v=603-header',
            'surface-header-v603.js?v=603-header',
            'area-runtime-v603.js?v=603-bootstrap',
            'kistology-v603.css?v=603',
            "serviceWorker.register('./sw.js?v=603-bootstrap-cleanup'"
          ]:
              if marker not in index: raise SystemExit(f'Missing V603 index marker: {marker}')
          for marker in ['log-core-v603.js','todo-stability-v603.js','kistology-v603.js','backstage-v531.js','history-safety-net-v498.js','backup-model-v600.js']:
              if marker not in runtime: raise SystemExit(f'Missing current runtime marker: {marker}')
          for marker in ['app-hub-launcher-v603.js','surface-header-v603.js','area-runtime-v603.js','kistology-v603.js','log-core-v603.js']:
              if marker not in sw: raise SystemExit(f'Missing current service-worker marker: {marker}')
          forbidden=[
            'app-hub-icon-buttons-v516.js','app-hub-launcher-v517.js','app-hub-simple-header-v523.css',
            'kistology-v537.js','kistology-v538.js','kistology-v539.js',
            'live-log-v453.js','log-stability-v499.js','stability-v595.js','stability-v596.js',
            'surface-taglines-v601.js','surface-header-v602.js'
          ]
          for marker in forbidden:
              if marker in index or marker in runtime or marker in sw:
                  raise SystemExit(f'Legacy runtime marker still active: {marker}')
          if metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics snapshot is not automated')
          print('V603 current wiring consistency OK')
      - name: JavaScript syntax
        run: |
          for f in             app.js app-hub-v515.js app-hub-launcher-v603.js surface-header-v603.js area-runtime-v603.js             kistology-v603.js log-core-v603.js background-log-v454.js history-safety-net-v498.js meaningful-history-v500.js             sport-v568.js food-v544.js finance-v552.js finance-data-v553.js             backstage-v531.js backstage-size-v532.js backstage-backup-v533.js backstage-backup-v534.js             backup-source-fallback-v506.js backup-stability-v506.js backup-model-v600.js iphone-backup-v400.js             task-title-library-v507.js archive-weight-layout-v508.js summary-weight-due-polish-v494.js; do
            node --check "$f"
          done
          node --check sw.js
      - name: Generator follows highest current module version
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const fs=require('fs');
          const m=require('/tmp/development-metrics.json');
          const versions=fs.readdirSync('.').map(name=>{const x=name.match(/(?:^|-)v(\d+)\.js$/i);return x?Number(x[1]):0;});
          const expected='V'+Math.max(...versions);
          if(m.version!==expected||!m.automated)throw new Error(`Generated version wrong: ${m.version}, expected ${expected}`);
          if(m.repository.currentFiles<40||m.repository.currentTextLines<10000||m.repository.currentBytes<500000)throw new Error('Generated repository metrics unexpectedly small');
          console.log('Generated metrics sane',expected);
          NODE
