name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current build and stable worker/runtime wiring
        shell: python
        run: |
          from pathlib import Path
          import json,re
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          gate=Path('service-worker-gate-v611.js').read_text(encoding='utf-8')
          runtime=Path('area-runtime-v609.js').read_text(encoding='utf-8')
          css=Path('backstage-section-loader-v609.css').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))

          build=re.search(r"version:'(V\d+)'",index)
          if not build:
              raise SystemExit('Current build version missing from index')
          build=build.group(1)

          for marker in [
            'service-worker-gate-v611.js?v=611-worker-gate',
            'area-runtime-v609.js?v=',
            'area-loader-v608.css?v=608-staged',
            'backstage-section-loader-v609.css?v=609-sections'
          ]:
              if marker not in index:
                  raise SystemExit(f'Missing current index marker: {marker}')

          for marker in [
            "preloadMode:'worker-warm-staged-heavy-execution'",
            "stagedBackstageSections:['log','history','backup','restore']",
            'sectionProgressUi:true',
            'loadSectionSequential',
            'mod-backstage-section-loader-v609',
            "if(context==='log'||context==='history')",
            "if(context==='backup'||context==='restore')",
            'recoveryDeferred:true',
            'backstageLogDeferred:true'
          ]:
              if marker not in runtime:
                  raise SystemExit(f'Missing V609 runtime marker: {marker}')

          for marker in ['mod-backstage-section-loader-v609','mod-backstage-section-loader-track-v609']:
              if marker not in css:
                  raise SystemExit(f'Missing V609 loader CSS marker: {marker}')

          for marker in ['./area-runtime-v609.js','./backstage-section-loader-v609.css']:
              if marker not in sw:
                  raise SystemExit(f'Missing V609 SW shell marker: {marker}')

          for marker in ["reloadAuthority:'none'","singleReloadAuthority:'none'"]:
              if marker not in gate:
                  raise SystemExit(f'Missing stable V611 gate marker: {marker}')

          for marker in ['location.reload()','client.navigate(']:
              if marker in gate or marker in sw:
                  raise SystemExit(f'Automatic navigation reintroduced: {marker}')

          if metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics snapshot is not automated')

          for marker in ['const SW_VERSION="V611"','const CACHE_NAME="master-of-disaster-v611-static"','cache.match(request)','cached(request,{ignoreSearch:true})']:
              if marker not in sw:
                  raise SystemExit(f'Missing V611 worker cache marker: {marker}')

          print(f'{build} build + V611 worker cache + V609 staged runtime wiring OK')

      - name: JavaScript syntax
        run: |
          for f in \
            app.js app-hub-v515.js app-hub-launcher-v603.js surface-header-v603.js service-worker-gate-v611.js area-runtime-v609.js \
            kistology-v603.js log-core-v603.js background-log-v454.js history-safety-net-v498.js meaningful-history-v500.js \
            sport-v616.js food-v544.js finance-v552.js finance-data-v553.js \
            backstage-v531.js backstage-size-v532.js backstage-backup-v533.js backstage-backup-v534.js \
            backup-source-fallback-v506.js backup-stability-v506.js backup-model-v600.js iphone-backup-v400.js \
            task-title-library-v507.js archive-weight-layout-v508.js summary-weight-due-polish-v494.js; do
            node --check "$f"
          done
          node --check sw.js

      - name: Generator follows highest current version
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const fs=require('fs');
          const m=require('/tmp/development-metrics.json');
          const index=fs.readFileSync('index.html','utf8');
          const numbers=[...index.matchAll(/V(\d+)/gi)].map(x=>Number(x[1])||0);
          for(const name of fs.readdirSync('.')){
            if(name.includes('/'))continue;
            for(const x of name.matchAll(/(?:^|[-_])v(\d+)(?=[-_.]|$)/gi))numbers.push(Number(x[1])||0);
          }
          const expected='V'+Math.max(0,...numbers);
          if(m.version!==expected||!m.automated)throw new Error(`Generated version wrong: ${m.version}, expected ${expected}`);
          if(m.repository.currentFiles<40||m.repository.currentTextLines<10000||m.repository.currentBytes<500000)throw new Error('Generated repository metrics unexpectedly small');
          console.log('Generated metrics sane',expected);
          NODE
