name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current build wiring
        shell: python
        run: |
          from pathlib import Path
          import json,re
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          required_index=[
            'paused-today-v447.js?v=502-1225',
            'build-freshness-v502.js?v=502-1225',
            "serviceWorker.register('./sw.js?v=502-1225'",
            'summary-weight-due-polish-v494.js?v=494-2103'
          ]
          for marker in required_index:
              if marker not in index: raise SystemExit(f'Missing current index marker: {marker}')
          for marker in ['build-freshness-v502.js','today-action-order-v501.js','paused-today-v447.js','summary-weight-due-polish-v494.js']:
              if marker not in sw: raise SystemExit(f'Missing service-worker shell marker: {marker}')
          for path,markers in {
            'build-freshness-v502.js':["const BUILD_VERSION='V502'",'noStoreFetch:true','dynamicFromMetrics:true'],
            'today-action-order-v501.js':["const BUILD_VERSION='V501'",'todayMarkerBoundToButton:true','dataSemanticsUntouched:true'],
            'summary-weight-due-polish-v494.js':["const BUILD_VERSION='V494'",'totalActiveHighlighted:true','partialWeightFirstLineShowsKg:true','dataSemanticsUntouched:true'],
            'ui-card-stability-v491.js':["const BUILD_VERSION='V491'",'actionsAlwaysBottom:true','stableCardLayout:true']
          }.items():
              text=Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text: raise SystemExit(f'Missing preserved behavior {marker} in {path}')
          if metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics snapshot is not automated')
          print('Current build wiring consistency OK')
      - name: JavaScript syntax
        run: |
          for f in app.js summary-weight-due-polish-v494.js ui-alignment-v493.js task-card-rail-polish-v492.js ui-card-stability-v491.js nested-task-weight-layout-v490.js task-time-weight-details-v489.js historical-segment-breakdown-v488.js segment-active-duration-v487.js time-segment-scroll-v486.js terminal-delete-v485.js remote-task-reopen-v484.js today-create-render-v480.js render-stability-v479.js remote-archive-sequence-v478.js ux-cooking-editor-v460.js time-segments-v443.js live-log-v453.js paused-today-v447.js today-action-order-v501.js build-freshness-v502.js; do node --check "$f"; done
      - name: Generator follows highest current module version
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const m=require('/tmp/development-metrics.json');
          const versions=fs.readdirSync('.').map(name=>{const x=name.match(/(?:^|-)v(\d+)\.js$/i);return x?Number(x[1]):0;});
          const expected='V'+Math.max(...versions);
          if(m.version!==expected||!m.automated)throw new Error(`Generated version wrong: ${m.version}, expected ${expected}`);
          if(m.repository.currentFiles<40||m.repository.currentTextLines<10000||m.repository.currentBytes<500000)throw new Error('Generated repository metrics unexpectedly small');
          console.log('Generated metrics sane',expected);
          NODE
