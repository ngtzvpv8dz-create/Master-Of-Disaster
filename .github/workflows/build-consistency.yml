name: Build Consistency Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V405 shell, task rules and categories
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path("index.html").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")
          iphone = Path("iphone-backup-v400.js").read_text(encoding="utf-8")
          dev = Path("dev-cleanup-v401.js").read_text(encoding="utf-8")
          stats = Path("stats-and-rules-v403.js").read_text(encoding="utf-8")
          cats = Path("categories-v405.js").read_text(encoding="utf-8")

          html_v = re.search(r'<!-- BUILD: V(\d+) ·', index)
          cache_v = re.search(r'CACHE_NAME = "master-of-disaster-v(\d+)"', sw)
          if not html_v or not cache_v:
              raise SystemExit("Build metadata missing")
          if html_v.group(1) != "405" or cache_v.group(1) != "405":
              raise SystemExit(f"Expected V405, got html={html_v.group(1)} sw={cache_v.group(1)}")

          required = [
            "categories-v405.css?v=405-1123","categories-v405.js?v=405-1123",
            "stats-and-rules-v403.js?v=405-1123","iphone-backup-v400.js?v=405-1123",
            "dev-cleanup-v401.js?v=405-1123","app.js?v=405","app.css?v=405"
          ]
          for marker in required:
              if marker not in index:
                  raise SystemExit(f"Missing V405 asset: {marker}")

          for marker in ["categories-v405.js","categories-v405.css"]:
              if marker not in sw:
                  raise SystemExit(f"Category asset missing from service worker: {marker}")

          obsolete = [
            "ROLLBACK-V398-RECOVERY.txt","conflict-actions-v390.js","conflict-center.css","conflict-center.js",
            "conflict-filter-v388.js","multidevice-sync-fix.js","offline-conflict-v398.js","offline-sync-v396.js",
            "sync-core-v399.js","weight-conflict-v392.js","build-label-v393.js",
            ".github/workflows/v389-conflict-semantics.yml"
          ]
          leftovers = [p for p in obsolete if Path(p).exists()]
          if leftovers:
              raise SystemExit(f"Obsolete files still present: {leftovers}")

          for marker in ["localStorage ist Master", "Kein automatisches Cloud→Local", "AUTO_BACKUP_DELAY_MS=10000"]:
              if marker not in iphone:
                  raise SystemExit(f"Missing iPhone backup behavior marker: {marker}")

          for marker in ["MIGRATIONS-CHECK", "KONTROLLIERTEN ERSTIMPORT", "LOCAL ↔ CLOUD VERGLEICHEN", "VERBINDUNG TESTEN"]:
              if marker in dev:
                  raise SystemExit(f"Obsolete DEV control still visible: {marker}")

          for marker in ["isAdministrativeTest", "hasStarted(task) && !isAdministrativeTest(task)", "V404"]:
              if marker not in stats:
                  raise SystemExit(f"Missing test-delete rule marker: {marker}")

          for marker in ["setAllByName", "nameMap", "KATEGORIE", "ALLE GLEICHNAMIGEN", "masterOfDisasterCategoriesV405"]:
              if marker not in cats:
                  raise SystemExit(f"Missing category behavior marker: {marker}")

          print("Build V405 categories + task rules OK")
