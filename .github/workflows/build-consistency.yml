name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V424 exact priority headers
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('priority-header-v424.js').read_text(encoding='utf-8')
          css=Path('priority-header-v424.css').read_text(encoding='utf-8')
          dev=Path('dev-version-v423.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V424','priority-header-v424.css?v=424-2104','priority-header-v424.js?v=424-2104']:
              if marker not in index: raise SystemExit(f'Missing V424 marker: {marker}')
          for marker in ['master-of-disaster-v424-priority-header-exact','priority-header-v424.js','priority-header-v424.css']:
              if marker not in sw: raise SystemExit(f'Missing V424 cache marker: {marker}')
          for marker in ['HOHE PRIORITÄT','MITTLERE PRIORITÄT','NORMALE PRIORITÄT','OPTIONAL','taskLeft','--title-offset-v424']:
              if marker not in js+css: raise SystemExit(f'Missing V424 priority behavior: {marker}')
          if 'V424' not in dev or '21:04 Uhr' not in dev: raise SystemExit('V424 DEV label mismatch')
          print('V424 priority header consistency OK')
      - name: JavaScript syntax
        run: node --check priority-header-v424.js && node --check visible-icon-fix-v423.js && node --check dev-version-v423.js
