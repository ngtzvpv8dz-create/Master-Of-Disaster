name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V488 build
        shell: python
        run: |
          from pathlib import Path
          import json
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v488=Path('historical-segment-breakdown-v488.js').read_text(encoding='utf-8')
          v487=Path('segment-active-duration-v487.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V488','historical-segment-breakdown-v488.js?v=488-1616',"version:'V488'",'modV488HistoricalBreakdownDone']:
              if marker not in index: raise SystemExit(f'Missing V488 index marker: {marker}')
          for marker in ['master-of-disaster-v488-historical-segment-breakdown','historical-segment-breakdown-v488.js','segment-active-duration-v487.js','time-segment-scroll-v486.js']:
              if marker not in sw: raise SystemExit(f'Missing V488 service worker marker: {marker}')
          for marker in ["const BUILD_VERSION='V488'",'pausesExcludedFromSegmentActive:true','historicalProgressPreserved:true','editorShowsBreakdown:true','cardShowsBreakdown:true','segmentMetrics','__modHistoricalSegmentBreakdownV488']:
              if marker not in v488: raise SystemExit(f'Missing V488 behavior: {marker}')
          for marker in ["const BUILD_VERSION='V487'",'segmentGapsCountAsPause:true','__modSegmentActiveDurationV487']:
              if marker not in v487: raise SystemExit(f'Missing preserved V487 behavior: {marker}')
          if metrics.get('version')!='V488' or metrics.get('automated') is not True:
              raise SystemExit('Bundled metrics snapshot is not V488/automated')
          print('V488 build consistency OK')
      - name: JavaScript syntax
        run: node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check today-create-render-v480.js && node --check render-stability-v479.js && node --check remote-archive-sequence-v478.js && node --check ux-cooking-editor-v460.js && node --check time-segments-v443.js && node --check app.js
      - name: Generator produces current repository metrics
        run: |
          METRICS_OUTPUT=/tmp/development-metrics.json node scripts/generate-development-metrics.mjs >/tmp/metrics.log
          cat /tmp/metrics.log
          node - <<'NODE'
          const m=require('/tmp/development-metrics.json');
          if(m.version!=='V488'||!m.automated)throw new Error('Generated version/automation flag wrong');
          if(m.repository.currentFiles<40||m.repository.currentTextLines<10000||m.repository.currentBytes<500000)throw new Error('Generated repository metrics unexpectedly small');
          console.log('V488 generated metrics sane');
          NODE
