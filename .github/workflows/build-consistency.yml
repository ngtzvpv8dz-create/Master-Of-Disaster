name: Build Consistency Guard
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V414 archive category modal
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          css=Path('categories.css').read_text(encoding='utf-8')
          for marker in ['BUILD: V414','categories.css?v=414-1429','dev-version-v414.js?v=414-1429']:
              if marker not in index: raise SystemExit(f'Missing V414 marker: {marker}')
          if 'master-of-disaster-v414' not in sw: raise SystemExit('V414 cache missing')
          for marker in ['.modal-overlay{position:fixed','inset:0','align-items:center','justify-content:center','z-index:2000']:
              if marker not in css: raise SystemExit(f'Modal CSS missing: {marker}')
          print('V414 modal consistency OK')
