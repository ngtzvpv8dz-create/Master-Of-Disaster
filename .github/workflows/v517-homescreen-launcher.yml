name: V517 Homescreen Launcher
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  homescreen-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and wiring
        run: |
          node --check app-hub-launcher-v517.js
          node --check build-version-v517.js
          node --check running-task-render-stability-v505.js
          node --check sw.js
          test -f food-icon-v517.svg
          test -f future-icon-v517.svg
          grep -q 'app-hub-launcher-v517.css?v=517-1245' running-task-render-stability-v505.js
          grep -q 'app-hub-launcher-v517.js?v=517-1245' running-task-render-stability-v505.js
          grep -q 'build-version-v517.js?v=517-1245' running-task-render-stability-v505.js
          grep -q 'master-of-disaster-v517-homescreen-launcher' sw.js
          grep -q 'food-icon-v517.svg' sw.js
          grep -q 'future-icon-v517.svg' sw.js
      - name: Browser launcher regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v517-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg=v517',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modSportModeV510&&window.__modAppHubV515&&window.__modHubLauncherV517&&window.__modBuildVersionV517,null,{timeout:30000});
            await page.evaluate(()=>{
              const day=typeof getBerlinDateKey==='function'?getBerlinDateKey():'2026-09-09';
              tasks=[{id:51701,text:'V517 Bestandsschutz',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,activeSegments:[]}];
              if(typeof saveTasks==='function')saveTasks();
              window.__modAppHubV515.show();
              window.__modHubLauncherV517.render();
            });
            await page.waitForTimeout(450);

            const initial=await page.evaluate(()=>({
              hub:document.body.classList.contains('mod-app-hub-v515'),
              surface:document.body.dataset.modAppSurfaceV515,
              grid:document.querySelectorAll('.mod-hub-app-grid-v517').length,
              slots:[...document.querySelectorAll('.mod-hub-app-slot-v517')].map(x=>x.className),
              wideCards:document.querySelectorAll('.mod-hub-card-v515').length,
              buttons:[...document.querySelectorAll('[data-mod-hub-launch-v517]')].map(x=>x.dataset.modHubLaunchV517),
              labels:[...document.querySelectorAll('.mod-hub-app-label-v517')].map(x=>x.textContent.trim()),
              images:[...document.querySelectorAll('.mod-hub-app-icon-v517')].map(x=>({src:x.getAttribute('src'),w:x.naturalWidth,h:x.naturalHeight})),
              build:window.__modBuildVersionV517?.version,
              flags:{...window.__modHubLauncherV517},
              task:(tasks||[]).find(t=>t.id===51701)?.text
            }));
            if(!initial.hub||initial.surface!=='hub'||initial.grid!==1||initial.slots.length!==4||initial.wideCards!==0||JSON.stringify(initial.buttons)!==JSON.stringify(['todo','sport','food','future'])||initial.labels[0]!=='TO-DO'||initial.labels[1]!=='SPORT'||initial.labels[2]!=='FOOD'||initial.labels[3]!==''||initial.images.some(x=>x.w<=0||x.h<=0)||!initial.images[2].src.includes('food-icon-v517.svg')||!initial.images[3].src.includes('future-icon-v517.svg')||initial.build!=='V517'||initial.flags.homescreenStyle!==true||initial.flags.wideCardsRemoved!==true||initial.task!=='V517 Bestandsschutz')throw new Error('V517 initial '+JSON.stringify({initial,errors}));

            await page.screenshot({path:'/tmp/v517-launcher.png',fullPage:true});

            await page.click('.mod-hub-app-button-todo-v517');
            await page.waitForTimeout(220);
            const todo=await page.evaluate(()=>({surface:document.body.dataset.modAppSurfaceV515,mode:window.__modSportModeV510.currentMode(),task:(tasks||[]).find(t=>t.id===51701)?.text}));
            if(todo.surface!=='todo'||todo.mode!=='todo'||todo.task!=='V517 Bestandsschutz')throw new Error('V517 todo '+JSON.stringify(todo));

            await page.evaluate(()=>{
              window.__v517Health=[];
              window.addEventListener('mod:health-sync-request',e=>window.__v517Health.push(e.detail));
              window.__modAppHubV515.show();
              window.__modHubLauncherV517.render();
            });
            await page.waitForTimeout(180);
            await page.click('.mod-hub-app-button-sport-v517');
            await page.waitForTimeout(260);
            const sport=await page.evaluate(()=>({surface:document.body.dataset.modAppSurfaceV515,mode:window.__modSportModeV510.currentMode(),events:window.__v517Health||[],task:(tasks||[]).find(t=>t.id===51701)?.text}));
            if(sport.surface!=='sport'||sport.mode!=='sport'||sport.events.length!==1||sport.events[0].source!=='hub-sport'||sport.task!=='V517 Bestandsschutz')throw new Error('V517 sport '+JSON.stringify(sport));

            await page.evaluate(()=>{window.__modAppHubV515.show();window.__modHubLauncherV517.render();});
            await page.waitForTimeout(150);
            await page.evaluate(()=>document.querySelector('.mod-hub-app-button-food-v517')?.click());
            await page.waitForTimeout(120);
            await page.evaluate(()=>document.querySelector('.mod-hub-app-button-future-v517')?.click());
            await page.waitForTimeout(120);
            const prepared=await page.evaluate(()=>({hub:document.body.classList.contains('mod-app-hub-v515'),surface:document.body.dataset.modAppSurfaceV515,task:(tasks||[]).find(t=>t.id===51701)?.text}));
            if(!prepared.hub||prepared.surface!=='hub'||prepared.task!=='V517 Bestandsschutz')throw new Error('V517 prepared '+JSON.stringify(prepared));

            if(errors.length)throw new Error('V517 page errors '+JSON.stringify(errors));
            fs.writeFileSync('/tmp/v517-result.json',JSON.stringify({initial,todo,sport,prepared,errors},null,2));
            console.log('V517 homescreen launcher PASS');
            await browser.close();
          })().catch(error=>{fs.writeFileSync('/tmp/v517-error.txt',String(error&&error.stack||error));console.error(error);process.exit(1);});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v517-homescreen-launcher-diagnostics
          path: |
            /tmp/v517-result.json
            /tmp/v517-error.txt
            /tmp/v517-launcher.png
            /tmp/mod-v517-http.log
          if-no-files-found: ignore
