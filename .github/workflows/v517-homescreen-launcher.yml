name: V540 Launcher Regression
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Current launcher wiring
        run: |
          node --check app-hub-launcher-v517.js
          node --check backstage-v530.js
          node --check sw.js
          for f in todo sport kistology food backstage; do test -f "assets/icons/${f}-v524-192.png"; done
          test -f assets/icons/progress-v540-192.png
          grep -q "const VERSION='V540'" app-hub-launcher-v517.js
          grep -q "progress:'./assets/icons/progress-v540-192.png?v=540-progress'" app-hub-launcher-v517.js
          grep -q "{id:'progress',label:'PROGRESS',active:false}" app-hub-launcher-v517.js
          grep -q '__modHubLauncherV540' app-hub-launcher-v517.js
          grep -q 'progressIconV540:true' app-hub-launcher-v517.js
          grep -q '"./assets/icons/progress-v540-192.png"' sw.js
          grep -q 'master-of-disaster-v540-progress-hub' sw.js
      - name: Validate current launcher PNG assets
        run: |
          python3 -m pip install --disable-pip-version-check pillow >/dev/null 2>&1
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          paths=[
              Path('assets/icons/todo-v524-192.png'),
              Path('assets/icons/sport-v524-192.png'),
              Path('assets/icons/kistology-v524-192.png'),
              Path('assets/icons/food-v524-192.png'),
              Path('assets/icons/progress-v540-192.png'),
              Path('assets/icons/backstage-v524-192.png'),
          ]
          for path in paths:
              data=path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG signature: {path}')
              if len(data) > 100000:
                  raise SystemExit(f'Icon too large: {path} -> {len(data)} bytes')
              with Image.open(path) as im:
                  im.load()
                  if im.format!='PNG' or im.size!=(192,192):
                      raise SystemExit(f'Invalid icon: {path} -> {im.format} {im.size}')
              print(f'{path}: PASS ({len(data)} bytes)')
          PY
      - name: Browser launcher regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-v540-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/',{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__modAppHubV515&&window.__modHubLauncherV540&&window.__modBackstageV530,null,{timeout:30000});
            await page.evaluate(()=>{
              window.__modAppHubV515.show();
              window.__modHubLauncherV540.render();
              window.__modBackstageV530.patchLauncher();
            });
            await page.waitForFunction(()=>document.getElementById('modAppHubV515')?.dataset.modHubAssetsV520==='ready',null,{timeout:10000});
            await page.waitForTimeout(180);
            const state=await page.evaluate(()=>({
              version:window.__modHubLauncherV540.version,
              buttons:[...document.querySelectorAll('[data-mod-hub-launch-v517]')].map(x=>x.dataset.modHubLaunchV517),
              labels:[...document.querySelectorAll('.mod-hub-app-label-v517')].map(x=>x.textContent.trim()),
              images:[...document.querySelectorAll('.mod-hub-app-icon-v517')].map(x=>({src:x.getAttribute('src'),w:x.naturalWidth,h:x.naturalHeight,complete:x.complete})),
              progressSource:window.__modHubLauncherV540.sources.progress,
              progressFlag:window.__modHubLauncherV540.progressIconV540,
              hub:document.body.classList.contains('mod-app-hub-v515')
            }));
            const ids=['todo','sport','kistology','food','progress','backstage'];
            const labels=['TO-DO','SPORT','KISTOLOGY','FOOD','PROGRESS','BACKSTAGE'];
            if(state.version!=='V540'||JSON.stringify(state.buttons)!==JSON.stringify(ids)||JSON.stringify(state.labels)!==JSON.stringify(labels)||state.images.length!==6||state.images.some(x=>!x.complete||x.w!==192||x.h!==192)||!state.progressSource.includes('progress-v540-192.png')||!state.progressFlag||!state.hub||errors.length){
              throw new Error('V540 launcher mismatch '+JSON.stringify({state,errors}));
            }
            fs.writeFileSync('/tmp/v540-launcher-result.json',JSON.stringify({state,errors},null,2));
            console.log('V540 LAUNCHER PASS');
            await browser.close();
          })().catch(error=>{fs.writeFileSync('/tmp/v540-launcher-error.txt',String(error&&error.stack||error));console.error(error);process.exit(1);});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v540-launcher-diagnostics
          path: |
            /tmp/v540-launcher-result.json
            /tmp/v540-launcher-error.txt
            /tmp/mod-v540-http.log
          if-no-files-found: ignore
