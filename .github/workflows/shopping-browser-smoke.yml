name: V1 Shopping Browser Smoke
on:
  push:
    branches:
      - main
      - fix/v1-browser-and-ci-20261118
    paths:
      - index.html
      - area-runtime-v609.js
      - food-v544.js
      - shopping-v678.js
      - tests/shopping-ui-browser-v1.cjs
      - .github/workflows/shopping-browser-smoke.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - area-runtime-v609.js
      - food-v544.js
      - shopping-v678.js
      - tests/shopping-ui-browser-v1.cjs
      - .github/workflows/shopping-browser-smoke.yml
permissions:
  contents: read
jobs:
  browser:
    name: Actual V1 page in Chromium + WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers and dependencies
        run: |
          npm init -y
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium webkit
      - name: Load real index.html + Food + Shopping in browsers
        run: node tests/shopping-ui-browser-v1.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-shopping-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
