name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check remote-commands.js && node --check theme-editor-help-stability-v470.js && node --check theme-editor-help-v469.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - name: Verify V473 grouping and drag wiring
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8');sw=Path('sw.js').read_text(encoding='utf-8');js=Path('category-group-drag-v473.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V473','category-group-drag-v473.js?v=473-1215',"version:'V473'",'modV473CategoryGroupingDone']:
              if marker not in html: raise SystemExit(f'Missing V473 HTML marker: {marker}')
          for marker in ['master-of-disaster-v473-category-grouping-drag-feedback','category-group-drag-v473.js']:
              if marker not in sw: raise SystemExit(f'Missing V473 SW marker: {marker}')
          for marker in ['REIHENFOLGE','GRUPPIERT','task-category-group-v473','task-category-head-v473','OHNE KATEGORIE','todayDragGroupedDisabled:true','POSITION ${preview.position} / ${preview.total}','drag-insert-before-v473','drag-insert-after-v473','groupingIsViewOnly:true','__modCategoryGroupDragV473']:
              if marker not in js: raise SystemExit(f'Missing V473 behavior marker: {marker}')
          print('V473 grouping/drag wiring OK')
      - name: Verify V473 view-only grouping state and drop positions
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();
          global.window=global;global.currentTab='today';global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};
          global.document={addEventListener(){},getElementById(){return null}};global.addEventListener=()=>{};global.setTimeout=()=>0;global.render=()=>{};global.getBerlinDateKey=()=> '2026-08-22';
          global.tasks=[
            {id:1,text:'Bad wischen',category:'Böden wischen',todayDate:'2026-08-22',todayOrder:1,status:'open'},
            {id:2,text:'Flur aufräumen',category:'Flur',todayDate:'2026-08-22',todayOrder:2,status:'open'},
            {id:3,text:'Flur wischen',category:'Böden wischen',todayDate:'2026-08-22',todayOrder:3,status:'open'},
            {id:4,text:'Küche wischen',category:'Böden wischen',todayDate:'2026-08-22',todayOrder:4,status:'open'}
          ];
          eval(fs.readFileSync('category-group-drag-v473.js','utf8'));
          const api=window.__modCategoryGroupDragV473,before=tasks.map(t=>t.todayOrder).join(',');
          if(!api.groupingIsViewOnly||!api.todayDragGroupedDisabled||!api.livePosition||!api.insertionLine)throw new Error('V473 capability flags missing');
          api.setMode('today','grouped');if(api.modeFor('today')!=='grouped')throw new Error('Grouped mode not stored');
          if(tasks.map(t=>t.todayOrder).join(',')!==before)throw new Error('Grouping changed todayOrder');
          const down=api.getDropPreview(1,4);if(!down||down.position!==4||down.side!=='after'||down.total!==4)throw new Error('Downward drop preview wrong');
          const up=api.getDropPreview(4,2);if(!up||up.position!==2||up.side!=='before')throw new Error('Upward drop preview wrong');
          api.setMode('today','order');if(api.modeFor('today')!=='order')throw new Error('Order mode not restored');
          if(tasks.map(t=>t.todayOrder).join(',')!==before)throw new Error('Mode switch changed todayOrder');
          console.log('V473 view-only grouping and drop positions OK');
          NODE
      - name: Verify preserved V472 exact A255 deletion
        run: |
          node <<'NODE'
          const fs=require('fs');global.window=global;global.navigator={onLine:false};global.addEventListener=()=>{};global.document={addEventListener:()=>{},visibilityState:'visible'};global.setTimeout=()=>0;global.setInterval=()=>0;global.clearInterval=()=>{};
          global.archive=[{archiveNumber:254,text:'Vorher'},{archiveNumber:255,text:'Falsches Kochen'}];global.nextArchiveNumber=256;let saved=0;global.saveArchive=()=>saved++;global.render=()=>{};
          eval(fs.readFileSync('remote-archive-maintenance-v472.js','utf8'));const r=window.__modRemoteArchiveMaintenanceV472.deleteArchiveEntry(255);
          if(archive.some(x=>Number(x.archiveNumber)===255)||nextArchiveNumber!==255||r.next_archive_number!==255||saved!==1)throw new Error('Preserved A255 deletion failed');
          console.log('V472 archive maintenance preserved');
          NODE
      - name: Verify preserved V460 passive cooking concurrency
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();global.window=global;global.addEventListener=()=>{};global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};global.currentTab='all';const classList={add(){},remove(){},toggle(){}};
          global.document={getElementById(){return null},querySelector(){return null},querySelectorAll(){return []},createElement(){return {style:{setProperty(){},removeProperty(){}},classList,appendChild(){},remove(){},querySelector(){return null},querySelectorAll(){return []}}},head:{appendChild(){}},body:{appendChild(){},classList}};global.MutationObserver=class{observe(){} disconnect(){}};
          global.tasks=[{id:1,text:'Kochen',type:'cooking',status:'open',activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:2,text:'Arbeit',type:'work',status:'open',activeSegments:[],pauseTotalMs:0}];global.archive=[];global.getTask=id=>tasks.find(t=>t.id===id);global.saveTasks=()=>{};global.render=()=>{};global.switchTab=()=>{};global.normalizeTodayOrder=()=>{};global.closeModal=()=>{};global.showInfoModal=()=>{};global.getBerlinDateKey=()=> '2026-08-22';global.getBerlinDateKeyFromISO=()=> '2026-08-22';global.escapeHtml=s=>String(s);global.section=()=>({});global.dynamicNumber=()=>1;global.statusSymbol=()=>'';global.formatDuration=ms=>String(ms);global.formatISOForDateTimeLocal=s=>s;global.berlinLocalInputToISO=s=>s;global.showMissingCompletionDuration=()=>{};global.startTask=()=>{};global.pauseTask=()=>{};global.resumeTask=()=>{};global.finishTask=()=>{};global.abortTask=()=>{};global.askManualTimes=()=>{};global.saveManualTimes=()=>{};global.addManualSegmentV443=()=>{};global.removeManualSegmentV443=()=>{};global.readSegmentsFromDomV443=()=>[];global.refreshSegmentTotalV443=()=>{};global.saveManualSegmentsAndCompleteV445=()=>{};
          eval(fs.readFileSync('ux-cooking-editor-v460.js','utf8'));startTask(1);switchCookingMode(1,'passive');startTask(2);if(tasks[1].status!=='running')throw new Error('Parallel cooking work blocked');console.log('Cooking concurrency OK');
          NODE
