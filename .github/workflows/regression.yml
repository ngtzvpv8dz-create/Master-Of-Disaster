name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check app.js
      - name: Verify V488 wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('historical-segment-breakdown-v488.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V488','historical-segment-breakdown-v488.js?v=488-1616',"version:'V488'",'modV488HistoricalBreakdownDone']:
              if marker not in html: raise SystemExit(f'Missing V488 HTML marker: {marker}')
          for marker in ['master-of-disaster-v488-historical-segment-breakdown','historical-segment-breakdown-v488.js']:
              if marker not in sw: raise SystemExit(f'Missing V488 SW marker: {marker}')
          for marker in ['historicalProgressPreserved:true','pausesExcludedFromSegmentActive:true','legacyLiveTickerDetached:true','segmentMetrics','patchVisibleCards']:
              if marker not in js: raise SystemExit(f'Missing V488 behavior marker: {marker}')
          if metrics.get('version')!='V488' or metrics.get('automated') is not True:
              raise SystemExit('Expected V488 automated metrics snapshot')
          print('V488 wiring OK')
      - name: Verify V487 calculation preserved
        run: |
          node <<'NODE'
          const fs=require('fs');global.window=global;global.calculateActiveDuration=()=>0;
          eval(fs.readFileSync('segment-active-duration-v487.js','utf8'));
          const task={status:'paused',importedHistoricalProgressDurationMs:8760000,activeSegments:[
            {startedAt:'2026-08-23T08:00:00Z',endedAt:'2026-08-23T09:00:00Z'},
            {startedAt:'2026-08-23T10:00:00Z',endedAt:'2026-08-23T10:48:00Z'},
            {startedAt:'2026-08-23T12:14:00Z',endedAt:'2026-08-23T12:54:00Z'}
          ]};
          const total=calculateActiveDuration(task,Date.parse('2026-08-23T12:54:00Z'));
          if(total!==17640000)throw new Error(`Expected preserved historical+segment total 04:54:00, got ${total}`);
          console.log('V487 accounting preserved');
          NODE
      - name: Browser regression V488
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:640}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V488'&&window.__modHistoricalSegmentBreakdownV488&&window.__modSegmentActiveDurationV487&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485,{timeout:30000});

            await page.evaluate(()=>{
              tasks=[{id:217,text:'Kisten sortieren',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:null,todayOrder:null,
                importedHistoricalProgressDurationMs:8760000,historicalAlreadyArchivedDurationMs:3360000,
                startedAt:'2026-08-23T08:00:00Z',pausedAt:'2026-08-23T12:54:00Z',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,
                activeSegments:[
                  {startedAt:'2026-08-23T08:00:00Z',endedAt:'2026-08-23T09:00:00Z'},
                  {startedAt:'2026-08-23T10:00:00Z',endedAt:'2026-08-23T10:48:00Z'},
                  {startedAt:'2026-08-23T12:14:00Z',endedAt:'2026-08-23T12:54:00Z'}
                ]}];archive=[];nextArchiveNumber=265;saveTasks();saveArchive();switchTab('all');render();
            });
            await page.waitForTimeout(120);
            const state=await page.evaluate(()=>{
              const task=tasks[0],m=window.__modHistoricalSegmentBreakdownV488.segmentMetrics(task);
              const el=document.querySelector('.task .duration');
              return {card:el?.innerText||'',segments:m.activeMs,history:m.historicalMs,total:m.totalActiveMs,gaps:m.gapMs,calc:liveDuration(task),liveKind:el?.getAttribute('data-live-kind')||null};
            });
            if(state.segments!==8880000)throw new Error(`Segment active time wrong: ${state.segments}`);
            if(state.history!==8760000)throw new Error(`Historical active time wrong: ${state.history}`);
            if(state.total!==17640000||state.calc!==17640000)throw new Error('Total active accounting must remain 04:54:00');
            if(state.gaps!==8760000)throw new Error(`Expected 02:26:00 segment gaps, got ${state.gaps}`);
            if(state.liveKind!==null)throw new Error('V488 card is still attached to legacy data-live-kind ticker');
            const expectedCard=['AKTIV · 02:28:00','HISTORISCH · 02:26:00','GESAMT AKTIV · 04:54:00','PAUSEN ZWISCHEN SEGMENTEN · 02:26:00 · NICHT ENTHALTEN'];
            for(const expected of expectedCard){if(!state.card.includes(expected))throw new Error(`Card breakdown missing ${expected}: ${state.card}`);}
            await page.waitForTimeout(1250);
            const stableCard=await page.locator('.task .duration').innerText();
            for(const expected of expectedCard){if(!stableCard.includes(expected))throw new Error(`Live ticker overwrote V488 card after 1.25s: ${stableCard}`);}

            await page.evaluate(()=>askManualTimes(217));await page.waitForTimeout(80);
            const editor=await page.locator('#segmentTotalV443').innerText();
            for(const expected of ['AKTIVE SEGMENTE · 02:28:00','HISTORISCHER FORTSCHRITT · 02:26:00','AKTIVE GESAMTZEIT · 04:54:00','PAUSEN ZWISCHEN SEGMENTEN · 02:26:00 · NICHT ENTHALTEN']){
              if(!editor.includes(expected))throw new Error(`Editor breakdown missing ${expected}: ${editor}`);
            }
            await page.getByRole('button',{name:'Zurück'}).click();

            await page.evaluate(()=>{tasks=[{id:4861,text:'Kochen',type:'cooking',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-23T12:00:00Z',pausedAt:'2026-08-23T12:20:00Z',pauseTotalMs:0,cookingMode:'passive',activeSegments:[{startedAt:'2026-08-23T12:00:00Z',endedAt:'2026-08-23T12:05:00Z'}],cookingSegments:[{mode:'active',startedAt:'2026-08-23T12:00:00Z',endedAt:'2026-08-23T12:05:00Z'},{mode:'passive',startedAt:'2026-08-23T12:05:00Z',endedAt:'2026-08-23T12:20:00Z'}]}];saveTasks();askManualTimes(4861);});
            await page.getByRole('button',{name:/KOCHABSCHNITT HINZUFÜGEN/i}).click();await page.waitForTimeout(120);
            const modal=await page.evaluate(()=>{const m=document.querySelector('.segment-editor-modal'),a=m?.querySelector('.modal-actions');return m&&a?{rows:document.querySelectorAll('#segmentRowsV443 [data-segment-row]').length,overflow:getComputedStyle(m).overflowY,sticky:getComputedStyle(a).position}:null;});
            if(!modal||modal.rows!==3||modal.overflow!=='auto'||modal.sticky!=='sticky')throw new Error('V486 scroll regression');
            console.log('V488 browser regression OK');await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
