name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check ui-card-stability-v491.js && node --check nested-task-weight-layout-v490.js && node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check live-log-v453.js && node --check app.js
      - name: Verify V491 wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          v491=Path('ui-card-stability-v491.js').read_text(encoding='utf-8')
          v490=Path('nested-task-weight-layout-v490.js').read_text(encoding='utf-8')
          v488=Path('historical-segment-breakdown-v488.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V491','ui-card-stability-v491.js?v=491-1926',"version:'V491'",'modV491CardStabilityDone']:
              if marker not in html: raise SystemExit(f'Missing V491 HTML marker: {marker}')
          for marker in ['master-of-disaster-v491-card-stability-controls','ui-card-stability-v491.js','nested-task-weight-layout-v490.js']:
              if marker not in sw: raise SystemExit(f'Missing V491 SW marker: {marker}')
          for marker in ['dragHandleReplacedByArrows:true','actionsAlwaysBottom:true','todayActionAfterClock:true','todayIconConsistentAcrossStatuses:true','selectedTodayUsesCalendarPin:true','stableCardLayout:true','controlsReuseDomNodes:true']:
              if marker not in v491: raise SystemExit(f'Missing V491 behavior marker: {marker}')
          for marker in ['periodicDomRewriteRemoved:true','subSecondSegmentsHidden:true','nestedSegmentWeight:true']:
              if marker not in v490: raise SystemExit(f'Missing updated V490 behavior: {marker}')
          for marker in ['cardPauseLineRemoved:true','nestedWeightPreservedOnTicker:true','unchangedCardsDoNotRewriteDom:true']:
              if marker not in v488: raise SystemExit(f'Missing V488 stability behavior: {marker}')
          if metrics.get('version')!='V491' or metrics.get('automated') is not True:
              raise SystemExit('Expected V491 automated metrics snapshot')
          print('V491 wiring OK')
      - name: Browser regression V491
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V491'&&window.__modUiCardStabilityV491&&window.__modNestedTaskWeightLayoutV490&&window.__modHistoricalSegmentBreakdownV488&&window.__modTodayWorkBlocksV474,{timeout:30000});

            await page.evaluate(()=>{
              const day=getBerlinDateKey();
              localStorage.removeItem(window.__modTodayWorkBlocksV474.storageKey);
              tasks=[
                {id:4911,text:'Kisten sortieren V491',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,todayWorkBlockId:null,importedHistoricalProgressDurationMs:8760000,historicalAlreadyArchivedDurationMs:0,startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T16:10:00.900+02:00',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,activeSegments:[
                  {startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},
                  {startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},
                  {startedAt:'2026-08-23T15:30:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'},
                  {startedAt:'2026-08-23T16:10:00+02:00',endedAt:'2026-08-23T16:10:00.900+02:00'}
                ]},
                {id:4912,text:'Büro wischen V491',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:2,todayWorkBlockId:null,startedAt:null,pausedAt:null,pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,activeSegments:[]}
              ];
              weightPhases=[
                {id:9201,weightKg:12.3,startedAt:'2026-08-23T13:10:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},
                {id:9202,weightKg:12.3,startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},
                {id:9203,weightKg:8,startedAt:'2026-08-23T15:40:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}
              ];
              weightState={isWearing:false,currentWeightKg:8};archive=[];nextArchiveNumber=1;
              saveTasks();saveArchive();saveWeight();
              window.__modTodayWorkBlocksV474.ensureTodayModel(day,[]);saveTasks();
              switchTab('all');render();
            });
            await page.waitForTimeout(500);
            const allCard=page.locator('.task',{hasText:'Kisten sortieren V491'}).first();
            const allText=await allCard.innerText();
            for(const expected of ['AKTIV · 02:15:00','+ HISTORISCH · 02:26:00','= GESAMT AKTIV · 04:41:00','↳ 🏋️ DAVON 01:55:00 MIT ZUSATZGEWICHT','13:00:00–14:00:00 · 01:00:00','↳ 🏋️ INKL. ZUSATZGEWICHT · 13:10:00–14:00:00','00:50:00 · 12,3 kg','14:15:00–15:00:00 · 00:45:00','↳ 🏋️ INKL. ZUSATZGEWICHT · 12,3 kg','HISTORISCH · 02:26:00']){
              if(!allText.includes(expected))throw new Error(`V491 ALL card missing ${expected}: ${allText}`);
            }
            if(allText.includes('PAUSEN ZWISCHEN SEGMENTEN'))throw new Error('Card still shows segment-gap line: '+allText);
            if(allText.includes('16:10:00'))throw new Error('Sub-second segment still visible: '+allText);

            const initial=await allCard.evaluate(card=>{
              const host=card.querySelector('.task-content'),actions=card.querySelector('.icon-actions'),hist=card.querySelector('.historical-segment-duration-v488'),overall=card.querySelector('.v490-overall-weight');
              const buttons=[...actions.querySelectorAll('button')],clock=buttons.findIndex(b=>b.dataset.iconV416==='clock'),today=buttons.findIndex(b=>b.dataset.v480TodayAction==='1');
              return {height:card.getBoundingClientRect().height,html:card.innerHTML,overall:overall?.textContent.trim()||'',pause:hist?.querySelectorAll('.v488-pause').length||0,actionsLast:host?.lastElementChild===actions,clock,today,todayIcon:buttons[today]?.dataset.iconV416||null};
            });
            if(!initial.actionsLast||initial.pause!==0||initial.clock<0||initial.today!==initial.clock+1||initial.todayIcon!=='calendarPin')throw new Error('ALL action hierarchy wrong: '+JSON.stringify(initial));
            await page.waitForTimeout(2200);
            const stable=await allCard.evaluate(card=>({height:card.getBoundingClientRect().height,html:card.innerHTML,overall:card.querySelector('.v490-overall-weight')?.textContent.trim()||''}));
            if(Math.abs(stable.height-initial.height)>0.5||stable.html!==initial.html||stable.overall!==initial.overall)throw new Error('Kisten sortieren card still hops/rewrites after ticker: '+JSON.stringify({initial:{height:initial.height,overall:initial.overall},stable:{height:stable.height,overall:stable.overall}}));

            // Pauseninformation bleibt im manuellen Zeit-Editor erhalten.
            await page.evaluate(()=>askManualTimes(4911));await page.waitForTimeout(100);
            const editor=await page.locator('#segmentTotalV443').innerText();
            if(!editor.includes('PAUSEN ZWISCHEN SEGMENTEN'))throw new Error('Segment editor lost pause information: '+editor);
            await page.getByRole('button',{name:'Zurück'}).click();

            // HEUTE: kein Drag-Griff mehr, volle Breite, Pfeile, gleiche Kalender-Pin-Symbolik.
            await page.evaluate(()=>{switchTab('today');render();});await page.waitForTimeout(650);
            const paused=page.locator('.today-task-active',{hasText:'Kisten sortieren V491'}).first();
            const open=page.locator('.today-task-active',{hasText:'Büro wischen V491'}).first();
            if(!(await paused.count())||!(await open.count()))throw new Error('Today task cards missing');
            const todayState=await paused.evaluate(card=>{
              const actions=card.querySelector('.icon-actions'),host=card.querySelector('.task-content'),buttons=[...actions.querySelectorAll('button')];
              const clock=buttons.findIndex(b=>b.dataset.iconV416==='clock'),today=buttons.findIndex(b=>b.dataset.v480TodayAction==='1');
              const partial=card.querySelector('.v490-weight-partial');
              const number=card.querySelector('.task-number'),status=card.querySelector('.status-symbol'),content=card.querySelector('.task-content');
              return {drag:card.querySelectorAll('.drag-handle').length,up:card.querySelectorAll('.v491-order-up').length,down:card.querySelectorAll('.v491-order-down').length,actionsLast:host.lastElementChild===actions,clock,today,todayIcon:buttons[today]?.dataset.iconV416||null,partialHeight:partial?.getBoundingClientRect().height||0,partialScroll:partial?.scrollWidth||0,partialClient:partial?.clientWidth||0,numberLeft:number?.getBoundingClientRect().left||0,statusLeft:status?.getBoundingClientRect().left||0,contentLeft:content?.getBoundingClientRect().left||0};
            });
            if(todayState.drag!==0||todayState.up!==1||todayState.down!==1||!todayState.actionsLast)throw new Error('Today grip/arrows/action-row wrong: '+JSON.stringify(todayState));
            if(todayState.clock<0||todayState.today!==todayState.clock+1||todayState.todayIcon!=='calendarPin')throw new Error('Today calendar position/icon wrong: '+JSON.stringify(todayState));
            if(todayState.partialHeight>13||todayState.partialScroll>todayState.partialClient+1)throw new Error('Partial weight line wraps in Today: '+JSON.stringify(todayState));
            if(!(todayState.numberLeft<todayState.statusLeft&&todayState.statusLeft<todayState.contentLeft))throw new Error('Task number did not return to left edge: '+JSON.stringify(todayState));
            const openIcon=await open.evaluate(card=>card.querySelector('button[data-v480-today-action="1"]')?.dataset.iconV416||null);
            if(openIcon!=='calendarPin'||openIcon!==todayState.todayIcon)throw new Error('Pinned icon differs by status: '+JSON.stringify({paused:todayState.todayIcon,open:openIcon}));

            // Pfeil nach unten verschiebt die erste Heute-Aufgabe tatsächlich um eine Position.
            const beforeOrder=await page.evaluate(()=>window.__modTodayWorkBlocksV474.orderedByBlocks(getBerlinDateKey()).rows.map(x=>x.id));
            if(beforeOrder[0]!==4911||beforeOrder[1]!==4912)throw new Error('Unexpected initial Today order: '+JSON.stringify(beforeOrder));
            await paused.locator('.v491-order-down').click();await page.waitForTimeout(500);
            const afterDown=await page.evaluate(()=>window.__modTodayWorkBlocksV474.orderedByBlocks(getBerlinDateKey()).rows.map(x=>x.id));
            if(afterDown[0]!==4912||afterDown[1]!==4911)throw new Error('Down arrow did not reorder task: '+JSON.stringify(afterDown));
            const moved=page.locator('.today-task-active',{hasText:'Kisten sortieren V491'}).first();
            await moved.locator('.v491-order-up').click();await page.waitForTimeout(500);
            const afterUp=await page.evaluate(()=>window.__modTodayWorkBlocksV474.orderedByBlocks(getBerlinDateKey()).rows.map(x=>x.id));
            if(afterUp[0]!==4911||afterUp[1]!==4912)throw new Error('Up arrow did not restore task order: '+JSON.stringify(afterUp));

            // Archiv-V490 und Log bleiben kompakt erhalten.
            await page.evaluate(()=>{
              archive=[{archiveNumber:1,archiveId:'v491-a1',text:'Archiv V491',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:'2026-08-22T13:00:00+02:00',completedAt:'2026-08-22T14:00:00+02:00',activeDurationMs:3600000,archiveAccountingActiveDurationMs:3600000,actualDurationMs:3600000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00'}],historicalWeightKg:12.3,weightedActiveDurationMs:3600000,weightActiveSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00',historicalWeightKg:12.3}]}];nextArchiveNumber=2;saveArchive();switchTab('archive');render();
            });await page.waitForTimeout(350);
            const archiveStyle=await page.locator('.archive-task',{hasText:'Archiv V491'}).first().evaluate(card=>({font:[...card.querySelectorAll('.task-detail-v490>div')].map(el=>getComputedStyle(el).fontSize),old:card.querySelectorAll('.archive-task-weight-details,.archive-task-weight,.task-detail-v489').length,text:card.innerText}));
            if(archiveStyle.font.some(x=>x!=='8.5px')||archiveStyle.old!==0||!archiveStyle.text.includes('INKL. ZUSATZGEWICHT'))throw new Error('Archive V490 preservation failed: '+JSON.stringify(archiveStyle));
            await page.evaluate(()=>{window.__modLiveLogV453.clear();window.__modLiveLogV453.append('TASK','INFO','V491 Log Test');switchTab('log');});await page.waitForTimeout(120);
            const logFont=await page.evaluate(()=>getComputedStyle(document.querySelector('.log-message-v453')).fontSize);
            if(logFont!=='8.5px')throw new Error('Compact log regressed: '+logFont);

            const preserved=await page.evaluate(()=>!!(window.__modNestedTaskWeightLayoutV490&&window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modRemoteArchiveSequenceV478));
            if(!preserved)throw new Error('Preserved V490/V489/V488/V486/V485/V484/V478 module missing');
            console.log('V491 browser regression OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
