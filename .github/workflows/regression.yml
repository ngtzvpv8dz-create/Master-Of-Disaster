name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and wiring
        run: |
          node --check app.js
          node --check app-hub-v515.js
          node --check app-hub-launcher-v603.js
          node --check surface-header-v603.js
          node --check service-worker-gate-v611.js
          node --check area-runtime-v609.js
          node --check food-v544.js
          node --check kistology-v603.js
          node --check log-core-v603.js
          node --check todo-stability-v603.js
          node --check history-safety-net-v498.js
          node --check backup-stability-v506.js
          node --check backup-model-v600.js
          node --check backup-source-fallback-v506.js
          node --check task-title-library-v507.js
          node --check archive-weight-layout-v508.js
          node --check summary-weight-due-polish-v494.js
          node --check build-freshness-v502.js
          node tests/v503-today-interaction.test.cjs
          grep -q 'service-worker-gate-v611.js?v=611-worker-gate' index.html
          grep -q 'area-runtime-v609.js?v=621-sport-phase-summary-loader' index.html
          grep -q 'backstage-section-loader-v609.css?v=609-sections' index.html
          grep -q 'area-loader-v608.css?v=608-staged' index.html
          grep -q 'app-hub-launcher-v603.js?v=603-loader' index.html
          grep -q 'surface-header-v603.js?v=603-header' index.html
          grep -q 'kistology-v603.css?v=603' index.html
          ! grep -q "serviceWorker.register('./sw.js" index.html
          grep -q 'log-core-v603.js' area-runtime-v609.js
          grep -q 'history-safety-net-v498.js' area-runtime-v609.js
          grep -q 'backup-model-v600.js' area-runtime-v609.js
          grep -q 'app-hub-launcher-v603.js' sw.js
          grep -q 'surface-header-v603.js' sw.js
          grep -q 'service-worker-gate-v611.js' sw.js
          grep -q 'area-runtime-v609.js' sw.js
          grep -q 'backstage-section-loader-v609.css' sw.js
          grep -q 'MOD_GET_SW_VERSION' sw.js
          grep -q 'MOD_WARM_URLS' sw.js
          grep -q "preloadMode:'worker-warm-staged-heavy-execution'" area-runtime-v609.js
          grep -Fq "new Set(['todo','backstage'])" area-runtime-v609.js
          grep -q 'browserBreather' area-runtime-v609.js
          grep -q 'recoveryDeferred:true' area-runtime-v609.js
          grep -q 'backstageLogDeferred:true' area-runtime-v609.js
          grep -q 'await ensureWorkerGate()' area-runtime-v609.js
          grep -q 'dbReconnectV506:true' history-safety-net-v498.js
          grep -q 'iosBackupHandoffV506:true' history-safety-net-v498.js
          grep -q 'codeloadBypassed:true' backup-source-fallback-v506.js
          grep -q 'rawGithubFileFallback:true' backup-source-fallback-v506.js
          grep -q 'todayMarkerBoundToButton:true' todo-stability-v603.js
          grep -q 'explicitNewCategoryWins:true' todo-stability-v603.js
          grep -q 'fullViewTickerRemoved:true' todo-stability-v603.js
          grep -q 'legacySportHubBootstrapRemoved:true' todo-stability-v603.js
          grep -q 'knownOnlySuggestions:true' task-title-library-v507.js
          grep -q 'archiveUsesTaskSegmentHierarchy:true' archive-weight-layout-v508.js
          grep -q 'noStoreFetch:true' build-freshness-v502.js
      - name: Browser regression current build
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-http.log 2>&1 &
          node <<'NODE'
          const {chromium,webkit}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.on('pageerror',error=>console.error('PAGEERROR',error.message));
            page.on('requestfailed',request=>console.error('REQUESTFAILED',request.url(),request.failure()?.errorText));
            page.on('response',response=>{if(/v608|area-runtime|worker-gate/.test(response.url()))console.log('V608 RESPONSE',response.status(),response.url());});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1000);
            const early=await page.evaluate(()=>({
              runtime:!!window.__modAreaRuntimeV609,
              gate:!!window.__modWorkerGateV611,
              scripts:[...document.scripts].map(script=>script.src).filter(Boolean),
              resources:performance.getEntriesByType('resource').map(entry=>entry.name).filter(name=>/v611|area-runtime|worker-gate/.test(name))
            }));
            if(!early.runtime)throw new Error('V609 runtime script missing '+JSON.stringify(early));
            const bootResult=await page.evaluate(()=>window.__modAreaRuntimeV609.preloadAll());
            const bootState=await page.evaluate(()=>({ready:window.__modAreaRuntimeV609?.ready,progress:window.__modAreaRuntimeV609?.progress,gate:window.__modWorkerGateV611?.status||null}));
            if(bootResult!==true||bootState.ready!==true)throw new Error('V609 local bootstrap failed '+JSON.stringify({bootResult,bootState}));
            const preloadOnly=await page.evaluate(()=>({
              mode:window.__modAreaRuntimeV609?.preloadMode,
              executed:window.__modAreaRuntimeV609?.executedCount,
              renderType:typeof window.render,
              kistology:!!window.__modKistologyV603,
              food:!!window.__modFoodV544,
              backstage:!!window.__modBackstageV531
            }));
            if(preloadOnly.mode!=='worker-warm-staged-heavy-execution'||preloadOnly.executed!==0||preloadOnly.renderType==='function'||preloadOnly.kistology||preloadOnly.food||preloadOnly.backstage)throw new Error('V609 preload executed area modules '+JSON.stringify(preloadOnly));
            await page.evaluate(()=>{
              window.__v609Progress=[];
              window.addEventListener('mod:bootstrap-v609-progress',event=>window.__v609Progress.push(event.detail));
            });
            const todoStarted=Date.now();
            await page.evaluate(()=>window.__modAreaRuntimeV609.openArea('todo'));
            const todoElapsed=Date.now()-todoStarted;
            await page.waitForFunction(()=>window.__modTodoStabilityV603&&window.__modTaskTitleLibraryV507&&window.__modArchiveWeightLayoutV508&&window.__modTodayWorkBlocksV474&&window.__modTodayCreateRenderV480,{timeout:45000});
            const todoStage=await page.evaluate(()=>({
              progress:(window.__v609Progress||[]).filter(x=>x?.phase==='area'&&x?.areaLoading==='todo'),
              historyLoaded:!!window.__modRecoveryHistoryV498,
              backupLoaded:!!window.__modBackupModelV600,
              staged:window.__modAreaRuntimeV609?.stagedHeavyAreas||[],
              recoveryDeferred:window.__modAreaRuntimeV609?.recoveryDeferred,
              backstageLogDeferred:window.__modAreaRuntimeV609?.backstageLogDeferred
            }));
            if(todoElapsed<2500||todoStage.progress.length<10||!todoStage.progress.some(x=>/Modul \d+ von \d+/.test(x.label||''))||todoStage.historyLoaded||todoStage.backupLoaded||!todoStage.staged.includes('todo')||!todoStage.staged.includes('backstage')||!todoStage.recoveryDeferred||!todoStage.backstageLogDeferred)throw new Error('V609 staged To Do regression '+JSON.stringify({todoElapsed,todoStage}));
            await page.evaluate(()=>window.__modAreaRuntimeV609.loadSection('backup'));
            await page.waitForFunction(()=>window.__modSummaryWeightDuePolishV494&&window.__modUiAlignmentV493&&window.__modTodayActionOrderV501&&window.__modTodayInteractionStabilityV503&&window.__modCategoryCreateStabilityV504&&window.__modRunningTaskRenderStabilityV505&&window.__modRecoveryHistoryV498&&window.__modBackupStabilityV506&&window.__modBackupSourceFallbackV506?.patchRevision==='V506.3'&&window.__modTaskTitleLibraryV507&&window.__modArchiveWeightLayoutV508,{timeout:60000});
            const day=await page.evaluate(()=>getBerlinDateKey());
            const directTodayCreate=await page.evaluate(day=>{
              localStorage.removeItem(window.__modTodayWorkBlocksV474.storageKey);
              tasks=[];archive=[];nextArchiveNumber=1;saveTasks();saveArchive();switchTab('all');render();
              window.__modTodayCreateRenderV480.setNewTaskToday(true);
              const input=document.getElementById('taskInput');
              if(!input)throw new Error('V628 task input missing');
              input.value='V628 Direkt Heute Arbeitsblock 1';
              addTask();
              const task=(tasks||[]).find(t=>t.text==='V628 Direkt Heute Arbeitsblock 1');
              const blocks=window.__modTodayWorkBlocksV474.getBlocks(day)||[];
              switchTab('today');render();
              const visible=[...document.querySelectorAll('#viewContainer .task:not(.archive-task)')].some(card=>(card.querySelector('.task-text')?.textContent||'').includes('V628 Direkt Heute Arbeitsblock 1'));
              return {
                task:task?{todayDate:task.todayDate||null,todayWorkBlockId:task.todayWorkBlockId||null}:null,
                firstBlockId:blocks[0]?.id||null,
                blockCount:blocks.length,
                visible
              };
            },day);
            if(!directTodayCreate.task||directTodayCreate.task.todayDate!==day||!directTodayCreate.task.todayWorkBlockId||directTodayCreate.task.todayWorkBlockId!==directTodayCreate.firstBlockId||directTodayCreate.blockCount<1||!directTodayCreate.visible)throw new Error('V628 direct Today create/work-block regression '+JSON.stringify(directTodayCreate));

            await page.evaluate(day=>{
              localStorage.removeItem(window.__modTodayWorkBlocksV474?.storageKey||'');
              tasks=[
                {id:50101,text:'V501 offene Aufgabe',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,todayWorkBlockId:null},
                {id:50102,text:'V501 El Porcador',type:'selfrunner',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:2,todayWorkBlockId:null},
                {id:50301,text:'V503 pausierte Aufgabe',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:3,todayWorkBlockId:null,startedAt:new Date().toISOString(),pausedAt:new Date().toISOString(),activeSegments:[{startedAt:new Date().toISOString(),endedAt:new Date().toISOString()}]}
              ];
              archive=[];nextArchiveNumber=1;saveTasks();saveArchive();switchTab('today');render();
            },day);
            await page.waitForTimeout(800);
            const result=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('#viewContainer .task:not(.archive-task)')];
              return cards.map(card=>{
                const actions=card.querySelector('.icon-actions');
                const buttons=[...actions?.querySelectorAll(':scope>button')||[]];
                const ranks=buttons.map(b=>Number(b.dataset.v501ActionOrder||9999));
                const today=buttons.find(b=>b.classList.contains('v501-today-action')||b.classList.contains('paused-today-v447'));
                return {
                  text:card.querySelector('.task-text')?.textContent||'',
                  ordered:ranks.every((v,i)=>i===0||ranks[i-1]<=v),
                  todayInside:!!today&&today.parentElement===actions,
                  todayPosition:today?getComputedStyle(today).position:null,
                  todaySelected:today?.classList.contains('today-selected-v480')||today?.classList.contains('selected')||false
                };
              });
            });
            if(result.length<3||result.some(x=>!x.ordered||!x.todayInside||x.todayPosition!=='relative'||!x.todaySelected))throw new Error('V501 action layout regression '+JSON.stringify(result));
            const pausedBefore=await page.evaluate(()=>!![...document.querySelectorAll('#viewContainer .task:not(.archive-task)')].find(card=>(card.querySelector('.task-text')?.textContent||'').includes('V503 pausierte Aufgabe')));
            if(!pausedBefore)throw new Error('V503 paused fixture missing before removal');
            await page.evaluate(()=>window.__modTodayInteractionStabilityV503.removeFromToday(50301));
            await page.waitForTimeout(350);
            const pausedAfter=await page.evaluate(()=>({
              visible:!![...document.querySelectorAll('#viewContainer .task:not(.archive-task)')].find(card=>(card.querySelector('.task-text')?.textContent||'').includes('V503 pausierte Aufgabe')),
              task:(tasks||[]).find(t=>t.id===50301)
            }));
            if(pausedAfter.visible||pausedAfter.task?.todayDate!==null||pausedAfter.task?.todayHiddenDate!==day)throw new Error('V503 paused Today removal regression '+JSON.stringify(pausedAfter));

            await page.evaluate(()=>{
              localStorage.setItem('masterOfDisasterCategoriesV405',JSON.stringify(['Haushalt','Verlauf']));
              tasks=[];archive=[];nextArchiveNumber=1;saveTasks();saveArchive();switchTab('all');render();
            });
            await page.waitForTimeout(350);
            const categoryCreate=await page.evaluate(()=>{
              const input=document.getElementById('taskInput');
              const select=document.getElementById('newCategoryV412');
              const addButton=document.querySelector('#inputPanel .add-button');
              if(!input||!select||!addButton)throw new Error('V504 create controls missing');
              const diagnostics={
                v504:window.__modCategoryCreateStabilityV504?.version||null,
                v507:window.__modTaskTitleLibraryV507?.version||null,
                todoCore:window.__modTodoStabilityV603?.version||null,
                addTaskType:typeof window.addTask
              };
              if(![...select.options].some(option=>option.value==='Haushalt')){
                select.add(new Option('Haushalt','Haushalt'));
              }
              input.value='V504 manuelle Kategorie';
              select.value='Haushalt';
              select.dispatchEvent(new Event('change',{bubbles:true}));
              window.__modPendingSuggestionCategory=null;
              addButton.click();
              const manual=(tasks||[]).find(t=>t.text==='V504 manuelle Kategorie');
              input.value='V504 Vorschlags-Fallback';
              select.value='';
              select.dispatchEvent(new Event('change',{bubbles:true}));
              window.__modPendingSuggestionCategory='Verlauf';
              addButton.click();
              const fallback=(tasks||[]).find(t=>t.text==='V504 Vorschlags-Fallback');
              return {
                manual:manual?.category??null,
                fallback:fallback?.category??null,
                rows:(tasks||[]).map(t=>({text:t.text,category:t.category??null})),
                diagnostics
              };
            });
            if(categoryCreate.manual!=='Haushalt'||categoryCreate.fallback!=='Verlauf')throw new Error('V504 category create regression '+JSON.stringify(categoryCreate));

            await page.evaluate(day=>{
              const now=Date.now();
              tasks=[
                {id:50501,text:'V505 Wäsche abnehmen',type:'work',status:'running',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:1,todayWorkBlockId:null,startedAt:new Date(now-5000).toISOString(),activeSegments:[{startedAt:new Date(now-5000).toISOString(),endedAt:null}]},
                {id:50502,text:'V505 Wäsche waschen',type:'work',status:'completed',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:2,todayWorkBlockId:null,startedAt:new Date(now-12000).toISOString(),completedAt:new Date(now-7000).toISOString(),completedDate:day,activeDurationMs:5000,actualDurationMs:5000,activeSegments:[{startedAt:new Date(now-12000).toISOString(),endedAt:new Date(now-7000).toISOString()}]}
              ];
              archive=[];nextArchiveNumber=1;saveTasks();saveArchive();switchTab('today');render();
            },day);
            await page.waitForTimeout(700);
            const fixture=await page.evaluate(()=>{
              const running=document.querySelector('#viewContainer .task[data-v490-task-id="50501"]');
              const completed=document.querySelector('#viewContainer .task[data-v490-task-id="50502"]');
              const del=completed?.querySelector('.terminal-delete-v485');
              if(!running||!completed||!del)throw new Error('V505 video fixture incomplete');
              window.__v505CompletedCard=completed;
              window.__v505DeleteButton=del;
              window.__v505RunningDetailBefore=running.querySelector('.task-detail-v490')?.textContent||'';
              window.__v505BaseRender=window.render;
              window.__v505RenderCalls=0;
              window.render=function(){window.__v505RenderCalls+=1;return window.__v505BaseRender.apply(this,arguments);};
              return {detail:window.__v505RunningDetailBefore,deleteText:del.textContent||''};
            });
            if(!fixture.detail)throw new Error('V505 running detail missing before ticker '+JSON.stringify(fixture));
            await page.waitForTimeout(1350);
            const ticker=await page.evaluate(()=>{
              const running=document.querySelector('#viewContainer .task[data-v490-task-id="50501"]');
              const completed=document.querySelector('#viewContainer .task[data-v490-task-id="50502"]');
              const del=completed?.querySelector('.terminal-delete-v485');
              const after=running?.querySelector('.task-detail-v490')?.textContent||'';
              const result={renderCalls:window.__v505RenderCalls,completedCardSame:completed===window.__v505CompletedCard,deleteButtonSame:del===window.__v505DeleteButton,deleteStillVisible:!!del,runningDetailBefore:window.__v505RunningDetailBefore,runningDetailAfter:after,runningDetailChanged:after!==window.__v505RunningDetailBefore,verify:window.__modRunningTaskRenderStabilityV505.verify()};
              window.render=window.__v505BaseRender;
              delete window.__v505BaseRender;
              return result;
            });
            if(ticker.renderCalls!==0||!ticker.completedCardSame||!ticker.deleteButtonSame||!ticker.deleteStillVisible||!ticker.runningDetailChanged||!ticker.verify)throw new Error('V505 running-task flicker regression '+JSON.stringify(ticker));

            const v508=await page.evaluate(()=>({
              version:window.__modArchiveWeightLayoutV508?.version,
              verify:window.__modArchiveWeightLayoutV508?.verify?.(),
              date:window.__modArchiveWeightLayoutV508?.shortDateYY?.('2026-08-15T12:00:00+02:00')
            }));
            if(v508.version!=='V508'||!v508.verify||v508.date!=='15.08.26')throw new Error('V508 module regression '+JSON.stringify(v508));

            const backupReconnect=await page.evaluate(async()=>{
              const api=window.__modRecoveryHistoryV498;
              if(!api)throw new Error('V498 backup API missing');
              const before=await api.exportPackage();
              api.resetDbConnection();
              const after=await api.exportPackage();
              return {
                beforeOk:before?.schema==='master-of-disaster-safety-net'&&Array.isArray(before.points)&&Array.isArray(before.logs),
                afterOk:after?.schema==='master-of-disaster-safety-net'&&Array.isArray(after.points)&&Array.isArray(after.logs),
                reconnect:api.dbReconnectV506===true,
                iosHandoff:api.iosBackupHandoffV506===true,
                verify:window.__modBackupStabilityV506?.verify?.()===true,
                sourceFallback:window.__modBackupSourceFallbackV506?.verify?.()===true,
                sourcePatch:window.__modBackupSourceFallbackV506?.patchRevision
              };
            });
            if(!backupReconnect.beforeOk||!backupReconnect.afterOk||!backupReconnect.reconnect||!backupReconnect.iosHandoff||!backupReconnect.verify||!backupReconnect.sourceFallback||backupReconnect.sourcePatch!=='V506.3')throw new Error('V506 backup reconnect regression '+JSON.stringify(backupReconnect));

            const build=await page.evaluate(()=>({v:window.__MOD_BUILD__?.version,v503:window.__modTodayInteractionStabilityV503?.version,v504:window.__modCategoryCreateStabilityV504?.version,v505:window.__modRunningTaskRenderStabilityV505?.version,v506:window.__modBackupStabilityV506?.version,v506source:window.__modBackupSourceFallbackV506?.patchRevision,v507:window.__modTaskTitleLibraryV507?.version,v508:window.__modArchiveWeightLayoutV508?.version}));
            if(!/^V\d+$/.test(build.v||'')||Number(build.v.slice(1))<609||build.v503!=='V503'||build.v504!=='V504'||build.v505!=='V505'||build.v506!=='V506'||build.v506source!=='V506.3'||build.v507!=='V507'||build.v508!=='V508')throw new Error('V609 build metadata missing '+JSON.stringify(build));
            console.log('V609 Chromium regression OK',result,pausedAfter,categoryCreate,ticker,v508,backupReconnect,build);
            await browser.close();

            const webkitBrowser=await webkit.launch({headless:true});
            const context=await webkitBrowser.newContext({viewport:{width:390,height:844}});
            async function webkitEntry(iteration,exercise){
              const p=await context.newPage();
              await p.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
              await p.goto('http://127.0.0.1:8787/?webkit-reentry='+iteration+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(()=>window.__modAreaRuntimeV609?.ready===true,{timeout:90000});
              const state=await p.evaluate(()=>({
                mode:window.__modAreaRuntimeV609?.preloadMode,
                percent:window.__modAreaRuntimeV609?.progress?.percent,
                executed:window.__modAreaRuntimeV609?.executedCount,
                home:document.body.classList.contains('mod-app-hub-v515')
              }));
              if(state.mode!=='worker-warm-staged-heavy-execution'||state.percent!==100||state.executed!==0||!state.home)throw new Error('V609 WebKit re-entry preload invalid '+JSON.stringify({iteration,state}));
              if(exercise){
                await p.evaluate(()=>window.__modAreaRuntimeV609.openArea('todo'));
                await p.waitForFunction(()=>typeof window.render==='function'&&window.__modTodoStabilityV603,{timeout:30000});
                await p.evaluate(()=>window.__modAppHubV603.show());
                await p.evaluate(()=>window.__modAreaRuntimeV609.openArea('kistology'));
                await p.waitForFunction(()=>window.__modKistologyV603&&document.body.classList.contains('mod-kistology-v535'),{timeout:30000});
                await p.evaluate(()=>window.__modAppHubV603.show());
                await p.evaluate(()=>window.__modAreaRuntimeV609.openArea('backstage'));
                await p.waitForFunction(()=>window.__modBackstageV531,{timeout:30000});
                const backstageDeferred=await p.evaluate(()=>!window.__modRecoveryHistoryV498&&!window.__modLogCoreV603);
                if(!backstageDeferred)throw new Error('V609 Backstage loaded Log too early');
                await p.evaluate(()=>{window.__v609LogLoad=window.__modAreaRuntimeV609.loadSection('log');});
                await p.waitForSelector('#viewContainer .mod-backstage-section-loader-v609',{timeout:10000});
                const logLoader=await p.evaluate(()=>({
                  text:document.querySelector('#viewContainer .mod-backstage-section-loader-v609')?.textContent||'',
                  section:window.__modAreaRuntimeV609?.loadingSection||null
                }));
                if(logLoader.section!=='log'||!/Modul \d+ von \d+/.test(logLoader.text))throw new Error('V609 LOG loader not visible '+JSON.stringify(logLoader));
                await p.evaluate(()=>window.__v609LogLoad);
                await p.evaluate(()=>window.__modBackstageV531.setSection('log'));
                await p.waitForFunction(()=>!!document.querySelector('#viewContainer .mod-log-v498'),{timeout:30000});
              }
              await p.waitForTimeout(1200);
              await p.close();
            }
            await webkitEntry(1,true);
            await webkitEntry(2,false);
            await webkitEntry(3,false);

            const soak=await context.newPage();
            let soakNavigations=0,soakCrashed=false;
            soak.on('framenavigated',frame=>{if(frame===soak.mainFrame())soakNavigations+=1;});
            soak.on('crash',()=>{soakCrashed=true;});
            await soak.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await soak.goto('http://127.0.0.1:8787/?webkit-soak='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await soak.waitForFunction(()=>window.__modAreaRuntimeV609?.ready===true,{timeout:90000});
            for(let cycle=0;cycle<3;cycle++){
              for(const area of ['todo','sport','kistology','finance','food','backstage']){
                await soak.evaluate(area=>window.__modAreaRuntimeV609.openArea(area),area);
                await soak.waitForTimeout(220);
                await soak.evaluate(()=>window.__modAppHubV603.show());
                await soak.waitForTimeout(160);
              }
            }
            await soak.waitForTimeout(1200);
            if(soakCrashed||soakNavigations!==1)throw new Error('V609 WebKit soak instability '+JSON.stringify({soakCrashed,soakNavigations}));
            await soak.close();

            await context.close();

            /* Echter Upgrade-Fall in frischem Storage:
               Legacy-Cache entfernen und neuen Worker übernehmen, ohne irgendeine
               zusätzliche Top-Level-Navigation der laufenden Seite. */
            const upgradeContext=await webkitBrowser.newContext({viewport:{width:390,height:844}});
            const seed=await upgradeContext.newPage();
            await seed.goto('http://127.0.0.1:8787/?reg=seed-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await seed.evaluate(async()=>{
              const cache=await caches.open('master-of-disaster-v606-static');
              await cache.put('./legacy-v606-marker',new Response('legacy',{headers:{'Content-Type':'text/plain'}}));
            });
            await seed.close();

            const upgrade=await upgradeContext.newPage();
            let topNavigations=0;
