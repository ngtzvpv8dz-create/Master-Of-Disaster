name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check integrity-v439.js && node --check remote-commands.js && node --check task-search.js && node --check ui.js && node --check archive-category-v413.js && node --check categories.js
      - name: Verify V441 diagnostic bridge
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          remote=Path('remote-commands.js').read_text(encoding='utf-8')
          assert 'BUILD: V441' in index
          assert 'REPORT_INTEGRITY' in remote
          assert 'REPORT_TASK_DETAILS' in remote
          assert 'taskDetailResult' in remote
          assert '__modRemoteCommandsV441' in remote
          print('V441 regression markers OK')
