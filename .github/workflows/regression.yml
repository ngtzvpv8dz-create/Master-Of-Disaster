name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check remote-archive-maintenance-v472.js && node --check remote-commands.js && node --check theme-editor-help-stability-v470.js && node --check theme-editor-help-v469.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - name: Verify V472 queue isolation and archive maintenance
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8');sw=Path('sw.js').read_text(encoding='utf-8');js=Path('remote-archive-maintenance-v472.js').read_text(encoding='utf-8');v450=Path('remote-commands.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V472','remote-archive-maintenance-v472.js?v=472-1030',"version:'V472'",'modV472ArchiveDeleteQueueFixDone']:
              if marker not in html: raise SystemExit(f'Missing V472 HTML marker: {marker}')
          for marker in ['master-of-disaster-v472-archive-delete-queue-fix','remote-archive-maintenance-v472.js']:
              if marker not in sw: raise SystemExit(f'Missing V472 SW marker: {marker}')
          for marker in ["QUEUE_STATUS='processing'",'.eq(\'status\',QUEUE_STATUS)',".eq('command','DELETE_ARCHIVE_ENTRY')",'realArchiveNumber','deleteArchiveEntry','nextArchiveNumber=afterHighest+1','saveArchive','__modRemoteArchiveMaintenanceV472']:
              if marker not in js: raise SystemExit(f'Missing V472 behavior marker: {marker}')
          if ".eq('status','pending')" not in v450: raise SystemExit('V450 no longer isolated to pending')
          print('V472 queue isolation wiring OK')
      - name: Verify V472 exact A255 deletion and numbering
        run: |
          node <<'NODE'
          const fs=require('fs');global.window=global;global.navigator={onLine:false};global.addEventListener=()=>{};global.document={addEventListener:()=>{},visibilityState:'visible'};global.setTimeout=()=>0;global.setInterval=()=>0;global.clearInterval=()=>{};
          global.archive=[{archiveNumber:254,archiveId:'A-254',text:'Vorher'},{archiveNumber:255,archiveId:'A-255',text:'Falsches Kochen',type:'cooking',status:'completed'}];global.nextArchiveNumber=256;let saved=0;global.saveArchive=()=>{saved++};global.render=()=>{};
          eval(fs.readFileSync('remote-archive-maintenance-v472.js','utf8'));const api=window.__modRemoteArchiveMaintenanceV472;
          if(api.queueStatus!=='processing')throw new Error('Wrong dedicated queue status');
          const r=api.deleteArchiveEntry(255);
          if(archive.length!==1||archive.some(x=>Number(x.archiveNumber)===255))throw new Error('A255 not deleted exactly');
          if(nextArchiveNumber!==255||r.next_archive_number!==255)throw new Error('Next archive number not rolled back');
          if(saved!==1)throw new Error('Archive not persisted once');
          console.log('V472 exact delete OK');
          NODE
      - name: Verify preserved V460 passive cooking concurrency
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();global.window=global;global.addEventListener=()=>{};global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};global.currentTab='all';const classList={add(){},remove(){},toggle(){}};
          global.document={getElementById(){return null},querySelector(){return null},querySelectorAll(){return []},createElement(){return {style:{setProperty(){},removeProperty(){}},classList,appendChild(){},remove(){},querySelector(){return null},querySelectorAll(){return []}}},head:{appendChild(){}},body:{appendChild(){},classList}};global.MutationObserver=class{observe(){} disconnect(){}};
          global.tasks=[{id:1,text:'Kochen',type:'cooking',status:'open',activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:2,text:'Arbeit',type:'work',status:'open',activeSegments:[],pauseTotalMs:0}];global.archive=[];global.getTask=id=>tasks.find(t=>t.id===id);global.saveTasks=()=>{};global.render=()=>{};global.switchTab=()=>{};global.normalizeTodayOrder=()=>{};global.closeModal=()=>{};global.showInfoModal=()=>{};global.getBerlinDateKey=()=> '2026-08-22';global.getBerlinDateKeyFromISO=()=> '2026-08-22';global.escapeHtml=s=>String(s);global.section=()=>({});global.dynamicNumber=()=>1;global.statusSymbol=()=>'';global.formatDuration=ms=>String(ms);global.formatISOForDateTimeLocal=s=>s;global.berlinLocalInputToISO=s=>s;global.showMissingCompletionDuration=()=>{};global.startTask=()=>{};global.pauseTask=()=>{};global.resumeTask=()=>{};global.finishTask=()=>{};global.abortTask=()=>{};global.askManualTimes=()=>{};global.saveManualTimes=()=>{};global.addManualSegmentV443=()=>{};global.removeManualSegmentV443=()=>{};global.readSegmentsFromDomV443=()=>[];global.refreshSegmentTotalV443=()=>{};global.saveManualSegmentsAndCompleteV445=()=>{};
          eval(fs.readFileSync('ux-cooking-editor-v460.js','utf8'));startTask(1);switchCookingMode(1,'passive');startTask(2);if(tasks[1].status!=='running')throw new Error('Parallel cooking work blocked');console.log('Cooking concurrency OK');
          NODE
