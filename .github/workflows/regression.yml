name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check remote-archive-sequence-v478.js && node --check statistics-alignment-v477.js && node --check development-stats-current-v476.js && node --check scripts/generate-development-metrics.mjs && node --check fixed-app-header-v475.js && node --check today-work-blocks-v474.js && node --check category-group-drag-v473.js && node --check remote-archive-maintenance-v472.js && node --check theme-editor-help-stability-v470.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - name: Verify V478 archive sequence wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('remote-archive-sequence-v478.js').read_text(encoding='utf-8')
          v477=Path('statistics-alignment-v477.js').read_text(encoding='utf-8')
          v476=Path('development-stats-current-v476.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V478','remote-archive-sequence-v478.js?v=478-0732',"version:'V478'",'modV478ArchiveSequenceDone']:
              if marker not in html: raise SystemExit(f'Missing V478 HTML marker: {marker}')
          for marker in ['master-of-disaster-v478-archive-sequence-repair','remote-archive-sequence-v478.js','development-metrics.json']:
              if marker not in sw: raise SystemExit(f'Missing V478 SW marker: {marker}')
          for marker in ["const COMMAND='RENUMBER_ARCHIVE_GAP'",'repairArchiveGap','before.gaps.length!==1','archive_id_preserved:true','sequence_contiguous:true','__modRemoteArchiveSequenceV478']:
              if marker not in js: raise SystemExit(f'Missing V478 behavior marker: {marker}')
          for marker in ['padding:12px 13px!important','fixedSummaryPadding:true','dynamicIndentRemoved:true','__modStatisticsAlignmentV477']:
              if marker not in v477: raise SystemExit(f'Missing preserved V477 marker: {marker}')
          for marker in ['APP-ENTWICKLUNG · AKTUELL','AUTOMATISCHER IST-STAND','autoGenerated:true','historicalFromGit:true','__modDevelopmentStatsCurrentV476']:
              if marker not in v476: raise SystemExit(f'Missing preserved V476 marker: {marker}')
          if metrics.get('version')!='V478' or metrics.get('automated') is not True:
              raise SystemExit('Expected valid V478 automated metrics snapshot')
          print('V478 archive sequence wiring OK')
      - name: Verify V478 targeted A255 gap repair
        run: |
          node <<'NODE'
          const fs=require('fs');
          global.window=global;global.navigator={onLine:false};global.addEventListener=()=>{};global.document={addEventListener:()=>{},visibilityState:'visible'};global.setTimeout=()=>0;global.setInterval=()=>0;global.clearInterval=()=>{};
          global.archive=Array.from({length:254},(_,i)=>({archiveNumber:i+1,archiveId:`stable-${i+1}`,text:`Aufgabe ${i+1}`,activeDurationMs:i*1000}));
          for(let n=256;n<=262;n++)archive.push({archiveNumber:n,archiveId:`stable-${n}`,text:`Aufgabe ${n}`,activeDurationMs:n*1000,category:'Test'});
          global.nextArchiveNumber=263;let saved=0;global.saveArchive=()=>saved++;global.render=()=>{};
          const before256=JSON.stringify({...archive.find(x=>x.archiveNumber===256),archiveNumber:undefined});
          eval(fs.readFileSync('remote-archive-sequence-v478.js','utf8'));
          const api=window.__modRemoteArchiveSequenceV478;
          const r=api.repairArchiveGap(255);
          const nums=archive.map(x=>Number(x.archiveNumber)).sort((a,b)=>a-b);
          if(archive.length!==261||nums.some((n,i)=>n!==i+1))throw new Error('A1-A261 are not contiguous');
          const moved=archive.find(x=>x.archiveId==='stable-256');
          if(!moved||moved.archiveNumber!==255||JSON.stringify({...moved,archiveNumber:undefined})!==before256)throw new Error('A256 payload/identity was not preserved');
          if(nextArchiveNumber!==262||r.shifted!==7||r.first_mapping.from!==256||r.first_mapping.to!==255||r.last_mapping.from!==262||r.last_mapping.to!==261||!r.archive_id_preserved||!r.sequence_contiguous||saved!==1)throw new Error('V478 repair result mismatch');
          const again=api.repairArchiveGap(255);if(!again.already_repaired||again.shifted!==0||saved!==1)throw new Error('V478 idempotency failed');
          console.log('V478 targeted archive gap repair OK');
          NODE
      - name: Generate live-shaped repository metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" --jq '.[].number' | wc -l | tr -d ' ')
          merged_count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq '.[] | select(.merged_at != null) | .number' | wc -l | tr -d ' ')
          METRICS_OUTPUT=/tmp/development-metrics.json PR_COUNT="$pr_count" MERGED_PR_COUNT="$merged_count" SOURCE_COMMIT="$GITHUB_SHA" node scripts/generate-development-metrics.mjs | tee /tmp/metrics.log
          node - <<'NODE'
          const m=require('/tmp/development-metrics.json');
          if(m.version!=='V478'||m.sourceCommit==='pending'||!m.automated)throw new Error('Generated metrics identity wrong');
          if(m.repository.pullRequests<60||m.repository.mergedPullRequests<50)throw new Error('PR counts unexpectedly low');
          if(m.repository.reachableCommits<500||m.repository.currentFiles<40||m.repository.currentTextLines<10000)throw new Error('Repository metrics unexpectedly low');
          console.log('V478 generated repository metrics OK');
          NODE
      - name: Verify preserved V475 fixed header
        shell: python
        run: |
          from pathlib import Path
          js=Path('fixed-app-header-v475.js').read_text(encoding='utf-8')
          for marker in ['appFixedTopV475','position:sticky','headerAndTabsTogether:true','opaqueShell:true','dynamicHeight:true','--mod-fixed-top-height-v475','__modFixedAppHeaderV475']:
              if marker not in js: raise SystemExit(f'Missing preserved V475 marker: {marker}')
          print('V475 fixed header preserved')
      - name: Verify preserved V474 work block data model
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();
          global.window=global;global.currentTab='all';global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};
          global.addEventListener=()=>{};global.setTimeout=()=>0;global.CSS={escape:s=>String(s)};
          global.document={addEventListener(){},getElementById(){return null},querySelector(){return null},querySelectorAll(){return []},createElement(){return {id:'',textContent:'',className:'',style:{},appendChild(){},append(){},querySelector(){return null},querySelectorAll(){return []},classList:{add(){},remove(){},toggle(){}}}},head:{appendChild(){}},body:{appendChild(){}}};
          global.getBerlinDateKey=()=> '2026-08-22';global.render=null;global.saveEdit=null;global.saveTasks=()=>{};
          global.tasks=[{id:1,text:'Bad wischen',category:'Böden wischen',todayDate:'2026-08-22',todayOrder:1,status:'open'},{id:2,text:'Flur aufräumen',category:'Flur',todayDate:'2026-08-22',todayOrder:2,status:'open'},{id:3,text:'Flur wischen',category:'Böden wischen',todayDate:'2026-08-22',todayOrder:3,status:'open'},{id:4,text:'Küche wischen',category:'Böden wischen',todayDate:null,todayOrder:null,status:'open'}];
          eval(fs.readFileSync('today-work-blocks-v474.js','utf8'));
          const api=window.__modTodayWorkBlocksV474;let blocks=api.ensureTodayModel('2026-08-22',[]);if(blocks.length!==1)throw new Error('Today migration failed');
          const b1=blocks[0],b2=api.addBlock('',{date:'2026-08-22',render:false}),b3=api.addBlock('',{date:'2026-08-22',render:false});api.moveTaskToBlock(2,b2.id,null,{date:'2026-08-22',render:false});api.moveTaskToBlock(3,b3.id,null,{date:'2026-08-22',render:false});const cats=tasks.map(t=>t.category).join('|');api.swapBlocks(b3.id,b1.id);
          if(api.blockNumber(b3.id,'2026-08-22')!==1||api.blockNumber(b1.id,'2026-08-22')!==3||tasks.map(t=>t.category).join('|')!==cats)throw new Error('Work block reorder/categories failed');
          api.assignTaskToToday(4,b2.id,{date:'2026-08-22',render:false});if(tasks[3].todayWorkBlockId!==b2.id)throw new Error('Direct Today assignment failed');
          console.log('V474 work blocks preserved');
          NODE
      - name: Verify preserved V472 exact A255 deletion
        run: |
          node <<'NODE'
          const fs=require('fs');global.window=global;global.navigator={onLine:false};global.addEventListener=()=>{};global.document={addEventListener:()=>{},visibilityState:'visible'};global.setTimeout=()=>0;global.setInterval=()=>0;global.clearInterval=()=>{};global.archive=[{archiveNumber:254,text:'Vorher'},{archiveNumber:255,text:'Falsches Kochen'}];global.nextArchiveNumber=256;let saved=0;global.saveArchive=()=>saved++;global.render=()=>{};
          eval(fs.readFileSync('remote-archive-maintenance-v472.js','utf8'));const r=window.__modRemoteArchiveMaintenanceV472.deleteArchiveEntry(255);if(archive.some(x=>Number(x.archiveNumber)===255)||nextArchiveNumber!==255||r.next_archive_number!==255||saved!==1)throw new Error('Preserved A255 deletion failed');console.log('V472 archive maintenance preserved');
          NODE
      - name: Verify preserved V460 passive cooking concurrency
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();global.window=global;global.addEventListener=()=>{};global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};global.currentTab='all';const classList={add(){},remove(){},toggle(){}};global.document={getElementById(){return null},querySelector(){return null},querySelectorAll(){return []},createElement(){return {style:{setProperty(){},removeProperty(){}},classList,appendChild(){},remove(){},querySelector(){return null},querySelectorAll(){return []}}},head:{appendChild(){}},body:{appendChild(){},classList}};global.MutationObserver=class{observe(){} disconnect(){}};global.tasks=[{id:1,text:'Kochen',type:'cooking',status:'open',activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:2,text:'Arbeit',type:'work',status:'open',activeSegments:[],pauseTotalMs:0}];global.archive=[];global.getTask=id=>tasks.find(t=>t.id===id);global.saveTasks=()=>{};global.render=()=>{};global.switchTab=()=>{};global.normalizeTodayOrder=()=>{};global.closeModal=()=>{};global.showInfoModal=()=>{};global.getBerlinDateKey=()=> '2026-08-22';global.getBerlinDateKeyFromISO=()=> '2026-08-22';global.escapeHtml=s=>String(s);global.section=()=>({});global.dynamicNumber=()=>1;global.statusSymbol=()=>'';global.formatDuration=ms=>String(ms);global.formatISOForDateTimeLocal=s=>s;global.berlinLocalInputToISO=s=>s;global.showMissingCompletionDuration=()=>{};global.startTask=()=>{};global.pauseTask=()=>{};global.resumeTask=()=>{};global.finishTask=()=>{};global.abortTask=()=>{};global.askManualTimes=()=>{};global.saveManualTimes=()=>{};global.addManualSegmentV443=()=>{};global.removeManualSegmentV443=()=>{};global.readSegmentsFromDomV443=()=>[];global.refreshSegmentTotalV443=()=>{};global.saveManualSegmentsAndCompleteV445=()=>{};
          eval(fs.readFileSync('ux-cooking-editor-v460.js','utf8'));startTask(1);switchCookingMode(1,'passive');startTask(2);if(tasks[1].status!=='running')throw new Error('Parallel cooking work blocked');console.log('Cooking concurrency OK');
          NODE
