name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check remote-archive-maintenance-v471.js && node --check theme-editor-help-stability-v470.js && node --check theme-editor-help-v469.js && node --check theme-editor-polish-v468.js && node --check theme-package-stability-v467.js && node --check theme-package-actions-v466.js && node --check theme-state-design-v464.js && node --check ux-cooking-editor-v460.js && node --check app.js
      - name: Verify V471 archive maintenance wiring
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('remote-archive-maintenance-v471.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V471','remote-archive-maintenance-v471.js?v=471-1024',"version:'V471'",'modV471RemoteArchiveDeleteDone']:
              if marker not in html: raise SystemExit(f'Missing V471 HTML marker: {marker}')
          for marker in ['master-of-disaster-v471-remote-archive-delete','remote-archive-maintenance-v471.js']:
              if marker not in sw: raise SystemExit(f'Missing V471 SW marker: {marker}')
          for marker in ['DELETE_ARCHIVE_ENTRY','archive_pending','realArchiveNumber','deleteArchiveEntry','nextArchiveNumber=afterHighest+1','saveArchive','__modRemoteArchiveMaintenanceV471']:
              if marker not in js: raise SystemExit(f'Missing V471 behavior marker: {marker}')
          print('V471 archive maintenance wiring OK')
      - name: Verify V471 exact archive deletion and numbering
        run: |
          node <<'NODE'
          const fs=require('fs');
          global.window=global;global.navigator={onLine:false};global.addEventListener=()=>{};global.document={addEventListener:()=>{},visibilityState:'visible'};global.setTimeout=()=>0;global.setInterval=()=>0;global.clearInterval=()=>{};
          global.archive=[{archiveNumber:254,archiveId:'A-254',text:'Vorher'},{archiveNumber:255,archiveId:'A-255',text:'Falsches Kochen',type:'cooking',status:'completed'}];
          global.nextArchiveNumber=256;let saved=0;global.saveArchive=()=>{saved++};global.render=()=>{};
          eval(fs.readFileSync('remote-archive-maintenance-v471.js','utf8'));
          const r=window.__modRemoteArchiveMaintenanceV471.deleteArchiveEntry(255);
          if(archive.length!==1||archive.some(x=>Number(x.archiveNumber)===255))throw new Error('A255 not deleted exactly');
          if(nextArchiveNumber!==255||r.next_archive_number!==255)throw new Error('Next archive number not rolled back to A255');
          if(saved!==1)throw new Error('Archive not persisted exactly once');
          let threw=false;try{window.__modRemoteArchiveMaintenanceV471.deleteArchiveEntry(255)}catch(e){threw=true}if(!threw)throw new Error('Missing entry must fail closed');
          console.log('V471 exact delete OK');
          NODE
      - name: Verify preserved V460 passive cooking concurrency
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();global.window=global;global.addEventListener=()=>{};global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};global.currentTab='all';const classList={add(){},remove(){},toggle(){}};
          global.document={getElementById(){return null},querySelector(){return null},querySelectorAll(){return []},createElement(){return {style:{setProperty(){},removeProperty(){}},classList,appendChild(){},remove(){},querySelector(){return null},querySelectorAll(){return []}}},head:{appendChild(){}},body:{appendChild(){},classList}};global.MutationObserver=class{observe(){} disconnect(){}};
          global.tasks=[{id:1,text:'Kochen',type:'cooking',status:'open',activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:2,text:'Arbeit',type:'work',status:'open',activeSegments:[],pauseTotalMs:0}];global.archive=[];global.getTask=id=>tasks.find(t=>t.id===id);global.saveTasks=()=>{};global.render=()=>{};global.switchTab=()=>{};global.normalizeTodayOrder=()=>{};global.closeModal=()=>{};global.showInfoModal=()=>{};global.getBerlinDateKey=()=> '2026-08-22';global.getBerlinDateKeyFromISO=()=> '2026-08-22';global.escapeHtml=s=>String(s);global.section=()=>({});global.dynamicNumber=()=>1;global.statusSymbol=()=>'';global.formatDuration=ms=>String(ms);global.formatISOForDateTimeLocal=s=>s;global.berlinLocalInputToISO=s=>s;global.showMissingCompletionDuration=()=>{};global.startTask=()=>{};global.pauseTask=()=>{};global.resumeTask=()=>{};global.finishTask=()=>{};global.abortTask=()=>{};global.askManualTimes=()=>{};global.saveManualTimes=()=>{};global.addManualSegmentV443=()=>{};global.removeManualSegmentV443=()=>{};global.readSegmentsFromDomV443=()=>[];global.refreshSegmentTotalV443=()=>{};global.saveManualSegmentsAndCompleteV445=()=>{};
          eval(fs.readFileSync('ux-cooking-editor-v460.js','utf8'));startTask(1);switchCookingMode(1,'passive');startTask(2);if(tasks[1].status!=='running')throw new Error('Parallel cooking work blocked');console.log('Cooking concurrency OK');
          NODE
