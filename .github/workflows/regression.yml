name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check theme-state-design-v464.js && node --check theme-editor-comfort-v463.js && node --check theme-ui-guard-v462.js && node --check theme-editor-stability-v461.js && node --check ux-cooking-editor-v460.js && node --check theme-layout-editor-v458.js && node --check safe-undo-v457.js && node --check goals-milestones-v455.js && node --check background-log-v454.js && node --check live-log-v453.js && node --check app.js
      - name: Verify preserved core behavior markers
        shell: python
        run: |
          from pathlib import Path
          checks={
            'remote-commands.js':['findReusableTask','reused_existing','__modRemoteCommandsV450'],
            'project-history-v452.js':['GESAMTCHRONIK','__modProjectHistoryV452'],
            'live-log-v453.js':['WINDOW_MS=24*60*60*1000','__modLiveLogV453'],
            'background-log-v454.js':['SYNC_DELAY_MS=900','emptyRemotePollSuppressed:true','__modBackgroundLogV454'],
            'goals-milestones-v455.js':['ZIELE & MEILENSTEINE','__modGoalsMilestonesV455'],
            'safe-undo-v457.js':['TTL_MS=10*60*1000','__modSafeUndoV457'],
            'theme-layout-editor-v458.js':['THEME & LAYOUT EDITOR','__modThemeLayoutV458'],
            'ux-cooking-editor-v460.js':['themeStickyPreviewV460','ERLEDIGT / ABGEBROCHEN HEUTE','passiveCookingParallel:true','__modUxCookingEditorV460'],
            'theme-editor-stability-v461.js':['replaceObservedHostAfterLegacyObserversAttached','__modThemeStabilityV461'],
            'theme-ui-guard-v462.js':['theme-panel-v458:has(.theme-preview-v458)','__modThemeUiGuardV462'],
            'theme-editor-comfort-v463.js':['BOTTOM_OFFSET_PX=50','scrollRetention:true','__modThemeEditorComfortV463']
          }
          for name,markers in checks.items():
              text=Path(name).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text: raise SystemExit(f'Missing preserved marker {marker} in {name}')
          print('Preserved behavior markers OK')
      - name: Verify V455 goals and V457 undo
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();
          global.window=global;global.addEventListener=()=>{};global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};
          global.tasks=[];global.archive=[{archiveNumber:1,status:'completed',completedDate:'2026-08-20',archiveAccountingActiveDurationMs:3600000},{archiveNumber:2,status:'completed',completedDate:'2026-08-21',archiveAccountingActiveDurationMs:7200000,historicalWeightKg:12.3}];
          eval(fs.readFileSync('goals-milestones-v455.js','utf8'));const t=window.__modGoalsMilestonesV455.totals();if(t.archiveTasks!==2||Math.abs(t.activeHours-3)>.001)throw new Error('Goals regression');
          global.tasks=[{id:1,text:'Test',status:'open',activeSegments:[]}];global.archive=[];global.weightState={isWearing:false};global.weightPhases=[];global.saveTasks=()=>{};global.saveWeight=()=>{};global.saveArchive=()=>{};
          eval(fs.readFileSync('safe-undo-v457.js','utf8'));tasks[0].status='running';tasks[0].startedAt='2026-08-21T15:00:00Z';tasks[0].activeSegments=[{startedAt:tasks[0].startedAt,endedAt:null}];saveTasks();if(!window.__modSafeUndoV457.undo()||tasks[0].status!=='open')throw new Error('Undo regression');
          console.log('Goals/undo OK');
          NODE
      - name: Verify V460 passive cooking concurrency
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();global.window=global;global.addEventListener=()=>{};global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};global.currentTab='all';const classList={add(){},remove(){},toggle(){}};
          global.document={getElementById(){return null},querySelector(){return null},querySelectorAll(){return []},createElement(){return {style:{setProperty(){},removeProperty(){}},classList,appendChild(){},remove(){},querySelector(){return null},querySelectorAll(){return []}}},head:{appendChild(){}},body:{appendChild(){},classList}};global.MutationObserver=class{observe(){} disconnect(){}};
          global.tasks=[{id:1,text:'Kochen',type:'cooking',status:'open',activeSegments:[],cookingSegments:[],cookingMode:'active',pauseTotalMs:0},{id:2,text:'Arbeit',type:'work',status:'open',activeSegments:[],pauseTotalMs:0}];global.archive=[];global.getTask=id=>tasks.find(t=>t.id===id);global.saveTasks=()=>{};global.render=()=>{};global.switchTab=()=>{};global.normalizeTodayOrder=()=>{};global.closeModal=()=>{};global.showInfoModal=()=>{};global.getBerlinDateKey=()=> '2026-08-22';global.getBerlinDateKeyFromISO=()=> '2026-08-22';global.escapeHtml=s=>String(s);global.section=()=>({});global.dynamicNumber=()=>1;global.statusSymbol=()=>'';global.formatDuration=ms=>String(ms);global.formatISOForDateTimeLocal=s=>s;global.berlinLocalInputToISO=s=>s;global.showMissingCompletionDuration=()=>{};global.startTask=()=>{};global.pauseTask=id=>{const t=tasks.find(x=>x.id===id);if(!t)return;const now=new Date().toISOString();const last=t.activeSegments?.at(-1);if(last&&!last.endedAt)last.endedAt=now;t.status='paused';t.pausedAt=now;};global.resumeTask=()=>{};global.finishTask=()=>{};global.abortTask=()=>{};global.askManualTimes=()=>{};global.saveManualTimes=()=>{};global.addManualSegmentV443=()=>{};global.removeManualSegmentV443=()=>{};global.readSegmentsFromDomV443=()=>[];global.refreshSegmentTotalV443=()=>{};global.saveManualSegmentsAndCompleteV445=()=>{};
          eval(fs.readFileSync('ux-cooking-editor-v460.js','utf8'));startTask(1);switchCookingMode(1,'passive');startTask(2);if(tasks[1].status!=='running')throw new Error('Parallel cooking work blocked');console.log('Cooking concurrency OK');
          NODE
      - name: Verify V464 state design wiring
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8');sw=Path('sw.js').read_text(encoding='utf-8');js=Path('theme-state-design-v464.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V464','22.08.2026 · 00:03','theme-state-design-v464.js?v=464-0003',"version:'V464'",'modV464ThemeStateDesignDone']:
              if marker not in html: raise SystemExit(f'Missing V464 HTML marker: {marker}')
          for marker in ['master-of-disaster-v464-theme-state-design','/theme-state-design-v464.js']:
              if marker not in sw: raise SystemExit(f'Missing V464 SW marker: {marker}')
          for marker in ['ZUSTANDSDESIGN','KARTE VERLAUF WINKEL','AKTION VERLAUF START','AKTION VERLAUF ENDE','AKTION VERLAUF WINKEL','data-v464-preview-source','perState:true','actionGradient:true','gradientAngle:true','previewRepair:true','__modThemeStateDesignV464']:
              if marker not in js: raise SystemExit(f'Missing V464 behavior marker: {marker}')
          print('V464 state design wiring OK')
