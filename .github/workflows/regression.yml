name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check theme-layout-editor-v458.js && node --check safe-undo-v457.js && node --check task-notes-v456.js && node --check goals-milestones-v455.js && node --check background-log-v454.js && node --check live-log-v453.js && node --check project-history-v452.js && node --check development-stats-v451.js && node --check completed-category-v449.js && node --check paused-today-v447.js && node --check today-paused-v446.js && node --check retroactive-complete-v445.js && node --check segment-duration-v444.js && node --check time-segments-v443.js && node --check integrity-v439.js && node --check remote-commands.js && node --check app.js
      - name: Verify preserved V445-V454 behavior
        shell: python
        run: |
          from pathlib import Path
          files={name:Path(name).read_text(encoding='utf-8') for name in ['retroactive-complete-v445.js','today-paused-v446.js','paused-today-v447.js','completed-category-v449.js','remote-commands.js','development-stats-v451.js','project-history-v452.js','live-log-v453.js','background-log-v454.js']}
          checks={
            'retroactive-complete-v445.js':['saveManualSegmentsAndCompleteV445',"task.status='completed'"],
            'today-paused-v446.js':['task.activeSegments.some','PAUSIERTE AUFGABEN'],
            'paused-today-v447.js':['Für heute markieren','toggleToday(${id})'],
            'completed-category-v449.js':['setCompletedCategory','__modCompletedCategoryV449'],
            'remote-commands.js':['findReusableTask','reused_existing','__modRemoteCommandsV450'],
            'development-stats-v451.js':['APP-ENTWICKLUNG','__modDevelopmentStatsV451'],
            'project-history-v452.js':['GESAMTCHRONIK','data-stat-open-v452','data-stat-close-v452','__modProjectHistoryV452'],
            'live-log-v453.js':['WINDOW_MS=24*60*60*1000','__modLiveLogV453'],
            'background-log-v454.js':['SYNC_DELAY_MS=900','wrapSupabaseClient','emptyRemotePollSuppressed:true','__modBackgroundLogV454']
          }
          for name,markers in checks.items():
              for marker in markers:
                  if marker not in files[name]: raise SystemExit(f'Missing preserved marker {marker} in {name}')
          print('V445-V454 behavior markers preserved')
      - name: Verify V455 goals and milestones
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map();
          global.window=global;global.addEventListener=()=>{};global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};
          global.tasks=[];global.archive=[
            {archiveNumber:1,text:'A',status:'completed',completedDate:'2026-08-20',archiveAccountingActiveDurationMs:3600000},
            {archiveNumber:2,text:'B',status:'completed',completedDate:'2026-08-21',archiveAccountingActiveDurationMs:7200000,historicalWeightKg:12.3},
            {archiveNumber:3,text:'C',status:'aborted',completedDate:'2026-08-21',archiveAccountingActiveDurationMs:9999999}
          ];
          eval(fs.readFileSync('goals-milestones-v455.js','utf8'));
          const api=window.__modGoalsMilestonesV455;if(!api||api.version!=='V455')throw new Error('V455 API missing');
          const t=api.totals();if(t.archiveTasks!==2||Math.abs(t.activeHours-3)>0.001||t.activeDays!==2||t.weightedTasks!==1)throw new Error('V455 totals wrong: '+JSON.stringify(t));
          api.setGoals({archiveTasks:300,activeHours:120,activeDays:40,weightedTasks:80});const g=api.goals();if(g.archiveTasks!==300||g.activeHours!==120||g.activeDays!==40||g.weightedTasks!==80)throw new Error('V455 goals persistence failed');
          console.log('V455 goals regression OK');
          NODE
      - name: Verify V456 optional task notes
        run: |
          node <<'NODE'
          const fs=require('fs');let saves=0;
          global.window=global;global.addEventListener=()=>{};global.localStorage={getItem(){return null},setItem(){}};
          global.tasks=[{id:7,text:'Küche aufräumen',status:'open'}];global.archive=[];global.getTask=id=>tasks.find(t=>t.id===Number(id));global.saveTasks=()=>{saves++};
          eval(fs.readFileSync('task-notes-v456.js','utf8'));
          const api=window.__modTaskNotesV456;if(!api||api.version!=='V456')throw new Error('V456 API missing');
          if(!api.setNote(7,'  Ersatzteil liegt im Auto.  '))throw new Error('V456 setNote rejected');
          if(tasks[0].note!=='Ersatzteil liegt im Auto.'||saves!==1)throw new Error('V456 note persistence failed');
          if(api.cleanNote('x'.repeat(1300)).length!==1200)throw new Error('V456 note limit failed');
          console.log('V456 notes regression OK');
          NODE
      - name: Verify V457 safe one-step undo
        run: |
          node <<'NODE'
          const fs=require('fs');
          global.window=global;global.tasks=[{id:1,text:'Test',status:'open',activeSegments:[]}];global.archive=[];global.weightState={isWearing:false};global.weightPhases=[];
          global.saveTasks=()=>{};global.saveWeight=()=>{};global.saveArchive=()=>{};
          eval(fs.readFileSync('safe-undo-v457.js','utf8'));
          const api=window.__modSafeUndoV457;if(!api||api.version!=='V457')throw new Error('V457 API missing');
          tasks[0].status='running';tasks[0].startedAt='2026-08-21T15:00:00Z';tasks[0].activeSegments=[{startedAt:tasks[0].startedAt,endedAt:null}];saveTasks();
          if(!api.current()||!/Start/.test(api.current().label))throw new Error('V457 start undo was not captured');
          if(!api.undo()||tasks[0].status!=='open'||tasks[0].activeSegments.length!==0)throw new Error('V457 undo did not restore task');
          tasks[0].category='Haushalt';saveTasks();if(!api.current())throw new Error('V457 edit undo missing');
          archive.push({archiveNumber:99,text:'Archived'});saveArchive();if(api.current()!==null)throw new Error('V457 undo survived archive mutation');
          console.log('V457 safe undo regression OK');
          NODE
      - name: Verify V458 theme and layout editor state
        run: |
          node <<'NODE'
          const fs=require('fs'),store=new Map(),vars=new Map();
          global.window=global;global.localStorage={getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)};
          global.addEventListener=()=>{};global.confirm=()=>true;global.alert=()=>{};
          global.document={
            documentElement:{style:{setProperty:(k,v)=>vars.set(k,String(v))}},
            getElementById(){return null},querySelector(){return null},querySelectorAll(){return []},
            createElement(){return {style:{},classList:{toggle(){}},addEventListener(){},appendChild(){},remove(){},click(){},set textContent(v){this._text=v},get textContent(){return this._text||''}}},
            head:{appendChild(){}},body:{appendChild(){}}
          };
          eval(fs.readFileSync('theme-layout-editor-v458.js','utf8'));
          const api=window.__modThemeLayoutV458;if(!api||api.version!=='V458')throw new Error('V458 API missing');
          const defaults=api.getConfig();if(defaults.card.minHeight!==50||defaults.card.noteLines!==2||defaults.gridStep!==2)throw new Error('V458 defaults wrong');
          const changed=api.setConfig({...defaults,card:{...defaults.card,minHeight:999,actionSize:10},elements:{...defaults.elements,title:{...defaults.elements.title,fontSize:99,x:99,y:-99}}});
          if(changed.card.minHeight!==140||changed.card.actionSize!==24)throw new Error('V458 card clamp failed');
          if(changed.elements.title.fontSize!==30||changed.elements.title.x!==48||changed.elements.title.y!==-48)throw new Error('V458 element clamp failed');
          if(!store.has('masterOfDisasterThemeLayoutV458'))throw new Error('V458 config was not persisted');
          if(vars.get('--mod-card-min-height')!=='140px'||vars.get('--mod-title-x')!=='48px')throw new Error('V458 CSS variables not applied');
          console.log('V458 theme/layout state regression OK');
          NODE
      - name: Verify V458 build wiring and editor coverage
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('theme-layout-editor-v458.js').read_text(encoding='utf-8')
          for marker in ['BUILD: V458','21.08.2026 · 22:40','data-tab="theme"','theme-layout-editor-v458.js?v=458-2240',"version:'V458'",'modV458ThemeLayoutDone']:
              if marker not in html: raise SystemExit(f'Missing V458 HTML marker: {marker}')
          for marker in ['master-of-disaster-v458-theme-layout-editor','/theme-layout-editor-v458.js']:
              if marker not in sw: raise SystemExit(f'Missing V458 service worker marker: {marker}')
          for marker in ['APP-FARBEN · ZENTRALE PALETTE','AUFGABENKARTE · FARBEN & FORM','ELEMENT AUSWÄHLEN & FEINPOSITIONIEREN','LIVE-VORSCHAU · VERSCHIEDENE ZUSTÄNDE','OFFEN · MIT NOTIZ','LÄUFT · NORMALE ARBEIT','PAUSIERT','KOCHEN · AKTIV/GARZEIT','ERLEDIGT','data-move="up"','data-move="left"','data-move="right"','data-move="down"','themePositionOkV458','card.minHeight','card.borderWidth','card.actionSize','elements.${selectedRole}.fontSize','elements.${selectedRole}.fontWeight','elements.${selectedRole}.lineHeight','__modThemeLayoutV458']:
              if marker not in js: raise SystemExit(f'Missing V458 editor marker: {marker}')
          print('V458 build/editor coverage OK')
