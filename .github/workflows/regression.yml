name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check nested-task-weight-layout-v490.js && node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check live-log-v453.js && node --check app.js
      - name: Verify V490 wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('nested-task-weight-layout-v490.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V490','nested-task-weight-layout-v490.js?v=490-1853',"version:'V490'",'modV490NestedWeightLayoutDone']:
              if marker not in html: raise SystemExit(f'Missing V490 HTML marker: {marker}')
          for marker in ['master-of-disaster-v490-nested-weight-layout','nested-task-weight-layout-v490.js','task-time-weight-details-v489.js']:
              if marker not in sw: raise SystemExit(f'Missing V490 SW marker: {marker}')
          for marker in ['nestedSegmentWeight:true','partialWeightTwoLines:true','fullSegmentWeightCompact:true','overallWeightIndented:true','duplicateTotalRemoved:true','historicalNoteRemoved:true','archiveMatchesTaskLayout:true','archiveDetailFontPx:8.5','historicalUnknownsStayBlank:true']:
              if marker not in js: raise SystemExit(f'Missing V490 behavior marker: {marker}')
          if metrics.get('version')!='V490' or metrics.get('automated') is not True:
              raise SystemExit('Expected V490 automated metrics snapshot')
          print('V490 wiring OK')
      - name: Browser regression V490
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V490'&&window.__modNestedTaskWeightLayoutV490&&window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485,{timeout:30000});

            // ALLE/HEUTE-Stil: Historie oben, Gewicht eingerückt unter Gesamt, danach Segmente mit verschachteltem Gewicht.
            await page.evaluate(()=>{
              tasks=[{
                id:4901,text:'Kisten sortieren V490',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:null,todayOrder:null,
                importedHistoricalProgressDurationMs:8760000,historicalAlreadyArchivedDurationMs:0,
                startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T16:00:00+02:00',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,
                activeSegments:[
                  {startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},
                  {startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},
                  {startedAt:'2026-08-23T15:30:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}
                ]
              }];
              weightPhases=[
                {id:9101,weightKg:12.3,startedAt:'2026-08-23T13:10:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},
                {id:9102,weightKg:12.3,startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},
                {id:9103,weightKg:8,startedAt:'2026-08-23T15:40:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}
              ];
              weightState={isWearing:false,currentWeightKg:8};archive=[];nextArchiveNumber=1;
              saveTasks();saveArchive();saveWeight();switchTab('all');render();
            });
            await page.waitForTimeout(1350);
            const card=page.locator('.task',{hasText:'Kisten sortieren V490'}).first();
            const cardText=await card.innerText();
            for(const expected of [
              'AKTIV · 02:15:00',
              '+ HISTORISCH · 02:26:00',
              '= GESAMT AKTIV · 04:41:00',
              '↳ 🏋️ DAVON 01:55:00 MIT ZUSATZGEWICHT',
              'PAUSEN ZWISCHEN SEGMENTEN · 00:45:00 · NICHT ENTHALTEN',
              '13:00:00–14:00:00 · 01:00:00',
              '↳ 🏋️ INKL. ZUSATZGEWICHT · 13:10:00–14:00:00',
              '00:50:00 · 12,3 kg',
              '14:15:00–15:00:00 · 00:45:00',
              '↳ 🏋️ INKL. ZUSATZGEWICHT · 12,3 kg',
              '15:30:00–16:00:00 · 00:30:00',
              '↳ 🏋️ INKL. ZUSATZGEWICHT · 15:40:00–16:00:00',
              '00:20:00 · 8 kg',
              'HISTORISCH · 02:26:00'
            ]) if(!cardText.includes(expected))throw new Error(`V490 card missing ${expected}: ${cardText}`);
            if(cardText.includes('keine exakten Segmentzeiten dokumentiert')||cardText.includes('Uhrzeit der Gewichtsnutzung nicht exakt dokumentiert'))throw new Error('V490 still shows historical explanatory noise: '+cardText);
            const totalCount=(cardText.match(/GESAMT AKTIV · 04:41:00/g)||[]).length;
            if(totalCount!==1)throw new Error(`GESAMT AKTIV duplicated ${totalCount}x: ${cardText}`);
            const order=await card.locator('.historical-segment-duration-v488').evaluate(el=>[...el.children].map(x=>x.textContent.trim()));
            if(!/^AKTIV/.test(order[0])||!/^\+ HISTORISCH/.test(order[1])||!/^= GESAMT AKTIV/.test(order[2])||!/^↳ 🏋️ DAVON/.test(order[3])||!/^PAUSEN/.test(order[4]))throw new Error('Overall hierarchy/order wrong: '+JSON.stringify(order));
            const compactFull=await card.locator('.v490-weight-full').first().innerText();
            if(/14:15:00|00:45:00/.test(compactFull))throw new Error('Full weight coverage repeats time/duration: '+compactFull);
            const partialLines=await card.locator('.v490-weight-partial').count();
            const partialSubs=await card.locator('.v490-weight-subline').count();
            if(partialLines!==2||partialSubs!==2)throw new Error(`Expected two partial weight pairs, got ${partialLines}/${partialSubs}`);

            // Archiv: gleiche 8.5px-Hierarchie, keine alte große Gewichtsauszeichnung, kein unteres Gesamt-Aktiv-Duplikat.
            await page.evaluate(()=>{
              archive=[{
                archiveNumber:1,archiveId:'v490-a1',text:'Archiv Gewicht Layout',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',
                startedAt:'2026-08-22T13:00:00+02:00',completedAt:'2026-08-22T15:00:00+02:00',activeDurationMs:6300000,archiveAccountingActiveDurationMs:6300000,actualDurationMs:6300000,pauseTotalMs:0,
                activeSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00'},{startedAt:'2026-08-22T14:15:00+02:00',endedAt:'2026-08-22T15:00:00+02:00'}],
                historicalWeightKg:12.3,weightedActiveDurationMs:6300000,
                weightActiveSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00',historicalWeightKg:12.3},{startedAt:'2026-08-22T14:15:00+02:00',endedAt:'2026-08-22T15:00:00+02:00',historicalWeightKg:12.3}]
              },{
                archiveNumber:2,archiveId:'v490-a2',text:'Historisch ohne genaue Zeiten',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:null,completedAt:null,activeDurationMs:600000,archiveAccountingActiveDurationMs:600000,actualDurationMs:600000,pauseTotalMs:0,activeSegments:[],historicalWeightKg:8,weightedActiveDurationMs:600000
              }];nextArchiveNumber=3;saveArchive();switchTab('archive');render();
            });
            await page.waitForTimeout(450);
            const archived=page.locator('.archive-task',{hasText:'Archiv Gewicht Layout'}).first();
            const archiveText=await archived.innerText();
            for(const expected of ['↳ 🏋️ KOMPLETT INKL. ZUSATZGEWICHT','13:00:00–14:00:00 · 01:00:00','↳ 🏋️ INKL. ZUSATZGEWICHT · 12,3 kg','14:15:00–15:00:00 · 00:45:00']) if(!archiveText.includes(expected))throw new Error(`Archive nested layout missing ${expected}: ${archiveText}`);
            if(archiveText.includes('GESAMT AKTIV')||archiveText.includes('keine exakten')||archiveText.includes('Uhrzeit der Gewichtsnutzung'))throw new Error('Archive still contains duplicated/noisy V489 details: '+archiveText);
            const archiveStyle=await archived.evaluate(card=>{
              const detail=card.querySelector('.task-detail-v490'),lines=[...card.querySelectorAll('.task-detail-v490>div,.v490-overall-weight-archive')];
              return {detail:detail?getComputedStyle(detail).fontSize:null,lines:lines.map(x=>getComputedStyle(x).fontSize),oldBadges:card.querySelectorAll('.archive-task-weight-details,.archive-task-weight,.task-detail-v489').length};
            });
            if(archiveStyle.detail!=='8.5px'||archiveStyle.lines.some(x=>x!=='8.5px')||archiveStyle.oldBadges!==0)throw new Error('Archive compact typography/cleanup failed: '+JSON.stringify(archiveStyle));

            // Bei unbekannter historischer Zeitlage nichts erfinden.
            const historical=page.locator('.archive-task',{hasText:'Historisch ohne genaue Zeiten'}).first();
            const historicalText=await historical.innerText();
            if(!historicalText.includes('KOMPLETT INKL. ZUSATZGEWICHT'))throw new Error('Known historical weight fact missing: '+historicalText);
            if(/\d{2}:\d{2}:\d{2}–\d{2}:\d{2}:\d{2}/.test(historicalText)||historicalText.includes('keine exakten')||historicalText.includes('nicht exakt dokumentiert'))throw new Error('Historical unknowns were invented/explained instead of left blank: '+historicalText);

            // V489 Log bleibt kompakt; V488/V486/V485/V484/V478 bleiben erhalten.
            await page.evaluate(()=>{window.__modLiveLogV453.clear();window.__modLiveLogV453.append('TASK','INFO','V490 Log Test');switchTab('log');});
            await page.waitForTimeout(120);
            const logFont=await page.evaluate(()=>getComputedStyle(document.querySelector('.log-message-v453')).fontSize);
            if(logFont!=='8.5px')throw new Error('Compact log regressed: '+logFont);
            const preserved=await page.evaluate(()=>!!(window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modRemoteArchiveSequenceV478));
            if(!preserved)throw new Error('Preserved V489/V488/V486/V485/V484/V478 module missing');

            console.log('V490 browser regression OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
