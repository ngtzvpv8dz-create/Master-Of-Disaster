name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check live-log-v453.js && node --check app.js
      - name: Verify V489 wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('task-time-weight-details-v489.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V489','task-time-weight-details-v489.js?v=489-1825',"version:'V489'",'modV489TaskTimeWeightDetailsDone']:
              if marker not in html: raise SystemExit(f'Missing V489 HTML marker: {marker}')
          for marker in ['master-of-disaster-v489-task-time-weight-details','task-time-weight-details-v489.js','historical-segment-breakdown-v488.js']:
              if marker not in sw: raise SystemExit(f'Missing V489 SW marker: {marker}')
          for marker in ['perTaskTimeRanges:true','perTaskWeightOverlap:true','appliesToPausedCompletedAbortedAndArchive:true','historicalTimesNeverInvented:true','compactLogFontPx:8.5']:
              if marker not in js: raise SystemExit(f'Missing V489 behavior marker: {marker}')
          if metrics.get('version')!='V489' or metrics.get('automated') is not True:
              raise SystemExit('Expected V489 automated metrics snapshot')
          print('V489 wiring OK')
      - name: Browser regression V489
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:700}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V489'&&window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485,{timeout:30000});

            // Pausierte Aufgabe: 3 aktive Segmente = 02:15:00. Gewicht nur in echten Aktivüberlappungen = 01:15:00.
            await page.evaluate(()=>{
              tasks=[
                {id:4891,text:'Drei Segmente mit Gewicht',type:'work',status:'paused',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:null,todayOrder:null,startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T16:00:00+02:00',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,activeSegments:[
                  {startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},
                  {startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},
                  {startedAt:'2026-08-23T15:30:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}
                ]},
                {id:4892,text:'Erledigt Detailtest',type:'work',status:'completed',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-23T17:58:19+02:00',completedAt:'2026-08-23T18:03:19+02:00',activeDurationMs:300000,actualDurationMs:300000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-23T17:58:19+02:00',endedAt:'2026-08-23T18:03:19+02:00'}]},
                {id:4893,text:'Abgebrochen Detailtest',type:'work',status:'aborted',priority:'normal',optional:false,dueMode:'none',dueDate:null,startedAt:'2026-08-23T18:10:00+02:00',abortedAt:'2026-08-23T18:20:00+02:00',activeDurationMs:600000,actualDurationMs:600000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-23T18:10:00+02:00',endedAt:'2026-08-23T18:20:00+02:00'}]}
              ];
              weightPhases=[
                {id:9001,weightKg:12.3,startedAt:'2026-08-23T13:10:00+02:00',endedAt:'2026-08-23T14:20:00+02:00'},
                {id:9002,weightKg:8,startedAt:'2026-08-23T15:40:00+02:00',endedAt:'2026-08-23T16:10:00+02:00'}
              ];
              weightState={isWearing:false,currentWeightKg:8};
              archive=[];nextArchiveNumber=265;saveTasks();saveArchive();saveWeight();switchTab('all');render();
            });
            await page.waitForTimeout(350);
            const paused=page.locator('.task',{hasText:'Drei Segmente mit Gewicht'}).first();
            const pausedText=await paused.innerText();
            for(const expected of [
              '13:00:00–14:00:00 · 01:00:00',
              '14:15:00–15:00:00 · 00:45:00',
              '15:30:00–16:00:00 · 00:30:00',
              'GESAMT AKTIV · 02:15:00',
              'MIT ZUSATZGEWICHT · 01:15:00 VON 02:15:00',
              '13:10:00–14:00:00 · 00:50:00 · 12,3 kg',
              '14:15:00–14:20:00 · 00:05:00 · 12,3 kg',
              '15:40:00–16:00:00 · 00:20:00 · 8 kg'
            ]) if(!pausedText.includes(expected))throw new Error(`Paused detail missing ${expected}: ${pausedText}`);
            const detailApi=await page.evaluate(()=>{
              const t=tasks.find(x=>x.id===4891),ti=window.__modTaskTimeWeightDetailsV489.timeDetail(t,false),wi=window.__modTaskTimeWeightDetailsV489.weightDetail(t,ti,false);
              return {active:ti.knownTotalMs,weighted:wi.totalMs,overlaps:wi.overlaps.map(r=>r.durationMs),detailFont:window.__modTaskTimeWeightDetailsV489.detailFontPx};
            });
            if(detailApi.active!==8100000||detailApi.weighted!==4500000||detailApi.overlaps.join(',')!=='3000000,300000,1200000'||detailApi.detailFont!==8.5)throw new Error('V489 overlap accounting regression: '+JSON.stringify(detailApi));

            // Erledigte Aufgabe in ALLE.
            const completed=page.locator('.task',{hasText:'Erledigt Detailtest'}).first();
            const completedText=await completed.innerText();
            if(!completedText.includes('17:58:19–18:03:19 · 00:05:00')||!completedText.includes('GESAMT AKTIV · 00:05:00'))throw new Error('Completed detail missing: '+completedText);

            // Abgebrochene Aufgabe wird von V485 im eigenen Bereich dargestellt und behält V489-Details.
            await page.waitForTimeout(250);
            const aborted=page.locator('#abortedSectionV485 .task',{hasText:'Abgebrochen Detailtest'}).first();
            if(!(await aborted.count()))throw new Error('Aborted V485 section missing');
            const abortedText=await aborted.innerText();
            if(!abortedText.includes('18:10:00–18:20:00 · 00:10:00')||!abortedText.includes('GESAMT AKTIV · 00:10:00'))throw new Error('Aborted detail missing: '+abortedText);

            // Archiv: exakte Segmente + gespeicherte Gewichtsteilsegmente.
            await page.evaluate(()=>{
              archive=[
                {archiveNumber:1,archiveId:'v489-a1',text:'Archiv Detailtest',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:'2026-08-22T13:00:00+02:00',completedAt:'2026-08-22T15:00:00+02:00',activeDurationMs:6300000,archiveAccountingActiveDurationMs:6300000,actualDurationMs:6300000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00'},{startedAt:'2026-08-22T14:15:00+02:00',endedAt:'2026-08-22T15:00:00+02:00'}],historicalWeightKg:12.3,weightedActiveDurationMs:2700000,weightActiveSegments:[{startedAt:'2026-08-22T13:15:00+02:00',endedAt:'2026-08-22T14:00:00+02:00',historicalWeightKg:12.3}]},
                {archiveNumber:2,archiveId:'v489-a2',text:'Historisch ohne Uhrzeit',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:null,completedAt:null,activeDurationMs:600000,archiveAccountingActiveDurationMs:600000,actualDurationMs:600000,pauseTotalMs:0,activeSegments:[],historicalWeightKg:8,weightedActiveDurationMs:600000,historicalWeightNote:'historisch vollständig mit 8 kg'}
              ];nextArchiveNumber=3;saveArchive();switchTab('archive');render();
            });
            await page.waitForTimeout(350);
            const archiveText=await page.locator('.archive-task',{hasText:'Archiv Detailtest'}).first().textContent();
            for(const expected of ['13:00:00–14:00:00 · 01:00:00','14:15:00–15:00:00 · 00:45:00','GESAMT AKTIV · 01:45:00','MIT ZUSATZGEWICHT · 00:45:00 VON 01:45:00','13:15:00–14:00:00 · 00:45:00 · 12,3 kg']) if(!archiveText.includes(expected))throw new Error(`Archive detail missing ${expected}: ${archiveText}`);
            const historicalText=await page.locator('.archive-task',{hasText:'Historisch ohne Uhrzeit'}).first().textContent();
            if(!historicalText.includes('DAUER · 00:10:00 · keine exakten Uhrzeiten dokumentiert')||!historicalText.includes('MIT ZUSATZGEWICHT · 00:10:00 VON 00:10:00 · 8 kg')||!historicalText.includes('Uhrzeit der Gewichtsnutzung nicht exakt dokumentiert'))throw new Error('Historical fallback wrong: '+historicalText);
            if(/\d{2}:\d{2}:\d{2}–\d{2}:\d{2}:\d{2}/.test(historicalText))throw new Error('V489 invented historical clock times: '+historicalText);

            // V488 historical/segment accounting stays untouched.
            const preserved=await page.evaluate(()=>window.__modHistoricalSegmentBreakdownV488?.cardBreakdownFontPx===8.5&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modRemoteArchiveSequenceV478);
            if(!preserved)throw new Error('Preserved V488/V486/V485/V484/V478 module missing');

            // Log typography: same compact scale as archive/task metadata.
            await page.evaluate(()=>{window.__modLiveLogV453.clear();window.__modLiveLogV453.append('TASK','INFO','V489 Log Test');switchTab('log');});
            await page.waitForTimeout(150);
            const logStyle=await page.evaluate(()=>{
              const row=document.querySelector('.log-row-v453'),msg=document.querySelector('.log-message-v453'),chip=document.querySelector('.log-chip-v453');
              return {row:row?getComputedStyle(row).fontSize:null,msg:msg?getComputedStyle(msg).fontSize:null,chip:chip?getComputedStyle(chip).fontSize:null};
            });
            if(logStyle.row!=='8.5px'||logStyle.msg!=='8.5px'||logStyle.chip!=='8.5px')throw new Error('Log is not compact 8.5px: '+JSON.stringify(logStyle));

            console.log('V489 browser regression OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
