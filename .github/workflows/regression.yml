name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check time-segments-v443.js && node --check integrity-v439.js && node --check remote-commands.js && node --check app.js
      - name: Verify V443 time segment editor
        shell: python
        run: |
          from pathlib import Path
          seg=Path('time-segments-v443.js').read_text(encoding='utf-8')
          for marker in ['Zeitabschnitte korrigieren','ABSCHNITT ${index+1}','+ ZEITABSCHNITT HINZUFÜGEN','AKTIVE GESAMTZEIT','Nur der letzte Abschnitt darf ohne Endzeit sein','überlappen sich','task.activeSegments=segs','scheduleSupabaseLiveSync']:
              if marker not in seg: raise SystemExit(f'Missing segment behavior: {marker}')
          print('V443 segment editor regression OK')
