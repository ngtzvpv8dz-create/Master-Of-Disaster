name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and wiring
        run: |
          node --check task-card-rail-polish-v492.js
          node --check ui-card-stability-v491.js
          node --check nested-task-weight-layout-v490.js
          node --check task-time-weight-details-v489.js
          node --check historical-segment-breakdown-v488.js
          node --check app.js
          grep -q 'BUILD: V492' index.html
          grep -q 'task-card-rail-polish-v492.js?v=492-1954' index.html
          grep -q 'master-of-disaster-v492-number-status-weight-polish' sw.js
          grep -q 'numberAndStatusLeftAligned:true' task-card-rail-polish-v492.js
      - name: Browser regression V492
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V492'&&window.__modTaskCardRailPolishV492&&window.__modUiCardStabilityV491&&window.__modNestedTaskWeightLayoutV490,{timeout:30000});
            await page.evaluate(()=>{
              const day=getBerlinDateKey();
              localStorage.removeItem(window.__modTodayWorkBlocksV474.storageKey);
              tasks=[{id:4921,text:'Kisten sortieren V492',type:'work',status:'paused',priority:'high',optional:false,dueMode:'deadline',dueDate:day,todayDate:day,todayOrder:1,todayWorkBlockId:null,importedHistoricalProgressDurationMs:8760000,startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T16:00:00+02:00',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,activeSegments:[{startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},{startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},{startedAt:'2026-08-23T15:30:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}]},{id:4922,text:'Büro wischen V492',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:2,todayWorkBlockId:null,activeSegments:[],pauseTotalMs:0}];
              weightPhases=[{id:1,weightKg:12.3,startedAt:'2026-08-23T13:10:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},{id:2,weightKg:12.3,startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},{id:3,weightKg:8,startedAt:'2026-08-23T15:40:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}];
              weightState={isWearing:false,currentWeightKg:8};archive=[];nextArchiveNumber=1;saveTasks();saveArchive();saveWeight();window.__modTodayWorkBlocksV474.ensureTodayModel(day,[]);saveTasks();
            });
            for(const tab of ['all','today','priority','due','active']){
              await page.evaluate(t=>{switchTab(t);render();},tab);await page.waitForTimeout(250);
              const card=page.locator('.task:not(.archive-task):visible',{hasText:'Kisten sortieren V492'}).first();
              if(!(await card.count()))throw new Error(tab+': task missing');
              const rail=await card.evaluate(card=>{const r=card.querySelector(':scope > .v492-number-status-rail'),n=r?.querySelector('.task-number'),s=r?.querySelector('.status-symbol');if(n)n.textContent='9.999';const nr=n?.getBoundingClientRect(),sr=s?.getBoundingClientRect();return {ok:!!r&&nr.top<sr.top&&n.scrollWidth<=n.clientWidth&&getComputedStyle(n).textAlign==='left'&&getComputedStyle(s).justifyContent==='flex-start',width:r?.getBoundingClientRect().width};});
              if(!rail.ok||rail.width<41)throw new Error(tab+': rail failed '+JSON.stringify(rail));
            }
            await page.evaluate(()=>{switchTab('all');render();});await page.waitForTimeout(250);
            const card=page.locator('.task:not(.archive-task):visible',{hasText:'Kisten sortieren V492'}).first();
            const w=await card.evaluate(card=>{const p=card.querySelector('.v490-weight-partial'),copy=p?.querySelector('.v492-weight-copy'),sub=p?.nextElementSibling,o=card.querySelector('.v490-overall-weight'),d=card.querySelector('.task-detail-v490');return {aligned:p?.dataset.v492Aligned==='true'&&sub?.classList.contains('v492-weight-subline-aligned'),copyX:copy?.getBoundingClientRect().left,subX:sub?.getBoundingClientRect().left+(parseFloat(getComputedStyle(sub).paddingLeft)||0),color:p?getComputedStyle(p).color:null,fw:p?getComputedStyle(p).fontWeight:null,overall:o?getComputedStyle(o).color:null,ofw:o?getComputedStyle(o).fontWeight:null,border:d?getComputedStyle(d).borderTopWidth:null,actionsLast:card.querySelector('.task-content')?.lastElementChild===card.querySelector('.icon-actions')};});
            if(!w.aligned||Math.abs(w.copyX-w.subX)>0.75||w.color!=='rgb(126, 139, 104)'||w.overall!=='rgb(126, 139, 104)'||w.fw!=='400'||w.ofw!=='400'||w.border!=='1px'||!w.actionsLast)throw new Error('Weight/layout polish failed '+JSON.stringify(w));
            await page.evaluate(()=>{switchTab('today');render();});await page.waitForTimeout(250);
            const today=page.locator('.today-task-active:visible',{hasText:'Kisten sortieren V492'}).first();
            if((await today.locator('.v491-order-button').count())!==2||(await today.locator('.drag-handle').count())!==0)throw new Error('V491 arrows regressed');
            const before=await today.evaluate(c=>({h:c.getBoundingClientRect().height,html:c.innerHTML}));await page.waitForTimeout(1200);const after=await today.evaluate(c=>({h:c.getBoundingClientRect().height,html:c.innerHTML}));if(Math.abs(before.h-after.h)>0.5||before.html!==after.html)throw new Error('Card stability regressed');
            await page.evaluate(()=>{archive=[{archiveNumber:1,archiveId:'v492-a',text:'Archiv Rail V492',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:'2026-08-22T13:00:00+02:00',completedAt:'2026-08-22T14:00:00+02:00',activeDurationMs:3600000,archiveAccountingActiveDurationMs:3600000,actualDurationMs:3600000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00'}],historicalWeightKg:12.3,weightedActiveDurationMs:3600000,weightActiveSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00',historicalWeightKg:12.3}]}];nextArchiveNumber=2;saveArchive();switchTab('archive');render();});await page.waitForTimeout(350);
            const archived=page.locator('.archive-task:visible',{hasText:'Archiv Rail V492'}).first();
            if(!(await archived.count()))throw new Error('Visible archive card missing');
            const ar=await archived.evaluate(card=>{const r=card.querySelector(':scope > .v492-number-status-rail'),n=r?.querySelector('.archive-number'),s=r?.querySelector('.status-symbol');if(n)n.textContent='A9999';const nr=n?.getBoundingClientRect(),sr=s?.getBoundingClientRect();return {ok:!!r&&nr.top<sr.top&&n.scrollWidth<=n.clientWidth&&getComputedStyle(n).textAlign==='left'&&getComputedStyle(s).justifyContent==='flex-start',width:r?.getBoundingClientRect().width,font:[...card.querySelectorAll('.task-detail-v490>div')].map(x=>getComputedStyle(x).fontSize)};});
            if(!ar.ok||ar.width<45||ar.font.some(x=>x!=='8.5px'))throw new Error('Archive layout failed '+JSON.stringify(ar));
            const preserved=await page.evaluate(()=>!!(window.__modUiCardStabilityV491&&window.__modNestedTaskWeightLayoutV490&&window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modRemoteArchiveSequenceV478));
            if(!preserved)throw new Error('Preserved modules missing');
            console.log('V492 browser regression OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
