name: Regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check task-card-rail-polish-v492.js && node --check ui-card-stability-v491.js && node --check nested-task-weight-layout-v490.js && node --check task-time-weight-details-v489.js && node --check historical-segment-breakdown-v488.js && node --check segment-active-duration-v487.js && node --check time-segment-scroll-v486.js && node --check terminal-delete-v485.js && node --check remote-task-reopen-v484.js && node --check live-log-v453.js && node --check app.js
      - name: Verify V492 wiring
        shell: python
        run: |
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          js=Path('task-card-rail-polish-v492.js').read_text(encoding='utf-8')
          metrics=json.loads(Path('development-metrics.json').read_text(encoding='utf-8'))
          for marker in ['BUILD: V492','task-card-rail-polish-v492.js?v=492-1954',"version:'V492'",'modV492TaskCardRailPolishDone']:
              if marker not in html: raise SystemExit(f'Missing V492 HTML marker: {marker}')
          for marker in ['master-of-disaster-v492-number-status-weight-polish','task-card-rail-polish-v492.js','ui-card-stability-v491.js']:
              if marker not in sw: raise SystemExit(f'Missing V492 SW marker: {marker}')
          for marker in ['numberTopLeftEverywhere:true','statusBelowNumber:true','fourDigitTaskNumberReady:true','archiveNumberFutureReady:true','subtleWeightStyle:true','weightSecondLineAligned:true','segmentSeparator:true','dataSemanticsUntouched:true']:
              if marker not in js: raise SystemExit(f'Missing V492 behavior marker: {marker}')
          if metrics.get('version')!='V492' or metrics.get('automated') is not True:
              raise SystemExit('Expected V492 automated metrics snapshot')
          print('V492 wiring OK')
      - name: Browser regression V492
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/mod-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/*',route=>/supabase\.co/.test(route.request().url())?route.abort():route.continue());
            await page.goto('http://127.0.0.1:8787/?reg='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>window.__MOD_BUILD__?.version==='V492'&&window.__modTaskCardRailPolishV492&&window.__modUiCardStabilityV491&&window.__modNestedTaskWeightLayoutV490,{timeout:30000});

            await page.evaluate(()=>{
              const day=getBerlinDateKey();
              localStorage.removeItem(window.__modTodayWorkBlocksV474.storageKey);
              tasks=[
                {id:4921,text:'Kisten sortieren V492',type:'work',status:'paused',priority:'high',optional:false,dueMode:'deadline',dueDate:day,todayDate:day,todayOrder:1,todayWorkBlockId:null,importedHistoricalProgressDurationMs:8760000,historicalAlreadyArchivedDurationMs:0,startedAt:'2026-08-23T13:00:00+02:00',pausedAt:'2026-08-23T16:00:00+02:00',pauseTotalMs:0,activeDurationMs:null,actualDurationMs:null,activeSegments:[
                  {startedAt:'2026-08-23T13:00:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},
                  {startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},
                  {startedAt:'2026-08-23T15:30:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}
                ]},
                {id:4922,text:'Büro wischen V492',type:'work',status:'open',priority:'normal',optional:false,dueMode:'none',dueDate:null,todayDate:day,todayOrder:2,todayWorkBlockId:null,startedAt:null,pauseTotalMs:0,activeSegments:[]}
              ];
              weightPhases=[
                {id:9301,weightKg:12.3,startedAt:'2026-08-23T13:10:00+02:00',endedAt:'2026-08-23T14:00:00+02:00'},
                {id:9302,weightKg:12.3,startedAt:'2026-08-23T14:15:00+02:00',endedAt:'2026-08-23T15:00:00+02:00'},
                {id:9303,weightKg:8,startedAt:'2026-08-23T15:40:00+02:00',endedAt:'2026-08-23T16:00:00+02:00'}
              ];
              weightState={isWearing:false,currentWeightKg:8};archive=[];nextArchiveNumber=1;
              saveTasks();saveArchive();saveWeight();window.__modTodayWorkBlocksV474.ensureTodayModel(day,[]);saveTasks();switchTab('all');render();
            });
            await page.waitForTimeout(500);

            async function assertRail(tab,label){
              await page.evaluate(t=>{switchTab(t);render();},tab);await page.waitForTimeout(300);
              const card=page.locator('.task:not(.archive-task)',{hasText:'Kisten sortieren V492'}).first();
              if(!(await card.count()))throw new Error(`${label}: task card missing`);
              const r=await card.evaluate(card=>{
                const rail=card.querySelector(':scope > .v492-number-status-rail'),num=rail?.querySelector('.task-number'),status=rail?.querySelector('.status-symbol'),content=card.querySelector(':scope > .task-content');
                if(num)num.textContent='9999';
                const nr=num?.getBoundingClientRect(),sr=status?.getBoundingClientRect(),cr=content?.getBoundingClientRect(),rr=rail?.getBoundingClientRect();
                return {rail:!!rail,numberParent:num?.parentElement===rail,statusParent:status?.parentElement===rail,numTop:nr?.top,statusTop:sr?.top,railLeft:rr?.left,numLeft:nr?.left,contentLeft:cr?.left,width:rr?.width,numOverflow:num?num.scrollWidth-num.clientWidth:999};
              });
              if(!r.rail||!r.numberParent||!r.statusParent||!(r.numTop<r.statusTop)||Math.abs(r.numLeft-r.railLeft)>1||r.width<41||r.numOverflow>0||!(r.contentLeft>r.railLeft+r.width-1))throw new Error(`${label}: number/status rail wrong: ${JSON.stringify(r)}`);
            }
            for(const [tab,label] of [['all','ALLE'],['today','HEUTE'],['priority','PRIORITÄT'],['due','FÄLLIG'],['active','PAUSIERT']])await assertRail(tab,label);

            await page.evaluate(()=>{switchTab('all');render();});await page.waitForTimeout(300);
            const card=page.locator('.task:not(.archive-task)',{hasText:'Kisten sortieren V492'}).first();
            const weight=await card.evaluate(card=>{
              const partial=card.querySelector('.v490-weight-partial'),copy=partial?.querySelector('.v492-weight-copy'),sub=partial?.nextElementSibling,overall=card.querySelector('.v490-overall-weight'),detail=card.querySelector('.task-detail-v490');
              const cs=partial?getComputedStyle(partial):null,os=overall?getComputedStyle(overall):null,ds=detail?getComputedStyle(detail):null;
              const cx=copy?.getBoundingClientRect().left,sx=sub?.getBoundingClientRect().left+(parseFloat(getComputedStyle(sub).paddingLeft)||0);
              return {copyX:cx,subTextX:sx,color:cs?.color,weight:cs?.fontWeight,overallColor:os?.color,overallWeight:os?.fontWeight,borderWidth:ds?.borderTopWidth,borderStyle:ds?.borderTopStyle,aligned:partial?.dataset.v492Aligned||null,subAligned:sub?.classList.contains('v492-weight-subline-aligned')||false};
            });
            if(weight.aligned!=='true'||!weight.subAligned||Math.abs(weight.copyX-weight.subTextX)>0.75)throw new Error('Weight second line not aligned: '+JSON.stringify(weight));
            if(weight.color!=='rgb(126, 139, 104)'||weight.overallColor!=='rgb(126, 139, 104)'||Number(weight.weight)>500||Number(weight.overallWeight)>500)throw new Error('Weight styling not subtle: '+JSON.stringify(weight));
            if(weight.borderWidth!=='1px'||weight.borderStyle!=='solid')throw new Error('Segment separator missing: '+JSON.stringify(weight));

            await page.evaluate(()=>{
              archive=[{archiveNumber:9999,archiveId:'v492-a9999',text:'Archiv Rail V492',status:'completed',type:'work',priority:'normal',optional:false,dueMode:'none',completedDate:'2026-08-22',startedAt:'2026-08-22T13:00:00+02:00',completedAt:'2026-08-22T14:00:00+02:00',activeDurationMs:3600000,archiveAccountingActiveDurationMs:3600000,actualDurationMs:3600000,pauseTotalMs:0,activeSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00'}],historicalWeightKg:12.3,weightedActiveDurationMs:3600000,weightActiveSegments:[{startedAt:'2026-08-22T13:00:00+02:00',endedAt:'2026-08-22T14:00:00+02:00',historicalWeightKg:12.3}]}];nextArchiveNumber=10000;saveArchive();switchTab('archive');render();
            });await page.waitForTimeout(350);
            const archived=page.locator('.archive-task',{hasText:'Archiv Rail V492'}).first();
            const ar=await archived.evaluate(card=>{
              const rail=card.querySelector(':scope > .v492-number-status-rail'),num=rail?.querySelector('.archive-number'),status=rail?.querySelector('.status-symbol');
              if(num)num.textContent='A9999';
              const nr=num?.getBoundingClientRect(),sr=status?.getBoundingClientRect(),rr=rail?.getBoundingClientRect();
              return {rail:!!rail,numTop:nr?.top,statusTop:sr?.top,width:rr?.width,overflow:num?num.scrollWidth-num.clientWidth:999,font:[...card.querySelectorAll('.task-detail-v490>div')].map(el=>getComputedStyle(el).fontSize)};
            });
            if(!ar.rail||!(ar.numTop<ar.statusTop)||ar.width<45||ar.overflow>0||ar.font.some(x=>x!=='8.5px'))throw new Error('Archive rail/future number failed: '+JSON.stringify(ar));

            const preserved=await page.evaluate(()=>!!(window.__modUiCardStabilityV491&&window.__modNestedTaskWeightLayoutV490&&window.__modTaskTimeWeightDetailsV489&&window.__modHistoricalSegmentBreakdownV488&&window.__modTimeSegmentScrollV486&&window.__modTerminalDeleteV485&&window.__modRemoteTaskReopenV484&&window.__modRemoteArchiveSequenceV478));
            if(!preserved)throw new Error('Preserved V491/V490/V489/V488/V486/V485/V484/V478 module missing');
            console.log('V492 browser regression OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
