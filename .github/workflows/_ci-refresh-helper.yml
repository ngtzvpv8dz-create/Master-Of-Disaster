name: Temporary CI Refresh Helper
on:
  push:
    branches: [ fix/v530-ci-current ]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh stale release assumptions
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text for {label} in {path}')
              p.write_text(text.replace(old,new))

          replace('.github/workflows/regression.yml',
                  "grep -q 'running-task-render-stability-v505.js?v=505-1353' index.html",
                  "grep -q 'running-task-render-stability-v505.js?v=' index.html",
                  'regression running-task cache-buster')
          replace('.github/workflows/regression.yml',
                  "grep -q \"serviceWorker.register('./sw.js?v=508-0709'\" index.html",
                  "grep -q \"serviceWorker.register('./sw.js?v=\" index.html",
                  'regression service-worker cache-buster')
          replace('.github/workflows/regression.yml',
                  "if(build.v!=='V508'||build.loaded!=='V502'||build.v503!=='V503'||build.v504!=='V504'||build.v505!=='V505'||build.v506!=='V506'||build.v506source!=='V506.3'||build.v507!=='V507'||build.v508!=='V508')throw new Error('Dynamic build metadata missing '+JSON.stringify(build));",
                  "if(!/^V\\d+$/.test(build.v||'')||Number(build.v.slice(1))<508||build.dynamic!==true||build.loaded!=='V502'||build.v503!=='V503'||build.v504!=='V504'||build.v505!=='V505'||build.v506!=='V506'||build.v506source!=='V506.3'||build.v507!=='V507'||build.v508!=='V508')throw new Error('Dynamic build metadata missing '+JSON.stringify(build));",
                  'regression dynamic build check')

          replace('.github/workflows/v508-archive-weight-layout.yml',
                  "grep -q \"serviceWorker.register('./sw.js?v=508-0709'\" index.html",
                  "grep -q \"serviceWorker.register('./sw.js?v=\" index.html",
                  'v508 service-worker cache-buster')

          replace('.github/workflows/v515-app-hub.yml',
                  "if(!initial.hub||initial.surface!=='hub'||initial.mode!=='todo'||JSON.stringify(initial.cards)!==JSON.stringify(['todo','sport','food'])||!initial.foodReserved||initial.healthConnected!==false||initial.task!=='V515 Bestandsschutz'||initial.build!=='V515')throw new Error('V515 initial '+JSON.stringify({initial,errors}));",
                  "if(!initial.hub||initial.surface!=='hub'||initial.mode!=='todo'||!initial.cards.includes('todo')||!initial.cards.includes('sport')||!initial.foodReserved||initial.healthConnected!==false||initial.task!=='V515 Bestandsschutz'||initial.build!=='V515')throw new Error('V515 initial '+JSON.stringify({initial,errors}));",
                  'v515 extensible launcher')

          replace('.github/workflows/runtime-smoke.yml',
                  "EXPECTED_VERSION=$(node -e \"const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/BUILD:\\s*(V\\d+)/);if(!m)process.exit(1);process.stdout.write(m[1])\")\n          echo \"EXPECTED_VERSION=${EXPECTED_VERSION}\" >> \"$GITHUB_ENV\"\n          echo \"Testing ${EXPECTED_VERSION}\"",
                  "METRICS_OUTPUT=/tmp/runtime-expected.json node scripts/generate-development-metrics.mjs >/tmp/runtime-expected.log\n          EXPECTED_VERSION=$(node -e \"const m=require('/tmp/runtime-expected.json');if(!/^V\\d+$/.test(m.version||''))process.exit(1);process.stdout.write(m.version)\")\n          echo \"EXPECTED_VERSION=${EXPECTED_VERSION}\" >> \"$GITHUB_ENV\"\n          echo \"Testing ${EXPECTED_VERSION}\"",
                  'runtime expected build')
          replace('.github/workflows/runtime-smoke.yml',
                  "window.__modArchiveWeightLayoutV508\n                ),undefined,{timeout:15000});",
                  "window.__modArchiveWeightLayoutV508&&\n                  window.__modBackstageV530\n                ),undefined,{timeout:15000});",
                  'runtime backstage readiness')
          replace('.github/workflows/runtime-smoke.yml',
                  "v508Verified:window.__modArchiveWeightLayoutV508?.verify?.()===true\n              }));",
                  "v508Verified:window.__modArchiveWeightLayoutV508?.verify?.()===true,\n                v530:window.__modBackstageV530?.version==='V530'\n              }));",
                  'runtime backstage bundle')
          replace('.github/workflows/runtime-smoke.yml',
                  "await page.evaluate(()=>{switchTab('dev');render();});",
                  "await page.evaluate(()=>window.__modBackstageV530.open({section:'dev'}));",
                  'runtime backstage dev navigation')
          PY
      - name: Commit refreshed workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/regression.yml .github/workflows/v508-archive-weight-layout.yml .github/workflows/v515-app-hub.yml .github/workflows/runtime-smoke.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "CI: aktuelle V530-Struktur statt alte Release-Annahmen prüfen"
          git push
