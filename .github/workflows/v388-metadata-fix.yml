name: V388 Metadata Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v388-metadata-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set V388 app metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r'const APP_VERSION =\s*\\?"V\d+\\?";', 'const APP_VERSION =\n"V388";', s, count=1)
          s, n2 = re.subn(r'const APP_BUILD_DATE =\s*\\?"[^\"]+\\?";', 'const APP_BUILD_DATE =\n"19.08.2026";', s, count=1)
          s, n3 = re.subn(r'const APP_BUILD_TIME =\s*\\?"[0-9]{2}:[0-9]{2}\\?";', 'const APP_BUILD_TIME =\n"01:04";', s, count=1)
          if not (n1 and n2 and n3):
              raise SystemExit(f'metadata replacement failed: version={n1}, date={n2}, time={n3}')
          p.write_text(s, encoding='utf-8')
      - name: Commit V388 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: set V388 app metadata"
          git push origin main
