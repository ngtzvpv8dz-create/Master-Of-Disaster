name: V431 One-Shot Consolidation
on:
  push:
    branches: [ refactor/v431-consolidate ]
permissions:
  contents: write
jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[v431-bundle]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v431-consolidate
          fetch-depth: 0
      - name: Bundle active patch layers and remove obsolete files
        shell: python
        run: |
          from pathlib import Path
          import re

          js_files = [
            'tab-visibility-v415.js',
            'action-icons-v416.js',
            'dev-cleanup-v401.js',
            'dev-version-v430.js',
            'unified-icons-v419.js',
            'unified-icons-v420.js',
            'ui-polish-v421.js',
            'ui-video-fixes-v422.js',
            'visible-icon-fix-v423.js',
            'priority-header-v424.js',
            'completed-cleanup-v429.js',
            'weight-backfill-v430.js',
          ]
          css_files = [
            'action-icons-v416.css',
            'unified-icons-v419.css',
            'unified-icons-v420.css',
            'ui-polish-v421.css',
            'ui-video-fixes-v422.css',
            'visible-icon-fix-v423.css',
            'priority-header-v424.css',
            'weight-backfill-v430.css',
          ]

          dev_v431 = r'''/* V431 · consolidated DEV build label */
          (function(){
            function patch(){
              if(typeof currentTab!=="undefined"&&currentTab!=="dev")return;
              const vals=document.querySelectorAll(".dev-build-value");
              if(vals[0])vals[0].textContent="V431";
              if(vals[1])vals[1].textContent="21.08.2026 · 00:07 Uhr";
            }
            const prev=typeof render==="function"?render:null;
            if(prev){render=function(){const r=prev.apply(this,arguments);setTimeout(patch,0);return r;};}
            window.addEventListener("load",()=>setTimeout(patch,400));
            window.__modDevVersion={version:"V431",build:"21.08.2026 · 00:07 Uhr",patch};
          })();'''

          js_parts = ['/* V431 CONSOLIDATED UI/FEATURE BUNDLE. Source order preserved from V430. */']
          for name in js_files:
            if name == 'dev-version-v430.js':
              js_parts.append('\n/* ===== dev-version.js ===== */\n' + dev_v431)
            else:
              js_parts.append(f'\n/* ===== {name} ===== */\n' + Path(name).read_text(encoding='utf-8'))
          Path('ui.js').write_text('\n'.join(js_parts) + '\n', encoding='utf-8')

          css_parts = ['/* V431 CONSOLIDATED UI STYLES. Source order preserved from V430. */']
          for name in css_files:
            css_parts.append(f'\n/* ===== {name} ===== */\n' + Path(name).read_text(encoding='utf-8'))
          Path('ui.css').write_text('\n'.join(css_parts) + '\n', encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          for name in css_files:
            index = re.sub(r'<link rel="stylesheet" href="\./'+re.escape(name)+r'\?v=[^"]+">', '', index)
          index = re.sub(r'(<link rel="stylesheet" href="\./categories\.css\?v=[^"]+">)', r'\1<link rel="stylesheet" href="./ui.css?v=431-0007">', index, count=1)
          for name in js_files:
            index = re.sub(r'<script src="\./'+re.escape(name)+r'\?v=[^"]+"></script>', '', index)
          index = re.sub(r'(<script src="\./archive-category-v413\.js\?v=[^"]+"></script>)', r'\1<script src="./ui.js?v=431-0007"></script>', index, count=1)
          index = re.sub(r'<!-- BUILD: [^>]+-->', '<!-- BUILD: V431 · 21.08.2026 · 00:07 · CONSOLIDATED -->', index, count=1)
          index = index.replace('v=430-2329','v=431-0007').replace('v=430','v=431-0007')
          index = index.replace('modV430WeightBackfillDone','modV431ConsolidatedDone').replace('v430weight','v431consolidated').replace('V430 weight backfill:','V431 consolidated cleanup:')
          Path('index.html').write_text(index, encoding='utf-8')

          sw = '''const CACHE_NAME = "master-of-disaster-v431-consolidated";
          const APP_SHELL = ["./","./index.html","./app.css?v=431-0007","./categories.css?v=431-0007","./ui.css?v=431-0007","./app.js?v=431-0007","./weight-integrity-v393.js?v=431-0007","./cloud-backup-restore-v394.js?v=431-0007","./full-backup-v397.js?v=431-0007","./stats-and-rules-v403.js?v=431-0007","./categories.js?v=431-0007","./archive-category-v413.js?v=431-0007","./ui.js?v=431-0007","./iphone-backup-v400.js?v=431-0007","./manifest.webmanifest","./supabase-config.js?v=431-0007","./master-of-disaster-192.png","./master-of-disaster-512.png","./apple-touch-icon.png?v=431-0007","https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"];
          self.addEventListener("install",event=>{self.skipWaiting();event.waitUntil(caches.open(CACHE_NAME).then(cache=>cache.addAll(APP_SHELL)).catch(()=>{}));});
          self.addEventListener("activate",event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE_NAME).map(key=>caches.delete(key)))).then(()=>self.clients.claim()));});
          self.addEventListener("fetch",event=>{if(event.request.method!=="GET")return;const u=new URL(event.request.url);const nav=event.request.mode==="navigate";const asset=u.origin===self.location.origin&&["/index.html","/app.js","/app.css","/categories.css","/ui.js","/ui.css","/weight-integrity-v393.js","/cloud-backup-restore-v394.js","/full-backup-v397.js","/stats-and-rules-v403.js","/categories.js","/archive-category-v413.js","/iphone-backup-v400.js","/manifest.webmanifest","/supabase-config.js","/master-of-disaster-192.png","/master-of-disaster-512.png","/apple-touch-icon.png"].some(p=>u.pathname.endsWith(p));if(nav||asset){event.respondWith(fetch(event.request,{cache:"no-store"}).then(r=>{if(r&&r.ok){const c=r.clone();caches.open(CACHE_NAME).then(cache=>cache.put(event.request,c)).catch(()=>{});}return r;}).catch(()=>caches.match(event.request).then(hit=>hit||caches.match("./index.html")||caches.match("./"))));return;}event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request)));});
          '''
          Path('sw.js').write_text(sw.replace('\n          ','\n').lstrip(), encoding='utf-8')

          for name in js_files + css_files:
            Path(name).unlink()
          for name in ['.github/workflows/v428-direct-archive-test.yml','.github/workflows/v430-weight-backfill-test.yml','.github/workflows/v431-consolidate.yml']:
            p=Path(name)
            if p.exists(): p.unlink()

      - name: Commit consolidated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js ui.js ui.css .github/workflows
          git add -u -- tab-visibility-v415.js action-icons-v416.js action-icons-v416.css dev-cleanup-v401.js dev-version-v430.js unified-icons-v419.js unified-icons-v419.css unified-icons-v420.js unified-icons-v420.css ui-polish-v421.js ui-polish-v421.css ui-video-fixes-v422.js ui-video-fixes-v422.css visible-icon-fix-v423.js visible-icon-fix-v423.css priority-header-v424.js priority-header-v424.css completed-cleanup-v429.js weight-backfill-v430.js weight-backfill-v430.css
          git commit -m "[v431-bundle] consolidate active UI patch layers"
          git push origin HEAD:refactor/v431-consolidate
