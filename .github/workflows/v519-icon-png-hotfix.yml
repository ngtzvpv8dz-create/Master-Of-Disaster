name: V519 Icon PNG Hotfix
on:
  push:
    branches: [ v519-icon-png-hotfix ]
    paths:
      - 'assets/icons/*.webp'
      - '.github/workflows/v519-icon-png-hotfix.yml'
permissions:
  contents: write
jobs:
  convert-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Validate and convert launcher icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=['todo','sport','food','future']
          for name in names:
              src=Path(f'assets/icons/{name}-v518-1024.webp')
              dst=Path(f'assets/icons/{name}-v519-1024.png')
              with Image.open(src) as im:
                  im.load()
                  if im.size != (1024,1024):
                      raise SystemExit(f'{src} has wrong size {im.size}')
                  im.convert('RGBA').save(dst, format='PNG', optimize=True)
                  print(name, src.stat().st_size, '->', dst.stat().st_size)
          PY
      - name: Commit generated PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/*-v519-1024.png
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Generate V519 PNG launcher icons [skip ci]'
            git push
          fi
