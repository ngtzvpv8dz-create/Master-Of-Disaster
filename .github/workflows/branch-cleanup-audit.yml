name: Branch Cleanup Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Classify branches without deleting anything
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          default_branch = os.environ['DEFAULT_BRANCH'] or 'main'
          owner = repo.split('/', 1)[0]
          protected = {
              default_branch,
              'v540-progress-hub',
              'pages-status',
              'runtime-status',
          }

          def api(path):
              url = f'https://api.github.com{path}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'master-of-disaster-branch-audit',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          branches = []
          page = 1
          while True:
              batch = api(f'/repos/{repo}/branches?per_page=100&page={page}')
              branches.extend(item['name'] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          rows = []
          counts = {}

          for branch in sorted(branches, key=str.lower):
              if branch in protected:
                  classification = 'PROTECTED'
                  ahead = behind = '-'
                  open_pr = '-'
              else:
                  query = urllib.parse.urlencode({
                      'state': 'open',
                      'head': f'{owner}:{branch}',
                      'base': default_branch,
                      'per_page': 1,
                  })
                  open_prs = api(f'/repos/{repo}/pulls?{query}')
                  open_pr = 'yes' if open_prs else 'no'

                  if open_prs:
                      classification = 'KEEP_OPEN_PR'
                      ahead = behind = '-'
                  else:
                      basehead = f"{urllib.parse.quote(default_branch, safe='')}...{urllib.parse.quote(branch, safe='')}"
                      try:
                          comparison = api(f'/repos/{repo}/compare/{basehead}')
                          ahead = comparison.get('ahead_by', 0)
                          behind = comparison.get('behind_by', 0)
                          if ahead == 0:
                              classification = 'SAFE_DELETE'
                          else:
                              classification = 'REVIEW_UNIQUE_COMMITS'
                      except urllib.error.HTTPError as exc:
                          classification = f'REVIEW_API_{exc.code}'
                          ahead = behind = '?'

              counts[classification] = counts.get(classification, 0) + 1
              rows.append((branch, classification, ahead, behind, open_pr))

          summary_path = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary_path, 'a', encoding='utf-8') as out:
              out.write('# Branch Cleanup Audit – DRY RUN\n\n')
              out.write('**Es wurde nichts gelöscht.**\n\n')
              out.write(f'- Repository: `{repo}`\n')
              out.write(f'- Default-Branch: `{default_branch}`\n')
              out.write(f'- Branches gesamt: **{len(rows)}**\n\n')
              out.write('## Zusammenfassung\n\n')
              for key in sorted(counts):
                  out.write(f'- `{key}`: **{counts[key]}**\n')
              out.write('\n## Details\n\n')
              out.write('| Branch | Einstufung | ahead | behind | offener PR |\n')
              out.write('|---|---:|---:|---:|---:|\n')
              for branch, classification, ahead, behind, open_pr in rows:
                  out.write(f'| `{branch}` | `{classification}` | {ahead} | {behind} | {open_pr} |\n')

          print(json.dumps({'total': len(rows), 'counts': counts}, ensure_ascii=False))
          PY
